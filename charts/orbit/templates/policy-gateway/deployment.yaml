apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-policy-gateway
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.policyGateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.policyGateway.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.policyGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.policyGateway.selectorLabels" . | nindent 8 }}
        {{- include "orbit.policyGateway.labels" . | nindent 8 }}
        spiffe.io/component: policy-gateway
        {{- include "orbit.podLabels" (dict "root" $ "name" "policyGateway") | nindent 8 }}
      annotations:
        {{- include "orbit.spireProxyAnnotations" (dict "root" $ "identityProxy" false) | nindent 8 }}
        {{- include "orbit.podAnnotations" (dict "root" $ "name" "policyGateway") | nindent 8 }}
    spec:
      serviceAccountName: orbit-policy-gateway
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.scheduling" (dict "root" $ "name" "policyGateway") | nindent 6 }}
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "orbit.spireVolumes" (dict "identityProxy" false) | nindent 8 }}
        {{- include "orbit.extraVolumes" (dict "root" $ "name" "policyGateway") | nindent 8 }}
      containers:
        - name: orbit-policy-gateway
          image: {{ include "orbit.image" (dict "root" $ "name" "policyGateway") | quote }}
          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "policyGateway") }}
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            - name: ORBIT_OTLP_ENDPOINT
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "policyGateway" "field" "otlpEndpoint" "default" .Values.global.observability.otlpEndpoint) | quote }}
            - name: ORBIT_SAMPLING_RATE
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "policyGateway" "field" "samplingRate" "default" .Values.global.observability.samplingRate) | quote }}
            - name: ORBIT_LOG_FORMAT
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "policyGateway" "field" "logFormat" "default" .Values.global.logFormat) | quote }}
            {{- include "orbit.extraEnv" (dict "root" $ "name" "policyGateway") | nindent 12 }}
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.policyGateway.resources | nindent 12 }}
          volumeMounts:
            {{- include "orbit.spireVolumeMount" . | nindent 12 }}
            {{- include "orbit.extraVolumeMounts" (dict "root" $ "name" "policyGateway") | nindent 12 }}
