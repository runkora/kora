name: Images

on:
  workflow_call:
    inputs:
      image_tag:
        description: OCI tag to publish. Empty derives it from the event.
        required: false
        default: ""
        type: string
      platforms:
        description: Comma-separated build platforms.
        required: false
        default: linux/amd64
        type: string
      push:
        description: Push the images, or build and discard.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  list-targets:
    name: List bake targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          TARGETS=$(docker buildx bake --print -f docker-bake.hcl -f versions.hcl 2>/dev/null \
            | jq -c '[.target | keys[] | select(startswith("_") | not)]')
          echo "targets=${TARGETS}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.target }}
    needs: list-targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.list-targets.outputs.targets) }}
    env:
      # A multi-arch build keeps its own cache. An amd64 build replaces the cache
      # it writes, and a shared cache would never hold the arm64 layers.
      CACHE_SUFFIX: ${{ contains(inputs.platforms, 'arm64') && '-multiarch' || '' }}
      # Every image except the frontend compiles Go in a RUN cache mount, and
      # the registry cache does not carry cache mounts. These jobs restore a
      # shared Go build cache into the mount before the bake.
      GO_CACHE: ${{ matrix.target != 'orbit-frontend' }}
      # One job saves the shared cache, on a push to main only, so a pull
      # request never writes a cache that other builds read. Most backend
      # images share nearly all of their packages with orbit-agents.
      GO_CACHE_SAVE: ${{ matrix.target == 'orbit-agents' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: version
        uses: ./.github/actions/derive-version
        with:
          image_tag: ${{ inputs.image_tag }}

      - name: Enable multi-arch emulation
        if: contains(inputs.platforms, 'arm64')
        run: docker run --rm --privileged tonistiigi/binfmt:qemu-v8.1.5 --install arm64

      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login also runs on build-only calls: pulling the layer cache from a
      # private GHCR needs auth.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The key changes with go.sum and with the go directive in go.mod, which
      # pins the Go version. Go keys its build cache by content, so a cache
      # from an older commit is still correct and the job recompiles only what
      # changed. The prefix fallback reuses the last cache after a dependency
      # bump. The cache lives outside the workspace, which is the operator's
      # build context.
      - name: Restore the Go build cache
        if: env.GO_CACHE == 'true' && env.GO_CACHE_SAVE != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-build
          key: go-image-build-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}
          restore-keys: go-image-build-

      # actions/cache saves in its post step. Post steps run in reverse order,
      # so the save runs after the cache dance below extracts the mount. An
      # actions/cache/save step would run before the extraction.
      - name: Restore and save the Go build cache
        id: go-cache-save
        if: env.GO_CACHE_SAVE == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-build
          key: go-image-build-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}
          restore-keys: go-image-build-

      # Copies the restored cache into the BuildKit cache mount now and, in its
      # post step, copies the mount back out. A mount id defaults to its
      # target, so the target here must match the Dockerfiles. The Go builder
      # stages run on the build platform, so a multi-arch release reads the
      # same mount. Only a job that saves extracts. The module cache mount is
      # left out: copying it in took longer than the module downloads it saved.
      - name: Inject the Go build cache
        if: env.GO_CACHE == 'true'
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          utility-image: ghcr.io/containerd/busybox:1.36@sha256:7b3ccabffc97de872a30dfd234fd972a66d247c8cfc69b0550f276481852627c
          scratch-dir: ${{ runner.temp }}/cache-dance
          cache-map: |
            {
              "${{ runner.temp }}/go-build": "/root/.cache/go-build"
            }
          skip-extraction: ${{ env.GO_CACHE_SAVE != 'true' || steps.go-cache-save.outputs.cache-hit == 'true' }}

      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        # docker-bake.hcl tags every image with IMAGE_TAG, which defaults to latest.
        # A sandbox image job also builds kora-sandbox-base, so it reads the base cache too.
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        with:
          source: .
          files: |
            docker-bake.hcl
            versions.hcl
          targets: ${{ matrix.target }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          set: |
            *.platform=${{ inputs.platforms }}
            *.cache-from=type=registry,ref=ghcr.io/${{ env.IMAGE_NAMESPACE }}/orbit-buildcache:${{ matrix.target }}${{ env.CACHE_SUFFIX }}
            *.cache-to=type=registry,ref=ghcr.io/${{ env.IMAGE_NAMESPACE }}/orbit-buildcache:${{ matrix.target }}${{ env.CACHE_SUFFIX }},mode=max,ignore-error=true
            kora-sandbox-base.cache-from=type=registry,ref=ghcr.io/${{ env.IMAGE_NAMESPACE }}/orbit-buildcache:kora-sandbox-base${{ env.CACHE_SUFFIX }}
            *.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}
            *.labels.org.opencontainers.image.url=https://github.com/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.labels.org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            *.labels.org.opencontainers.image.created=${{ steps.version.outputs.created }}
