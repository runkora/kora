name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly rescore of the default branch.
    - cron: "31 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions replace the top-level set. The checkout and the
      # analysis need these reads. On a private repository the analysis also
      # walks pull requests, issues, and checks.
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      # Upload the SARIF result to code scanning.
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing requires a public repository. Set to true once it is.
          publish_results: false

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        # Needs Code Security enabled on the repository.
        with:
          sarif_file: results.sarif
