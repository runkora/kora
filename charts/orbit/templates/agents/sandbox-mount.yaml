{{- if .Values.sandboxMount.enabled }}
{{- /* Node agent for sandbox working folders (docs/adr/2026-10-08-sandbox-workspace-mount.md). */}}
{{- $m := .Values.sandboxMount }}
{{- if or (lt (int $m.port) 1) (gt (int $m.port) 65535) }}
  {{- fail "sandboxMount.port must be a TCP port" }}
{{- end }}
{{- if $m.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $m.namespace }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbit-sandbox-mount
  namespace: {{ $m.namespace }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-mount
---
# The node agent only reads pods. It needs every namespace and node: a sandbox
# and its session-manager pod run on different nodes, and each node agent acts
# on whichever side it hosts.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orbit-sandbox-mount
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-mount
rules:
  # The agent's two informers list and watch sandbox and session-manager pods.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orbit-sandbox-mount
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-mount
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orbit-sandbox-mount
subjects:
  - kind: ServiceAccount
    name: orbit-sandbox-mount
    namespace: {{ $m.namespace }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: orbit-sandbox-mount
  namespace: {{ $m.namespace }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-mount
spec:
  selector:
    matchLabels:
      app: orbit-sandbox-mount
  template:
    metadata:
      labels:
        app: orbit-sandbox-mount
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: orbit-sandbox-mount
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      # nfsd serves, and the NFS client connects, from the node's own address.
      hostNetwork: true
      # The agent joins the node's mount namespace through PID 1 to release mount copies under dying pods.
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with $m.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $m.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $m.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with concat $m.tolerations .Values.agents.workloads.sandbox.tolerations .Values.agents.workloads.sessionManager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sandbox-mount
          image: {{ include "orbit.imageRef" (dict "root" $ "image" $m.image) | quote }}
          imagePullPolicy: {{ $m.image.pullPolicy | default .Values.global.imagePullPolicy | default "IfNotPresent" }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBELET_DIR
              value: {{ $m.kubeletDir | quote }}
            - name: NFS_PORT
              value: {{ $m.port | int | toString | quote }}
          # Mounting filesystems and starting the kernel NFS server need full privileges on the node.
          securityContext:
            privileged: true
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          volumeMounts:
            # Bidirectional: mounts the agent makes here reach the host, and from there the session-manager pods.
            - name: kubelet
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
      volumes:
        - name: kubelet
          hostPath:
            path: {{ $m.kubeletDir }}
            type: Directory
{{- end }}
