# What kora requires of SPIRE. An existing SPIRE must match these; the rest is
# chart default. The trust domain and cluster name are injected by the Helmfile
# from the shared environment facts (global.spire.trustDomain, clusterName).
spire-server:
  # With this 1s entry cache reload and the agent's 1s sync, a bound pool pod
  # holds its agent SVID about 2s after the bind. The default reload is 5s
  # (docs/adr/2026-11-22-agent-cold-tier.md).
  experimental:
    enabled: true
    cacheReloadInterval: 1s
    eventsBasedCache: true
  controllerManager:
    identities:
      clusterSPIFFEIDs:
        # The chart's catch-all registration would race kora's own.
        default:
          enabled: false
  nodeAttestor:
    k8sPSAT:
      enabled: true
      serviceAccountAllowList:
        - spire-system:spire-agent

spire-agent:
  # A 1s sync brings a bound pool pod's agent SVID to Envoy in about 2s. The
  # default 5s sync took 2.8s to 6.3s on kora-local (docs/adr/2026-11-22-agent-cold-tier.md).
  experimental:
    enabled: true
    syncInterval: 1s
  # Runs on every node that runs agent pods, including nodes with a disruption
  # taint such as karpenter.sh/disrupted. Without it a node loses its SDS stream.
  tolerations:
    - operator: Exists
  sds:
    enabled: true
    defaultSVIDName: default
    defaultBundleName: ROOTCA
    defaultAllBundlesName: ALL
  nodeAttestor:
    k8sPSAT:
      enabled: true
  workloadAttestors:
    k8s:
      enabled: true
      disableContainerSelectors: true
      useNewContainerLocator: false

spiffe-csi-driver:
  enabled: true
  tolerations:
    - operator: Exists

spire-controller-manager:
  enabled: true
