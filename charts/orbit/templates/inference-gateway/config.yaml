{{- /*
inference-gateway config files (docs/adr/2026-10-06-rendered-service-config-files.md).
*/}}
{{- define "orbit.inferenceGateway.configModules" -}}
cmd/inference-gateway:
  metrics:
    enabled: {{ .Values.global.metrics.enabled }}
    port: {{ .Values.global.metrics.port | default 9464 }}
  identity:
    internalURL: {{ include "orbit.serviceURL" (dict "root" . "name" "orbit-identity") | toJson }}
  agents:
    internalURL: {{ include "orbit.serviceURL" (dict "root" . "name" "orbit-agents") | toJson }}
  policy:
    bundleEndpoint: {{ include "orbit.bundleEndpoint" . | toJson }}
    policyServiceURL: {{ include "orbit.serviceURL" (dict "root" . "name" "orbit-policy-service") | toJson }}
  providers:
    namespace: {{ include "orbit.systemNamespace" . | toJson }}
{{ include "orbit.observabilityConfigModule" . }}
{{ include "orbit.storageConfigModule" (dict "root" . "redisClient" true) }}
{{ include "orbit.tokenConfigModule" . }}
{{- end }}
{{- include "orbit.configMap" (dict "root" $ "name" "inferenceGateway" "configMap" "orbit-inference-gateway-config" "modules" (include "orbit.inferenceGateway.configModules" . | fromYaml)) }}
