app:
  version: "0.1.0"

# publisher (replicas=1 — introspection + scope publishing + catalog) or
# proxy (scaled — request-path PEP + MCP proxy). Set per-deployment.
mode: "publisher"

server:
  # Health (and, in Phase 4, the MCP request path). orbit-mcp serves on 8095;
  # the tool-gateway takes 8096.
  httpPort: 8096
  basePath: "/v1"
  shutdownTimeoutSecs: 30

identity:
  # SVID exchange for this service's own platform token. The mesh's mTLS peer
  # identity authenticates the call, so no credential is configured here.
  internalURL: "http://orbit-identity.orbit-system.svc"

policy:
  policyServiceInternalURL: "http://orbit-policy-service.orbit-system.svc"
  bundleEndpoint: "http://orbit-policy-service.orbit-system.svc/api/v1/policy/bundles"
  bundlePollIntervalSecs: 30

registry:
  # Rendered by the operator's MCPServerAggregator into the orbit-mcp-servers
  # ConfigMap, mounted here and hot-reloaded on change.
  serversPath: "/var/run/orbit/mcp-servers/servers.json"

introspection:
  reintrospectIntervalSecs: 300

observability:
  serviceName: "tool-gateway"
