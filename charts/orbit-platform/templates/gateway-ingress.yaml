{{- if .Values.gateway.ingress.enabled }}
# Ingress exposing the Istio Gateway service through an ingress controller.
#
# This keeps Istio VirtualService routing in the request path while using a
# cluster-standard ingress controller such as Traefik for external exposure.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbit-gateway
  namespace: {{ .Values.gateway.ingress.namespace | default "istio-system" }}
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
  {{- with .Values.gateway.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.gateway.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    {{- range .Values.gateway.ingress.hosts }}
    - {{- with .host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $.Values.gateway.ingress.service.name }}
                port:
                  number: {{ $.Values.gateway.ingress.service.port }}
          {{- end }}
    {{- end }}
  {{- with .Values.gateway.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
