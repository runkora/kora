apiVersion: v1
kind: Service
metadata:
  name: orbit-inference-gateway
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.inferenceGateway.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "orbit.inferenceGateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 8081
      protocol: TCP
