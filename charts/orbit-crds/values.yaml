global:
  # "cluster" (default) or "namespaced" — sets orbittenants.orbit.io's CRD
  # scope. Must match the orbit release's global.tenantScope installed
  # against the same cluster; a cluster can only ever have one scope active
  # for this CRD (scope is immutable once the CRD exists). See
  # backend/internal/operator/settings.go.
  tenantScope: cluster
