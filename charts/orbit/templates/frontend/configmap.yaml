apiVersion: v1
kind: ConfigMap
metadata:
  name: orbit-frontend-config
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.frontend.labels" . | nindent 4 }}
data:
  # URL of the Go identity service as seen from inside the cluster.
  # Used by the Next.js BFF server-side routes to call the identity API.
  # Never sent to the browser.
  ORBIT_API_URL: {{ required "frontend.config.orbitApiUrl must be set" .Values.frontend.config.orbitApiUrl | quote }}

  # URL of the inference gateway service as seen from inside the cluster.
  # Used by the Next.js BFF server-side routes to proxy model/usage requests.
  # Never sent to the browser.
  INFERENCE_GATEWAY_URL: {{ required "frontend.config.inferenceGatewayUrl must be set" .Values.frontend.config.inferenceGatewayUrl | quote }}

  # URL of the policy gateway service as seen from inside the cluster.
  # Used by the Next.js BFF to fetch the principal's effective scope set
  # on login and token refresh (ADR-0037). Never sent to the browser.
  POLICY_GATEWAY_URL: {{ required "frontend.config.policyGatewayUrl must be set" .Values.frontend.config.policyGatewayUrl | quote }}

  # URL of the policy service (PAP) as seen from inside the cluster.
  # Used by the Next.js BFF to proxy grant/role/vocabulary admin endpoints.
  # Never sent to the browser.
  POLICY_SERVICE_URL: {{ required "frontend.config.policyServiceUrl must be set" .Values.frontend.config.policyServiceUrl | quote }}

  # URL of the orbit-agents service as seen from inside the cluster.
  # Used by the Next.js BFF to proxy agent type and run CRUD + SSE endpoints.
  # Never sent to the browser.
  ORBIT_AGENTS_URL: {{ required "frontend.config.orbitAgentsUrl must be set" .Values.frontend.config.orbitAgentsUrl | quote }}

  # URL of the MCP tool-gateway (proxy) as seen from inside the cluster.
  # Used by the Next.js BFF to read the read-only MCP tool catalog. Never sent
  # to the browser.
  TOOL_GATEWAY_URL: {{ required "frontend.config.toolGatewayUrl must be set" .Values.frontend.config.toolGatewayUrl | quote }}

  # Public base URL of this frontend, as seen from the browser.
  # Also available at runtime for server-side code that reads process.env.NEXT_PUBLIC_APP_URL.
  # Note: Next.js inlines NEXT_PUBLIC_* values into client bundles at build time —
  # the value here does not affect what was baked into the image, but should match it.
  NEXT_PUBLIC_APP_URL: {{ required "frontend.config.nextPublicAppUrl must be set" .Values.frontend.config.nextPublicAppUrl | quote }}

  # The dev environment ID this install belongs to, or empty on a normal (host)
  # install. Not NEXT_PUBLIC_* — read server-side per request, never baked in at
  # build time, since the identical image serves every environment.
  ORBIT_DEV_ENVIRONMENT_ID: {{ .Values.frontend.config.devEnvironmentId | default "" | quote }}
