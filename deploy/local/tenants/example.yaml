# KoraTenant CR for the local k3d development tenant.
#
# The operator will:
#   1. Auto-derive the namespace as "kora-tenant-example" (spec.namespace omitted)
#   2. Create that namespace with SPIRE + Istio injection labels
#   3. Add this tenant to the kora-tenants ConfigMap registry
#   4. The identity service picks up the registry update automatically
#
# The OIDC client is public (no client secret); Dex is configured with
# orbit-local as a public client for Device Authorization Grant.
apiVersion: runkora.io/v1alpha1
kind: KoraTenant
metadata:
  name: example
spec:
  displayName: "kora Example"
  active: true

  oidc:
    issuerURL: "https://dex.orbit.local.clearroute.io:5556/dex"
    clientID: "orbit-local"
    # No clientSecretRef; orbit-local is a public Dex client (device flow).
    scopes:
      - openid
      - profile
      - email
      - groups
    emailDomains:
      - orbit.local.clearroute.io

  # Retain the namespace when this CR is deleted (default). Prevents accidental
  # workload deletion during local dev iteration.
