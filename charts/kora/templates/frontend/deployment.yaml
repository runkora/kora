{{- $theme := include "kora.themeEnabled" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kora-frontend
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "kora.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kora.frontend.selectorLabels" . | nindent 8 }}
        {{- include "kora.frontend.labels" . | nindent 8 }}
        spiffe.io/component: frontend
        {{- include "kora.podLabels" (dict "root" $ "name" "frontend") | nindent 8 }}
      annotations:
        {{- include "kora.spireProxyAnnotations" (dict "root" $) | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/frontend/configmap.yaml") . | sha256sum }}
        {{- if $theme }}
        # Roll the pod when the theme document changes.
        checksum/theme: {{ include (print $.Template.BasePath "/frontend/theme-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- include "kora.podAnnotations" (dict "root" $ "name" "frontend") | nindent 8 }}
    spec:
      serviceAccountName: kora-frontend
      {{- include "kora.imagePullSecrets" . | nindent 6 }}
      {{- include "kora.scheduling" (dict "root" $ "name" "frontend") | nindent 6 }}
      securityContext:
        {{- include "kora.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "kora.spireVolumes" . | nindent 8 }}
        {{- if $theme }}
        - name: theme-document
          configMap:
            name: kora-frontend-theme
        {{- end }}
        {{- include "kora.extraVolumes" (dict "root" $ "name" "frontend") | nindent 8 }}
      {{- if $theme }}
      # Validates the document against this image's kora release. It fetches no URL.
      # A fault stalls the rollout, the old pods keep serving, and the reason is in this log.
      initContainers:
        - name: validate-theme
          image: {{ include "kora.image" (dict "root" $ "name" "frontend") | quote }}
          imagePullPolicy: {{ include "kora.imagePullPolicy" (dict "root" $ "name" "frontend") }}
          command: ["node", "/app/validate-theme.mjs", "/etc/kora/theme/theme.yaml"]
          securityContext:
            {{- include "kora.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            {{- include "kora.themeVolumeMounts" . | nindent 12 }}
      {{- end }}
      containers:
        - name: kora-frontend
          image: {{ include "kora.image" (dict "root" $ "name" "frontend") | quote }}
          imagePullPolicy: {{ include "kora.imagePullPolicy" (dict "root" $ "name" "frontend") }}
          securityContext:
            {{- include "kora.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            {{- include "kora.extraEnv" (dict "root" $ "name" "frontend") | nindent 12 }}
          envFrom:
            - configMapRef:
                name: kora-frontend-config
            - secretRef:
                name: {{ .Values.frontend.existingSecret }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            {{- include "kora.spireVolumeMount" . | nindent 12 }}
            {{- if $theme }}
            {{- include "kora.themeVolumeMounts" . | nindent 12 }}
            {{- end }}
            {{- include "kora.extraVolumeMounts" (dict "root" $ "name" "frontend") | nindent 12 }}
