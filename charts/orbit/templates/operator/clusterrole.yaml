# Least-privilege permissions for tenant reconciliation, admission, and preflight.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orbit-operator{{ include "orbit.clusterSuffix" . }}
  labels:
    {{- include "orbit.operator.labels" . | nindent 4 }}
rules:
  # Tenant namespaces: creation, injection and Pod Security labels.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # Aggregated registries, tenant CA, per-tenant OPA config, pull-secret
  # replication, the webhook serving certificate.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # delete covers the pull-secret replicas only: a Secret dropped from
  # global.imagePullSecrets is removed from every tenant namespace that
  # received it (internal/operator/tenant_pullsecrets.go).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # Counting the pods an MCPServer's workload selector matches. Listed directly,
  # not watched, so this starts no cluster-wide Pod cache.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # Sandbox egress policy in each tenant namespace, and an MCP server's ingress
  # policy. Both are owned by the CR that generated them, so deleting it is the
  # garbage collector's work rather than the operator's.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # Restricts an MCP server's callers to the tool-gateway principal.
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # Names the SPIFFE SAN a caller must expect on an MCP server's workload.
  - apiGroups: ["networking.istio.io"]
    resources: ["destinationrules"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # Limits agent pods' Envoy to the platform services
  # (docs/adr/2026-09-30-agent-pod-egress-lockdown.md).
  - apiGroups: ["networking.istio.io"]
    resources: ["sidecars"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # Reconciliation inputs; read-only. Connection/OAuthClient/MCPServer stay
  # here in every mode: they live across a dynamic, growing set of tenant
  # namespaces the cache can't express as a fixed namespace list (see
  # docs/adr/2026-09-29-namespace-scoped-tenants.md).
  - apiGroups: ["orbit.io"]
    resources: ["connections", "oauthclients", "mcpservers"]
    verbs: ["get", "list", "watch"]
  # Status conditions. Connection and OAuthClient have none.
  - apiGroups: ["orbit.io"]
    resources: ["mcpservers/status"]
    verbs: ["get", "patch"]
  {{- if ne (.Values.global.tenantScope | default "cluster") "namespaced" }}
  # orbittenants/orbittenants-status: cluster-scoped in this mode, so this is
  # the only place they can be granted. In namespaced mode they instead live
  # in this install's own system namespace and are granted there (see
  # namespaced-rbac.yaml).
  - apiGroups: ["orbit.io"]
    resources: ["orbittenants"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["orbit.io"]
    resources: ["orbittenants/status"]
    verbs: ["get", "patch"]
  {{- end }}
  # caBundle and failurePolicy on Orbit's own webhooks.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    resourceNames:
      [
        "aaa-orbit-agent-pod-mutator{{ include "orbit.clusterSuffix" . }}",
        "orbit-agent-pod-validator{{ include "orbit.clusterSuffix" . }}",
      ]
    verbs: ["get", "patch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["list", "watch"]
  # Preflight: CNI presence, SPIRE registrations. istiod comes from the
  # injector ConfigMap, not a Deployment. CSI driver and CRD presence have no
  # direct RBAC; see preflight.go's SVID fetch and ClusterSPIFFEID checks.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get"]
  - apiGroups: ["spire.spiffe.io"]
    resources: ["clusterspiffeids"]
    verbs: ["list"]
  {{- if ne (.Values.global.tenantScope | default "cluster") "namespaced" }}
  # Leader-election Lease: always lives in this install's own system
  # namespace (LeaderElectionNamespace, cmd/operator/main.go), so in
  # namespaced mode it's granted there instead (namespaced-rbac.yaml).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  {{- end }}
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
