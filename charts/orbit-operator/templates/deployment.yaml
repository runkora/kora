apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-operator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orbit-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "orbit-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit-operator.labels" . | nindent 8 }}
      annotations:
        # The operator installs Istio — it cannot depend on Istio being present.
        # This annotation must never be removed.
        sidecar.istio.io/inject: "false"
        {{- range $k, $v := .Values.podAnnotations }}
        {{- if ne $k "sidecar.istio.io/inject" }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "orbit-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ include "orbit-operator.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            # Helm SDK needs a writable home for its repo/cache files.
            # The container runs as non-root (65532) and cannot write to /.
            - name: HOME
              value: /tmp
            # Leader election is the only in-cluster tunable that differs between
            # dev and production. Driven by the chart value so operators running
            # in Kind/minikube can set leaderElection: false without APP_ENV.
            - name: ORBIT_LEADER_ELECTION
              value: {{ .Values.leaderElection | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.opa }}
            {{- if .Values.opa.image }}
            - name: ORBIT_OPA_IMAGE
              value: {{ .Values.opa.image | quote }}
            {{- end }}
            {{- if .Values.opa.logLevel }}
            - name: ORBIT_OPA_LOG_LEVEL
              value: {{ .Values.opa.logLevel | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.devEnv }}
            {{- if .Values.devEnv.imageRegistry }}
            - name: ORBIT_DEVENV_IMAGE_REGISTRY
              value: {{ .Values.devEnv.imageRegistry | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: webhook
              containerPort: 9443
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: webhook-tls
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: webhook-tls
          secret:
            secretName: orbit-operator-webhook-tls
      terminationGracePeriodSeconds: 60
