# =============================================================================
# glauth — lightweight LDAP server for local Dex identity
# =============================================================================
#
# glauth provides a minimal LDAP backend so that Dex's LDAP connector can
# return group membership (platform-admin, engineer, etc.) in the OIDC
# token. Dex's built-in staticPasswords do not support groups, so this
# replaces enablePasswordDB with a real directory-backed connector.
#
# Test credentials (local dev only — all passwords default to "password"):
#
#   dev@local.runkora.io        the admin. groups: platform-admin, engineer
#   engineer@local.runkora.io   a regular engineer. groups: engineer
#
# The passsha256 fields use ${GLAUTH_DEV_PASSWORD_HASH}, which is rendered at
# container startup by config/glauth/entrypoint.sh using shell builtins into
# /tmp/config.cfg.
#
# Started by: make dev-up  (or docker compose up -d glauth)
# =============================================================================

[ldap]
  enabled = true
  listen = "0.0.0.0:3893"

[ldaps]
  enabled = false

[backend]
  datastore = "config"
  baseDN = "dc=kora,dc=local"

# ─── Service account ─────────────────────────────────────────────────────────
# Dex binds as this account to search for users and groups.

[[users]]
  name = "serviceuser"
  mail = "service@local.runkora.io"
  uidnumber = 5000
  primarygroup = 5000
  passsha256 = "${GLAUTH_DEV_PASSWORD_HASH}"

  [[users.capabilities]]
    action = "search"
    object = "*"

[[groups]]
  name = "svcaccts"
  gidnumber = 5000

# ─── Dev users ───────────────────────────────────────────────────────────────

[[users]]
  name = "engineer"
  givenname = "Engineer"
  sn = "User"
  mail = "engineer@local.runkora.io"
  uidnumber = 1003
  primarygroup = 1100
  othergroups = [5003]
  passsha256 = "${GLAUTH_DEV_PASSWORD_HASH}"

[[users]]
  name = "dev"
  givenname = "Dev"
  sn = "User"
  mail = "dev@local.runkora.io"
  uidnumber = 1004
  primarygroup = 1100
  # platform-admin for policy administration, engineer for inference.
  othergroups = [5001, 5003]
  passsha256 = "${GLAUTH_DEV_PASSWORD_HASH}"

# ─── Groups ─────────────────────────────────────────────────────────────────

[[groups]]
  name = "users"
  gidnumber = 1100

[[groups]]
  name = "platform-admin"
  gidnumber = 5001

[[groups]]
  name = "engineer"
  gidnumber = 5003
