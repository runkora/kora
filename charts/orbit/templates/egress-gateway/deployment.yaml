apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-egress-gateway
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.egressGateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.egressGateway.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.egressGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.egressGateway.selectorLabels" . | nindent 8 }}
        {{- include "orbit.egressGateway.labels" . | nindent 8 }}
        spiffe.io/component: egress-gateway
        {{- include "orbit.podLabels" (dict "root" $ "name" "egressGateway") | nindent 8 }}
      annotations:
        {{- include "orbit.spireProxyAnnotations" (dict "root" $) | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/egress-gateway/config.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.global.metrics.port | default 9464 }}"
        prometheus.io/path: "/metrics"
        {{- include "orbit.podAnnotations" (dict "root" $ "name" "egressGateway") | nindent 8 }}
    spec:
      serviceAccountName: orbit-egress-gateway
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.scheduling" (dict "root" $ "name" "egressGateway") | nindent 6 }}
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "orbit.spireVolumes" . | nindent 8 }}
        {{- include "orbit.configVolume" (dict "root" $ "name" "egressGateway" "configMap" "orbit-egress-gateway-config" "modules" (include "orbit.egressGateway.configModules" . | fromYaml)) | nindent 8 }}
        # Per-tenant CA and connection material aggregated by the operator into the
        # system namespace; optional so the gateway starts before any tenant exists.
        - name: tenant-cas
          secret:
            secretName: {{ .Values.egressGateway.tenantCASecretName }}
            optional: true
            defaultMode: 0o400
        - name: connection-secrets
          secret:
            secretName: {{ .Values.egressGateway.connectionSecretName }}
            optional: true
            defaultMode: 0o400
        - name: tenant-connections
          configMap:
            name: {{ .Values.egressGateway.tenantConnectionsConfigMapName }}
            optional: true
        {{- include "orbit.extraVolumes" (dict "root" $ "name" "egressGateway") | nindent 8 }}
      containers:
        - name: orbit-egress-gateway
          image: {{ include "orbit.image" (dict "root" $ "name" "egressGateway") | quote }}
          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "egressGateway") }}
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          {{- with .Values.egressGateway.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: connect
              containerPort: {{ .Values.egressGateway.connectPort }}
              protocol: TCP
            - name: admin-http
              containerPort: {{ .Values.egressGateway.adminPort }}
              protocol: TCP
            - name: http-metrics
              containerPort: {{ .Values.global.metrics.port | default 9464 }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: connect
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: connect
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.egressGateway.resources | nindent 12 }}
          volumeMounts:
            {{- include "orbit.spireVolumeMount" . | nindent 12 }}
            {{- include "orbit.configVolumeMount" . | nindent 12 }}
            - name: tenant-cas
              mountPath: /var/run/orbit/tenant-ca
              readOnly: true
            - name: connection-secrets
              mountPath: /var/run/orbit/connection-secrets
              readOnly: true
            - name: tenant-connections
              mountPath: /var/run/orbit/connections
              readOnly: true
            {{- include "orbit.extraVolumeMounts" (dict "root" $ "name" "egressGateway") | nindent 12 }}
