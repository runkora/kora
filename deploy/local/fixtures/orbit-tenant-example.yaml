# Example tenant workload for the local cluster. The namespace comes from
# deploy/local/tenants/example.yaml; the operator's webhook adds the sidecars.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-config
  namespace: orbit-tenant-example
data:
  DB_HOST: orbit-postgres
  DB_NAME: orbit
  DB_PORT: "5432"
  DB_USER: orbit
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbit-example
  namespace: orbit-tenant-example
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-example
  namespace: orbit-tenant-example
  labels:
    app: orbit-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbit-example
  template:
    metadata:
      labels:
        app: orbit-example
        # Selects the orbit-tenant-agent ClusterSPIFFEID: .../agent/example.
        spiffe.io/agent: example
    spec:
      serviceAccountName: orbit-example
      # Tenant namespaces enforce restricted Pod Security.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orbit-example
          image: orbit-registry:5001/orbit-example:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: APP_ENV
              value: local
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: example-config
            - secretRef:
                name: orbit-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orbit-example
  namespace: orbit-tenant-example
spec:
  selector:
    app: orbit-example
  ports:
    - name: http
      port: 80
      targetPort: 8081
      protocol: TCP
