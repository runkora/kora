{{- /*
identity config files (docs/adr/2026-10-06-rendered-service-config-files.md).
*/}}
{{- define "orbit.identity.configModules" -}}
cmd/identity:
  publicHosts: {{ splitList "," (include "orbit.publicHosts" .) | compact | toJson }}
  policyServiceURL: {{ include "orbit.serviceURL" (dict "root" . "name" "orbit-policy-service") | toJson }}
  metrics:
    enabled: {{ .Values.global.metrics.enabled }}
    port: {{ .Values.global.metrics.port | default 9464 }}
internal/identity:
  token:
    accessTokenTtlMinutes: {{ .Values.identity.config.accessTokenTtlMinutes | int }}
{{ include "orbit.observabilityConfigModule" . }}
{{ include "orbit.storageConfigModule" (dict "root" . "redisClient" true) }}
{{- end }}
{{- include "orbit.configMap" (dict "root" $ "name" "identity" "configMap" "orbit-identity-config" "modules" (include "orbit.identity.configModules" . | fromYaml)) }}
