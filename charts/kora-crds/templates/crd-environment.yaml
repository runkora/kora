apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: environments.runkora.io
  labels:
    {{- include "kora-crds.labels" . | nindent 4 }}
  annotations:
    # helm uninstall keeps this CRD. Tenant definitions outlive the product install.
    helm.sh/resource-policy: keep
spec:
  group: runkora.io
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    singular: environment
    shortNames:
      - kenv
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.sandboxImage
        - name: Accepted
          type: string
          jsonPath: .status.conditions[?(@.type=="Accepted")].status
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >
            Environment defines a sandbox environment for the tenant whose
            namespace holds it. kora-agents watches it. metadata.name is the
            environment slug that agents attach by name.
          type: object
          required:
            - spec
          x-kubernetes-validations:
            - rule: "self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') && size(self.metadata.name) <= 63"
              message: metadata.name must be a DNS label.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - displayName
              properties:
                displayName:
                  type: string
                  minLength: 1
                description:
                  type: string
                sandboxImage:
                  type: string
                  description: A SandboxImage name in this namespace. Empty runs kora-base.
                size:
                  type: object
                  description: Kubernetes quantities. An empty dimension takes the install default.
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                    disk:
                      type: string
                egressHosts:
                  type: array
                  description: Hosts a sandbox may reach, exact or "*.suffix".
                  items:
                    type: string
                    minLength: 1
                connectors:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - connection
                  items:
                    type: object
                    required:
                      - connection
                      - actions
                    properties:
                      connection:
                        type: string
                        minLength: 1
                        description: A Connection name in this namespace.
                      actions:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          minLength: 1
                      resources:
                        type: array
                        description: Upstream resources the connector is narrowed to. Empty means all.
                        items:
                          type: string
                          minLength: 1
            status:
              type: object
              properties:
                id:
                  type: string
                  description: The id of the item the resource is projected to.
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
