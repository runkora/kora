apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-opa-gateway
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.opaGateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.opaGateway.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.opaGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.opaGateway.selectorLabels" . | nindent 8 }}
        {{- include "orbit.opaGateway.labels" . | nindent 8 }}
        spiffe.io/component: opa-gateway
        {{- include "orbit.podLabels" (dict "root" $ "name" "opaGateway") | nindent 8 }}
      annotations:
        {{- include "orbit.spireProxyAnnotations" (dict "root" $ "identityProxy" false) | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/opa-gateway/configmap.yaml") . | sha256sum }}
        {{- include "orbit.podAnnotations" (dict "root" $ "name" "opaGateway") | nindent 8 }}
    spec:
      serviceAccountName: orbit-opa-gateway
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.scheduling" (dict "root" $ "name" "opaGateway") | nindent 6 }}
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 1000) | nindent 8 }}
      volumes:
        {{- include "orbit.spireVolumes" (dict "identityProxy" false) | nindent 8 }}
        - name: opa-config
          configMap:
            name: orbit-opa-gateway-config
      containers:
        - name: opa
          image: {{ include "orbit.image" (dict "root" $ "name" "opaGateway") | quote }}
          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "opaGateway") }}
          args:
            - "run"
            - "--server"
            # gRPC ext_authz is what the gateway calls; the REST API stays on loopback.
            - "--addr=127.0.0.1:8181"
            - "--diagnostic-addr=0.0.0.0:8282"
            - "--config-file=/config/config.yaml"
            - "--log-level=info"
            - "--log-format=json"
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict) | nindent 12 }}
          ports:
            - name: grpc
              containerPort: 9191
              protocol: TCP
            - name: diag
              containerPort: 8282
              protocol: TCP
          volumeMounts:
            - name: opa-config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8282
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8282
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.opaGateway.resources | nindent 12 }}
