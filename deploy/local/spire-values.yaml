global:
  spire:
    trustDomain: orbit.local
    clusterName: orbit-local

spire-server:
  controllerManager:
    identities:
      clusterSPIFFEIDs:
        default:
          enabled: false

  nodeAttestor:
    k8sPSAT:
      enabled: true
      clusters:
        orbit-local:
          service_account_allow_list:
            - "spire-system:spire-agent"

spire-agent:
  sds:
    enabled: true
    defaultSVIDName: "default"
    defaultBundleName: "ROOTCA"
    defaultAllBundlesName: "ALL"
  nodeAttestor:
    k8sPSAT:
      enabled: true

  workloadAttestors:
    k8s:
      enabled: true
      skipKubeletVerification: true
      disableContainerSelectors: true
      useNewContainerLocator: false

spiffe-csi-driver:
  enabled: true

spire-controller-manager:
  enabled: true
