{{- if eq (include "orbit.sandboxWarmingMode" $) "image" }}
# Keeps the sandbox image cached on every node it runs on, avoiding a cold pull
# inside the provisioning timeout. The container only idles.
{{- $warming := .Values.agents.sandboxWarming }}
{{- $img := .Values.agents.config.sandboxImage | default (printf "%s/orbit-sandbox-exec:%s" .Values.global.imageRegistry (.Values.global.imageTag | default .Chart.AppVersion)) }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: orbit-sandbox-image-warmer
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-image-warmer
spec:
  selector:
    matchLabels:
      app: orbit-sandbox-image-warmer
  template:
    metadata:
      # Orbit's own keys win the merge, and every value is quoted: label and
      # annotation values are strings, and an unquoted `true` in values.yaml
      # reaches the API server as a boolean.
      labels:
        {{- range $k, $v := merge (dict "app" "orbit-sandbox-image-warmer") $warming.podLabels }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
      annotations:
        {{- range $k, $v := merge (dict "sidecar.istio.io/inject" "false") $warming.podAnnotations }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
    spec:
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.sandboxWarmingScheduling" (dict "root" $) | nindent 6 }}
      {{- with (.Values.agents.workloads.sandbox.priorityClassName | default .Values.agents.priorityClassName | default .Values.global.priorityClassName) }}
      priorityClassName: {{ . }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 100) | nindent 8 }}
      containers:
        - name: warm
          image: {{ $img | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "while true; do sleep 86400; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict) | nindent 12 }}
{{- end }}
