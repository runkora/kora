apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-egress-gateway
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.egressGateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.egressGateway.replicas }}
  selector:
    matchLabels:
      {{- include "kora.egressGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kora.egressGateway.selectorLabels" . | nindent 8 }}
        {{- include "kora.egressGateway.labels" . | nindent 8 }}
        spiffe.io/component: egress-gateway
        {{- include "kora.podLabels" (dict "root" $ "name" "egressGateway") | nindent 8 }}
      annotations:
        {{- include "kora.spireProxyAnnotations" (dict "root" $) | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/egress-gateway/config.yaml") . | sha256sum }}
        {{- include "kora.podAnnotations" (dict "root" $ "name" "egressGateway") | nindent 8 }}
    spec:
      serviceAccountName: orbit-egress-gateway
      {{- include "kora.imagePullSecrets" . | nindent 6 }}
      {{- include "kora.scheduling" (dict "root" $ "name" "egressGateway") | nindent 6 }}
      securityContext:
        {{- include "kora.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "kora.spireVolumes" . | nindent 8 }}
        {{- include "kora.configVolume" (dict "root" $ "name" "egressGateway" "configMap" "orbit-egress-gateway-config" "modules" (include "kora.egressGateway.configModules" . | fromYaml)) | nindent 8 }}
        # Per-tenant CA and connection material aggregated by the operator into the
        # system namespace; optional so the gateway starts before any tenant exists.
        - name: tenant-cas
          secret:
            secretName: {{ .Values.egressGateway.tenantCASecretName }}
            optional: true
            defaultMode: 0o400
        - name: connection-secrets
          secret:
            secretName: {{ .Values.egressGateway.connectionSecretName }}
            optional: true
            defaultMode: 0o400
        - name: tenant-connections
          configMap:
            name: {{ .Values.egressGateway.tenantConnectionsConfigMapName }}
            optional: true
        {{- include "kora.redisCAVolume" . | nindent 8 }}
        {{- include "kora.extraVolumes" (dict "root" $ "name" "egressGateway") | nindent 8 }}
      containers:
        - name: orbit-egress-gateway
          image: {{ include "kora.image" (dict "root" $ "name" "egressGateway") | quote }}
          imagePullPolicy: {{ include "kora.imagePullPolicy" (dict "root" $ "name" "egressGateway") }}
          securityContext:
            {{- include "kora.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            {{- include "kora.platformEnv" (dict "root" $ "name" "egressGateway" "keys" (list "REDIS_PASSWORD")) | nindent 12 }}
          ports:
            - name: connect
              containerPort: {{ .Values.egressGateway.connectPort }}
              protocol: TCP
            - name: admin-http
              containerPort: {{ .Values.egressGateway.adminPort }}
              protocol: TCP
            {{- if .Values.global.metrics.enabled }}
            - name: http-metrics
              containerPort: {{ .Values.global.metrics.port | default 9464 }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: connect
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: connect
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.egressGateway.resources | nindent 12 }}
          volumeMounts:
            {{- include "kora.spireVolumeMount" . | nindent 12 }}
            {{- include "kora.configVolumeMount" . | nindent 12 }}
            {{- include "kora.redisCAVolumeMount" . | nindent 12 }}
            - name: tenant-cas
              mountPath: /var/run/orbit/tenant-ca
              readOnly: true
            - name: connection-secrets
              mountPath: /var/run/orbit/connection-secrets
              readOnly: true
            - name: tenant-connections
              mountPath: /var/run/orbit/connections
              readOnly: true
            {{- include "kora.extraVolumeMounts" (dict "root" $ "name" "egressGateway") | nindent 12 }}
