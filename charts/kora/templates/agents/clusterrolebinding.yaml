apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kora-agents
  labels:
    {{- include "kora.agents.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kora-agents
subjects:
  - kind: ServiceAccount
    name: kora-agents
    namespace: {{ include "kora.systemNamespace" . }}
