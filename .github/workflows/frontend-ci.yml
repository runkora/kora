name: Frontend CI

on:
  workflow_call:
    inputs:
      hades:
        description: Whether frontend/src/packages/hades changed, which runs the classifier.
        type: boolean
        required: false
        default: false

# The default token only reads the repository. Jobs that need more
# declare it themselves.
permissions:
  contents: read

# Tool versions — keep in sync with the pinned versions in versions.hcl.
env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'

jobs:
  # ── Static analysis ───────────────────────────────────────────────────────
  # Split from the test job: the two share nothing beyond setup, and running
  # them serially in one job put ~45s of static checks on the critical path.
  frontend-static:
    name: Frontend Static Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Lint
        run: make frontend-lint

      - name: Type check
        run: make frontend-type-check

      - name: Format check
        run: make frontend-fmt

  # ── Unit + integration tests ──────────────────────────────────────────────
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      # Hades has its own vitest config; the app's unit config excludes src/packages/**.
      - name: Hades component tests
        run: cd frontend && pnpm --filter @orbit/hades run test:unit

      - name: Unit tests
        run: cd frontend && pnpm run test:coverage:unit

      - name: Integration tests
        if: always()
        run: cd frontend && pnpm run test:coverage:integration

      - name: Upload unit coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-unit
          path: frontend/coverage/unit/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload integration coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-integration
          path: frontend/coverage/integration/
          retention-days: 30
          if-no-files-found: ignore

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(cd frontend && npx playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright system dependencies
        run: cd frontend && npx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd frontend && npx playwright install chromium

      - name: Run E2E tests
        run: make frontend-test-e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 30
          if-no-files-found: ignore

  # ── Hades classification ─────────────────────────────────────────────────
  # Classifies the Hades change against the last hades/v* release per the
  # contract boundary rules, and fails when the version bumps in package.json
  # and the manifest are below their floors. Full history and tags are needed
  # because the comparison point is a tag. Wired into frontend-gate through
  # this workflow, so it cannot be bypassed.
  #
  # This job installs dependencies and runs the PR's scripts, so it is
  # read-only and keeps no credential in the checkout. It hands the report to
  # hades-comment as an artifact, and the token that can write to the pull
  # request never meets code from the PR.
  hades-classify:
    name: Hades Classification
    if: inputs.hades
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Manifest and contract in sync
        run: make hades-check

      # Before the first release the classifier compares against the PR base
      # (or the previous commit on main) and reports without enforcing.
      - name: Classify
        id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          set +e
          make hades-classify BASE="$BASE" FORMAT=markdown > hades-classification.md
          status=$?
          set -e
          cat hades-classification.md >> "$GITHUB_STEP_SUMMARY"
          make hades-classify BASE="$BASE" || true
          exit $status

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hades-classification
          path: hades-classification.md
          retention-days: 7
          if-no-files-found: ignore

  # Posts the report as the one PR comment. It holds the only write token and
  # installs nothing: it runs the comment script from the PR's base commit, not
  # its head, and reads the report, which is untrusted text, from the artifact.
  # The comment is a convenience and the check status carries the verdict, so a
  # failure here never fails the gate. Fork PRs get a read-only token and skip.
  hades-comment:
    name: Hades Classification Comment
    needs: hades-classify
    if: >-
      always() &&
      needs.hades-classify.result != 'skipped' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout the comment script from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download the report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hades-classification
          path: ${{ runner.temp }}/hades-report

      - name: Comment with the classification
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HADES_REPORT_FILE: ${{ runner.temp }}/hades-report/hades-classification.md
        with:
          script: |
            const fs = require('fs')
            const script = `${process.env.GITHUB_WORKSPACE}/.github/scripts/comment-hades-classification.js`
            if (!fs.existsSync(script)) {
              core.notice('The base commit has no comment script yet; skipping the comment.')
              return
            }
            await require(script)({ github, context })
