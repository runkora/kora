app:
  version: "0.1.0"

operator:
  leaderElection: true
  webhookCertDir: /tmp/k8s-webhook-server/serving-certs
  syncPeriodSecs: 300
  shutdownTimeoutSecs: 30

observability:
  serviceName: orbit-operator

# Defaults for a binary run outside the chart. The chart renders every key per install.
install:
  systemNamespace: orbit-system
  istioNamespace: istio-system
  spireClassName: spire-system-spire
  injection:
    identityProxyImage: ghcr.io/runkora/kora-identity-proxy:latest
    identityProxyPullPolicy: IfNotPresent
    opaImage: docker.io/openpolicyagent/opa:1.21.0-envoy-static
    opaPullPolicy: IfNotPresent
    opaLogLevel: info
    bundlePollingMinDelay: 30
    bundlePollingMaxDelay: 60
    startupProbeSeconds: 120
  podSecurity:
    enforce: restricted
    warn: restricted
    audit: restricted
  preflight:
    intervalSeconds: 300
  sandboxImages:
    baseImage: ghcr.io/runkora/kora-sandbox-base:latest
