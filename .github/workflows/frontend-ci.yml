name: Frontend CI

on:
  workflow_call:
    inputs:
      hades:
        description: Whether frontend/src/packages/hades changed, which runs the classifier.
        type: boolean
        required: false
        default: false

# The default token only reads the repository. Jobs that need more
# declare it themselves.
permissions:
  contents: read

# Tool versions — keep in sync with the pinned versions in versions.hcl.
env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'

jobs:
  # ── Static analysis ───────────────────────────────────────────────────────
  # Split from the test job: the two share nothing beyond setup, and running
  # them serially in one job put ~45s of static checks on the critical path.
  frontend-static:
    name: Frontend Static Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Lint
        run: make frontend-lint

      - name: Type check
        run: make frontend-type-check

      - name: Format check
        run: make frontend-fmt

  # ── Unit + integration tests ──────────────────────────────────────────────
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      # Hades has its own vitest config; the app's unit config excludes src/packages/**.
      - name: Hades component tests
        run: cd frontend && pnpm --filter @orbit/hades run test:unit

      - name: Unit tests
        run: cd frontend && pnpm run test:coverage:unit

      - name: Integration tests
        if: always()
        run: cd frontend && pnpm run test:coverage:integration

      - name: Upload unit coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-unit
          path: frontend/coverage/unit/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload integration coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-integration
          path: frontend/coverage/integration/
          retention-days: 30
          if-no-files-found: ignore

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(cd frontend && npx playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright system dependencies
        run: cd frontend && npx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd frontend && npx playwright install chromium

      - name: Run E2E tests
        run: make frontend-test-e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 30
          if-no-files-found: ignore

  # ── Hades classification ─────────────────────────────────────────────────
  # Classifies the Hades change against the last hades/v* release per the
  # contract boundary rules, posts one PR comment with the result, and fails
  # when the version bump in package.json is below the floor. Full history and
  # tags are needed because the comparison point is a tag. Wired into
  # frontend-gate through this workflow, so it cannot be bypassed.
  hades-classify:
    name: Hades Classification
    if: inputs.hades
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Manifest and contract in sync
        run: make hades-check

      # Before the first release the classifier compares against the PR base
      # (or the previous commit on main) and reports without enforcing.
      - name: Classify
        id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          set +e
          make hades-classify BASE="$BASE" FORMAT=markdown > hades-classification.md
          status=$?
          set -e
          cat hades-classification.md >> "$GITHUB_STEP_SUMMARY"
          make hades-classify BASE="$BASE" || true
          exit $status

      - name: Comment with the classification
        # Fork PRs get a read-only token; skip rather than fail the gate.
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # The report is built from the PR branch, so it is untrusted input.
          # Read it from the file at runtime instead of interpolating it.
          HADES_REPORT_FILE: ${{ github.workspace }}/hades-classification.md
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/comment-hades-classification.js`)
            await run({ github, context })
