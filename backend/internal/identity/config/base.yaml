token:
  # Access token lifetime. The chart renders identity.config.accessTokenTtlMinutes.
  accessTokenTtlMinutes: 15
  # Human refresh token lifetime.
  refreshTokenTtlDays: 7
  # Default PAT lifetime when the caller does not specify expires_in_days.
  patDefaultTtlDays: 90
  # Maximum PAT lifetime a caller may request.
  patMaxTtlDays: 365
  # JWT aud claim.
  audience: kora-platform
  # Delegation token lifetime (delegated-agent-identity ADR, Decision 3). A
  # short backstop, not the revocation mechanism: retrieval re-signs from the
  # live issuance record.
  delegationTokenTtlMinutes: 60

# Where the chart mounts the operator-rendered tenant registry, OIDC client
# secrets and pre-registered OAuth clients.
registry:
  tenantsPath: /etc/kora/tenants.yaml
  clientSecretsPath: /etc/kora/tenant-secrets/client-secrets.yaml
  oauthClientsPath: /etc/kora/oauth-clients/oauth-clients.json
