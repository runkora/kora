app:
  version: "0.1.0"

operator:
  namespace: orbit-system
  chartDir: /etc/orbit/charts
  leaderElection: true
  webhookCertDir: /tmp/k8s-webhook-server/serving-certs
  syncPeriodSecs: 300
  shutdownTimeoutSecs: 30
  devEnvIngressDomain: dev.orbit.local
  # Browser-facing base URL for path-scoped dev-environment app ingress
  # ({url}/{env-id}). Default (empty) resolves to the local k3d value in
  # config.go; real infrastructure overrides via ORBIT_DEVENV_APP_EXTERNAL_URL
  # (e.g. https://orbit.dev.clearroute.io) plus ORBIT_DEVENV_APP_TLS_CREDENTIAL.
  devEnvAppExternalURL: ""
  devEnvAppTLSCredentialName: ""

observability:
  serviceName: orbit-operator
