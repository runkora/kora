name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.excalidraw"
      - "docs/**"
      - "tools/diagrams/**"
      - "scripts/docs/**"
      # The binary table is validated against backend/cmd/, so a new binary
      # must re-run this gate even when no doc file changed.
      - "backend/cmd/**"
      - ".github/workflows/docs-ci.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.excalidraw"
      - "docs/**"
      - "tools/diagrams/**"
      - "scripts/docs/**"
      - "backend/cmd/**"

permissions:
  contents: read

jobs:
  docs-check:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check documentation for drift
        run: make docs-check

      - name: Collect changed diagrams
        if: github.event_name == 'pull_request'
        id: diagrams
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" \
            -- '*.excalidraw' | sort -u)
          {
            echo "list<<EOF"
            echo "$changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment with changed diagrams
        # Fork PRs get a read-only token; skip rather than fail the gate.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.diagrams.outputs.list != ''
        uses: actions/github-script@v7
        env:
          # Filenames come from the PR branch, so they are untrusted input.
          # Read them at runtime instead of interpolating into the script body.
          CHANGED_DIAGRAMS: ${{ steps.diagrams.outputs.list }}
        with:
          script: |
            const marker = '<!-- orbit-diagram-preview -->'
            const sha = context.payload.pull_request.head.sha
            const repo = `${context.repo.owner}/${context.repo.repo}`
            const sources = (process.env.CHANGED_DIAGRAMS || '')
              .split('\n').map(s => s.trim()).filter(Boolean)
              // Only repo-relative diagram sources; no traversal, no odd characters.
              .filter(s => /^[A-Za-z0-9._/-]+\.excalidraw$/.test(s) && !s.includes('..'))

            if (sources.length === 0) return

            const rows = sources.map(src => {
              const svg = src.replace(/\.excalidraw$/, '.svg')
              const name = svg.split('/').pop().replace(/\.svg$/, '')
              return `| \`${name}\` | [view rendered](https://github.com/${repo}/blob/${sha}/${svg}) |`
            })

            const body = [
              marker,
              '### Diagrams changed in this PR',
              '',
              '| Diagram | Rendered |',
              '|---|---|',
              ...rows,
              '',
              'The Files changed tab shows a before-and-after image diff for each SVG.',
            ].join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(c => c.body && c.body.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
