# ClusterSPIFFEID resources for Orbit's SPIFFE identity grant model.
#
# These define the SPIFFE ID templates assigned to workloads by the SPIRE
# controller manager. The identity paths follow the Orbit SPIFFE URI scheme
# documented in ADR-0018 and ADR-0019:
#
#   Istio gateway:     spiffe://<trust-domain>/ns/<namespace>/sa/<service-account>
#   Istio sidecar:     spiffe://<trust-domain>/ns/<namespace>/sa/<service-account>
#   System component:  spiffe://<trust-domain>/system/<component-label>
#   Tenant service:    spiffe://<trust-domain>/tenant/<namespace>/service/<service-label>
#   Tenant agent:      spiffe://<trust-domain>/tenant/<namespace>/agent/<agent-label>
#
# The className "spire-system-spire" matches the SPIRE controller manager's configured
# className (set in the controller-manager-config.yaml ConfigMap, field: className).
#
# Ref: ADR-0018 (SPIFFE identity grants), ADR-0019 (tenant isolation)
#
# Gated on .Values.spire.enabled: a SPIRE-disabled (devenv-mode) install has
# no in-vcluster SPIRE controller manager to satisfy these — see
# docs/adr/2026-08-04-devenv-mode-platform-support.md, F-1.
{{- if .Values.spire.enabled }}
{{- $trustDomain := include "orbit-platform.trustDomain" . }}
---
# Istio gateway pods need a SPIFFE identity so that the service mesh can
# authenticate them in mTLS peer auth. Scoped to istio-system namespace only.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: istio-gateway
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
spec:
  className: spire-system-spire
  spiffeIDTemplate: "spiffe://{{ $trustDomain }}/ns/{{ `{{ .PodMeta.Namespace }}` }}/sa/{{ `{{ .PodSpec.ServiceAccountName }}` }}"
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: istio-system
  podSelector:
    matchLabels:
      app: gateway
  workloadSelectorTemplates:
    - "k8s:ns:istio-system"
    - "k8s:sa:gateway"
---
# Istio sidecar proxies injected into non-system, non-tenant, non-devenv namespaces.
# Scoped by exclusion: does NOT match orbit-system, any orbit.io/role=tenant namespace,
# or any orbit.io/role=devenv namespace — those are covered by the
# orbit-system-component, orbit-tenant-*, and (host-side) devenv-scoped IDs
# respectively.
#
# The devenv exclusion matters: every dev environment's flattened host namespace
# carries chart-shipped services with the identical
# spiffe.io/spire-managed-identity=true label this ClusterSPIFFEID selects on, and
# is neither orbit-system nor orbit.io/role=tenant — so without this exclusion a
# devenv pod matches BOTH this ID and its own devenv-scoped one, giving it two
# competing SPIFFE identities. SPIRE's SDS handler resolves the ambiguous
# "default" resource to whichever entry was created first, which is not
# guaranteed to be the devenv-prefixed one.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: istio-sidecar
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
spec:
  className: spire-system-spire
  spiffeIDTemplate: "spiffe://{{ $trustDomain }}/ns/{{ `{{ .PodMeta.Namespace }}` }}/sa/{{ `{{ .PodSpec.ServiceAccountName }}` }}"
  podSelector:
    matchLabels:
      spiffe.io/spire-managed-identity: "true"
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
          - {{ include "orbit-platform.systemNamespace" . }}
      - key: orbit.io/role
        operator: NotIn
        values:
          - tenant
          - devenv
---
# Orbit system components (identity service, etc.) in orbit-system namespace.
# SPIFFE ID path: spiffe://<trust-domain>/system/<component>
# The component name is taken from the pod label: spiffe.io/component=<name>
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: orbit-system-component
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
spec:
  className: spire-system-spire
  spiffeIDTemplate: "spiffe://{{ $trustDomain }}/system/{{ `{{ index .PodMeta.Labels \"spiffe.io/component\" }}` }}"
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ include "orbit-platform.systemNamespace" . }}
  podSelector:
    matchExpressions:
      - key: spiffe.io/component
        operator: Exists
---
# Tenant service workloads: long-running services in a tenant namespace.
# SPIFFE ID path: spiffe://<trust-domain>/tenant/<namespace>/service/<service>
# The service name is taken from the pod label: spiffe.io/service=<name>
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: orbit-tenant-service
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
spec:
  className: spire-system-spire
  spiffeIDTemplate: "spiffe://{{ $trustDomain }}/tenant/{{ `{{ .PodMeta.Namespace }}` }}/service/{{ `{{ index .PodMeta.Labels \"spiffe.io/service\" }}` }}"
  namespaceSelector:
    matchLabels:
      orbit.io/role: tenant
  podSelector:
    matchExpressions:
      - key: spiffe.io/service
        operator: Exists
---
# Tenant agent workloads: autonomous agents run inside tenant namespaces.
# SPIFFE ID path: spiffe://<trust-domain>/tenant/<namespace>/agent/<agent>
# The agent name is taken from the pod label: spiffe.io/agent=<name>
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: orbit-tenant-agent
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
spec:
  className: spire-system-spire
  spiffeIDTemplate: "spiffe://{{ $trustDomain }}/tenant/{{ `{{ .PodMeta.Namespace }}` }}/agent/{{ `{{ index .PodMeta.Labels \"spiffe.io/agent\" }}` }}"
  namespaceSelector:
    matchLabels:
      orbit.io/role: tenant
  podSelector:
    matchExpressions:
      - key: spiffe.io/agent
        operator: Exists
---
# Per-run sandbox workloads: the ephemeral pods that host an agent's
# tools (git, gh, aws, kubectl, SDKs). One per active run, attested
# distinctly so every outbound credential mint is auditably tied to
# the specific run that made it.
#
# SPIFFE ID path:
#   spiffe://<trust-domain>/tenant/<namespace>/agent/<slug>/sandbox/<run-id>
#
# The principal extractor (internal/identity/principal_extractor.go)
# normalizes this back to the agent URI for authorization (so OPA
# grants on the agent apply to every run) while lifting run_id into
# Claims for attribution. See
# docs/adr/2026-06-06-jit-credential-brokering-egress-gateway.md.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: orbit-tenant-sandbox
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
spec:
  className: spire-system-spire
  spiffeIDTemplate: "spiffe://{{ $trustDomain }}/tenant/{{ `{{ .PodMeta.Namespace }}` }}/agent/{{ `{{ index .PodMeta.Labels \"orbit.io/agent-slug\" }}` }}/sandbox/{{ `{{ index .PodMeta.Labels \"orbit.io/run-id\" }}` }}"
  namespaceSelector:
    matchLabels:
      orbit.io/role: tenant
  podSelector:
    matchLabels:
      orbit.io/role: sandbox
    matchExpressions:
      - key: orbit.io/agent-slug
        operator: Exists
      - key: orbit.io/run-id
        operator: Exists
{{- end }}
