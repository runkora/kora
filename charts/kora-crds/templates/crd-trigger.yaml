apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: triggers.runkora.io
  labels:
    {{- include "kora-crds.labels" . | nindent 4 }}
  annotations:
    # helm uninstall keeps this CRD. Tenant definitions outlive the product install.
    helm.sh/resource-policy: keep
spec:
  group: runkora.io
  names:
    kind: Trigger
    listKind: TriggerList
    plural: triggers
    singular: trigger
    shortNames:
      - ktrig
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: Agent
          type: string
          jsonPath: .spec.agent
        - name: Accepted
          type: string
          jsonPath: .status.conditions[?(@.type=="Accepted")].status
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >
            Trigger starts runs of an Agent for the tenant whose namespace
            holds it, on a webhook event, a schedule or a manual fire.
            kora-triggers watches it. A webhook trigger may route each event to
            one of several Agents instead of naming one.
          type: object
          required:
            - spec
          x-kubernetes-validations:
            - rule: "self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') && size(self.metadata.name) <= 63"
              message: metadata.name must be a DNS label.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - promptTemplate
              x-kubernetes-validations:
                - rule: "has(self.agent) != has(self.routing)"
                  message: set exactly one of agent and routing.
                - rule: "self.kind != 'webhook' || (has(self.source) && has(self.eventType))"
                  message: a webhook trigger needs source and eventType.
                - rule: "self.kind != 'scheduled' || has(self.schedule)"
                  message: a scheduled trigger needs schedule.
                - rule: "self.kind == 'webhook' || !(has(self.source) || has(self.eventType) || has(self.match) || has(self.matchContains) || has(self.senderRestriction) || has(self.coalesce) || has(self.routing))"
                  message: source, eventType, match, matchContains, senderRestriction, coalesce and routing apply to webhook triggers only.
                - rule: "self.kind == 'scheduled' || !has(self.schedule)"
                  message: schedule applies to scheduled triggers only.
                - rule: "self.kind == 'manual' || !has(self.manual)"
                  message: manual applies to manual triggers only.
              properties:
                kind:
                  type: string
                  enum:
                    - webhook
                    - scheduled
                    - manual
                  default: webhook
                source:
                  type: string
                  minLength: 1
                  description: A TriggerSource name in this namespace.
                eventType:
                  type: string
                  minLength: 1
                match:
                  type: object
                  description: Payload paths and the values each must equal, one of.
                  additionalProperties:
                    type: array
                    items:
                      type: string
                matchContains:
                  type: object
                  description: Payload paths and the values each must contain, one of.
                  additionalProperties:
                    type: array
                    items:
                      type: string
                senderRestriction:
                  type: object
                  properties:
                    ids:
                      type: array
                      items:
                        type: string
                    roles:
                      type: array
                      items:
                        type: string
                coalesce:
                  type: object
                  description: Folds events with the same key inside the window into one delivery.
                  required:
                    - key
                    - windowSeconds
                  properties:
                    key:
                      type: string
                      minLength: 1
                    windowSeconds:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 300
                agent:
                  type: string
                  minLength: 1
                  description: The Agent name in this namespace whose runs the trigger starts.
                routing:
                  type: object
                  description: Lets a decision model pick one of the candidate Agents for each event.
                  required:
                    - candidates
                    - model
                  properties:
                    candidates:
                      type: array
                      minItems: 1
                      maxItems: 20
                      description: Agent names in this namespace.
                      items:
                        type: string
                        minLength: 1
                    model:
                      type: object
                      description: The VirtualModel that decides.
                      required:
                        - family
                        - name
                      properties:
                        family:
                          type: string
                          pattern: "^[a-z0-9_-]{1,255}$"
                        name:
                          type: string
                          pattern: "^[a-z0-9_-]{1,255}$"
                    confidence:
                      type: string
                      description: The probability the chosen Agent must reach. Unset means balanced.
                      enum:
                        - strict
                        - balanced
                        - loose
                    fallback:
                      type: string
                      minLength: 1
                      description: The candidate Agent that takes an event the model is unsure about. Unset starts no run.
                    joinRuns:
                      type: boolean
                      description: Lets an event join an open run. Unset means true.
                    joinKey:
                      type: string
                      maxLength: 256
                schedule:
                  type: object
                  required:
                    - cronExpression
                  properties:
                    cronExpression:
                      type: string
                      minLength: 1
                      description: A standard five-field cron expression.
                    timezone:
                      type: string
                      default: UTC
                      description: An IANA timezone name. Defaults to UTC.
                    catchUp:
                      type: boolean
                      description: Fire once for schedules missed while the platform was down.
                manual:
                  type: object
                  properties:
                    inputs:
                      type: array
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys:
                        - name
                      items:
                        type: object
                        required:
                          - name
                          - type
                        properties:
                          name:
                            type: string
                            minLength: 1
                          type:
                            type: string
                            enum:
                              - text
                              - number
                              - boolean
                              - choice
                          label:
                            type: string
                          description:
                            type: string
                          required:
                            type: boolean
                          default:
                            type: string
                          choices:
                            type: array
                            items:
                              type: string
                promptTemplate:
                  type: string
                  minLength: 1
                maxParallel:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 16
                overflow:
                  type: string
                  enum:
                    - wait
                    - replace
                    - refuse
                maxQueueDepth:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 500
                timeoutSeconds:
                  type: integer
                  format: int32
                  minimum: 5
                  maximum: 600
                dedupeEnabled:
                  type: boolean
                autopauseEnabled:
                  type: boolean
                enabled:
                  type: boolean
                  default: true
            status:
              type: object
              properties:
                id:
                  type: string
                  description: The id of the item the resource is projected to.
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
