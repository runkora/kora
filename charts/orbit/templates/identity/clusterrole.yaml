apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orbit-identity
  labels:
    {{- include "orbit.identity.labels" . | nindent 4 }}
rules:
  # Decision 5 of docs/adr/2026-07-07-ephemeral-development-environments-via-vcluster.md:
  # the devenvironments feature's only Kubernetes access, deliberately narrowed
  # to CRUD on OrbitDevEnvironment CRs — no namespaces, no pods, no Helm
  # releases, and no access to the status subresource (only the operator's
  # reconciler signs kubeconfig CSRs and advances lifecycle phase).
  - apiGroups: ["orbit.io"]
    resources: ["orbitdevenvironments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
