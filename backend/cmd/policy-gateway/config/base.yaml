app:
  version: "0.1.0"

server:
  httpPort: 8084
  basePath: "/v1"
  shutdownTimeoutSecs: 30

# The chart renders the policy service URLs.
policy:
  bundlePollIntervalSecs: 30

observability:
  serviceName: "policy-gateway"

metrics:
  enabled: true
  port: 9464
  path: /metrics
  shutdownTimeoutSecs: 5
  namespace: ""
  collectGoRuntimeMetrics: true
  collectProcessMetrics: true
