# The operator registers each InferenceProvider's hosts with the mesh as a
# ServiceEntry it owns; the garbage collector removes it with the provider.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kora-operator
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["runkora.io"]
    resources: ["inferenceproviders"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.istio.io"]
    resources: ["serviceentries"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kora-operator
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kora-operator
subjects:
  - kind: ServiceAccount
    name: kora-operator
    namespace: {{ include "kora.systemNamespace" . }}
