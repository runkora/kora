version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images are pinned by digest in the Dockerfiles so builds are
  # reproducible; this keeps those digests moving with upstream tags.
  - package-ecosystem: docker
    directories:
      - /
      - /backend
      - /frontend
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    # The tags in the Dockerfiles (golang 1.26, node 24, alpine 3.23, ...)
    # are chosen deliberately; a new major or minor is a decision, not an
    # update. Dependabot moves only the digest and patch releases behind them.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # The agent CLIs the session-manager image installs with npm ci. A new major
  # changes the runner protocol, so Dependabot moves minor and patch releases only.
  - package-ecosystem: npm
    directory: /backend/cmd/session-manager/agent-clis
    schedule:
      interval: weekly
    groups:
      agent-clis:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # The backend's Go modules. Minor and patch releases arrive as one grouped
  # pull request a week. A new major changes the module path and its API, so it
  # is a decision, not an update.
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # The frontend's pnpm dependencies, on the same terms as the Go modules.
  # The Hades workspace package still lists Storybook 8 while the app runs
  # Storybook 10. Dependabot updates a package in every manifest of the
  # workspace together, so an 8.x release for Hades is also written into the
  # app's manifest, which breaks `storybook dev`. Storybook 8 releases are
  # therefore never proposed.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@storybook/*"
        versions: ["< 10"]
      - dependency-name: "storybook"
        versions: ["< 10"]
