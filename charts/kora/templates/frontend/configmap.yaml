# In-cluster URLs the Next.js BFF calls server-side; frontend.config.*
# overrides the release-namespace defaults. Only NEXT_PUBLIC_APP_URL reaches
# the browser, and it must match the build-time value. KORA_APP_URL carries the
# same value for server code, which cannot read the build-inlined NEXT_PUBLIC one.
{{- $ns := include "kora.systemNamespace" . }}
{{- $c := .Values.frontend.config }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kora-frontend-config
  namespace: {{ $ns }}
  labels:
    {{- include "kora.frontend.labels" . | nindent 4 }}
data:
  KORA_API_URL: {{ $c.koraApiUrl | default (printf "http://kora-identity.%s.svc.cluster.local/api/v1" $ns) | quote }}
  KORA_TRIGGERS_URL: {{ $c.koraTriggersUrl | default (printf "http://kora-triggers.%s.svc.cluster.local/api/v1" $ns) | quote }}
  INFERENCE_GATEWAY_URL: {{ $c.inferenceGatewayUrl | default (printf "http://kora-inference-gateway.%s.svc.cluster.local/v1" $ns) | quote }}
  POLICY_GATEWAY_URL: {{ $c.policyGatewayUrl | default (printf "http://kora-policy-gateway.%s.svc.cluster.local/v1" $ns) | quote }}
  POLICY_SERVICE_URL: {{ $c.policyServiceUrl | default (printf "http://kora-policy-service.%s.svc.cluster.local/api/v1" $ns) | quote }}
  KORA_AGENTS_URL: {{ $c.koraAgentsUrl | default (printf "http://kora-agents.%s.svc.cluster.local" $ns) | quote }}
  TOOL_GATEWAY_URL: {{ $c.toolGatewayUrl | default (printf "http://kora-tool-gateway.%s.svc.cluster.local" $ns) | quote }}
  NEXT_PUBLIC_APP_URL: {{ $c.nextPublicAppUrl | default (printf "https://%s" (include "kora.frontendHost" .)) | quote }}
  KORA_APP_URL: {{ $c.nextPublicAppUrl | default (printf "https://%s" (include "kora.frontendHost" .)) | quote }}
