---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server
  namespace: spire
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      # MUST be overridden by each environment overlay — staging and production
      # will use a different trust domain (e.g. spiffe://orbit.example.com).
      trust_domain = "orbit.local"
      data_dir = "/run/spire/data"
      log_level = "INFO"

      # Publish the trust bundle into the spire-bundle ConfigMap so agents
      # and workloads can fetch it without direct server contact.
      ca_ttl = "24h"
      default_x509_svid_ttl = "1h"
      default_jwt_svid_ttl = "5m"
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }

    plugins {
      DataStore "sql" {
        plugin_data {
          # MUST be overridden by each environment overlay.
          # This connection string is intentionally broken (password=REPLACE-VIA-OVERLAY)
          # so any environment that inherits the base without patching it will fail
          # immediately rather than silently using a wrong credential.
          # See: overlays/*/patches/spire-server-config.yaml
          database_type = "postgres"
          connection_string = "host=spire-db.spire.svc.cluster.local port=5432 user=spire password=REPLACE-VIA-OVERLAY dbname=spire sslmode=require"
        }
      }

      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "orbit-cluster" = {
              service_account_allow_list = ["spire:spire-agent"]
            }
          }
        }
      }

      KeyManager "disk" {
        plugin_data {
          keys_path = "/run/spire/data/keys.json"
        }
      }

      Notifier "k8sbundle" {
        plugin_data {
          namespace = "spire"
          config_map = "spire-bundle"
        }
      }
    }
