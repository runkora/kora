# Unified backend API VirtualService.
#
# api.<domain> is the single external host for ALL backend/data-plane services
# (ADR 2026-07-04, north-south ingress + external service exposure). This VS is
# the platform-owned routing table: services declare a path prefix here; there is
# no per-service host or additional Gateway server. <domain> with no prefix is the
# frontend/BFF only (see frontend/virtualservice.yaml).
#
# Routes are ordered most-specific first (Istio evaluates in order, first match
# wins). The root /.well-known/* discovery documents (RFC 8414/9728) are served
# at the host root and rewritten to each owning service's internal base path.
#
# The Gateway resource lives in charts/orbit-platform/templates/gateway.yaml.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: orbit-api
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
spec:
  hosts:
    - "{{ include "orbit.apiHost" . }}"
  gateways:
    - {{ include "orbit.systemNamespace" . }}/orbit-gateway
  http:
    # ── Root discovery metadata (RFC 8414 / 9728) ──────────────────────────────
    # Served at the host root; rewritten to each service's internal basePath. The
    # metadata CONTENT is host-derived, so the rewrite (path only) keeps the issuer
    # correct.
    - match:
        - uri:
            exact: /.well-known/oauth-protected-resource
      rewrite:
        uri: /v1/.well-known/oauth-protected-resource
      route:
        - destination:
            host: orbit-tool-gateway.{{ include "orbit.systemNamespace" . }}.svc.cluster.local
            port:
              number: 80
    - match:
        - uri:
            exact: /.well-known/oauth-authorization-server
      rewrite:
        uri: /api/v1/identity/.well-known/oauth-authorization-server
      route:
        - destination:
            host: orbit-identity.{{ include "orbit.systemNamespace" . }}.svc.cluster.local
            port:
              number: 80
    # ── MCP tool-gateway ───────────────────────────────────────────────────────
    - match:
        - uri:
            prefix: /v1/mcp
      route:
        - destination:
            host: orbit-tool-gateway.{{ include "orbit.systemNamespace" . }}.svc.cluster.local
            port:
              number: 80
    # ── Identity: OAuth, device/session/exchange, JWKS, inbound webhooks ────────
    - match:
        - uri:
            prefix: /api/v1/identity/
        - uri:
            prefix: /api/v1/webhooks/
      route:
        - destination:
            host: orbit-identity.{{ include "orbit.systemNamespace" . }}.svc.cluster.local
            port:
              number: 80
    # ── Inference gateway (OpenAI-compatible API) — the API-host default ────────
    - timeout: 3600s # Long timeout; inference streams can run for many minutes.
      route:
        - destination:
            host: orbit-inference-gateway.{{ include "orbit.systemNamespace" . }}.svc.cluster.local
            port:
              number: 80
