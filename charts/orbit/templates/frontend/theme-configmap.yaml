{{- if include "orbit.themeEnabled" . }}
# The theme document. The frontend pod mounts it as /etc/orbit/theme/theme.yaml.
# The init container validates it and the frontend loads it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orbit-frontend-theme
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.frontend.labels" . | nindent 4 }}
data:
  theme.yaml: |
    {{- .Values.theme.document | nindent 4 }}
{{- end }}
