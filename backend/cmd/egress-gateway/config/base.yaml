app:
  version: "0.1.0"

server:
  # CONNECT port, credential-broker pipeline only. Carries istio
  # CONNECT-specific config (EnvoyFilter + "http-connect" Service port).
  httpPort: 8085
  # Admin/read HTTP port. Plain HTTP, serving health and GET /api/v1/connections.
  # Separate from the CONNECT port so istio handles it like any service port
  # and the frontend BFF can issue a normal HTTP GET.
  adminHTTPPort: 8086
  # Admin-API base path. Controller routes are registered RELATIVE to this
  # (e.g. "/connections"), so the absolute path is "/api/v1/connections",
  # matching ReadRoutes() and the kora admin-API convention (cf. identity).
  basePath: "/api/v1"
  shutdownTimeoutSecs: 30

identity:
  # SVID exchange for this service's own platform token. The mesh's mTLS peer
  # identity authenticates the call, so no credential is configured here.
  internalURL: "http://orbit-identity.orbit-system.svc"

policy:
  bundleEndpoint: "http://orbit-policy-service.orbit-system.svc/api/v1/policy/bundles"
  bundlePollIntervalSecs: 30
  policyServiceInternalURL: "http://orbit-policy-service.orbit-system.svc"

secrets:
  tenantCARoot: "/var/run/orbit/tenant-ca"
  connectionSecretRoot: "/var/run/orbit/connection-secrets"
  connectionRegistryPath: "/var/run/orbit/connections/connections.json"

observability:
  serviceName: "egress-gateway"
