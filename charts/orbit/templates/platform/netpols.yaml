# Default-deny in orbit-system plus explicit allows below. SPIRE runs in its
# own namespace and needs no rule here: SVIDs arrive over a CSI-mounted socket,
# not the network. Disable with networkPolicy.enabled=false.
{{- if .Values.networkPolicy.enabled }}
{{- $ns := include "orbit.systemNamespace" . }}
---
# Everything else in this file is an exception to this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ $ns }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Without this, service discovery fails under default-deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ $ns }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Intra-namespace traffic on the application ports each service listens on,
# plus the Envoy sidecar ports. CNI enforcement sees the original destination
# port before iptables redirects into the sidecar: the app ports below are
# required even though every call goes through Envoy.
# 3000 frontend, 8080 identity, 8081 inference-gateway, 8083 policy-service,
# 8084 policy-gateway, 8095 orbit-mcp, 8096 tool-gateway, 8097 triggers,
# 9090 policy-gateway ext_authz, 15006/15008 Envoy redirect/HBONE, 15090 metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mesh-sidecar
  namespace: {{ $ns }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
      ports:
        - port: 3000
        - port: 8080
        - port: 8081
        - port: 8083
        - port: 8084
        - port: 8095
        - port: 8096
        - port: 8097
        - port: 9090
        - port: 15006
        - port: 15008
        - port: 15090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
      ports:
        - port: 3000
        - port: 8080
        - port: 8081
        - port: 8083
        - port: 8084
        - port: 8095
        - port: 8096
        # Egress leg for the frontend BFF calling the triggers API.
        - port: 8097
        - port: 9090
        - port: 15006
        - port: 15008
---
# mTLS traffic from tenant namespaces: identity-proxy exchanging tokens on
# 8080, OPA polling bundles on 8083, session-manager calling inference-gateway
# on 8081 and tool-gateway on 8096.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tenant-mesh-ingress
  namespace: {{ $ns }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              orbit.io/role: tenant
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 8083
          protocol: TCP
        - port: 8096
          protocol: TCP
        - port: 15006
          protocol: TCP
        - port: 15008
          protocol: TCP
---
# orbit-agents creates, messages and terminates the session-manager process on
# any agent pod in any tenant; scoped to app=orbit-agents so no other
# orbit-system pod inherits that reach.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-session-manager-egress
  namespace: {{ $ns }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: orbit-agents
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              orbit.io/role: tenant
      ports:
        - port: 8090
          protocol: TCP
---
# xDS: every Envoy sidecar's config feed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istiod-xds
  namespace: {{ $ns }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.istio.namespace }}
      ports:
        - port: 15012
---
# The API server is host-networked and cannot be selected by pod/namespace
# selector, hence the open ipBlock.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-apiserver
  namespace: {{ $ns }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
spec:
  # Only the operator and orbit-agents call the API server directly.
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [orbit-operator, orbit-agents]
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
{{- if .Values.networkPolicy.externalServices }}
---
# Postgres, Redis or other out-of-cluster services, per environment.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-services
  namespace: {{ $ns }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    {{- range .Values.networkPolicy.externalServices }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        {{- range .ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
{{- end }}
---
# For an existing gateway in the Istio namespace. With gateway.create the
# gateway pods are in this namespace and already covered by allow-mesh-sidecar.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: {{ $ns }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "orbit.gatewayWorkloadNamespace" $ }}
          podSelector:
            matchLabels:
              {{- include "orbit.gatewayWorkloadSelector" $ | nindent 14 }}
      ports:
        # Allow gateway traffic to Orbit backends.
        - port: 3000
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 8083
          protocol: TCP
        - port: 8084
          protocol: TCP
        - port: 8096
          protocol: TCP
        # Public webhook ingestion (/api/v1/webhooks on the api. host).
        - port: 8097
          protocol: TCP
        - port: 9090
          protocol: TCP
        - port: 15006
          protocol: TCP
        - port: 15008
          protocol: TCP
{{- if $.Values.gateway.create }}
---
# The load balancer's way into the listener and readiness ports, and the
# gateway's way out to the edge OPA for ext_authz. Application ports come from
# allow-mesh-sidecar.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-gateway-external
  namespace: {{ $ns }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "orbit.gatewayWorkloadSelector" $ | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ $.Values.gateway.ports.http }}
          protocol: TCP
        - port: {{ $.Values.gateway.ports.https }}
          protocol: TCP
        - port: 15021
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "orbit.opaGateway.selectorLabels" $ | nindent 14 }}
      ports:
        - port: 9191
          protocol: TCP
{{- end }}
---
# Allow kube-apiserver calls to the fail-closed admission webhook.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-webhook
  namespace: {{ $ns }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: orbit-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.apiServerCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: 9443
          protocol: TCP
{{- end }}
