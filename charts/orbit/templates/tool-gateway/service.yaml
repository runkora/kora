apiVersion: v1
kind: Service
metadata:
  name: orbit-tool-gateway
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.toolGateway.labels" . | nindent 4 }}
spec:
  # Route request traffic to the PROXY pods only (the publisher serves none).
  selector:
    {{- include "orbit.toolGateway.selectorLabels" . | nindent 4 }}
    orbit.io/mode: proxy
  ports:
    # Plain HTTP — health + GET /v1/catalog (the BFF reads the catalog here),
    # and the Phase-4 MCP request path. Must match
    # cmd/tool-gateway/config/base.yaml's server.httpPort.
    - name: http
      port: 80
      targetPort: 8096
      protocol: TCP
