apiVersion: v2
name: orbit
description: >
  Orbit control plane: the tenant operator, cluster-scoped identity and gateway
  resources, and every Orbit service. Requires the orbit-crds chart first, and a
  cluster that meets the Istio and SPIRE prerequisites contract in
  docs/guides/deployment.md. Orbit never installs Istio or SPIRE.
type: application
version: 0.0.0
appVersion: "0.0.0"

keywords:
  - orbit
  - agents
  - identity
  - spiffe
  - istio

home: https://github.com/clear-route/orbit
maintainers:
  - name: Orbit Team

dependencies:
  # Orbit's ingress gateway pods. Off when an existing Istio Gateway fronts Orbit.
  - name: gateway
    alias: ingressGateway
    version: "1.29.1"
    repository: https://istio-release.storage.googleapis.com/charts
    condition: gateway.create
