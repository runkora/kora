# =============================================================================
# SPIRE Helm values — base / production defaults
#
# Chart: spiffe/spire 0.20.0 (SPIRE appVersion 1.9.4)
# Repo:  https://spiffe.github.io/helm-charts-hardened/
#
# Install order (CRDs must be pre-installed):
#   helm upgrade --install spire-crds spiffe/spire-crds --namespace spire
#   helm upgrade --install spire spiffe/spire --namespace spire \
#     -f infrastructure/helm/spire/values.yaml \
#     [-f infrastructure/helm/spire/values.local.yaml]
#
# Per-environment overlays MUST override:
#   - global.spire.clusterName
#   - global.spire.trustDomain
#   - spire-server.dataStore.sql.host
#   - spire-server.dataStore.sql.username
#   - spire-server.dataStore.sql.password   (or use externalSecret)
#   - spire-server.dataStore.sql.databaseName
# =============================================================================

global:
  spire:
    # MUST be overridden per environment. Base default is a safe sentinel.
    trustDomain: "orbit.local"
    clusterName: "orbit-cluster"
    jwtIssuer: "https://spire.orbit.local"

    namespaces:
      create: false
      # Chart default namespace for server resources is "spire-server".
      # We use a single "spire" namespace; override both to match.
      server:
        name: "spire"
      system:
        name: "spire"

# ── SPIRE Server ──────────────────────────────────────────────────────────────
spire-server:
  enabled: true

  # CA and SVID lifetimes
  # Docs: https://github.com/spiffe/spire/blob/main/doc/spire_server.md
  caTTL: "24h"
  defaultX509SvidTTL: "1h"
  defaultJwtSvidTTL: "5m"

  # Datastore: PostgreSQL (production).
  # password is intentionally a broken sentinel — any environment that
  # inherits base without patching will fail immediately, not silently.
  dataStore:
    sql:
      databaseType: postgres
      host: "spire-db.spire.svc.cluster.local"
      port: 5432
      username: spire
      password: "REPLACE-VIA-OVERLAY"
      databaseName: spire
      options:
        - sslmode: require

  # Key manager: disk (durable across pod restarts — required for production)
  keyManager:
    disk:
      enabled: true
    memory:
      enabled: false

  # Node attestor: k8s PSAT
  nodeAttestor:
    k8sPsat:
      enabled: true
      serviceAccountAllowList:
        - "spire:spire-agent"

  # Publish trust bundle to a ConfigMap so workloads can consume it
  notifier:
    k8sbundle:
      enabled: true
      namespace: "spire"

  bundleConfigMap: "spire-bundle"

  # Controller Manager (runs as sidecar in the server StatefulSet pod)
  controllerManager:
    enabled: true
    image:
      # Keep in sync with SPIRE_CONTROLLER_MANAGER_VERSION in scripts/cluster/versions.env
      tag: "0.6.3"
    ignoreNamespaces:
      - kube-system
      - kube-public
      - local-path-storage

  # Resource limits
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Security context
  # runAsNonRoot intentionally omitted — ghcr.io/spiffe/spire-server:1.9.4
  # runs as root UID; compensating controls are applied below.
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

# ── SPIRE Agent ───────────────────────────────────────────────────────────────
spire-agent:
  enabled: true

  nodeAttestor:
    k8sPsat:
      enabled: true

  workloadAttestors:
    k8s:
      enabled: true
      # skipKubeletVerification: false in base — k3d local override sets this true.
      # Production nodes have CA-signed kubelet certs; verification must not be skipped.
      skipKubeletVerification: false

  # Trust bundle format for workload consumption
  trustBundleFormat: "pem"

  # Key manager: memory for agents (ephemeral — SVIDs are short-lived)
  keyManager:
    memory:
      enabled: true

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

# ── Disable unused chart components ──────────────────────────────────────────
spiffe-csi-driver:
  enabled: false

spiffe-oidc-discovery-provider:
  enabled: false
