apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-triggers
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.triggers.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.triggers.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.triggers.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.triggers.selectorLabels" . | nindent 8 }}
        {{- include "orbit.triggers.labels" . | nindent 8 }}
        spiffe.io/component: orbit-triggers
        {{- include "orbit.podLabels" (dict "root" $ "name" "triggers") | nindent 8 }}
      annotations:
        {{- include "orbit.spireProxyAnnotations" (dict "root" $) | nindent 8 }}
        # Postgres is external to the mesh; bypass Envoy interception.
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
        {{- include "orbit.podAnnotations" (dict "root" $ "name" "triggers") | nindent 8 }}
    spec:
      serviceAccountName: orbit-triggers
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.scheduling" (dict "root" $ "name" "triggers") | nindent 6 }}
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "orbit.spireVolumes" . | nindent 8 }}
        {{- include "orbit.extraVolumes" (dict "root" $ "name" "triggers") | nindent 8 }}
      containers:
        - name: orbit-triggers
          image: {{ include "orbit.image" (dict "root" $ "name" "triggers") | quote }}
          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "triggers") }}
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            - name: ORBIT_POSTGRES_SSL_MODE
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "triggers" "field" "postgresSSLMode" "default" .Values.global.postgres.sslMode) | quote }}
            - name: ORBIT_POSTGRES_CAPTURE_QUERY_TEXT
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "triggers" "field" "postgresCaptureQueryText" "default" .Values.global.postgres.captureQueryText) | quote }}
            - name: ORBIT_OTLP_ENDPOINT
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "triggers" "field" "otlpEndpoint" "default" .Values.global.observability.otlpEndpoint) | quote }}
            - name: ORBIT_SAMPLING_RATE
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "triggers" "field" "samplingRate" "default" .Values.global.observability.samplingRate) | quote }}
            - name: ORBIT_LOG_FORMAT
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "triggers" "field" "logFormat" "default" .Values.global.logFormat) | quote }}
            {{- include "orbit.extraEnv" (dict "root" $ "name" "triggers") | nindent 12 }}
          {{- include "orbit.platformEnvFrom" $ | nindent 10 }}
          ports:
            - name: http
              containerPort: 8097
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8097
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8097
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.triggers.resources | nindent 12 }}
          volumeMounts:
            {{- include "orbit.spireVolumeMount" . | nindent 12 }}
            {{- include "orbit.extraVolumeMounts" (dict "root" $ "name" "triggers") | nindent 12 }}
