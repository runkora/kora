app:
  version: "0.1.0"

server:
  port: 8090
  basePath: ""
  shutdownTimeoutSecs: 30

observability:
  serviceName: orbit-session-manager

workspaces:
  basePath: /workspaces

orbitAgents:
  url: "http://orbit-agents.orbit-system.svc.cluster.local"

# Settings shared by every agent framework.
runner:
  # Applies Landlock before the agent execs, for every
  # framework. See docs/adr/2026-06-04-per-session-home-isolation.md.
  wrapperPath: orbit-session-runner
  # The orbit-shell proxy. Exposed under a "bash" basename by
  # Dockerfile.session-manager, since shell detection keys on that.
  shellPath: /opt/orbit/shell/bash

claude:
  binaryPath: claude
  bare: false # bare mode restricts Claude to only Bash/Edit/Read; full tool set requires non-bare

codex:
  binaryPath: codex

opencode:
  binaryPath: opencode

# inferenceGateway is used by the Codex and OpenCode runners (and the run
# summarizer) to construct per-run base URLs.
#
# Claude reads ANTHROPIC_BASE_URL directly from the pod environment, which the
# operator injects at StatefulSet creation time (internal/agents/k8s.go), so
# this value does not affect Claude runs.
#
# Codex and OpenCode cannot follow the same pattern: Codex requires a custom
# provider declaration in config.toml to set wire_api = "responses" (an
# env-var-only approach has no equivalent field), and OpenCode requires a
# provider block in opencode.json. Both files are written at session start
# by the respective runners, which need this URL to do so. Extending the
# operator to inject per-framework env vars for every future runner type
# would couple it to runner implementation details; centralising the value
# here keeps that concern inside the session-manager.
inferenceGateway:
  url: "http://orbit-inference-gateway.orbit-system.svc.cluster.local"

# toolGateway is the in-mesh MCP tool-gateway. Its URL is written into each run's
# MCP config so the agent reaches governed tools through the gateway; the agent
# calls it unauthenticated and the identity-proxy sidecar injects the token.
toolGateway:
  url: "http://orbit-tool-gateway.orbit-system.svc.cluster.local"

# auth guards the session-control API (create/message/interrupt/close). Every
# caller must present a platform token AND be the orbit-agents control plane;
# see internal/agents/sessionmanager/server.go Middleware. /health stays open
# for the kubelet readiness probe, and /internal/* is loopback-only because its
# callers are in-pod child processes that hold no token.
session:
  idleTimeoutSecs: 1200 # 20 minutes
