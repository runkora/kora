# Istio injection template: opa-policy
#
# Injects the OPA Envoy plugin sidecar into agent pods that carry:
#   inject.istio.io/templates: "sidecar,spire,identity-proxy,opa-policy"
#
# The OPA sidecar implements the ext_authz gRPC protocol and listens on
# localhost:9191. The EnvoyFilter in charts/orbit/templates/policy-gateway/
# envoyfilter.yaml wires Envoy's outbound ext_authz to this port.
#
# OPA polls the policy-service bundle endpoint in the background. The
# readiness probe gates pod readiness until OPA has loaded its first bundle,
# preventing a startup race where requests are denied before policy is loaded.
#
# Bundle path: /api/v1/policy/bundles/{tenant_id}
# OPA evaluates:  data.orbit.authz.allow
#
# Ref: policy-enforcement-redesign.md (Layer 1)
apiVersion: v1
kind: ConfigMap
metadata:
  name: orbit-opa-config
  namespace: {{ include "orbit-platform.systemNamespace" . }}
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
data:
  config.yaml: |
    services:
      policy-service:
        url: http://orbit-policy-service.orbit-system.svc/api/v1/policy

    bundles:
      authz:
        service: policy-service
        resource: "bundles/$(ORBIT_TENANT_ID)"
        polling:
          min_delay_seconds: 30
          max_delay_seconds: 60

    plugins:
      envoy_ext_authz_grpc:
        addr: localhost:9191
        path: orbit/authz/allow

    decision_logs:
      console: true
---
# Istio mesh config patch to register the opa-policy injection template.
# This ConfigMap is read by the Istio injection webhook; the template name
# must match what is referenced in pod annotations.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orbit-opa-injection-template
  namespace: istio-system
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
  annotations:
    # Istio reads injection templates from ConfigMaps labelled with
    # istio.io/config: "true" in the istio-system namespace.
    istio.io/config: "true"
data:
  opa-policy: |
    spec:
      initContainers:
      - name: opa-init
        image: openpolicyagent/opa:latest-envoy
        args:
          - "bundles"
          - "--config-file=/config/config.yaml"
          - "--wait"
        volumeMounts:
          - name: orbit-opa-config
            mountPath: /config
            readOnly: true
      containers:
      - name: opa
        image: openpolicyagent/opa:latest-envoy
        args:
          - "run"
          - "--server"
          - "--config-file=/config/config.yaml"
          - "--addr=0.0.0.0:8181"
          - "--diagnostic-addr=0.0.0.0:8282"
        env:
          - name: ORBIT_TENANT_ID
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['orbit.io/tenant-id']
        ports:
          - name: opa-grpc
            containerPort: 9191
            protocol: TCP
          - name: opa-http
            containerPort: 8181
            protocol: TCP
          - name: opa-diag
            containerPort: 8282
            protocol: TCP
        readinessProbe:
          httpGet:
            path: /health?bundle=true
            port: 8282
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health
            port: 8282
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
          - name: orbit-opa-config
            mountPath: /config
            readOnly: true
      volumes:
      - name: orbit-opa-config
        configMap:
          name: orbit-opa-config
