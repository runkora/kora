{{- /*
inference-gateway config files (docs/adr/2026-10-06-rendered-service-config-files.md).
*/}}
{{- define "kora.inferenceGateway.configModules" -}}
cmd/inference-gateway:
  server:
    shutdownTimeoutSecs: {{ .Values.inferenceGateway.shutdownTimeoutSecs }}
  metrics:
    enabled: {{ .Values.global.metrics.enabled }}
    port: {{ .Values.global.metrics.port | default 9464 }}
  identity:
    internalURL: {{ include "kora.serviceURL" (dict "root" . "name" "kora-identity") | toJson }}
  agents:
    internalURL: {{ include "kora.serviceURL" (dict "root" . "name" "kora-agents") | toJson }}
  policy:
    bundleEndpoint: {{ include "kora.bundleEndpoint" . | toJson }}
    policyServiceURL: {{ include "kora.serviceURL" (dict "root" . "name" "kora-policy-service") | toJson }}
  providers:
    namespace: {{ include "kora.systemNamespace" . | toJson }}
  catalog:
    apiAuthoring: {{ .Values.inferenceGateway.catalog.apiAuthoring }}
{{ include "kora.observabilityConfigModule" . }}
{{ include "kora.storageConfigModule" (dict "root" . "redisClient" true) }}
{{ include "kora.tokenConfigModule" . }}
{{- end }}
{{- include "kora.configMap" (dict "root" $ "name" "inferenceGateway" "configMap" "kora-inference-gateway-config" "modules" (include "kora.inferenceGateway.configModules" . | fromYaml)) }}
