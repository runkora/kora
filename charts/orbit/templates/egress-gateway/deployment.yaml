apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-egress-gateway
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.egressGateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.egressGateway.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.egressGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.egressGateway.selectorLabels" . | nindent 8 }}
        {{- include "orbit.egressGateway.labels" . | nindent 8 }}
        spiffe.io/spire-managed-identity: "true"
        spiffe.io/component: egress-gateway
        # Activates the identity-proxy ext_proc EnvoyFilter so outbound
        # east-west calls (e.g. policy-service /routes/register at startup)
        # carry an Authorization: Bearer <platform-token> injected from the
        # gateway's SPIFFE SVID — same wiring every other in-mesh service uses.
        orbit.io/identity-proxy: "enabled"
      annotations:
        # Inject SPIRE for the gateway's own SVID and identity-proxy for
        # outbound east-west calls (policy-service /routes/register etc.).
        #
        # The CONNECT port (8085) STAYS in the mesh: an EnvoyFilter
        # (charts/orbit/templates/egress-gateway/envoyfilter.yaml) patches
        # both the sandbox's outbound and our inbound HCM to add
        # upgrade_configs:[CONNECT] + connect_matcher routes, so istio-proxy
        # delivers the CONNECT to our application as a normal HTTP request
        # (where ConnectHandler sees r.Method == "CONNECT" and hijacks).
        # Without the mesh in the path, the platform Bearer token injected
        # by the sandbox's identity-proxy never reaches us — and that is
        # the gateway's only signal of caller identity.
        inject.istio.io/templates: "sidecar,spire,identity-proxy"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      serviceAccountName: orbit-egress-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      volumes:
        - name: spire-workload-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        # Per-tenant CA + connection-secret material is mounted from
        # aggregated Secrets in orbit-system. The operator aggregates each
        # tenant's orbit-tenant-ca Secret (in the tenant namespace) into
        # orbit-tenant-cas (in orbit-system) on every reconcile, mirroring
        # the existing orbit-tenant-oidc-secrets aggregator pattern. Each
        # tenant's material lives under its own subdirectory:
        #
        #   /var/run/orbit/tenant-ca/<tenant>/ca.crt
        #   /var/run/orbit/tenant-ca/<tenant>/ca.key
        #   /var/run/orbit/connection-secrets/<tenant>/...
        #
        # The aggregator stores ca.crt/ca.key under namespaced keys in the
        # aggregated Secret (e.g. acme/ca.crt → key "acme.ca.crt") and the
        # gateway's k8sfile resolver / cabundle.LoadEager are configured to
        # walk the projected directory as their mount root.
        #
        # When the aggregated Secret is absent (single-tenant bootstrap, no
        # tenants registered yet), the volumes are marked optional so the
        # gateway pod still starts; it will simply reject every CONNECT
        # with ErrTenantNotFound until secrets land.
        - name: tenant-cas
          secret:
            secretName: {{ .Values.egressGateway.tenantCASecretName }}
            optional: true
            defaultMode: 0o400
        - name: connection-secrets
          secret:
            secretName: {{ .Values.egressGateway.connectionSecretName }}
            optional: true
            defaultMode: 0o400
      containers:
        - name: orbit-egress-gateway
          image: "{{ .Values.egressGateway.image.repository }}:{{ include "orbit.egressGateway.imageTag" . }}"
          imagePullPolicy: {{ include "orbit.egressGateway.imagePullPolicy" . }}
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: ORBIT_OTLP_INSECURE
              value: {{ .Values.egressGateway.config.otlpInsecure | quote }}
            - name: ORBIT_LOG_FORMAT
              value: {{ .Values.egressGateway.config.logFormat | quote }}
            - name: ORBIT_POSTGRES_SSL_MODE
              value: {{ .Values.egressGateway.config.postgresSSLMode | quote }}
          {{- if or .Values.egressGateway.existingConfigMap .Values.egressGateway.existingSecret }}
          envFrom:
            {{- if .Values.egressGateway.existingConfigMap }}
            - configMapRef:
                name: {{ .Values.egressGateway.existingConfigMap }}
            {{- end }}
            {{- if .Values.egressGateway.existingSecret }}
            - secretRef:
                name: {{ .Values.egressGateway.existingSecret }}
            {{- end }}
          {{- end }}
          ports:
            - name: connect
              containerPort: {{ .Values.egressGateway.connectPort }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: connect
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: connect
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.egressGateway.resources | nindent 12 }}
          volumeMounts:
            - name: spire-workload-socket
              mountPath: /run/secrets/workload-spiffe-uds
              readOnly: true
            - name: tenant-cas
              mountPath: /var/run/orbit/tenant-ca
              readOnly: true
            - name: connection-secrets
              mountPath: /var/run/orbit/connection-secrets
              readOnly: true
