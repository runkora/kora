apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policyroles.runkora.io
  labels:
    {{- include "kora-crds.labels" . | nindent 4 }}
  annotations:
    # helm uninstall keeps this CRD. Tenant definitions outlive the product install.
    helm.sh/resource-policy: keep
spec:
  group: runkora.io
  names:
    kind: PolicyRole
    listKind: PolicyRoleList
    plural: policyroles
    singular: policyrole
    shortNames:
      - kpr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Role
          type: string
          jsonPath: .spec.role
        {{- include "kora-crds.declaredColumns" . | nindent 8 }}
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >
            PolicyRole grants scopes to every user whose identity provider role
            claim matches, in the tenant whose namespace holds it. The operator
            projects it into policy-service.
          type: object
          required:
            - spec
          x-kubernetes-validations:
            {{- include "kora-crds.dnsLabelName" . | nindent 12 }}
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - scopes
              properties:
                tenant:
                  type: string
                  minLength: 1
                  description: The tenant the role belongs to. Set it only on a PolicyRole in the system namespace. Such a role may hold platform scopes.
                role:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: The identity provider's role claim. Unset means metadata.name.
                scopes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                budget:
                  type: object
                  description: The spending limit for each holder of the role, or for all of them together when pooled.
                  required:
                    - limitUSD
                  properties:
                    limitUSD:
                      type: number
                      exclusiveMinimum: true
                      minimum: 0
                    resetCadence:
                      type: string
                      enum:
                        - weekly
                        - monthly
                      default: monthly
                    pooled:
                      type: boolean
            status:
              type: object
              properties:
                {{- include "kora-crds.declaredStatus" . | nindent 16 }}
