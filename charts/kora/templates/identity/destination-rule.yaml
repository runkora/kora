{{- if .Values.platform.spiffe.enabled }}
# DestinationRule for kora-identity mTLS peer authentication.
#
# Configures Istio to use ISTIO_MUTUAL (SPIFFE-backed mTLS) for all traffic
# to the kora-identity service, and validates the server's SPIFFE SAN against
# the expected SVID issued by SPIRE to the identity service:
#   spiffe://<trust-domain>/system/identity
#
# This ensures that any caller (within the mesh) reaching kora-identity
# receives a verified identity assertion — not just an encrypted channel.
# If the SPIRE-issued SVID does not match, the connection is rejected at the
# Envoy layer before any application code runs.
#
# Ref: ADR-0018 (SPIFFE identity grants), ADR-0015 (service mesh mTLS)
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: kora-identity-client-policy
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.identity.labels" . | nindent 4 }}
spec:
  host: kora-identity.{{ include "kora.systemNamespace" . }}.svc.cluster.local
  # Export to all namespaces so tenant pods can resolve this DestinationRule
  # when calling kora-identity cross-namespace via the mesh.
  exportTo: ["*"]
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
      subjectAltNames:
        - "spiffe://{{ include "kora.trustDomain" . }}/system/identity"
{{- end }}
