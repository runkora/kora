# Local k3d: Helmfile release inputs. The kora chart's values live in
# values/kora.yaml and values/kora.local.yaml.
versions:
  spireCrds: "0.6.1"
  spire: "0.30.2"
  istio: "1.31.1"

systemNamespace: orbit-system
trustDomain: orbit.test
clusterName: orbit-local
# Pins every helm and kubectl call in this Helmfile to the k3d cluster.
kubeContext: k3d-orbit-local

kora:
  chart: ../../charts/kora
  crdsChart: ../../charts/kora-crds
  version: 0.0.0

istio:
  revision: ""

# Values files for the istio-cni release (k3s CNI paths, local only).
cniValuesFiles:
  - values/cni.local.yaml

# Chart-values overlays merged onto values/kora.yaml for the orbit release.
# local.generated.yaml is written by make up (Dex hostAlias, egress CIDRs,
# pushed image digests).
koraValuesFiles:
  - values/kora.local.yaml
  - environments/local.generated.yaml
