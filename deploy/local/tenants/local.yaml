# OrbitTenant CR for the local k3d development tenant.
#
# The operator will:
#   1. Create the orbit-example-tenant namespace with SPIRE + Istio injection labels
#   2. Add this tenant to the orbit-tenants ConfigMap registry
#   3. The identity service picks up the registry update automatically
#
# The OIDC client is public (no client secret) — Dex is configured with
# orbit-local as a public client for Device Authorization Grant.
apiVersion: orbit.io/v1alpha1
kind: OrbitTenant
metadata:
  name: local
spec:
  tenantId: local
  displayName: "Orbit Local Dev"
  namespace: orbit-example-tenant
  active: true

  oidc:
    issuerURL: "http://dex.orbit.local:5556/dex"
    clientID: "orbit-local"
    # No clientSecretRef — orbit-local is a public Dex client (device flow).
    scopes:
      - openid
      - profile
      - email

  # Retain the namespace when this CR is deleted (default). Prevents accidental
  # workload deletion during local dev iteration.
  deleteNamespaceOnRemoval: false
