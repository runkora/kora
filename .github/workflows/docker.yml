name: Docker build and publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Override the auto-derived tag. Leave empty to publish
          br-{branch-slug}-{shortsha} for the dispatched ref.
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  REPOSITORY_URL: https://github.com/${{ github.repository }}

concurrency:
  group: publish-backend-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Expands the bake file's default group into a list of individual target names.
  # Adding a new image to docker-bake.hcl's default group is all that's needed —
  # CI picks it up automatically on the next run.
  list-targets:
    name: List bake targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4

      - name: Expand default group to target list
        id: list
        run: |
          TARGETS=$(docker buildx bake --print -f docker-bake.hcl 2>/dev/null \
            | jq -c '[.target | keys[] | select(startswith("_") | not)]')
          echo "targets=${TARGETS}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.target }}
    needs: list-targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.list-targets.outputs.targets) }}

    steps:
      - uses: actions/checkout@v4

      # Tags are immutable and never moved or reused: main-{shortsha} per push,
      # br-{branch-slug}-{shortsha} per manual dispatch. This trades tag
      # accumulation (needs a registry lifecycle/GC policy — not yet in place)
      # for images that are always resolvable by exact commit.
      - name: Derive image tag
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_TAG="pr-${{ github.event.pull_request.number }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.image_tag }}" ]; then
              IMAGE_TAG="${{ inputs.image_tag }}"
            else
              SLUG=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr '/' '-' | sed -e 's/[^a-z0-9._-]/-/g' -e 's/^-*//' -e 's/-*$//')
              IMAGE_TAG="br-${SLUG}-${SHORT_SHA}"
            fi
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            IMAGE_TAG="main-${SHORT_SHA}"
          else
            IMAGE_TAG="latest"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE_VERSION=${IMAGE_TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE_CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on non-PR)
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha,scope=${{ matrix.target }}
            *.cache-to=type=gha,scope=${{ matrix.target }},mode=max
            *.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}
            *.labels.org.opencontainers.image.url=https://github.com/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.labels.org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
            *.labels.org.opencontainers.image.created=${{ env.IMAGE_CREATED }}
