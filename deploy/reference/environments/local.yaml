# Local k3d environment.
versions:
  spireCrds: "0.5.0"
  spire: "0.28.3"
  istio: "1.29.1"

systemNamespace: orbit-system
trustDomain: orbit.test
clusterName: orbit-local
frontendHost: orbit.local.clearroute.io

orbit:
  chart: ../../charts/orbit
  crdsChart: ../../charts/orbit-crds
  version: 0.0.0
  imageRegistry: orbit-registry:5001
  # Local builds push :latest; redeploy.sh pins digests over it.
  imageTag: latest
  imagePullPolicy: Always
  imagePullSecrets: []
  platformSecretName: orbit-secrets
  operatorReplicas: 1
  logLevel: debug
  appEnv: development
  serviceConfig:
    postgresSSLMode: disable
    postgresCaptureQueryText: "true"
    otlpInsecure: "true"
    logFormat: console
  # Mirrored into the k3d registry by make docker-pull-third-party.
  opaImage:
    registry: orbit-registry:5001
    repository: openpolicyagent/opa
    tag: 1.15.2-envoy-static

database:
  host: orbit-postgres
  port: 5432
  name: orbit
  user: orbit
redis:
  host: orbit-redis
  port: 6379
  tls: false

istio:
  revision: ""
  outboundTrafficPolicy: ALLOW_ANY
  cni:
    cniBinDir: /var/lib/rancher/k3s/data/cni
    cniConfDir: /var/lib/rancher/k3s/agent/etc/cni/net.d

networkPolicy:
  enabled: true
  # externalServices comes from local.generated.yaml.

gateway:
  # k3d maps host 8443 and 8880 to the cluster load balancer.
  serviceType: LoadBalancer
  tls:
    enabled: true
    credentialName: orbit-gateway-tls

identity:
  # hostAliases comes from local.generated.yaml.
  hostAliases: []
  accessTokenTtlMinutes: 240

inferenceGateway:
  serviceAccountAnnotations: {}

frontend:
  # Baked into the frontend image at build time.
  publicUrl: https://orbit.local.clearroute.io:8443

bedrock:
  accounts: []

agents:
  runtimePods: {}
