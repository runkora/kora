apiVersion: v1
kind: Service
metadata:
  name: kora-skills-service
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.skillsService.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kora.skillsService.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8098
      targetPort: 8098
    {{- if .Values.global.metrics.enabled }}
    - name: http-metrics
      port: {{ .Values.global.metrics.port | default 9464 }}
      targetPort: http-metrics
      protocol: TCP
    {{- end }}
