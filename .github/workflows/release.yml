name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

concurrency:
  group: release-${{ github.ref }}
  # A release uploads several artifacts; cancelling midway leaves them partial.
  cancel-in-progress: false

jobs:
  # Fails the release before any image is built if manifest.json is stale.
  hades-verify:
    name: Verify the Hades manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: The manifest is in sync
        run: make hades-check

  hades-test:
    name: Hades tests
    needs: hades-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Hades unit tests
        run: make frontend-test-hades

  # The tarball is packed once, with the release's version stamped in, and
  # carried through the later jobs as a workflow artifact, so what the smoke
  # build proves is what gets attached and published.
  hades-pack-and-smoke:
    name: Pack Hades and smoke build
    needs: [hades-verify, hades-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      # The tree carries 0.0.0; the tag is the only place a Hades version is written.
      - name: Stamp the release version and pack
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          (cd frontend/src/packages/hades && npm pkg set version="$VERSION")
          (cd frontend && pnpm --filter @runkora/hades pack --pack-destination "$RUNNER_TEMP/hades-pack")
          test -f "$RUNNER_TEMP/hades-pack/runkora-hades-$VERSION.tgz"

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hades-tarball
          path: ${{ runner.temp }}/hades-pack/*.tgz
          if-no-files-found: error

      # Scaffolds a Vite + React + Tailwind v4 app in a temporary directory,
      # installs the tarball and its declared peers, and builds a page that
      # imports tokens.css and Button: the proof that the package builds
      # without the Next.js application.
      - name: Smoke build
        run: bash .github/scripts/hades-smoke-build.sh "$RUNNER_TEMP"/hades-pack/runkora-hades-*.tgz

  images:
    name: Build images
    needs: [hades-verify, hades-test, hades-pack-and-smoke]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      image_tag: ${{ github.ref_name }}
      platforms: linux/amd64,linux/arm64
      push: true
    secrets: inherit

  publish:
    name: Publish charts
    needs: [images, hades-verify, hades-pack-and-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      HAS_COSIGN: ${{ secrets.COSIGN_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/k8s-toolchain
        with:
          helm: true
          yq: true
      - id: version
        uses: ./.github/actions/derive-version

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Docker credentials let the stamp step read image digests with
      # `docker buildx imagetools` and cosign sign the images; the images are
      # private, so an anonymous pull fails with 401.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR for Helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Resolve digests and stamp charts
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/stamp-release-charts.sh

      - name: Package and push charts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          helm package charts/orbit-crds -d dist
          helm package charts/orbit -d dist
          for c in orbit-crds orbit; do
            helm push "dist/${c}-${VERSION}.tgz" "${CHART_REPO}" 2>&1 | tee "push-${c}.txt"
          done

      - name: Sign charts and images
        if: ${{ env.HAS_COSIGN == 'true' }}
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: .github/scripts/sign-release.sh

      - name: Write the compatibility statement
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: .github/scripts/write-compatibility.sh

      - name: Download the Hades tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hades-tarball
          path: ${{ runner.temp }}/hades-pack

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Hades ships in every release: the tarball and the manifest, so a
          # theme builder can offer any release and read its surface. A final
          # release also publishes the package.
          tarball=$(ls "$RUNNER_TEMP"/hades-pack/runkora-hades-*.tgz)
          checksum=$(sha256sum "$tarball" | cut -d' ' -f1)
          hades_dir=frontend/src/packages/hades
          hades_note="Hades \`@runkora/hades@${TAG#v}\`, SHA-256 \`${checksum}\`"
          if [[ "${TAG}" == *-* ]]; then
            hades_note="${hades_note}. Release candidate: the package is not published."
          else
            hades_note="${hades_note}. Published to GitHub Packages."
          fi
          # A semver pre-release tag (v0.2.0-rc.1) carries a hyphen; publish it
          # as a prerelease and never as latest.
          flags=(--title "${TAG}" --generate-notes --notes "${hades_note}")
          if [[ "${TAG}" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
            # A final release lists everything since the previous final release,
            # not only what changed since its last release candidate.
            previous=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
            if [[ -n "${previous}" ]]; then
              flags+=(--notes-start-tag "${previous}")
            fi
          fi
          gh release create "${TAG}" "${flags[@]}" dist/*.tgz images.txt compatibility.yaml \
            "$tarball" "$hades_dir/manifest.json"

  # Last: a published package version can be neither removed nor published
  # again, so everything that can fail runs before it. A failure here leaves no
  # package version published and can be re-run on its own. Final releases
  # only: a release candidate is packed, smoke-built and attached, never
  # published.
  hades-publish:
    name: Publish Hades to GitHub Packages
    needs: [hades-pack-and-smoke, publish]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # registry-url and scope write the job's .npmrc; NODE_AUTH_TOKEN is the
      # workflow token, which can publish to the package linked to this
      # repository through package.json's repository field.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: '@runkora'

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hades-tarball
          path: ${{ runner.temp }}/hades-pack

      - name: Publish the tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish "$RUNNER_TEMP"/hades-pack/runkora-hades-*.tgz
