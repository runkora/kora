apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orbit-agents{{ include "orbit.clusterSuffix" . }}
  labels:
    {{- include "orbit.agents.labels" . | nindent 4 }}
# Verbs match the calls in internal/agents/k8s.go. There are no informers and
# no watch. get+update on every namespaced resource because each
# ensureX follows a create-then-backfill pattern — on AlreadyExists it Gets
# the existing object, merges the OrbitTenant owner reference, and Updates
# (docs/adr/2026-09-06-owner-references-for-agents-and-sandboxes.md).
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["get", "create", "update", "delete"]
  # Deleting an agent type removes its workspace claims by label.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["networking.istio.io"]
    resources: ["destinationrules"]
    verbs: ["get", "create", "update", "delete"]
  # AuthorizationPolicies restricting each agent pod's session-manager port to
  # the orbit-agents principal, created in the tenant namespace alongside the
  # StatefulSet (internal/agents/k8s.go ensureAuthorizationPolicy).
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies"]
    verbs: ["get", "create", "update", "delete"]
  {{- if ne (.Values.global.tenantScope | default "cluster") "namespaced" }}
  # Read-only access to the OrbitTenant CR so orbit-agents can set it as
  # ownerReferences on the resources it provisions. Enables the ArgoCD
  # resource-tree view and native k8s cascade delete
  # (docs/adr/2026-09-06-owner-references-for-agents-and-sandboxes.md).
  # Cluster-scoped mode only: in namespaced mode, internal/agents'
  # tenantOwnerRef skips ownership entirely rather than fetching OrbitTenant
  # at all (cross-namespace owner references don't work in Kubernetes — see
  # docs/adr/2026-09-29-namespace-scoped-tenants.md), so no grant is needed
  # there; orbit-agents never calls Get on this resource in that mode.
  - apiGroups: ["orbit.io"]
    resources: ["orbittenants"]
    verbs: ["get"]
  {{- end }}
