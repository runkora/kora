{{- if .Values.platform.spiffe.enabled }}
# DestinationRule for kora-agents mTLS peer authentication.
#
# Required so that any Envoy proxy (including sidecars in tenant namespaces)
# that dials kora-agents uses ISTIO_MUTUAL with the correct SPIFFE SAN.
# Without this rule, cross-namespace callers (e.g. session-manager pods pushing
# events) fall back to plain-text and the TLS handshake fails.
#
# The SPIFFE ID matches the kora-system-component ClusterSPIFFEID template
# (spiffe.io/component=kora-agents label on the kora-agents pod).
#
# Ref: ADR-0054 (agent event streaming — HTTP push path)
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: kora-agents-client-policy
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.agents.labels" . | nindent 4 }}
spec:
  host: kora-agents.{{ include "kora.systemNamespace" . }}.svc.cluster.local
  exportTo: ["*"]
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
      subjectAltNames:
        - "spiffe://{{ include "kora.trustDomain" . }}/system/kora-agents"
{{- end }}
