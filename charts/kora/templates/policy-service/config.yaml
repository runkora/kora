{{- /*
policy-service config files (docs/adr/2026-10-06-rendered-service-config-files.md).
*/}}
{{- define "kora.policyService.configModules" -}}
cmd/policy-service:
  metrics:
    enabled: {{ .Values.global.metrics.enabled }}
    port: {{ .Values.global.metrics.port | default 9464 }}
  bundle:
    jwksURL: {{ printf "%s/api/v1/identity/.well-known/jwks.json" (include "kora.serviceURL" (dict "root" . "name" "kora-identity")) | toJson }}
    frontendHost: {{ include "kora.frontendHost" . | toJson }}
{{ include "kora.observabilityConfigModule" . }}
{{ include "kora.storageConfigModule" (dict "root" . "redisClient" true) }}
{{ include "kora.tokenConfigModule" . }}
{{- end }}
{{- include "kora.configMap" (dict "root" $ "name" "policyService" "configMap" "kora-policy-service-config" "modules" (include "kora.policyService.configModules" . | fromYaml)) }}
