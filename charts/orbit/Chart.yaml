apiVersion: v2
name: orbit
description: >
  Orbit's control plane runs the operator, the cluster-scoped identity and
  gateway resources, and the platform services. Install orbit-crds first, and
  have Istio and SPIRE already running on the cluster.
type: application
version: 0.0.0
appVersion: "0.0.0"

keywords:
  - orbit
  - agents
  - identity
  - spiffe
  - istio

home: https://github.com/clear-route/orbit
maintainers:
  - name: Orbit Team

dependencies:
  # Orbit's ingress gateway pods. Off when an existing Istio Gateway fronts Orbit.
  - name: gateway
    alias: ingressGateway
    version: "1.29.1"
    repository: https://istio-release.storage.googleapis.com/charts
    condition: gateway.create
