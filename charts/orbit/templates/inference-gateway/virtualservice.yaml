{{- if .Values.inferenceGateway.virtualService.enabled }}
# VirtualService for the Orbit inference gateway.
#
# Routes traffic for the configured inferenceGateway.virtualService.hosts
# entries through the configured inferenceGateway.virtualService.gateways to the
# orbit-inference-gateway ClusterIP service.
#
# The Gateway resource lives in this chart under templates/platform/gateway.yaml.
#
# Ref: ADR-0034 (frontend cluster deployment and ingress routing)
# Ref: ADR-0023 (inference gateway architecture)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: orbit-inference-gateway
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.inferenceGateway.labels" . | nindent 4 }}
spec:
  hosts:
    {{- range .Values.inferenceGateway.virtualService.hosts }}
    - {{ . | quote }}
    {{- end }}
  gateways:
    {{- range .Values.inferenceGateway.virtualService.gateways }}
    - {{ . | quote }}
    {{- end }}
  http:
    - route:
        - destination:
            host: orbit-inference-gateway.{{ include "orbit.systemNamespace" . }}.svc.cluster.local
            port:
              number: 80
{{- end }}
