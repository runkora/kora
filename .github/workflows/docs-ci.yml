name: Docs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs-check:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check documentation for drift
        run: make docs-check

      - name: Collect changed diagrams
        if: github.event_name == 'pull_request'
        id: diagrams
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" \
            -- '*.excalidraw' | sort -u)
          {
            echo "list<<EOF"
            echo "$changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment with changed diagrams
        # Fork PRs get a read-only token; skip rather than fail the gate.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.diagrams.outputs.list != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Filenames come from the PR branch, so they are untrusted input.
          # Read them at runtime instead of interpolating into the script body.
          CHANGED_DIAGRAMS: ${{ steps.diagrams.outputs.list }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/comment-diagrams.js`)
            await run({ github, context })
