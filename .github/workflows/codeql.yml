name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Weekly, to pick up new queries against an unchanged main.
    - cron: "17 3 * * 2"

permissions:
  contents: read

jobs:
  # Runs each language only when its inputs changed. The weekly schedule has
  # no diff, so the filter is skipped and every language is analysed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # A JSON array of the filter names that matched, so the analyze matrix
      # is exactly the set of languages whose inputs changed.
      languages: ${{ steps.filter.outputs.changes || '["go","javascript-typescript","actions"]' }}
    steps:
      - if: github.event_name != 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - 'backend/**'
              - '.github/workflows/codeql.yml'
            javascript-typescript:
              - 'frontend/**'
              - 'tools/**'
              - '.github/workflows/codeql.yml'
            actions:
              - '.github/workflows/**'

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.changes.outputs.languages) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # Go only supports a traced build (CodeQL rejects build-mode none
          # for it); the other languages are extracted from source.
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
          queries: security-and-quality

      # Compile every package once without linking binaries. The generated
      # protobuf code is committed, so no tool install or proto-gen is needed.
      - if: matrix.language == 'go'
        name: Build
        run: cd backend && go build ./...

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  # The analyze matrix varies per run, so branch protection requires this
  # always-on job instead. A skipped analysis means nothing in its language changed.
  gate:
    name: CodeQL gate
    needs: [changes, analyze]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless change detection and every analysis passed
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "analyze: ${{ needs.analyze.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          case "${{ needs.analyze.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
