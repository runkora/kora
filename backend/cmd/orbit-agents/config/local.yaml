kubernetes:
  inCluster: false # use KUBECONFIG / k3d for local development

# Leave policyServiceURL empty so grant management is skipped when running locally
# outside the cluster (no policy service reachable).
platform:
  trustDomain: "orbit.test"
  policyServiceURL: ""

agents:
  sessionManagerImage: orbit-registry:5001/orbit-session-manager:latest
  sandboxImage: orbit-registry:5001/kora-sandbox-base:latest
