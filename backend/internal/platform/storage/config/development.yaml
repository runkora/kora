# Development environment storage configuration

postgres:
  port: 5432
  sslMode: prefer  # Prefer TLS but allow fallback in dev clusters

  # Connection pool — mirrors production for realistic testing
  maxConnections: 25
  minConnections: 5
  maxConnLifetimeMinutes: 60
  maxConnIdleTimeMinutes: 30
  healthCheckPeriodSeconds: 60
  connectTimeoutSeconds: 5
  captureQueryText: true  # Capture SQL in traces (helpful for development)

redis:
  port: 6379
  db: 0

  # Retry and timeout configuration
  maxRetries: 3
  dialTimeoutSeconds: 5
  readTimeoutSeconds: 3
  writeTimeoutSeconds: 3

  # Connection pool
  poolSize: 10
  minIdleConns: 2
  connMaxIdleTimeMinutes: 30

  tlsEnabled: false  # Prefer TLS for dev clusters but allow non-TLS Redis
