apiVersion: apps/v1
kind: Deployment

metadata:
  name: orbit-skills-service
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    app: orbit-skills-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: orbit-skills-service

  template:
    metadata:
      labels:
        app: orbit-skills-service

    spec:
      serviceAccountName: orbit-skills-service

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: orbit-skills-service

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          image: {{ include "orbit.image" (dict "root" $ "name" "skillsService") | quote }}

          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "skillsService") }}

          ports:
            - name: http
              containerPort: 8085
              protocol: TCP

          env:
            - name: REDIS_HOST
              value: "orbit-redis"

            - name: REDIS_PASSWORD
              value: "orbit"

            - name: GITHUB_APP_ID
              value: "local-test"

            - name: GITHUB_APP_INSTALLATION_ID
              value: "1"

            - name: GITHUB_APP_PRIVATE_KEY_PATH
              value: "/tmp/github-private-key.pem"

            - name: ORBIT_MARKETPLACE_SOURCES_CONFIG
              value: "/etc/orbit/marketplace"

          volumeMounts:
            - name: marketplace-sources
              mountPath: /etc/orbit/marketplace

          resources:
            {{- toYaml .Values.skillsService.resources | nindent 12 }}

      volumes:
        - name: marketplace-sources
          configMap:
            name: orbit-skill-marketplace-sources