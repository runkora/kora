operator:
  # In local dev the charts live in the repo root's charts/ directory.
  # The operator binary is run from backend/ so we navigate up one level.
  chartDir: ../charts
  # Disable leader election in single-node local dev.
  leaderElection: false
  syncPeriodSecs: 60
  # Same k3d mirror registry used by deploy/local/orbit-platform.yaml — dev
  # environment workloads run as pods on the same host nodes, so the same
  # registry reference resolves for them too.
  devEnvImageRegistry: orbit-registry:5001
