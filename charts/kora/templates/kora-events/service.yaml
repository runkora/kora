apiVersion: v1
kind: Service
metadata:
  name: kora-events
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.koraEvents.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kora.koraEvents.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8099
      targetPort: 8099
      protocol: TCP
    {{- if .Values.global.metrics.enabled }}
    - name: http-metrics
      port: {{ .Values.global.metrics.port | default 9464 }}
      targetPort: http-metrics
      protocol: TCP
    {{- end }}
