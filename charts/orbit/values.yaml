# Required: global.trustDomain, frontendHost.
# Requires externally managed Istio, SPIRE, PostgreSQL, and Redis.

global:
  # Shared by SPIRE, Istio and Orbit. Required.
  trustDomain: ""

  # Namespace Orbit runs in. Empty means the release namespace.
  systemNamespace: ""

  # Registry prefix for every Orbit image. Overridable per component.
  imageRegistry: ghcr.io/clear-route

  # Apply these pull secrets to Orbit and tenant workloads.
  imagePullSecrets: []

  # IfNotPresent for released, digest-pinned images. Always for local development.
  imagePullPolicy: IfNotPresent

  # Defaults for every Orbit workload. Overridable per component.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""

# The external frontend host, e.g. orbit.example.com. The API host is
# api.<frontendHost> (ADR 2026-07-04). Required.
frontendHost: ""

# Trusted-host allowlist for OAuth discovery metadata (ADR 2026-07-04).
# Canonical (api.) host first. Empty disables validation.
publicHosts: []

# Non-secret platform config rendered into the orbit-config ConfigMap, and the
# name of the Secret every service reads.
config:
  db:
    host: ""
    port: 5432
    name: orbit
    user: orbit
  redis:
    host: ""
    port: 6379
  # Holds DB_PASSWORD, REDIS_PASSWORD, ORBIT_TOKEN_SIGNING_KEY,
  # ORBIT_TRIGGERS_ENCRYPTION_KEY. Not created by the chart.
  platformSecretName: orbit-secrets

# The Istio control plane Orbit runs on top of.
istio:
  namespace: istio-system
  # Empty means the default revision: namespaces get istio-injection=enabled.
  # A revision name labels istio.io/rev instead.
  revision: ""
  # ALLOW_ANY or REGISTRY_ONLY. REGISTRY_ONLY needs the ServiceEntries this
  # chart renders for the external hosts it knows about (Bedrock, Postgres, Redis).
  outboundTrafficPolicy: ALLOW_ANY

# The SPIRE deployment Orbit registers into.
spire:
  namespace: spire-system
  # Class the spire-controller-manager serves. A mismatch means Orbit's
  # ClusterSPIFFEIDs are ignored.
  className: spire-system-spire

# SPIFFE-dependent resources: DestinationRule SANs, AuthorizationPolicies.
# Always on in a supported install.
platform:
  spiffe:
    enabled: true

networkPolicy:
  # Enforce default-deny network policies.
  enabled: true
  # Outside networkPolicy.enabled default-deny; a managed DB or Redis subnet.
  externalServices: []
  # Permit kube-apiserver access to the admission webhook.
  apiServerCIDRs:
    - 0.0.0.0/0

gateway:
  # Set false to use an existing Istio Gateway (see deploy/reference/values/gateway-byo.yaml).
  create: true
  name: orbit-gateway
  ports:
    http: 80
    https: 443
  tls:
    # HTTPS with HTTP-to-HTTPS redirect. Needs a kubernetes.io/tls Secret named
    # credentialName, in the namespace the gateway pods run in.
    enabled: false
    credentialName: orbit-gateway-tls
  # Kubernetes Ingress in front of the Istio gateway Service (Traefik, ALB).
  # TLS terminates there; API routes force x-forwarded-proto=https.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  # With gateway.create=false: where the existing gateway pods run and their
  # selector, for gateway-level OPA and the admitting network policy.
  byo:
    namespace: ""
    selector:
      app: istio-ingressgateway

# Values for the ingressGateway subchart (upstream istio/gateway) when
# gateway.create is true. The SPIRE wiring is what lets DestinationRules and
# gateway-level OPA pin the proxy by SPIFFE identity instead of an istiod cert.
ingressGateway:
  name: orbit-gateway
  service:
    type: LoadBalancer
  labels:
    app: orbit-gateway
    istio: orbit-gateway
    # Matches the system-component registration for spiffe://<td>/system/ingress-gateway.
    spiffe.io/component: ingress-gateway
  env:
    PILOT_CERT_PROVIDER: spire
    SPIFFE_ENDPOINT_SOCKET: unix:///run/secrets/workload-spiffe-uds/socket
  volumes:
    - name: workload-socket
      csi:
        driver: csi.spiffe.io
        readOnly: true
  volumeMounts:
    - name: workload-socket
      mountPath: /run/secrets/workload-spiffe-uds
      readOnly: true
  autoscaling:
    enabled: false
  podAnnotations:
    inject.istio.io/templates: gateway
    sidecar.istio.io/inject: "true"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true

# Configure tenant reconciliation, admission, and preflight.
operator:
  image:
    registry: ""
    repository: orbit-operator
    tag: ""
    digest: ""
    pullPolicy: ""
  # Keep two replicas so admission remains available during a pod failure.
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  leaderElection: true
  logLevel: info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  webhook:
    certificate:
      # Set true to delegate webhook certificate management to cert-manager.
      certManager:
        enabled: false
        issuerRef: {}
  # Containers the webhook injects into every tenant pod. Images come from
  # identityProxy.image and opaGateway.image, same as the system pods.
  injection:
    opa:
      logLevel: info
      bundlePolling:
        minDelaySeconds: 30
        maxDelaySeconds: 60
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
  # Pod Security Admission labels set on every tenant namespace.
  tenantPodSecurity:
    enforce: restricted
    warn: restricted
    audit: restricted
  preflight:
    # Istio minors this release supports.
    supportedIstioMinors: ["1.29", "1.28"]
    intervalSeconds: 300

# Identity-proxy sidecar: services carry their own platform token when calling
# other Orbit services.
identityProxy:
  image:
    registry: ""
    repository: orbit-identity-proxy
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

identity:
  image:
    registry: ""
    repository: orbit-identity
    tag: ""
    digest: ""
    pullPolicy: ""
  replicas: 1
  hostAliases: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  config:
    postgresSSLMode: "require"
    postgresCaptureQueryText: "false"
    redisTLSEnabled: "true"
    otlpInsecure: "false"
    logFormat: "json"
    accessTokenTtlMinutes: 15
  # Operator-owned ConfigMaps and Secrets identity reads. Mounts are optional:
  # identity starts before any tenant exists.
  tenantsConfigMap: orbit-tenants
  clientSecretsSecret: orbit-tenant-oidc-secrets
  oauthClientsConfigMap: orbit-tenant-oauth-clients

inferenceGateway:
  image:
    registry: ""
    repository: orbit-inference-gateway
    tag: ""
    digest: ""
    pullPolicy: ""
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    # e.g. eks.amazonaws.com/role-arn for Bedrock access via IRSA.
    annotations: {}
  config:
    postgresSSLMode: "require"
    postgresCaptureQueryText: "false"
    otlpInsecure: "false"
    logFormat: "json"
  # AWS Bedrock providers. Each entry registers provider "bedrock:<alias>".
  # Credentials come from the pod's cloud identity, never from values.
  bedrock:
    accounts: []
    # - alias: aus
    #   region: ap-southeast-2

orbitMcp:
  image:
    registry: ""
    repository: orbit-mcp
    tag: ""
    digest: ""
    pullPolicy: ""
  replicas: 1
  register: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  config:
    otlpInsecure: "false"
    logFormat: "json"

toolGateway:
  image:
    registry: ""
    repository: orbit-tool-gateway
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  # Request-path proxy replicas. The publisher runs one.
  proxyReplicas: 1
  httpPort: 8096
  mcpServersConfigMapName: orbit-mcp-servers
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  config:
    otlpInsecure: "false"
    logFormat: "json"
    postgresSSLMode: "require"

frontend:
  image:
    registry: ""
    repository: orbit-frontend
    tag: ""
    digest: ""
    pullPolicy: ""
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  # In-cluster URLs the BFF calls. Empty derives from the release namespace.
  config:
    orbitApiUrl: ""
    orbitTriggersUrl: ""
    inferenceGatewayUrl: ""
    policyGatewayUrl: ""
    policyServiceUrl: ""
    orbitAgentsUrl: ""
    toolGatewayUrl: ""
    nextPublicAppUrl: ""
  # Holds BFF_SESSION_SECRET.
  existingSecret: orbit-frontend-secrets
  # Kubernetes Ingress straight to the frontend Service, for an edge that is
  # not the Istio gateway.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []

agents:
  image:
    registry: ""
    repository: orbit-agents
    tag: ""
    digest: ""
    pullPolicy: ""
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  config:
    postgresSSLMode: "require"
    postgresCaptureQueryText: "false"
    otlpInsecure: "false"
    logFormat: "json"
    sessionManagerPostgresSSLMode: "require"
    # Images orbit-agents runs in tenant namespaces. Empty resolves to
    # <global.imageRegistry>/orbit-session-manager and orbit-sandbox-exec at
    # the chart appVersion.
    sessionManagerImage: ""
    sandboxImage: ""
    sandboxGitAuthorName: ""
    sandboxGitAuthorEmail: ""
  # Per-agent AuthorizationPolicy restricting the session-manager port to the
  # orbit-agents principal. orbit-agents creates one alongside each StatefulSet.
  authorizationPolicy:
    enabled: true
  tenantConnectionsConfigMapName: orbit-tenant-connections
  # Applied to the StatefulSets and sandbox pods orbit-agents creates in tenant
  # namespaces, as ORBIT_MANIFEST__ overrides (ADR 2026-06-12).
  runtimePods:
    nodeSelector: {}
    tolerations: []
    priorityClassName: ""
    sandboxResources: {}
    workspace:
      storageClassName: ""
      accessModes: []
    # e.g. eks.amazonaws.com/role-arn for IRSA.
    serviceAccountAnnotations: {}
  imageWarmer:
    enabled: false
  warmHeadroom:
    enabled: false
    replicas: 1
    priority: -10
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "1"
        memory: 4Gi

policyService:
  image:
    registry: ""
    repository: orbit-policy-service
    tag: ""
    digest: ""
    pullPolicy: ""
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  config:
    postgresSSLMode: "require"
    postgresCaptureQueryText: "false"
    otlpInsecure: "false"
    logFormat: "json"

policyGateway:
  image:
    registry: ""
    repository: orbit-policy-gateway
    tag: ""
    digest: ""
    pullPolicy: ""
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  config:
    otlpInsecure: "false"
    logFormat: "json"

triggers:
  image:
    registry: ""
    repository: orbit-triggers
    tag: ""
    digest: ""
    pullPolicy: ""
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  config:
    postgresSSLMode: "require"
    postgresCaptureQueryText: "false"
    otlpInsecure: "false"
    logFormat: "json"
  authorizationPolicy:
    enabled: true
    systemPrincipals:
      - frontend
      - orbit-mcp
      - ingress-gateway
    # Mesh identities without an Orbit registration. Orbit's own gateway is
    # registered as a system component; an existing gateway goes here as
    # ns/<namespace>/sa/<serviceaccount>.
    meshPrincipals: []

egressGateway:
  image:
    registry: ""
    repository: orbit-egress-gateway
    tag: ""
    digest: ""
    pullPolicy: ""
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  # CONNECT port sandboxes use as HTTPS_PROXY. Must match
  # cmd/egress-gateway/config/base.yaml server.httpPort and the sandbox
  # NetworkPolicy.
  connectPort: 8085
  adminPort: 8086
  tenantCASecretName: orbit-tenant-cas
  connectionSecretName: orbit-tenant-connection-secrets
  tenantConnectionsConfigMapName: orbit-tenant-connections
  config:
    otlpInsecure: "false"
    logFormat: "json"
    postgresSSLMode: "require"

# Gateway-level OPA (ADR 2026-04-27): ext_authz for every request entering
# through the Istio gateway.
opaGateway:
  image:
    registry: docker.io
    repository: openpolicyagent/opa
    tag: 1.15.2-envoy-static
    digest: ""
    pullPolicy: ""
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
