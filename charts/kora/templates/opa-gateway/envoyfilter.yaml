# EnvoyFilter: add ext_authz to the Istio IngressGateway to enforce
# authz_gateway.rego on all external traffic (ADR-0044).
#
# This filter intercepts every HTTP request entering the cluster through the
# IngressGateway and sends a gRPC CheckRequest to the OPA gateway service
# before forwarding to the upstream service.
#
# Frontend traffic bypass: when frontendHost is set, an Envoy-level
# VirtualHost override disables ext_authz for browser cookie traffic entirely.
# This avoids unnecessary gRPC round-trips to OPA for session-authenticated
# requests (which Rego would pass through anyway). authz_gateway.rego retains
# the :authority check as a secondary guard in case Envoy routing changes.
#
# Health checks and OIDC/JWKS discovery are bypassed by Rego.
#
# failure_mode_allow: false. Fail-closed (zero trust). If OPA is unreachable
# or times out, the request is denied. The OPA readiness probe gates pod
# readiness on bundle activation so traffic only arrives after the bundle loads.
#
# Ordering: ext_authz is the outermost HTTP filter so that it fires before any
# other filter on the gateway. This ensures every request is checked regardless
# of protocol or routing decisions.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: opa-gateway-ext-authz
  namespace: {{ include "kora.gatewayWorkloadNamespace" . }}
  labels:
    {{- include "kora.labels" . | nindent 4 }}
spec:
  # kora's own gateway pods, or the customer-owned gateway selected by gateway.byo.
  workloadSelector:
    labels:
      {{- include "kora.gatewayWorkloadSelector" . | nindent 6 }}
  configPatches:
    # INSERT_BEFORE the router filter ensures ext_authz runs before any routing
    # or forwarding decisions are made. Note: INSERT_BEFORE targets the named
    # subFilter; INSERT_FIRST (absolute ordering) is a different Envoy operation.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: "envoy.filters.http.router"
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ext_authz
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
            grpc_service:
              envoy_grpc:
                cluster_name: opa_gateway_cluster
              timeout: 500ms
            failure_mode_allow: false
            transport_api_version: V3

    # Static cluster pointing to the OPA gateway service.
    # Uses STRICT_DNS so Envoy re-resolves the ClusterIP on DNS TTL expiry,
    # which handles OPA pod replacements without Envoy restart.
    - applyTo: CLUSTER
      match:
        context: GATEWAY
      patch:
        operation: ADD
        value:
          name: opa_gateway_cluster
          type: STRICT_DNS
          connect_timeout: 1s
          load_assignment:
            cluster_name: opa_gateway_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: orbit-opa-gateway.{{ include "kora.systemNamespace" . }}.svc.cluster.local
                          port_value: 9191
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}

{{- if .Values.frontendHost }}
{{- $fh := include "kora.frontendHost" . }}
    # Bypass ext_authz for the frontend host at the VirtualHost level.
    # Browser cookie traffic (no Bearer token) never reaches OPA, eliminating
    # unnecessary gRPC round-trips for requests that Rego would pass through.
    # Covers both HTTPS (443) and HTTP (80) listeners.
    - applyTo: VIRTUAL_HOST
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            name: "{{ $fh }}:443"
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_authz:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
              disabled: true
    - applyTo: VIRTUAL_HOST
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            name: "{{ $fh }}:80"
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_authz:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
              disabled: true
{{- end }}
