name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

concurrency:
  group: release-${{ github.ref }}
  # A release uploads several artifacts; cancelling midway leaves them partial.
  cancel-in-progress: false

jobs:
  # Hades is released with kora, so the kora version has to say when Hades
  # breaks. This classifies the Hades changes since the last final release and
  # fails the release, before an image is built or anything is published, when
  # the version is too low for them. Below 1.0.0 it reports and blocks nothing.
  # See the design system versioning ADR, SD-4.
  hades-verify:
    name: Verify the version against the Hades changes
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '24'
      PNPM_VERSION: '10'
    steps:
      # Full history and tags: the baseline is the last final release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: The manifest is in sync
        run: make hades-check

      # Fails with an explanation when the version is too low; the same text is
      # in the job summary so it is readable without opening the log.
      - name: Classify the Hades changes against this version
        env:
          RELEASE: ${{ github.ref_name }}
        run: |
          set +e
          make hades-classify RELEASE="$RELEASE" FORMAT=markdown >> "$GITHUB_STEP_SUMMARY"
          make hades-classify RELEASE="$RELEASE"
          exit $?

  # Nothing has been built or published when hades-verify fails, so the tag is
  # removed and the same release can be re-cut once the cause is fixed.
  hades-unwind:
    name: Delete the tag after a failed Hades check
    needs: hades-verify
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delete the tag
        env:
          TAG: ${{ github.ref_name }}
        run: git push --delete origin "refs/tags/$TAG"

  images:
    name: Build images
    needs: hades-verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      image_tag: ${{ github.ref_name }}
      platforms: linux/amd64,linux/arm64
      push: true
    secrets: inherit

  publish:
    name: Publish charts
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      HAS_COSIGN: ${{ secrets.COSIGN_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/k8s-toolchain
        with:
          helm: true
          yq: true
      - id: version
        uses: ./.github/actions/derive-version

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Docker credentials let the stamp step read image digests with
      # `docker buildx imagetools` and cosign sign the images; the images are
      # private, so an anonymous pull fails with 401.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR for Helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Resolve digests and stamp charts
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/stamp-release-charts.sh

      - name: Package and push charts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          helm package charts/orbit-crds -d dist
          helm package charts/orbit -d dist
          for c in orbit-crds orbit; do
            helm push "dist/${c}-${VERSION}.tgz" "${CHART_REPO}" 2>&1 | tee "push-${c}.txt"
          done

      - name: Sign charts and images
        if: ${{ env.HAS_COSIGN == 'true' }}
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: .github/scripts/sign-release.sh

      - name: Write the compatibility statement
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: .github/scripts/write-compatibility.sh

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # A semver pre-release tag (v0.2.0-rc.1) carries a hyphen; publish it
          # as a prerelease and never as latest.
          flags=(--title "${TAG}" --generate-notes)
          if [[ "${TAG}" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
            # A final release lists everything since the previous final release,
            # not only what changed since its last release candidate.
            previous=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
            if [[ -n "${previous}" ]]; then
              flags+=(--notes-start-tag "${previous}")
            fi
          fi
          gh release create "${TAG}" "${flags[@]}" dist/*.tgz images.txt compatibility.yaml
