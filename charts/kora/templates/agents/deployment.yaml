apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-agents
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.agents.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.agents.replicas }}
  selector:
    matchLabels:
      {{- include "kora.agents.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kora.agents.selectorLabels" . | nindent 8 }}
        orbit.io/kube-api-client: "true"
        {{- include "kora.agents.labels" . | nindent 8 }}
        spiffe.io/component: orbit-agents
        {{- include "kora.podLabels" (dict "root" $ "name" "agents") | nindent 8 }}
      annotations:
        {{- include "kora.spireProxyAnnotations" (dict "root" $) | nindent 8 }}
        # Postgres is external to the mesh; bypass Envoy interception.
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
        # Roll the pod when the manifest patches ConfigMap changes
        # (docs/adr/2026-09-15-manifest-patches-configmap.md).
        checksum/patches: {{ include (print $.Template.BasePath "/agents/patches-configmap.yaml") . | sha256sum }}
        # Roll the pod when the workload customisation ConfigMap changes
        # (docs/adr/2026-09-16-first-class-workload-placement.md).
        checksum/workloads: {{ include (print $.Template.BasePath "/agents/workloads-configmap.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/agents/config.yaml") . | sha256sum }}
        {{- include "kora.podAnnotations" (dict "root" $ "name" "agents") | nindent 8 }}
    spec:
      serviceAccountName: orbit-agents
      # Above the 30 s shutdown timeout, so a run start in flight can finish before the kubelet stops the pod.
      terminationGracePeriodSeconds: 45
      {{- include "kora.imagePullSecrets" . | nindent 6 }}
      {{- include "kora.scheduling" (dict "root" $ "name" "agents") | nindent 6 }}
      securityContext:
        {{- include "kora.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "kora.spireVolumes" . | nindent 8 }}
        {{- include "kora.configVolume" (dict "root" $ "name" "agents" "configMap" "orbit-agents-config" "modules" (include "kora.agents.configModules" . | fromYaml)) | nindent 8 }}
        # Connection registry aggregated by the operator; optional so the pod starts
        # before any Connection exists.
        - name: tenant-connections
          configMap:
            name: {{ .Values.agents.tenantConnectionsConfigMapName }}
            optional: true
        # Kustomize-style manifest patches applied to every provisioned
        # resource (docs/adr/2026-09-15-manifest-patches-configmap.md).
        - name: manifest-patches
          configMap:
            name: orbit-agents-manifest-patches
        # Placement, pod metadata and workspace storage for provisioned
        # workloads (docs/adr/2026-09-16-first-class-workload-placement.md).
        - name: workloads
          configMap:
            name: orbit-agents-workloads
        {{- include "kora.redisCAVolume" . | nindent 8 }}
        {{- include "kora.extraVolumes" (dict "root" $ "name" "agents") | nindent 8 }}
      containers:
        - name: orbit-agents
          image: {{ include "kora.image" (dict "root" $ "name" "agents") | quote }}
          imagePullPolicy: {{ include "kora.imagePullPolicy" (dict "root" $ "name" "agents") }}
          securityContext:
            {{- include "kora.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            {{- include "kora.platformEnv" (dict "root" $ "name" "agents" "keys" (list "DB_PASSWORD" "REDIS_PASSWORD")) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.global.metrics.enabled }}
            - name: http-metrics
              containerPort: {{ .Values.global.metrics.port | default 9464 }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.agents.resources | nindent 12 }}
          volumeMounts:
            {{- include "kora.spireVolumeMount" . | nindent 12 }}
            {{- include "kora.configVolumeMount" . | nindent 12 }}
            {{- include "kora.redisCAVolumeMount" . | nindent 12 }}
            - name: tenant-connections
              mountPath: /var/run/kora/connections
              readOnly: true
            - name: manifest-patches
              mountPath: /etc/kora/manifest-patches
              readOnly: true
            - name: workloads
              mountPath: /etc/kora/workloads
              readOnly: true
            {{- include "kora.extraVolumeMounts" (dict "root" $ "name" "agents") | nindent 12 }}
