---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: graders.runkora.io
spec:
  group: runkora.io
  names:
    kind: Grader
    listKind: GraderList
    plural: graders
    shortNames:
    - kgr
    singular: grader
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.agent
      name: Agent
      type: string
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Grader scores an Agent's runs against fixed questions that a decision model
          answers from the recorded trace. See docs/adr/2026-11-19-graders.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GraderSpec is the Grader resource. kora-agents checks the rules CEL cannot
              check cheaply, such as accept naming an existing option.
            properties:
              agent:
                description: Agent is the Agent name in this namespace whose runs
                  the Grader scores.
                minLength: 1
                type: string
              appliesWhen:
                description: AppliesWhen is a yes/no question. Unset applies to every
                  run.
                minLength: 1
                type: string
              description:
                description: Description is one line on what the Grader checks.
                minLength: 1
                type: string
              minPassRate:
                description: MinPassRate is the share of graded runs that must pass,
                  such as 90%.
                maxLength: 4
                pattern: ^[0-9]{1,3}%$
                type: string
              model:
                description: Model is the decision model on the System One API.
                properties:
                  family:
                    pattern: ^[a-z0-9_-]{1,255}$
                    type: string
                  name:
                    pattern: ^[a-z0-9_-]{1,255}$
                    type: string
                required:
                - family
                - name
                type: object
              questions:
                items:
                  description: GraderQuestion asks one fact about a run.
                  properties:
                    accept:
                      description: Accept lists the option or level names that count
                        as a pass.
                      items:
                        minLength: 1
                        type: string
                      minItems: 1
                      type: array
                    expect:
                      description: Expect is true when a yes answer is a pass and
                        false when a no answer is.
                      type: boolean
                    levels:
                      description: Levels are the answers a scale can give, lowest
                        first.
                      items:
                        description: GraderAnswer is one option or level. The model
                          reads Description.
                        properties:
                          description:
                            minLength: 1
                            type: string
                          name:
                            maxLength: 63
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        required:
                        - description
                        - name
                        type: object
                      type: array
                    name:
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    options:
                      description: Options are the answers a choice can give. kora
                        adds a none option.
                      items:
                        description: GraderAnswer is one option or level. The model
                          reads Description.
                        properties:
                          description:
                            minLength: 1
                            type: string
                          name:
                            maxLength: 63
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        required:
                        - description
                        - name
                        type: object
                      minItems: 1
                      type: array
                    question:
                      minLength: 1
                      type: string
                    skipOn:
                      description: |-
                        SkipOn lists the option or level names that mean the question has no
                        subject on a run.
                      items:
                        minLength: 1
                        type: string
                      type: array
                    threshold:
                      description: Threshold overrides the Grader's threshold for
                        this question.
                      properties:
                        fail:
                          maximum: 1
                          minimum: 0
                          type: number
                        pass:
                          maximum: 1
                          minimum: 0
                          type: number
                      required:
                      - fail
                      - pass
                      type: object
                      x-kubernetes-validations:
                      - message: threshold fail must be below pass.
                        rule: self.fail < self.pass
                    type:
                      enum:
                      - boolean
                      - choice
                      - scale
                      type: string
                  required:
                  - name
                  - question
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: expect is required on boolean questions and allowed only
                      there.
                    rule: has(self.expect) == (self.type == 'boolean')
                  - message: options are required on choice questions and allowed
                      only there.
                    rule: has(self.options) == (self.type == 'choice')
                  - message: levels are required on scale questions and allowed only
                      there.
                    rule: has(self.levels) == (self.type == 'scale')
                  - message: accept is required on choice and scale questions and
                      allowed only there.
                    rule: has(self.accept) == (self.type != 'boolean')
                  - message: skipOn applies to choice and scale questions only.
                    rule: self.type != 'boolean' || !has(self.skipOn)
                  - message: a scale has 2 to 10 levels.
                    rule: '!has(self.levels) || (size(self.levels) >= 2 && size(self.levels)
                      <= 10)'
                minItems: 1
                type: array
              threshold:
                default:
                  fail: 0.3
                  pass: 0.7
                description: Threshold is the default band for appliesWhen and every
                  question.
                properties:
                  fail:
                    maximum: 1
                    minimum: 0
                    type: number
                  pass:
                    maximum: 1
                    minimum: 0
                    type: number
                required:
                - fail
                - pass
                type: object
                x-kubernetes-validations:
                - message: threshold fail must be below pass.
                  rule: self.fail < self.pass
            required:
            - agent
            - description
            - model
            - questions
            type: object
            x-kubernetes-validations:
            - message: minPassRate must be between 0% and 100%.
              rule: '!has(self.minPassRate) || int(self.minPassRate.substring(0, size(self.minPassRate)
                - 1)) <= 100'
          status:
            description: |-
              Status is the status every declarative kind reports. The operator writes it
              from the owning service's response.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: ID is the id of the item the resource is projected to.
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be a DNS label.
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') && size(self.metadata.name)
            <= 63
    served: true
    storage: true
    subresources:
      status: {}
