---
# Service exposing the SPIRE Controller Manager's admission webhook server.
# The controller-manager binds on port 9443; this Service maps 443 → 9443
# so the Kubernetes API server can call the webhook.
apiVersion: v1
kind: Service
metadata:
  name: spire-controller-manager-webhook-service
  namespace: spire
spec:
  selector:
    app: spire-server
  ports:
    - port: 443
      targetPort: 9443

---
# ValidatingWebhookConfiguration for SPIRE Controller Manager.
# The controller-manager self-manages this object: it mints an SVID from the
# SPIRE Server socket and injects it as the caBundle, keeping the webhook cert
# continuously rotated via SPIFFE/X.509 SVIDs.
#
# webhook rules cover all CRD kinds the controller-manager reconciles.
# failurePolicy: Fail — reject invalid ClusterSPIFFEID / ClusterFederatedTrustDomain
# resources before they can cause SPIRE Server misconfiguration.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: spire-controller-manager-webhook
webhooks:
  - name: vclusterspiffeid.kb.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: spire-controller-manager-webhook-service
        namespace: spire
        path: /validate-spire-spiffe-io-v1alpha1-clusterspiffeid
    failurePolicy: Fail
    matchPolicy: Equivalent
    rules:
      - apiGroups: ["spire.spiffe.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusterspiffeids"]
    sideEffects: None
  - name: vclusterfederatedtrustdomain.kb.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: spire-controller-manager-webhook-service
        namespace: spire
        path: /validate-spire-spiffe-io-v1alpha1-clusterfederatedtrustdomain
    failurePolicy: Fail
    matchPolicy: Equivalent
    rules:
      - apiGroups: ["spire.spiffe.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusterfederatedtrustdomains"]
    sideEffects: None
