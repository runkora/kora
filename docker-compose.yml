services:
  postgres:
    image: postgres:17-alpine
    container_name: orbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orbit-network

  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orbit-network

  # ---------------------------------------------------------------------------
  # Dex — local OIDC provider
  #
  # Runs a real, standards-compliant OIDC server so the full OAuth 2.0 Device
  # Authorization Grant (RFC 8628) protocol executes without any cloud accounts.
  #
  # Issuer:   http://dex.orbit.test:5556/dex
  # Test user: dev@orbit.test / (password set via DEX_USER_PASSWORD_HASH in .env)
  # Client ID: orbit-local  (public client — no secret)
  #
  # Enabled by: make dev-up  (or docker compose up -d dex)
  # ---------------------------------------------------------------------------
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    container_name: orbit-dex
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    # Generate config/dex/.env from the example: cp config/dex/.env.example config/dex/.env
    env_file:
      - path: ./config/dex/.env
        required: true
    ports:
      - "5556:5556"
    volumes:
      - ./config/dex/config.yaml:/etc/dex/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5556/dex/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - orbit-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  orbit-network:
    name: orbit-network   # explicit name prevents docker-compose project-prefix (orbit_orbit-network)
    driver: bridge
