{{- /*
identity config files (docs/adr/2026-10-06-rendered-service-config-files.md).
*/}}
{{- define "kora.identity.configModules" -}}
cmd/identity:
  publicHosts: {{ splitList "," (include "kora.publicHosts" .) | compact | toJson }}
  policyServiceURL: {{ include "kora.serviceURL" (dict "root" . "name" "kora-policy-service") | toJson }}
  metrics:
    enabled: {{ .Values.global.metrics.enabled }}
    port: {{ .Values.global.metrics.port | default 9464 }}
internal/identity:
  token:
    accessTokenTtlMinutes: {{ .Values.identity.config.accessTokenTtlMinutes | int }}
{{ include "kora.observabilityConfigModule" . }}
{{ include "kora.storageConfigModule" (dict "root" . "redisClient" true) }}
{{- end }}
{{- include "kora.configMap" (dict "root" $ "name" "identity" "configMap" "kora-identity-config" "modules" (include "kora.identity.configModules" . | fromYaml)) }}
