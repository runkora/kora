name: Release

# Cuts a release on a v* tag: multi-arch images, then digest-pinned, signed
# charts pushed to GHCR, plus an image inventory and compatibility statement.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  HELM_VERSION: v4.2.3
  COSIGN_VERSION: v2.4.1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build and push every image at the tag for both architectures. Reuses the
  # image workflow so release and CI share one build path.
  images:
    name: Build images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      image_tag: ${{ github.ref_name }}
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish:
    name: Publish charts
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push and sign charts in GHCR
      id-token: write # keyless attestations
    env:
      HAS_COSIGN: ${{ secrets.COSIGN_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install helm, cosign and crane
        run: |
          set -euo pipefail
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp linux-amd64/helm
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            -o /tmp/cosign && sudo install /tmp/cosign /usr/local/bin/cosign

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Resolve digests and stamp the charts
        id: stamp
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          # Chart version and appVersion both track the tag.
          for c in orbit orbit-crds; do
            yq -i ".version = \"${VERSION}\" | .appVersion = \"${TAG}\"" "charts/${c}/Chart.yaml"
          done

          # Pin every chart-deployed image by digest. Orbit images sit under this
          # tag in our registry; a third-party block (OPA) carries its own ref.
          : > images.txt
          components=$(yq -o=json '.' charts/orbit/values.yaml \
            | jq -r 'to_entries[] | select((.value | type) == "object" and (.value.image.repository? // "") != "") | .key')
          for key in ${components}; do
            registry=$(yq -r ".${key}.image.registry // \"\"" charts/orbit/values.yaml)
            repo=$(yq -r ".${key}.image.repository" charts/orbit/values.yaml)
            reg="${registry:-${REGISTRY}/${IMAGE_NAMESPACE}}"
            tag=$(yq -r ".${key}.image.tag // \"\"" charts/orbit/values.yaml)
            ref="${reg}/${repo}:${tag:-${TAG}}"
            digest=$(docker buildx imagetools inspect "${ref}" --format '{{println .Manifest.Digest}}' | head -1)
            yq -i ".${key}.image.digest = \"${digest}\"" charts/orbit/values.yaml
            echo "${reg}/${repo}@${digest}" >> images.txt
          done
          sort -u images.txt -o images.txt

      - name: Package and push charts
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          set -euo pipefail
          helm dependency build charts/orbit
          helm package charts/orbit-crds -d dist
          helm package charts/orbit -d dist
          for c in orbit-crds orbit; do
            helm push "dist/${c}-${VERSION}.tgz" "${CHART_REPO}" 2>&1 | tee "push-${c}.txt"
          done

      - name: Sign charts and images with cosign
        if: ${{ env.HAS_COSIGN == 'true' }}
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          # Chart digests are printed by `helm push`.
          for c in orbit-crds orbit; do
            digest=$(grep -oE 'sha256:[0-9a-f]{64}' "push-${c}.txt" | head -1)
            cosign sign --yes --key env://COSIGN_KEY \
              "${REGISTRY}/${IMAGE_NAMESPACE}/charts/${c}@${digest}"
          done
          while read -r ref; do
            cosign sign --yes --key env://COSIGN_KEY "${ref}"
          done < images.txt

      - name: Write the compatibility statement
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/cluster/versions.env
          source scripts/cluster/versions.env
          cat > compatibility.yaml <<YAML
          release: ${TAG}
          kubernetes:
            tested: ["1.31", "1.32", "1.33"]
          istio:
            supported: ["1.29", "1.28"]
            mode: sidecar
            cni: required
          spire:
            chart: "${SPIRE_CHART_VERSION}"
          tooling:
            helm: "${HELM_VERSION}"
            helmfile: "${HELMFILE_VERSION}"
            helmDiff: "${HELM_DIFF_VERSION}"
          YAML

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            dist/*.tgz images.txt compatibility.yaml
