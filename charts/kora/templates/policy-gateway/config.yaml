{{- /*
policy-gateway config files (docs/adr/2026-10-06-rendered-service-config-files.md).
*/}}
{{- define "kora.policyGateway.configModules" -}}
cmd/policy-gateway:
  metrics:
    enabled: {{ .Values.global.metrics.enabled }}
    port: {{ .Values.global.metrics.port | default 9464 }}
  policy:
    bundleEndpoint: {{ include "kora.bundleEndpoint" . | toJson }}
    {{- /* The policy service's gRPC route-registration port. */}}
    policyServiceInternalURL: {{ printf "%s:9091" (include "kora.serviceURL" (dict "root" . "name" "kora-policy-service")) | toJson }}
{{ include "kora.observabilityConfigModule" . }}
{{ include "kora.storageConfigModule" (dict "root" . "redisClient" true) }}
{{ include "kora.tokenConfigModule" . }}
{{- end }}
{{- include "kora.configMap" (dict "root" $ "name" "policyGateway" "configMap" "kora-policy-gateway-config" "modules" (include "kora.policyGateway.configModules" . | fromYaml)) }}
