# A real cluster: Helmfile release inputs. Copy values/orbit.yaml into your own
# repository and edit it; this file only tells the Helmfile which charts and
# versions to install and the facts SPIRE, Istio and kora share.
versions:
  spireCrds: "0.6.1"
  spire: "0.30.2"
  istio: "1.31.1"

systemNamespace: orbit-system
trustDomain: orbit.example.com
clusterName: orbit

orbit:
  chart: oci://ghcr.io/clear-route/charts/orbit
  crdsChart: oci://ghcr.io/clear-route/charts/orbit-crds
  version: 0.0.0

istio:
  revision: ""

orbitValuesFiles: []
