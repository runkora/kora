{{- /*
egress-gateway config files (docs/adr/2026-10-06-rendered-service-config-files.md).
*/}}
{{- define "orbit.egressGateway.configModules" -}}
cmd/egress-gateway:
  identity:
    internalURL: {{ include "orbit.serviceURL" (dict "root" . "name" "orbit-identity") | toJson }}
  policy:
    bundleEndpoint: {{ include "orbit.bundleEndpoint" . | toJson }}
    policyServiceInternalURL: {{ include "orbit.serviceURL" (dict "root" . "name" "orbit-policy-service") | toJson }}
{{ include "orbit.observabilityConfigModule" . }}
{{ include "orbit.tokenConfigModule" . }}
{{- end }}
{{- include "orbit.configMap" (dict "root" $ "name" "egressGateway" "configMap" "orbit-egress-gateway-config" "modules" (include "orbit.egressGateway.configModules" . | fromYaml)) }}
