# Template Connection CR for the kubernetes adapter. Copy and fill in the
# ${placeholder} fields; see docs/guides/local-development.md#registering-a-kubernetes-connection
# for the token and CA provisioning walkthrough.
#
# baseHost rejects a bare IP: TLS to an IP literal carries no SNI, so it must
# be a hostname already on the target API server's certificate.
#
# Namespace: orbit-tenant-example (the operator derives "orbit-tenant-{name}"
# from the OrbitTenant CR in deploy/local/tenants/example.yaml).
apiVersion: orbit.io/v1alpha1
kind: Connection
metadata:
  name: orbit-local # ${cluster}
  namespace: orbit-tenant-example
spec:
  adapter: kubernetes
  baseHost: k3d-orbit-local-server-0:6443 # ${cluster_hostname}:${cluster_port}
  secretRef: orbit-local-token # ${cluster}-token
  secretKey: token
  config:
    cluster_name: orbit-local # ${cluster}
    ca_cert: |
      -----BEGIN CERTIFICATE-----
      <replace with the target cluster CA certificate PEM>
      -----END CERTIFICATE-----
