triggers:
  image:
    registry: ""
    repository: kora-triggers
    tag: ""
    digest: ""
    pullPolicy: ""
  # -- Operator-owned tenant registry ConfigMap; the service reads each tenant's authoring switch from it.
  tenantsConfigMap: kora-tenants
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  # Env vars for secrets only. Settings go in configOverrides.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  # -- Raw config merged last over the rendered config files, keyed by config
  # module (docs/adr/2026-10-06-rendered-service-config-files.md). Keys follow
  # the Go config structs; an unknown key fails startup.
  configOverrides: {}
  authorizationPolicy:
    enabled: true
    systemPrincipals:
      - frontend
      - kora-mcp
      - ingress-gateway
    # Mesh identities without a kora registration. kora's own gateway is
    # registered as a system component; an existing gateway goes here as
    # ns/<namespace>/sa/<serviceaccount>.
    meshPrincipals: []
    # -- Mesh identities (ns/<namespace>/sa/<serviceaccount>) allowed to reach
    # ONLY the metrics port (global.metrics.port). Separate from
    # meshPrincipals: a scraper needs no triggers-management authority, so it
    # is scoped by port rather than added to the broad caller list above.
    # Empty by default: nothing is allowed through until an operator names
    # their scraper's identity. See
    # docs/adr/2026-10-06-prometheus-metrics-endpoints.md, Decision.
    metricsScraperPrincipals: []
    # Same exception as metricsScraperPrincipals, scoped to the metrics port
    # only, for a scraper with no SPIFFE identity (not sidecar-injected into
    # the mesh) — principals can't match a caller with no mTLS identity to
    # present. CIDR blocks (e.g. the scraper namespace's pod range), matched
    # against the connection's actual source IP regardless of mTLS. Empty by
    # default: nothing is allowed through until an operator names their
    # scraper's address range. See docs/adr/2026-10-06-prometheus-metrics-endpoints.md.
    metricsScraperIPBlocks: []

egressGateway:
  # Extra outbound TCP ports the gateway may dial when brokering a connection.
  # It reaches 443 already; anything else has to be opened deliberately, since
  # this is the one component that holds credentials for every upstream. A
  # Kubernetes API server conventionally listens on 6443, so a kubernetes
  # Connection needs that port here before the gateway can reach it.
  upstreamPorts: []
  # The Envoy filter that tunnels every sandbox connection into the egress
  # gateway. Independent of networkPolicy.enabled: on a CNI without
  # NetworkPolicy support this is the control that still holds.
  transparentEgress:
    enabled: true
  image:
    registry: ""
    repository: kora-egress-gateway
    tag: ""
    digest: ""
    pullPolicy: ""
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  # Env vars for secrets only. Settings go in configOverrides.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  # CONNECT port sandboxes use as HTTPS_PROXY. Must match
  # cmd/egress-gateway/config/base.yaml server.httpPort and the sandbox
  # NetworkPolicy.
  connectPort: 8085
  adminPort: 8086
  tenantCASecretName: kora-tenant-cas
  connectionSecretName: kora-tenant-connection-secrets
  tenantConnectionsConfigMapName: kora-tenant-connections
  # -- Raw config merged last over the rendered config files, keyed by config
  # module (docs/adr/2026-10-06-rendered-service-config-files.md). Keys follow
