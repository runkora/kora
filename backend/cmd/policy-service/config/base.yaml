app:
  version: "0.1.0"

server:
  port: 8083
  basePath: "/api/v1"
  shutdownTimeoutSecs: 30

bundle:
  jwksURL: "http://orbit-identity.orbit-system.svc.cluster.local/api/v1/identity/.well-known/jwks.json"
  issuer: "orbit"
  audience: "orbit-platform"
  # Hostname of the frontend service as seen in the Istio IngressGateway
  # :authority header. Port is stripped by authz_gateway.rego before comparison.
  # Empty by default — injected at deploy time via POLICY_SERVICE_BUNDLE_FRONTEND_HOST
  # (set by the Helm chart from opaGateway.frontendHost). Without it the Rego-level
  # frontend bypass is inactive, but the Envoy-level VirtualHost bypass still works.
  frontendHost: ""

policy:
  # Re-register the service's own routes and platform scope vocabulary every
  # 5 minutes. The registration is in-process, but its scope upserts hit
  # Postgres, so this is what turns a database blip at boot into a delay rather
  # than a permanently unpublished vocabulary.
  reregistrationIntervalSecs: 300

observability:
  serviceName: "policy-service"
