# =============================================================================
# Dex — local OIDC provider for kora development
# =============================================================================
#
# Dex runs as a real, standards-compliant OIDC provider so that the full
# OAuth 2.0 Device Authorization Grant (RFC 8628) protocol executes end-to-end
# without any cloud accounts or mocking.
#
# Test credentials (local dev only):
#   Email:    dev@local.runkora.io
#   Password: password
#   Groups:   platform-admin
#
# Users are stored in glauth (lightweight LDAP) — see config/glauth/config.cfg.
# Dex authenticates via its LDAP connector, so group membership flows into the
# OIDC token just like a production corporate directory (Okta, Entra, etc.).
#
# Client:
#   ID:     kora-local
#   Secret: (none — public client, Device Grant does not require a secret)
#
# Issuer:  https://dex.local.runkora.io:5556/dex
# =============================================================================

issuer: https://dex.local.runkora.io:5556/dex

# In-memory storage — state is lost on restart, which is fine for local dev.
storage:
  type: memory

web:
  https: 0.0.0.0:5556
  tlsCert: /etc/dex/tls.crt
  tlsKey: /etc/dex/tls.key
  # allowedOrigins lets the browser fetch Dex's OIDC discovery document and
  # token endpoints from a different origin (the Next.js dev server).
  # Required because oidc-client-ts runs in the browser at http://localhost:3000
  # and makes cross-origin requests to https://dex.local.runkora.io:5556.
  allowedOrigins:
    - http://localhost:3000
    - https://local.runkora.io
    - https://local.runkora.io:8443
    - https://dex.local.runkora.io:8443

oauth2:
  # Enable the Device Authorization Grant (RFC 8628).
  deviceCodeGrant: true
  # Skip the consent/approval screen — the device code IS the approval gate.
  skipApprovalScreen: true
  responseTypes:
    - code

# Expiry values tuned for fast local iteration.
expiry:
  deviceRequests: "10m"
  signingKeys: "6h"
  idTokens: "24h"
  refreshTokens:
    reuseInterval: "3s"
    validIfNotUsedFor: "2160h"  # 90 days

logger:
  level: "info"
  format: "text"

# ─── Clients ──────────────────────────────────────────────────────────────────

staticClients:
  - id: kora-local
    name: "kora (local dev)"
    # public: true — no client secret required. Correct for Device Grant + CLI tooling.
    public: true
    redirectURIs:
      - "http://localhost:3000/auth/callback"
      - "https://local.runkora.io/auth/callback"
      - "https://local.runkora.io:8443/auth/callback"
      - "/device/callback"

# ─── Identity backend ────────────────────────────────────────────────────────
#
# Uses the LDAP connector backed by glauth (lightweight Go LDAP server) so
# that group membership (platform-admin, engineer, etc.) flows through
# the OIDC token — replicating the production pattern where roles come from
# the corporate directory.

connectors:
  - type: ldap
    id: local-ldap
    name: "Email"
    config:
      host: glauth:3893
      insecureNoSSL: true

      # Service account — Dex binds as this to search users/groups.
      bindDN: cn=serviceuser,dc=kora,dc=local
      bindPW: password

      userSearch:
        baseDN: dc=kora,dc=local
        filter: "(objectClass=posixAccount)"
        username: mail
        idAttr: cn
        emailAttr: mail
        nameAttr: givenName

      groupSearch:
        baseDN: dc=kora,dc=local
        filter: "(objectClass=posixGroup)"
        userMatchers:
          - userAttr: DN
            groupAttr: member
          - userAttr: cn
            groupAttr: memberUid
        nameAttr: cn
