---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orbit-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: ghcr.io/clear-route/charts
    chart: orbit-crds
    targetRevision: 0.0.0
  destination:
    server: https://kubernetes.default.svc
    namespace: orbit-system
  syncPolicy:
    # Unlike spire-crds, these back tenant-authored CRs (OrbitTenant,
    # Connection, OAuthClient, MCPServer) with no way to regenerate them;
    # a prune here cascade-deletes every tenant's data cluster-wide.
    automated: { prune: false, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orbit
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  # orbit's values are environment-specific: database, redis, hosts.
  # Point the second source at your own GitOps values repository and path.
  sources:
    - repoURL: ghcr.io/clear-route/charts
      chart: orbit
      targetRevision: 0.0.0
      helm:
        valueFiles:
          - $values/orbit.yaml
    - repoURL: https://github.com/your-org/your-gitops-values
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: orbit-system
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio-injection: enabled
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    automated: { prune: true, selfHeal: true }
    # A failed migration hook fails the sync; automated sync does not reattempt
    # the same revision without a retry policy.
    retry:
      limit: 3
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
  # Operator-owned fields.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: [".webhooks[].clientConfig.caBundle", ".webhooks[].failurePolicy"]
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: [".webhooks[].clientConfig.caBundle", ".webhooks[].failurePolicy"]
