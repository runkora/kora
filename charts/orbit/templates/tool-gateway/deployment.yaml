apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-tool-gateway
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.toolGateway.labels" . | nindent 4 }}
spec:
  # Single writer by topology: scope publication runs DeleteOrphans, which is
  # destructive (it revokes pruned scopes from grants/roles). The publisher must
  # be replicas=1 — see the MCP registration ADR, Decision 2.
  replicas: 1
  selector:
    matchLabels:
      {{- include "orbit.toolGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.toolGateway.selectorLabels" . | nindent 8 }}
        {{- include "orbit.toolGateway.labels" . | nindent 8 }}
        # SPIRE workload attestation — issues spiffe://<trust-domain>/system/tool-gateway.
        spiffe.io/spire-managed-identity: "true"
        spiffe.io/component: tool-gateway
        # Activates the identity-proxy ext_proc so outbound east-west calls carry
        # the gateway's own platform token: the policy-service /routes/register
        # publish AND the authed tools/list introspection of each MCP server.
        orbit.io/identity-proxy: "enabled"
      annotations:
        inject.istio.io/templates: "sidecar,spire,identity-proxy"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      serviceAccountName: orbit-tool-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      volumes:
        - name: spire-workload-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        # MCP server registry: the operator's MCPServerAggregator renders the
        # orbit-mcp-servers ConfigMap (one key, servers.json). The gateway mounts
        # it and parses it into its in-memory registry, hot-reloading on change.
        # Optional so the pod starts before any MCPServer CR is applied.
        - name: mcp-servers
          configMap:
            name: {{ .Values.toolGateway.mcpServersConfigMapName }}
            optional: true
      containers:
        - name: orbit-tool-gateway
          image: "{{ .Values.toolGateway.image.repository }}:{{ include "orbit.toolGateway.imageTag" . }}"
          imagePullPolicy: {{ include "orbit.toolGateway.imagePullPolicy" . }}
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: ORBIT_OTLP_INSECURE
              value: {{ .Values.toolGateway.config.otlpInsecure | quote }}
            - name: ORBIT_LOG_FORMAT
              value: {{ .Values.toolGateway.config.logFormat | quote }}
            - name: ORBIT_POSTGRES_SSL_MODE
              value: {{ .Values.toolGateway.config.postgresSSLMode | quote }}
          {{- if or .Values.toolGateway.existingConfigMap .Values.toolGateway.existingSecret }}
          envFrom:
            {{- if .Values.toolGateway.existingConfigMap }}
            - configMapRef:
                name: {{ .Values.toolGateway.existingConfigMap }}
            {{- end }}
            {{- if .Values.toolGateway.existingSecret }}
            - secretRef:
                name: {{ .Values.toolGateway.existingSecret }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.toolGateway.httpPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.toolGateway.httpPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.toolGateway.httpPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.toolGateway.resources | nindent 12 }}
          volumeMounts:
            - name: spire-workload-socket
              mountPath: /run/secrets/workload-spiffe-uds
              readOnly: true
            # servers.json lands at /var/run/orbit/mcp-servers/servers.json,
            # matching cmd/tool-gateway/config/base.yaml registry.serversPath.
            - name: mcp-servers
              mountPath: /var/run/orbit/mcp-servers
              readOnly: true
