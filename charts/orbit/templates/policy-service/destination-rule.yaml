{{- if .Values.platform.spiffe.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: orbit-policy-service-client-policy
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.policyService.labels" . | nindent 4 }}
spec:
  host: orbit-policy-service.{{ include "orbit.systemNamespace" . }}.svc.cluster.local
  exportTo: ["*"]
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
      subjectAltNames:
        - "{{ include "orbit.spiffeIDBase" . }}/system/policy-service"
{{- end }}
