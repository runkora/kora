name: Secret scan

on:
  # Every push, any branch: a secret is leaked the moment it reaches the remote.
  # pull_request also covers forks, which never fire push on the base repo.
  # Merge queue branches run through merge_group instead of push.
  push:
    branches-ignore: ["gh-readonly-queue/**"]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: v8.27.2

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans every commit, not just the tip.
          fetch-depth: 0
      # gitleaks builds from the Go module proxy and is cached, so a GitHub
      # releases outage does not fail the scan.
      - name: Restore gitleaks
        id: gitleaks-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          GOBIN="${HOME}/.local/bin" go install \
            -ldflags "-X github.com/zricethezav/gitleaks/v8/cmd.Version=${GITLEAKS_VERSION#v}" \
            "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
      - run: echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - run: make secrets
