apiVersion: v1
kind: Service
metadata:
  name: orbit-mcp
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.koraMcp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kora.koraMcp.selectorLabels" . | nindent 4 }}
  ports:
    # Port == targetPort (8095), matching every other orbit service. A 80→8095
    # remap broke in-mesh service routing (outbound mTLS cx_connect_fail) for
    # east-west callers like the tool-gateway, which introspects this server.
    - name: http
      port: 8095
      targetPort: 8095
      protocol: TCP
    {{- if .Values.global.metrics.enabled }}
    - name: http-metrics
      port: {{ .Values.global.metrics.port | default 9464 }}
      targetPort: http-metrics
      protocol: TCP
    {{- end }}
