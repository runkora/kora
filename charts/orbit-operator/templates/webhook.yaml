# orbit-operator admission webhook — agent pod mutator
#
# Injects the identity-proxy + OPA policy sidecar labels and annotations onto
# every pod created in a tenant namespace (orbit.io/role=tenant).
#
# TLS: a self-signed CA and server cert are generated by Helm on first install
# and stored in the orbit-operator-webhook-tls Secret. Subsequent upgrades use
# lookup() to reuse the existing cert, preventing unnecessary rotations.
#
# FailurePolicy: Ignore — if the operator webhook is unavailable, pods start
# without Layer 1 sidecars. Layer 2 (in-process OPA in owned services) is the
# authoritative enforcement boundary and continues to function independently.

{{- $secretName := "orbit-operator-webhook-tls" -}}
{{- $svcName := printf "orbit-operator-webhook.%s.svc" .Values.namespace -}}

{{- /* Reuse existing cert across Helm upgrades to avoid unnecessary rotation. */ -}}
{{- $existing := lookup "v1" "Secret" .Values.namespace $secretName -}}
{{- $caCert := "" -}}
{{- $tlsCert := "" -}}
{{- $tlsKey := "" -}}

{{- if and $existing $existing.data -}}
{{- $caCert = index $existing.data "ca.crt" -}}
{{- $tlsCert = index $existing.data "tls.crt" -}}
{{- $tlsKey = index $existing.data "tls.key" -}}
{{- else -}}
{{- $ca := genCA "orbit-operator-ca" 3650 -}}
{{- $cert := genSignedCert $svcName nil (list $svcName (printf "%s.cluster.local" $svcName)) 3650 $ca -}}
{{- $caCert = $ca.Cert | b64enc -}}
{{- $tlsCert = $cert.Cert | b64enc -}}
{{- $tlsKey = $cert.Key | b64enc -}}
{{- end -}}

# TLS credentials for the webhook server.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orbit-operator.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $caCert }}
  tls.crt: {{ $tlsCert }}
  tls.key: {{ $tlsKey }}
---
# ClusterIP service routing kube-apiserver webhook calls to the operator pod.
apiVersion: v1
kind: Service
metadata:
  name: orbit-operator-webhook
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orbit-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "orbit-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: 443
      targetPort: 9443
      protocol: TCP
---
# MutatingWebhookConfiguration: intercept pod CREATEs in tenant namespaces.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  # Prefixed with "aaa-" so this configuration sorts before "istio-sidecar-injector"
  # alphabetically. Kubernetes processes MutatingWebhookConfigurations in
  # alphabetical order, so our mutations (adding inject.istio.io/templates) must
  # be applied before Istio's injection webhook reads the pod spec.
  name: aaa-orbit-agent-pod-mutator
  labels:
    {{- include "orbit-operator.labels" . | nindent 4 }}
webhooks:
  - name: pod.orbit.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: orbit-operator-webhook
        namespace: {{ .Values.namespace }}
        path: /mutate-pod
      caBundle: {{ $caCert }}
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        orbit.io/role: "tenant"
    # Ignore — Layer 2 (in-process OPA in owned services) is the authoritative
    # enforcement boundary. If the webhook is unavailable, Layer 1 sidecars
    # are not injected but Layer 2 enforcement continues uninterrupted.
    failurePolicy: Ignore
    sideEffects: None
    timeoutSeconds: 5
