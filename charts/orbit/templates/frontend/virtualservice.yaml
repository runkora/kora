{{- if .Values.frontend.virtualService.enabled }}
# VirtualService for the Orbit frontend.
#
# Routes traffic for the configured frontend.virtualService.hosts entries
# through the configured frontend.virtualService.gateways to the
# orbit-frontend ClusterIP service. The shared Gateway resource lives in this
# chart under templates/platform/gateway.yaml.
#
# Ref: ADR-0034 (frontend cluster deployment and ingress routing)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: orbit-frontend
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.frontend.labels" . | nindent 4 }}
spec:
  hosts:
    {{- range .Values.frontend.virtualService.hosts }}
    - {{ . | quote }}
    {{- end }}
  gateways:
    {{- range .Values.frontend.virtualService.gateways }}
    - {{ . | quote }}
    {{- end }}
  http:
    - route:
        - destination:
            host: orbit-frontend.{{ include "orbit.systemNamespace" . }}.svc.cluster.local
            port:
              number: 80
{{- end }}
