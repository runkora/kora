# VirtualService for the Orbit frontend.
#
# Routes all traffic for orbit.local.clearroute.io through the platform Gateway to the
# orbit-frontend ClusterIP service. The Gateway resource itself lives in
# charts/orbit-platform/templates/gateway.yaml (a platform concern shared
# across all externally-reachable Orbit services).
#
# Ref: ADR-0034 (frontend cluster deployment and ingress routing)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: orbit-frontend
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.frontend.labels" . | nindent 4 }}
spec:
  hosts:
    - "orbit.local.clearroute.io"
  gateways:
    - {{ include "orbit.systemNamespace" . }}/orbit-gateway
  http:
    # Inbound webhook deliveries (Triggers feature) are HMAC-authenticated and
    # served by the identity service — not the frontend. Route this prefix
    # directly to orbit-identity, ahead of the catch-all frontend route below.
    # The gateway OPA bypass for this path lives in authz_gateway.rego.
    # Ref: ADR 2026-06-17 (agent triggers and webhook ingestion).
    - match:
        - uri:
            prefix: /api/v1/webhooks/
      route:
        - destination:
            host: orbit-identity.{{ include "orbit.systemNamespace" . }}.svc.cluster.local
            port:
              number: 80
    - route:
        - destination:
            host: orbit-frontend.{{ include "orbit.systemNamespace" . }}.svc.cluster.local
            port:
              number: 80
