              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              VirtualModelSpec mirrors the virtual model create request. Enabled
              defaults to true in the CRD.
            properties:
              description:
                type: string
              displayName:
                minLength: 1
                type: string
              enabled:
