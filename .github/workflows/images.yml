name: Images

on:
  workflow_call:
    inputs:
      image_tag:
        description: OCI tag to publish. Empty derives it from the event.
        required: false
        default: ""
        type: string
      platforms:
        description: Comma-separated build platforms.
        required: false
        default: linux/amd64
        type: string
      push:
        description: Push the images, or build and discard.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  list-targets:
    name: List bake targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          TARGETS=$(docker buildx bake --print -f docker-bake.hcl -f versions.hcl 2>/dev/null \
            | jq -c '[.target | keys[] | select(startswith("_") | not)]')
          echo "targets=${TARGETS}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.target }}
    needs: list-targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.list-targets.outputs.targets) }}
    env:
      # A multi-arch build keeps its own cache. An amd64 build replaces the cache
      # it writes, and a shared cache would never hold the arm64 layers.
      CACHE_SUFFIX: ${{ contains(inputs.platforms, 'arm64') && '-multiarch' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: version
        uses: ./.github/actions/derive-version
        with:
          image_tag: ${{ inputs.image_tag }}

      - name: Enable multi-arch emulation
        if: contains(inputs.platforms, 'arm64')
        run: docker run --rm --privileged tonistiigi/binfmt:qemu-v8.1.5 --install arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login also runs on build-only calls: pulling the layer cache from a
      # private GHCR needs auth.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        # docker-bake.hcl tags every image with IMAGE_TAG, which defaults to latest.
        # A sandbox image job also builds kora-sandbox-base, so it reads the base cache too.
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        with:
          source: .
          files: |
            docker-bake.hcl
            versions.hcl
          targets: ${{ matrix.target }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          set: |
            *.platform=${{ inputs.platforms }}
            *.cache-from=type=registry,ref=ghcr.io/${{ env.IMAGE_NAMESPACE }}/kora-buildcache:${{ matrix.target }}${{ env.CACHE_SUFFIX }}
            *.cache-to=type=registry,ref=ghcr.io/${{ env.IMAGE_NAMESPACE }}/kora-buildcache:${{ matrix.target }}${{ env.CACHE_SUFFIX }},mode=max,ignore-error=true
            kora-sandbox-base.cache-from=type=registry,ref=ghcr.io/${{ env.IMAGE_NAMESPACE }}/kora-buildcache:kora-sandbox-base${{ env.CACHE_SUFFIX }}
            *.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}
            *.labels.org.opencontainers.image.url=https://github.com/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.labels.org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            *.labels.org.opencontainers.image.created=${{ steps.version.outputs.created }}
