apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: orbit-system

configMapGenerator:
  - name: orbit-secrets
    literals:
      - DB_HOST=orbit-postgres
      - DB_NAME=orbit
      - DB_PORT="5432"
      - DB_USER=orbit
      - REDIS_HOST=172.18.0.1
      - REDIS_PORT="6379"
      - ORBIT_OIDC_CLIENT_ID=orbit-backend
      - ORBIT_OIDC_CLIENT_SECRET=""
      - ORBIT_OIDC_ISSUER_URL="http://172.18.0.1:5556/dex"

resources:
  - orbit-backend.yaml