apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpservers.orbit.io
  labels:
    {{- include "orbit-crds.labels" . | nindent 4 }}
  annotations:
    # Never deleted by helm uninstall: tenant definitions outlive the product install.
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: orbit.io
  names:
    kind: MCPServer
    listKind: MCPServerList
    plural: mcpservers
    singular: mcpserver
    shortNames:
      - omcp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Endpoint
          type: string
          jsonPath: .spec.endpoint
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >
            MCPServer declares one MCP server kora governs (GitOps; there is no
            create API). Apply it in orbit-system for a platform-global server
            (e.g. the kora MCP) or in a tenant namespace for a tenant's own
            server. The operator aggregates every MCPServer into the
            orbit-mcp-servers ConfigMap the tool-gateway mounts; the gateway
            introspects each server's tools and registers them as
            mcp:<server>:<tool>:use scopes. The CR name (metadata.name) is the
            stable server slug used in the scope path.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - endpoint
              properties:
                displayName:
                  description: Human-readable name for the catalog UI.
                  type: string
                description:
                  description: One-line summary of what the server does, for the catalog UI.
                  type: string
                endpoint:
                  description: >
                    In-mesh URL of the MCP server (Streamable HTTP), e.g.
                    http://github-mcp.orbit-tenant-acme.svc:8080/mcp.
                  type: string
                  minLength: 1
                transport:
                  description: >
                    MCP transport. MVP supports only "streamable-http" (the
                    default when omitted).
                  type: string
                  enum:
                    - streamable-http
                reintrospectIntervalSeconds:
                  description: >
                    How often the gateway re-introspects the tool surface, in
                    seconds, besides on registry reload. 0 = on-reload only.
                  type: integer
                  minimum: 0
                callerIdentity:
                  description: >
                    Whether the gateway conveys the CALLER's identity to this
                    upstream. "none" (default): the caller's token is never
                    forwarded; the server acts as itself with its own backend
                    credential. "forward": the gateway forwards the caller's
                    bearer so the server acts AS the caller against first-party
                    kora APIs. ENFORCED GLOBAL-ONLY: a tenant-namespaced CR
                    that sets "forward" is rejected at reconcile (status Invalid).
                  type: string
                  enum:
                    - none
                    - forward
                workload:
                  description: >
                    The pods in this namespace that serve the endpoint. Naming
                    them classifies them as MCP workloads: the operator skips the
                    identity-proxy and OPA injection an agent pod requires, and
                    generates the policies that let the tool-gateway reach them.
                    Omit for a global server, or one reached at an external URL.
                  type: object
                  properties:
                    selector:
                      description: Labels matching the serving pods.
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                phase:
                  description: "Reconciliation phase: Pending, Aggregated, or Invalid."
                  type: string
                lastReconciledAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
