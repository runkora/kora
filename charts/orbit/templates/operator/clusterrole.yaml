# Least-privilege permissions for tenant reconciliation, admission, and preflight.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orbit-operator
  labels:
    {{- include "orbit.operator.labels" . | nindent 4 }}
rules:
  # Tenant namespaces: creation, injection and Pod Security labels.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # Aggregated registries, tenant CA, per-tenant OPA config, pull-secret
  # replication, the webhook serving certificate.
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Sandbox egress policy in each tenant namespace.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Reconciliation inputs; read-only.
  - apiGroups: ["orbit.io"]
    resources: ["orbittenants", "connections", "oauthclients", "mcpservers"]
    verbs: ["get", "list", "watch"]
  # Status conditions. Connection and OAuthClient have none.
  - apiGroups: ["orbit.io"]
    resources: ["orbittenants/status", "mcpservers/status"]
    verbs: ["get", "update", "patch"]
  # caBundle and failurePolicy on Orbit's own webhooks.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    resourceNames: ["aaa-orbit-agent-pod-mutator", "orbit-agent-pod-validator"]
    verbs: ["get", "patch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["list", "watch"]
  # Preflight: CNI presence, CSI driver, CRDs, SPIRE registrations. istiod
  # presence and version come from the injector ConfigMap, not a Deployment.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csidrivers"]
    verbs: ["get"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
  - apiGroups: ["spire.spiffe.io"]
    resources: ["clusterspiffeids"]
    verbs: ["get", "list"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
