apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-agents
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.agents.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.agents.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.agents.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.agents.selectorLabels" . | nindent 8 }}
        orbit.io/kube-api-client: "true"
        {{- include "orbit.agents.labels" . | nindent 8 }}
        spiffe.io/component: orbit-agents
        orbit.io/identity-proxy: "enabled"
        {{- include "orbit.podLabels" (dict "root" $ "name" "agents") | nindent 8 }}
      annotations:
        {{- include "orbit.spireProxyAnnotations" (dict "root" $ "identityProxy" true) | nindent 8 }}
        # Postgres is external to the mesh; bypass Envoy interception.
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
        # Roll the pod when the manifest patches ConfigMap changes
        # (docs/adr/2026-09-15-manifest-patches-configmap.md).
        checksum/patches: {{ include (print $.Template.BasePath "/agents/patches-configmap.yaml") . | sha256sum }}
        # Roll the pod when the workload customisation ConfigMap changes
        # (docs/adr/2026-09-16-first-class-workload-placement.md).
        checksum/workloads: {{ include (print $.Template.BasePath "/agents/workloads-configmap.yaml") . | sha256sum }}
        {{- include "orbit.podAnnotations" (dict "root" $ "name" "agents") | nindent 8 }}
    spec:
      serviceAccountName: orbit-agents
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.scheduling" (dict "root" $ "name" "agents") | nindent 6 }}
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "orbit.spireVolumes" (dict "identityProxy" true) | nindent 8 }}
        # Connection registry aggregated by the operator; optional so the pod starts
        # before any Connection exists.
        - name: tenant-connections
          configMap:
            name: {{ .Values.agents.tenantConnectionsConfigMapName }}
            optional: true
        # Kustomize-style manifest patches applied to every provisioned
        # resource (docs/adr/2026-09-15-manifest-patches-configmap.md).
        - name: manifest-patches
          configMap:
            name: orbit-agents-manifest-patches
        # Placement, pod metadata and workspace storage for provisioned
        # workloads (docs/adr/2026-09-16-first-class-workload-placement.md).
        - name: workloads
          configMap:
            name: orbit-agents-workloads
        {{- include "orbit.extraVolumes" (dict "root" $ "name" "agents") | nindent 8 }}
      containers:
        - name: orbit-agents
          image: {{ include "orbit.image" (dict "root" $ "name" "agents") | quote }}
          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "agents") }}
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            - name: ORBIT_POSTGRES_SSL_MODE
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "agents" "field" "postgresSSLMode" "default" .Values.global.postgres.sslMode) | quote }}
            - name: ORBIT_POSTGRES_CAPTURE_QUERY_TEXT
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "agents" "field" "postgresCaptureQueryText" "default" .Values.global.postgres.captureQueryText) | quote }}
            - name: ORBIT_OTLP_ENDPOINT
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "agents" "field" "otlpEndpoint" "default" .Values.global.observability.otlpEndpoint) | quote }}
            - name: ORBIT_SAMPLING_RATE
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "agents" "field" "samplingRate" "default" .Values.global.observability.samplingRate) | quote }}
            # Tenant pods' collector. Global only, so a per-service override cannot
            # split tenant export from the identity-proxy and the policy bundle.
            - name: ORBIT_TENANT_OTLP_ENDPOINT
              value: {{ .Values.global.observability.otlpEndpoint | quote }}
            - name: ORBIT_LOG_FORMAT
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "agents" "field" "logFormat" "default" .Values.global.logFormat) | quote }}
            - name: ORBIT_SESSION_MANAGER_AUTHORIZATION_POLICY_ENABLED
              value: {{ and .Values.platform.spiffe.enabled .Values.agents.authorizationPolicy.enabled | quote }}
            - name: ORBIT_SYSTEM_NAMESPACE
              value: {{ include "orbit.systemNamespace" . | quote }}
            - name: ORBIT_TRUST_DOMAIN
              value: {{ include "orbit.trustDomain" . | quote }}
            - name: ORBIT_SESSION_MANAGER_IMAGE
              value: {{ .Values.agents.config.sessionManagerImage | default (printf "%s/orbit-session-manager:%s" .Values.global.imageRegistry (.Values.global.imageTag | default .Chart.AppVersion)) | quote }}
            - name: ORBIT_SANDBOX_IMAGE
              value: {{ .Values.agents.config.sandboxImage | default (printf "%s/orbit-sandbox-exec:%s" .Values.global.imageRegistry (.Values.global.imageTag | default .Chart.AppVersion)) | quote }}
            - name: ORBIT_SANDBOX_GIT_AUTHOR_NAME
              value: {{ .Values.agents.config.sandboxGitAuthorName | quote }}
            - name: ORBIT_SANDBOX_GIT_AUTHOR_EMAIL
              value: {{ .Values.agents.config.sandboxGitAuthorEmail | quote }}
            - name: ORBIT_AGENTS_IMAGE_PULL_SECRETS
              value: {{ range $i, $s := .Values.global.imagePullSecrets }}{{ if $i }},{{ end }}{{ $s.name }}{{ end }}
            {{- include "orbit.extraEnv" (dict "root" $ "name" "agents") | nindent 12 }}
          {{- include "orbit.platformEnvFrom" $ | nindent 10 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.agents.resources | nindent 12 }}
          volumeMounts:
            {{- include "orbit.spireVolumeMount" . | nindent 12 }}
            - name: tenant-connections
              mountPath: /var/run/orbit/connections
              readOnly: true
            - name: manifest-patches
              mountPath: /etc/orbit/manifest-patches
              readOnly: true
            - name: workloads
              mountPath: /etc/orbit/workloads
              readOnly: true
            {{- include "orbit.extraVolumeMounts" (dict "root" $ "name" "agents") | nindent 12 }}
        {{- include "orbit.identityProxyContainer" (dict "root" $) | nindent 8 }}
