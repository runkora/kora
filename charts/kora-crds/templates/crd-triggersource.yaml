apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: triggersources.runkora.io
  labels:
    {{- include "kora-crds.labels" . | nindent 4 }}
  annotations:
    # helm uninstall keeps this CRD. Tenant definitions outlive the product install.
    helm.sh/resource-policy: keep
spec:
  group: runkora.io
  names:
    kind: TriggerSource
    listKind: TriggerSourceList
    plural: triggersources
    singular: triggersource
    shortNames:
      - ktsrc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Provider
          type: string
          jsonPath: .spec.provider
        {{- include "kora-crds.declaredColumns" . | nindent 8 }}
        - name: Path
          type: string
          priority: 1
          jsonPath: .status.webhookPath
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >
            TriggerSource defines a webhook source for the tenant whose
            namespace holds it. The operator reads the signing secret from the
            referenced Secret, which must carry the label
            runkora.io/trigger-source=true, and projects the source into
            kora-triggers. status.webhookPath is the ingest path to configure in
            the provider.
          type: object
          required:
            - spec
          x-kubernetes-validations:
            {{- include "kora-crds.dnsLabelName" . | nindent 12 }}
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - provider
                - signingSecretRef
              properties:
                provider:
                  type: string
                  minLength: 1
                  description: The webhook provider, such as github or slack.
                config:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Provider-specific configuration, as the API accepts it.
                signingSecretRef:
                  type: object
                  description: The Secret key in this namespace that holds the signing secret.
                  required:
                    - name
                    - key
                  properties:
                    name:
                      type: string
                      minLength: 1
                    key:
                      type: string
                      minLength: 1
                enabled:
                  type: boolean
                  default: true
            status:
              type: object
              properties:
                webhookPath:
                  type: string
                  description: The ingest path to configure in the provider. It includes the source id.
                {{- include "kora-crds.declaredStatus" . | nindent 16 }}
