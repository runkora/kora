apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orbit-identity
  labels:
    {{- include "orbit.identity.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orbit-identity
subjects:
  - kind: ServiceAccount
    name: orbit-identity
    namespace: {{ include "orbit.systemNamespace" . }}
