apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-policy-service
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.policyService.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.policyService.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.policyService.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.policyService.selectorLabels" . | nindent 8 }}
        {{- include "orbit.policyService.labels" . | nindent 8 }}
        spiffe.io/component: policy-service
        {{- include "orbit.podLabels" (dict "root" $ "name" "policyService") | nindent 8 }}
      annotations:
        {{- include "orbit.spireProxyAnnotations" (dict "root" $) | nindent 8 }}
        # Postgres is external to the mesh; bypass Envoy interception.
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
        checksum/config: {{ include (print $.Template.BasePath "/policy-service/config.yaml") . | sha256sum }}
        {{- include "orbit.podAnnotations" (dict "root" $ "name" "policyService") | nindent 8 }}
    spec:
      serviceAccountName: orbit-policy-service
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.scheduling" (dict "root" $ "name" "policyService") | nindent 6 }}
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "orbit.spireVolumes" . | nindent 8 }}
        {{- include "orbit.configVolume" (dict "root" $ "name" "policyService" "configMap" "orbit-policy-service-config" "modules" (include "orbit.policyService.configModules" . | fromYaml)) | nindent 8 }}
        # Operator-owned tenant registry: the gateway bundle lists every
        # registered tenant, with or without policy rows. Optional so the
        # service starts before any tenant exists; re-read on every compile.
        - name: tenants-config
          configMap:
            name: {{ .Values.policyService.tenantsConfigMap }}
            optional: true
        {{- include "orbit.extraVolumes" (dict "root" $ "name" "policyService") | nindent 8 }}
      containers:
        - name: orbit-policy-service
          image: {{ include "orbit.image" (dict "root" $ "name" "policyService") | quote }}
          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "policyService") }}
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            {{- include "orbit.platformEnv" (dict "root" $ "name" "policyService" "keys" (list "DB_PASSWORD" "REDIS_PASSWORD")) | nindent 12 }}
            {{- include "orbit.extraEnv" (dict "root" $ "name" "policyService") | nindent 12 }}
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.policyService.resources | nindent 12 }}
          volumeMounts:
            {{- include "orbit.spireVolumeMount" . | nindent 12 }}
            {{- include "orbit.configVolumeMount" . | nindent 12 }}
            - name: tenants-config
              mountPath: /etc/orbit
              readOnly: true
            {{- include "orbit.extraVolumeMounts" (dict "root" $ "name" "policyService") | nindent 12 }}
