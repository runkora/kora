name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly rescore of the default branch.
    - cron: "31 4 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions replace the top-level set. The checkout and the
      # analysis need these reads.
      contents: read
      actions: read
      # Upload the SARIF result to code scanning.
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing requires a public repository. Set to true once it is.
          publish_results: false

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        # Code scanning on a private repository needs Code Security enabled.
        # Until the repository is public the SARIF artifact above holds the result.
        if: ${{ !github.event.repository.private }}
        with:
          sarif_file: results.sarif
