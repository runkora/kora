# =============================================================================
# Orbit Tenant Registry — Tier 1 local dev ONLY (make dev / air hot-reload)
# =============================================================================
#
# THIS FILE IS NOT USED IN CLUSTER DEPLOYMENTS.
#
# When you run the identity service directly on the host (make dev), there is
# no Kubernetes operator, no ConfigMap, and no volume mount. The service reads
# this file from the filesystem via the ORBIT_TENANTS_CONFIG env var (set in
# .env to ./config/tenants.yaml).
#
# For cluster dev (make cluster-operator + make cluster-deploy):
#   The orbit-operator builds the orbit-tenants ConfigMap from OrbitTenant CRs
#   defined in deploy/local/tenants/. This file is not read or mounted.
#   Edit deploy/local/tenants/example.yaml to change cluster tenant config.
#
# DO NOT put secrets in this file. Client secrets for confidential OIDC clients
# are managed by the orbit-operator (ADR-0029): the operator aggregates them
# into the Secret orbit-tenant-oidc-secrets in orbit-system; the identity
# service picks them up via a file watcher. The local Dex client is a public
# client — no secret is needed here.
#
# Ref: ADR-0026 (tenant registration and OIDC provider binding)
#      ADR-0029 (OIDC client secret projection for confidential tenants)
# =============================================================================

version: "v1"

tenants:
  - id: "example"
    displayName: "Orbit Example"
    state: "active"
    oidc:
      # Local Dex OIDC provider — started by: make dev-up
      # Issuer discovery: https://dex.orbit.local.clearroute.io:5556/dex/.well-known/openid-configuration
      #
      # Dex must be reachable at this URL from the identity service process.
      # In make dev (host process): add to /etc/hosts —
      #   127.0.0.1  dex.orbit.local.clearroute.io
      # In cluster (k3d): CoreDNS is patched by dev-cluster-up.sh to resolve
      #   dex.orbit.local.clearroute.io → Docker bridge gateway IP.
      issuerURL: "https://dex.orbit.local.clearroute.io:5556/dex"
      clientID: "orbit-local"
      # orbit-local is a public Dex client — no client secret is required.
      # See config/dex/config.yaml: staticClients[0].public: true
      emailDomains:
        - "orbit.local.clearroute.io"
      scopes:
        - openid
        - profile
        - email
        - groups
      # No claimBinding — any user authenticated by the local Dex instance is
      # a member of this tenant. In production, add a claimBinding to restrict
      # membership to a specific org, group, or hosted domain.
      # Example:
      #   claimBinding:
      #     claim: "email"
      #     value: "dev@orbit.local.clearroute.io"
