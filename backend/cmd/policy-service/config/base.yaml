app:
  version: "0.1.0"

server:
  port: 8083
  basePath: "/api/v1"
  shutdownTimeoutSecs: 30

bundle:
  # The chart renders jwksURL and frontendHost.
  issuer: "orbit"
  audience: "orbit-platform"
  # Where the chart mounts the orbit-tenants ConfigMap.
  tenantsPath: /etc/orbit/tenants.yaml

observability:
  serviceName: "policy-service"
