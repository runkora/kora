{{- /*
policy-service config files (docs/adr/2026-10-06-rendered-service-config-files.md).
*/}}
{{- define "orbit.policyService.configModules" -}}
cmd/policy-service:
  metrics:
    enabled: {{ .Values.global.metrics.enabled }}
    port: {{ .Values.global.metrics.port | default 9464 }}
  bundle:
    jwksURL: {{ printf "%s/api/v1/identity/.well-known/jwks.json" (include "orbit.serviceURL" (dict "root" . "name" "orbit-identity")) | toJson }}
    frontendHost: {{ include "orbit.frontendHost" . | toJson }}
{{ include "orbit.observabilityConfigModule" . }}
{{ include "orbit.storageConfigModule" . }}
{{ include "orbit.tokenConfigModule" . }}
{{- end }}
{{- include "orbit.configMap" (dict "root" $ "name" "policyService" "configMap" "orbit-policy-service-config" "modules" (include "orbit.policyService.configModules" . | fromYaml)) }}
