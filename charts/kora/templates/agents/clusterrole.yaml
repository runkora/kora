apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kora-agents
  labels:
    {{- include "kora.agents.labels" . | nindent 4 }}
# Verbs match the calls in internal/agents/k8s.go and the scaler's workload
# cache in internal/agents/workload_cache.go. get+update on every namespaced resource because each
# ensureX follows a create-then-backfill pattern — on AlreadyExists it Gets
# the existing object, merges the KoraTenant owner reference, and Updates
# (docs/adr/2026-09-06-owner-references-for-agents-and-sandboxes.md).
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The scaler sets each agent's replicas through the scale subresource.
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    verbs: ["get", "update"]
  # Run start lists an agent's pods to find the Ready ones (ReadyOrdinals), and
  # every session-manager call reads its pod's IP (PodIP). The scaler watches
  # agent StatefulSets and pods into a cache. Run start deletes the wake-reserve
  # pod on a node where a grow finds no room. The bind in PR 6 of
  # docs/adr/2026-11-22-agent-cold-tier.md will patch a pool pod's labels.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  # The scaler shrinks an idle agent's pods in place, and run start grows them back.
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["get", "create", "update", "delete"]
  # Deleting an agent type removes its workspace claims by label.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list", "delete"]
  # Apply deletes the HPA an earlier release created for each agent.
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["networking.istio.io"]
    resources: ["destinationrules"]
    verbs: ["get", "create", "update", "delete"]
  # AuthorizationPolicies restricting each agent pod's session-manager port to
  # the kora-agents principal, created in the tenant namespace alongside the
  # StatefulSet (internal/agents/k8s.go ensureAuthorizationPolicy).
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies"]
    verbs: ["get", "create", "update", "delete"]
  # Read-only access to the cluster-scoped KoraTenant CR so kora-agents can
  # set it as ownerReferences on the resources it provisions. Enables the
  # ArgoCD resource-tree view and native k8s cascade delete
  # (docs/adr/2026-09-06-owner-references-for-agents-and-sandboxes.md).
  - apiGroups: ["runkora.io"]
    resources: ["koratenants"]
    verbs: ["get"]
  # A SandboxImage's validation and pinned digest decide the image a sandbox runs.
  - apiGroups: ["runkora.io"]
    resources: ["sandboximages"]
    verbs: ["get", "list"]
