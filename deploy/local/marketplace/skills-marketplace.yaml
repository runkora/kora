# Example skill marketplace for the local example tenant. skills-service names the marketplace after the
# repository and reads its default branch. Browsing its skills needs the local
# GitHub App Secret (secrets/orbit-github-app.pem) with access to the repository.
apiVersion: orbit.io/v1alpha1
kind: SkillMarketplaceSource
metadata:
  name: skills-marketplace
  namespace: orbit-tenant-example
spec:
  github:
    owner: anthropics
    repo: skills
