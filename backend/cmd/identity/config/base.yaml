app:
  version: "0.1.0"

server:
  port: 8080
  basePath: /api/v1
  shutdownTimeoutSecs: 5

observability:
  serviceName: orbit-identity

# OAuth 2.1 authorization-server surface for the MCP profile (RFC 8414). issuer is
# the public base URL of this OAuth surface; endpoints are derived from it. Placeholder
# host until the public MCP-gateway exposure ADR lands (mirrors the gateway's gw.orbit.sh).
oauth:
  issuer: "https://identity.orbit.sh/api/v1/identity"
