name: Charts CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - uses: ./.github/actions/k8s-toolchain
        with:
          helm: true
      - run: .github/scripts/build-chart-deps.sh
      - run: make chart-lint
      - run: make chart-docs-check
      # The chart render tests skip in the backend Test job, which builds no chart dependencies.
      - name: Chart render tests
        working-directory: backend
        run: go test ./internal/platform/config/ -run '^TestChart'

  render:
    name: Render (k8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.34.0", "1.35.0", "1.36.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/k8s-toolchain
        with:
          helm: true
          yq: true
          kubeconform: true
      - run: .github/scripts/build-chart-deps.sh
      - name: Render and validate manifests
        env:
          K8S_VERSION: ${{ matrix.k8s }}
        run: |
          set -euo pipefail
          .github/scripts/gen-crd-schemas.sh crd-schemas
          {
            helm template orbit-crds charts/kora-crds -n orbit-system --kube-version "${K8S_VERSION}"
            echo '---'
            helm template orbit charts/kora -n orbit-system -f charts/kora/ci/default-values.yaml --kube-version "${K8S_VERSION}"
            echo '---'
            # The same release with a theme set.
            helm template orbit charts/kora -n orbit-system -f charts/kora/ci/default-values.yaml -f charts/kora/ci/theme-values.yaml --kube-version "${K8S_VERSION}"
          } > rendered.yaml
          # Schema coverage:
          #   - kora CRs: extracted from charts/kora-crds into crd-schemas/.
          #   - Istio CRs (Gateway, VirtualService, DestinationRule, EnvoyFilter,
          #     AuthorizationPolicy): pulled from the datreeio CRDs-catalog.
          #   - CustomResourceDefinition: pulled from yannh/kubernetes-json-schema's
          #     non-standalone dir (the standalone-strict dir omits it).
          #   - SPIRE CRs (ClusterSPIFFEID, ClusterFederatedTrustDomain,
          #     ClusterStaticEntry): skipped — no public JSON schema source
          #     publishes them.
          kubeconform -summary -strict \
            -skip ClusterSPIFFEID,ClusterFederatedTrustDomain,ClusterStaticEntry \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/{{.NormalizedKubernetesVersion}}/{{.ResourceKind}}.json' \
            -schema-location 'https://json.schemastore.org/{{.ResourceKind}}.json' \
            -schema-location 'crd-schemas/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' \
            -kubernetes-version "${K8S_VERSION}" rendered.yaml
      - name: Reject invalid theme values
        env:
          K8S_VERSION: ${{ matrix.k8s }}
        run: |
          set -euo pipefail
          # Each file under charts/kora/ci/invalid/ must fail the render with its expected message.
          while IFS='|' read -r file expected; do
            if out=$(helm template orbit charts/kora -n orbit-system -f charts/kora/ci/default-values.yaml -f "charts/kora/ci/invalid/${file}" --kube-version "${K8S_VERSION}" 2>&1); then
              echo "::error::${file} rendered; expected the render to fail"
              exit 1
            fi
            # Case-insensitive: Helm versions differ in capitalisation.
            if ! grep -qiF -- "${expected}" <<<"${out}"; then
              echo "::error::${file} failed without the expected message '${expected}':"
              echo "${out}"
              exit 1
            fi
            echo "${file}: rejected (${expected})"
          done <<'CASES'
          theme-unparseable.yaml|theme.document does not parse as a YAML map
          theme-product-name-markup.yaml|outside the Hades product-name bounds
          theme-product-name-newline.yaml|outside the Hades product-name bounds
          theme-product-name-long.yaml|must be 1 to 40 characters after trimming
          theme-product-name-blank.yaml|must be 1 to 40 characters after trimming
          theme-product-name-null.yaml|cannot be set to nothing
          CASES
