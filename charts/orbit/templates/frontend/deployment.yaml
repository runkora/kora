apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-frontend
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.frontend.selectorLabels" . | nindent 8 }}
        {{- include "orbit.frontend.labels" . | nindent 8 }}
        spiffe.io/component: frontend
        {{- include "orbit.podLabels" (dict "root" $ "name" "frontend") | nindent 8 }}
      annotations:
        {{- include "orbit.spireProxyAnnotations" (dict "root" $ "identityProxy" false) | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/frontend/configmap.yaml") . | sha256sum }}
        {{- include "orbit.podAnnotations" (dict "root" $ "name" "frontend") | nindent 8 }}
    spec:
      serviceAccountName: orbit-frontend
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.scheduling" (dict "root" $ "name" "frontend") | nindent 6 }}
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "orbit.spireVolumes" (dict "identityProxy" false) | nindent 8 }}
        {{- include "orbit.extraVolumes" (dict "root" $ "name" "frontend") | nindent 8 }}
      containers:
        - name: orbit-frontend
          image: {{ include "orbit.image" (dict "root" $ "name" "frontend") | quote }}
          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "frontend") }}
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            {{- include "orbit.extraEnv" (dict "root" $ "name" "frontend") | nindent 12 }}
          envFrom:
            - configMapRef:
                name: orbit-frontend-config
            - secretRef:
                name: {{ .Values.frontend.existingSecret }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            {{- include "orbit.spireVolumeMount" . | nindent 12 }}
            {{- include "orbit.extraVolumeMounts" (dict "root" $ "name" "frontend") | nindent 12 }}
