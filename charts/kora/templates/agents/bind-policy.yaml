# A tenant pod's agent identity comes from its spiffe.io/agent label. The label
# may be set on a running pod only once: by kora-agents, on a pool pod, in the
# same write that takes the pod out of the pool and sets app to the agent slug.
# Afterwards it never changes, and a pod never serves a second agent. app and
# runkora.io/managed-agent never change on a bound pod, and the other labels
# that select a SPIFFE ID never change on an existing pod. Only the ReplicaSet
# controller creates a pool pod, for the session-manager-pool ReplicaSet, as the
# pool ServiceAccount and with no agent label, and no update adds runkora.io/pool to a pod
# (docs/adr/2026-11-22-agent-cold-tier.md). The rules cover pod subresources too.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kora-agent-bind
  labels:
    {{- include "kora.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        runkora.io/role: tenant
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/*"]
  variables:
    # Each label is "unset" when absent and "set:<value>" when present, so an empty value counts as present.
    - name: oldAgent
      expression: "oldObject != null && has(oldObject.metadata.labels) && 'spiffe.io/agent' in oldObject.metadata.labels ? 'set:' + oldObject.metadata.labels['spiffe.io/agent'] : 'unset'"
    - name: newAgent
      expression: "has(object.metadata.labels) && 'spiffe.io/agent' in object.metadata.labels ? 'set:' + object.metadata.labels['spiffe.io/agent'] : 'unset'"
    - name: newApp
      expression: "has(object.metadata.labels) && 'app' in object.metadata.labels ? 'set:' + object.metadata.labels['app'] : 'unset'"
    - name: oldPool
      expression: "oldObject != null && has(oldObject.metadata.labels) && 'runkora.io/pool' in oldObject.metadata.labels"
    - name: newPool
      expression: "has(object.metadata.labels) && 'runkora.io/pool' in object.metadata.labels"
    # The other labels that select a SPIFFE ID in clusterspiffeids.yaml.
    - name: frozen
      expression: "['spiffe.io/service', 'spiffe.io/component', 'runkora.io/role', 'runkora.io/agent-slug', 'runkora.io/run-id']"
    # The labels that put a bound pod under its AuthorizationPolicy and the agent egress lockdown.
    - name: frozenWhenBound
      expression: "['app', 'runkora.io/managed-agent']"
  validations:
    - expression: >-
        request.operation != 'UPDATE' || variables.oldAgent == variables.newAgent ||
        (variables.oldAgent == 'unset' && variables.newAgent != 'set:' && variables.newApp == variables.newAgent &&
        variables.oldPool && !variables.newPool &&
        request.userInfo.username == 'system:serviceaccount:{{ include "kora.systemNamespace" . }}:kora-agents')
      message: spiffe.io/agent can be set only once, by kora-agents, on a pool pod as it leaves the pool, with app set to the same slug.
    - expression: >-
        request.operation != 'UPDATE' || variables.frozen.all(k,
        (has(oldObject.metadata.labels) && k in oldObject.metadata.labels) == (has(object.metadata.labels) && k in object.metadata.labels) &&
        (!(has(object.metadata.labels) && k in object.metadata.labels) || oldObject.metadata.labels[k] == object.metadata.labels[k]))
      message: The labels that select a SPIFFE ID cannot change on an existing pod.
    - expression: >-
        request.operation != 'UPDATE' || variables.oldAgent == 'unset' || variables.frozenWhenBound.all(k,
        (has(oldObject.metadata.labels) && k in oldObject.metadata.labels) == (has(object.metadata.labels) && k in object.metadata.labels) &&
        (!(has(object.metadata.labels) && k in object.metadata.labels) || oldObject.metadata.labels[k] == object.metadata.labels[k]))
      message: app and runkora.io/managed-agent cannot change on a bound pod.
    - expression: >-
        request.operation != 'CREATE' || !variables.newPool ||
        (request.userInfo.username == 'system:serviceaccount:kube-system:replicaset-controller' &&
        variables.newAgent == 'unset' &&
        object.spec.serviceAccountName == 'session-manager-pool' &&
        'pod-template-hash' in object.metadata.labels &&
        has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(o,
        o.kind == 'ReplicaSet' && has(o.controller) && o.controller &&
        o.name == 'session-manager-pool-' + object.metadata.labels['pod-template-hash']))
      message: Only the ReplicaSet controller creates a pod with runkora.io/pool, as the pool ServiceAccount, controlled by the session-manager-pool ReplicaSet and with no agent label.
    - expression: "request.operation != 'UPDATE' || !variables.newPool || variables.oldPool"
      message: runkora.io/pool cannot be added to an existing pod.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kora-agent-bind
  labels:
    {{- include "kora.labels" . | nindent 4 }}
spec:
  policyName: kora-agent-bind
  validationActions: ["Deny"]
---
# kora-agents updates a pod only to bind a pool pod, in PR 6 of
# docs/adr/2026-11-22-agent-cold-tier.md. Its pod updates stay on pool pods in
# tenant namespaces and change only the bind labels and the owner references.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kora-agents-pod-updates
  labels:
    {{- include "kora.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: kora-agents
      expression: "request.userInfo.username == 'system:serviceaccount:{{ include "kora.systemNamespace" . }}:kora-agents'"
  variables:
    # The labels a bind sets or removes: the agent identity, the pool label and the agent Service selector.
    - name: bindLabels
      expression: "['spiffe.io/agent', 'runkora.io/pool', 'app', 'runkora.io/agent-type']"
  validations:
    - expression: "has(namespaceObject.metadata.labels) && 'runkora.io/role' in namespaceObject.metadata.labels && namespaceObject.metadata.labels['runkora.io/role'] == 'tenant'"
      message: kora-agents updates pods only in tenant namespaces.
    - expression: "has(oldObject.metadata.labels) && 'runkora.io/pool' in oldObject.metadata.labels"
      message: kora-agents updates only pool pods.
    - expression: "object.spec == oldObject.spec"
      message: kora-agents does not change a pod's spec.
    - expression: >-
        has(object.metadata.annotations) == has(oldObject.metadata.annotations) &&
        (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations) &&
        has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers)
      message: kora-agents does not change a pod's annotations or finalizers.
    - expression: >-
        (!has(oldObject.metadata.labels) || oldObject.metadata.labels.all(k, k in variables.bindLabels ||
        (has(object.metadata.labels) && k in object.metadata.labels && object.metadata.labels[k] == oldObject.metadata.labels[k]))) &&
        (!has(object.metadata.labels) || object.metadata.labels.all(k, k in variables.bindLabels ||
        (has(oldObject.metadata.labels) && k in oldObject.metadata.labels)))
      message: kora-agents changes only the bind labels on a pod.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kora-agents-pod-updates
  labels:
    {{- include "kora.labels" . | nindent 4 }}
spec:
  policyName: kora-agents-pod-updates
  validationActions: ["Deny"]
---
# Only kora-agents writes the pool Deployment, and only the Deployment
# controller writes its ReplicaSets. A workload that is not the pool cannot
# carry a pool pod template (docs/adr/2026-11-22-agent-cold-tier.md).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kora-agent-pool-workloads
  labels:
    {{- include "kora.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        runkora.io/role: tenant
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "replicasets"]
  variables:
    - name: poolTemplate
      expression: "has(object.spec.template.metadata.labels) && 'runkora.io/pool' in object.spec.template.metadata.labels"
    - name: poolName
      expression: "object.metadata.name == 'session-manager-pool' || object.metadata.name.startsWith('session-manager-pool-')"
    # An update that leaves the pod template alone, such as a replica or owner change, is not checked.
    - name: templateWrite
      expression: "request.operation == 'CREATE' || object.spec.template != oldObject.spec.template"
  validations:
    - expression: >-
        request.kind.kind != 'Deployment' || !variables.templateWrite || !(variables.poolTemplate || variables.poolName) ||
        (object.metadata.name == 'session-manager-pool' &&
        request.userInfo.username == 'system:serviceaccount:{{ include "kora.systemNamespace" . }}:kora-agents')
      message: Only kora-agents writes a pool Deployment, and it is named session-manager-pool.
    - expression: >-
        request.kind.kind != 'ReplicaSet' || !variables.templateWrite || !(variables.poolTemplate || variables.poolName) ||
        (request.userInfo.username == 'system:serviceaccount:kube-system:deployment-controller' &&
        has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(o,
        o.kind == 'Deployment' && has(o.controller) && o.controller && o.name == 'session-manager-pool'))
      message: Only the Deployment controller writes a pool ReplicaSet, for the session-manager-pool Deployment.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kora-agent-pool-workloads
  labels:
    {{- include "kora.labels" . | nindent 4 }}
spec:
  policyName: kora-agent-pool-workloads
  validationActions: ["Deny"]
---
# kora-agents writes one kind of Deployment: the pool in a tenant namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kora-agents-deployments
  labels:
    {{- include "kora.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  matchConditions:
    - name: kora-agents
      expression: "request.userInfo.username == 'system:serviceaccount:{{ include "kora.systemNamespace" . }}:kora-agents'"
  validations:
    - expression: >-
        object.metadata.name == 'session-manager-pool' && has(namespaceObject.metadata.labels) &&
        'runkora.io/role' in namespaceObject.metadata.labels && namespaceObject.metadata.labels['runkora.io/role'] == 'tenant'
      message: kora-agents writes only the session-manager-pool Deployment in a tenant namespace.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kora-agents-deployments
  labels:
    {{- include "kora.labels" . | nindent 4 }}
spec:
  policyName: kora-agents-deployments
  validationActions: ["Deny"]
