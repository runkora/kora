# NetworkPolicies for the Orbit system namespace.
#
# Design intent:
# - Default deny-all (ingress + egress) in orbit-system
# - Explicit allow rules for: DNS, Istio mesh sidecar ports, istiod xDS,
#   and Kubernetes API (for any controller/webhook needs)
#
# SPIRE runs in its own namespace (spire-system) and is NOT governed by these
# policies. Workload SVIDs are delivered via CSI-mounted Unix domain socket —
# no network path from orbit-system to spire-system is required.
#
# Disable entirely for environments where the CNI does not enforce NetworkPolicy:
#   --set networkPolicy.enabled=false
{{- if .Values.networkPolicy.enabled }}
{{- $ns := include "orbit-platform.systemNamespace" . }}
---
# Block all ingress and egress by default in orbit-system.
# All exceptions must be explicitly granted by the rules below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ $ns }}
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow all pods in orbit-system to make DNS queries.
# Without this, service discovery fails under the default-deny-all baseline.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ $ns }}
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow intra-namespace traffic on Envoy sidecar ports and application ports.
# - 3000:  orbit-frontend (Next.js)
# - 8080:  orbit-identity
# - 8081:  orbit-inference-gateway
# - 8083:  orbit-policy-service
# - 8084:  orbit-policy-gateway
# - 8095:  orbit-mcp (introspected east-west by the tool-gateway)
# - 8096:  orbit-tool-gateway (catalog read by the BFF; health)
# - 8097:  orbit-triggers (webhook ingestion, management API, health)
# - 9090:  orbit-policy-gateway (gRPC ext_authz)
# - 15006: Envoy inbound iptables redirect
# - 15008: Envoy HBONE (HTTP/2 tunnel for mTLS)
# - 15090: Envoy Prometheus metrics scrape
#
# NOTE: CNI NetworkPolicy enforcement fires on the original destination port
# BEFORE iptables redirects traffic into the pod's Envoy sidecar. We must
# therefore allow the actual application ports that the source Envoy dials
# directly, not just the sidecar redirect ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mesh-sidecar
  namespace: {{ $ns }}
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
      ports:
        - port: 3000
        - port: 8080
        - port: 8081
        - port: 8083
        - port: 8084
        - port: 8095
        - port: 8096
        # orbit-triggers: webhook ingestion + management API.
        - port: 8097
        - port: 9090
        - port: 15006
        - port: 15008
        - port: 15090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
      ports:
        - port: 3000
        - port: 8080
        - port: 8081
        - port: 8083
        - port: 8084
        - port: 8095
        - port: 8096
        # orbit-triggers: the ingress side already allows 8097, and a one-sided
        # allowance is an outage waiting for the first in-namespace caller —
        # the frontend BFF reaching the triggers API is exactly that call.
        - port: 8097
        - port: 9090
        - port: 15006
        - port: 15008
---
# Allow inbound mTLS mesh traffic from tenant namespaces into orbit-system.
# Cross-namespace flows requiring this:
# - identity-proxy sidecar calls orbit-identity (/api/v1/identity/exchange) on port 8080
# - OPA sidecar polls orbit-policy-service for bundles on port 8083
# - session-manager (agent pods) calls orbit-inference-gateway on port 8081
# - session-manager (agent pods) calls orbit-tool-gateway (MCP) on port 8096
# With Istio mTLS, the source Envoy connects on the original destination port before
# iptables redirect. Without this rule, the default-deny-all blocks the connection
# and Envoy returns 503 "delayed connect error: Connection refused".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tenant-mesh-ingress
  namespace: {{ $ns }}
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              orbit.io/role: tenant
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 8083
          protocol: TCP
        - port: 8096
          protocol: TCP
        - port: 15006
          protocol: TCP
        - port: 15008
          protocol: TCP
---
# Allow orbit-system pods to reach session-manager pods in tenant namespaces.
# orbit-agents calls the session-manager HTTP API (port 8090) on each agent
# pod to create, message, and terminate Claude Code subprocesses.
# Cilium eBPF enforces NetworkPolicy before iptables redirect, so we must
# allow the actual application port (8090) on the egress side.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-session-manager-egress
  namespace: {{ $ns }}
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              orbit.io/role: tenant
      ports:
        - port: 8090
          protocol: TCP
---
# Allow orbit-system pods to reach istiod on port 15012 (gRPC xDS).
# Envoy sidecars must reach istiod to receive Listener, Cluster, Route, and
# Endpoint configuration. Without this, all sidecar-managed traffic fails.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istiod-xds
  namespace: {{ $ns }}
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 15012
---
# Allow orbit-system pods to reach the Kubernetes API server.
# Required for any controllers or webhooks that need to call the k8s API.
# The Kubernetes API server runs as a host-network service and cannot be
# selected by pod/namespace selector — an ipBlock open to 0.0.0.0/0 on 443
# and 6443 is the correct pattern for k3d/k8s environments.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-apiserver
  namespace: {{ $ns }}
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
{{- if .Values.networkPolicy.externalServices }}
---
# Allow orbit-system pods to reach external services (e.g. Postgres, Redis) running
# outside the cluster on known CIDRs. Configured per-environment in values files.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-services
  namespace: {{ $ns }}
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    {{- range .Values.networkPolicy.externalServices }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        {{- range .ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
{{- end }}
---
# Allow the Istio ingress gateway (istio-system) to reach orbit-system pods.
# Required for external traffic routed via the orbit-gateway VirtualServices
# (<frontendHost> → frontend, api.<frontendHost> → the unified backend API) to
# reach their destination pods' Envoy sidecars.
# Without this rule, the default-deny-all baseline blocks the gateway connection
# and Envoy returns 503 "delayed connect error".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: {{ $ns }}
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        # Application ports — CNI NetworkPolicy enforcement fires on the original
        # destination port before iptables redirect inside the pod's netns, so we
        # must allow the actual app/sidecar ports that the gateway dials directly.
        # 3000: orbit-frontend (Next.js)
        # 8080: orbit-identity
        # 8081: orbit-inference-gateway
        # 8083: orbit-policy-service
        # 8084: orbit-policy-gateway
        # 8096: orbit-tool-gateway (MCP — /v1/mcp via the api. host, ADR 2026-07-04)
        # 9090: orbit-policy-gateway (gRPC ext_authz)
        - port: 3000
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 8083
          protocol: TCP
        - port: 8084
          protocol: TCP
        - port: 8096
          protocol: TCP
        # 8097: orbit-triggers — public webhook ingestion (/api/v1/webhooks on the api. host)
        - port: 8097
          protocol: TCP
        - port: 9090
          protocol: TCP
        # Envoy inbound redirect port — in case any mesh-internal traffic arrives
        # here (e.g. HBONE or direct sidecar-to-sidecar mTLS).
        - port: 15006
          protocol: TCP
        # Envoy HBONE (HTTP/2 tunnel for mTLS) — ambient mesh traffic.
        - port: 15008
          protocol: TCP
{{- end }}
