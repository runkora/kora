# Unified backend API VirtualService.
#
# api.<domain> is the single external host for ALL backend/data-plane services
# (ADR 2026-07-04, north-south ingress + external service exposure). This VS is
# the platform-owned routing table: services declare a path prefix here; there is
# no per-service host or additional Gateway server. <domain> with no prefix is the
# frontend/BFF only (see frontend/virtualservice.yaml).
#
# Routes are ordered most-specific first (Istio evaluates in order, first match
# wins). The root /.well-known/* discovery documents (RFC 8414/9728) are served
# at the host root and rewritten to each owning service's internal base path.
#
# Binds to the kora Gateway, or the existing one named by gateway.name.
# Behind a TLS-terminating Ingress (gateway.ingress.enabled) the gateway sees
# plaintext and would advertise http:// in OAuth metadata; every route forces
# x-forwarded-proto=https to correct it.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: orbit-api
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
spec:
  hosts:
    - "{{ include "orbit.apiHost" . }}"
  gateways:
    - {{ include "orbit.gatewayRef" . }}
  http:
    # ── Root discovery metadata (RFC 8414 / 9728) ──────────────────────────────
    # Served at the host root; rewritten to each service's internal basePath. The
    # metadata CONTENT is host-derived, so the rewrite (path only) keeps the issuer
    # correct.
    - match:
        - uri:
            exact: /.well-known/oauth-protected-resource
      {{- include "orbit.forceHttpsHeaders" . | nindent 6 }}
      rewrite:
        uri: /v1/.well-known/oauth-protected-resource
      route:
        - destination:
            host: orbit-tool-gateway.{{ include "orbit.systemNamespace" . }}.svc.cluster.local
            port:
              number: 80
    - match:
        - uri:
            exact: /.well-known/oauth-authorization-server
      {{- include "orbit.forceHttpsHeaders" . | nindent 6 }}
      rewrite:
        uri: /api/v1/identity/.well-known/oauth-authorization-server
      route:
        - destination:
            host: orbit-identity.{{ include "orbit.systemNamespace" . }}.svc.cluster.local
            port:
              number: 80
    # ── MCP tool-gateway ───────────────────────────────────────────────────────
    - match:
        - uri:
            prefix: /v1/mcp
      {{- include "orbit.forceHttpsHeaders" . | nindent 6 }}
      route:
        - destination:
            host: orbit-tool-gateway.{{ include "orbit.systemNamespace" . }}.svc.cluster.local
            port:
              number: 80
    # ── Identity internal: never reachable from the edge ────────────────────────
    # /api/v1/identity/internal/* is the in-mesh-only surface (today: the
    # service-token mint used by orbit-triggers). It authenticates on the
    # sidecar-attested XFCC identity, which an external caller cannot forge
    # because Istio sanitises the header on ingress. This rule is belt-and-
    # braces: the endpoint is powerful enough that it should be unreachable
    # from outside by routing as well as by authentication. Must precede the
    # /api/v1/identity/ rule below, which would otherwise match it.
    - match:
        - uri:
            prefix: /api/v1/identity/internal/
      {{- include "orbit.forceHttpsHeaders" . | nindent 6 }}
      directResponse:
        status: 404
        body:
          string: '{"code":"not_found","message":"not found"}'
    # ── Inbound webhooks → orbit-triggers ──────────────────────────────────────
    # The path is unchanged from when triggers ran inside identity: every
    # registered webhook source posts here, so only the destination moves.
    # See docs/adr/2026-06-20-extended-trigger-types.md, Decision 1.
    - match:
        - uri:
            prefix: /api/v1/webhooks/
      {{- include "orbit.forceHttpsHeaders" . | nindent 6 }}
      route:
        - destination:
            host: orbit-triggers.{{ include "orbit.systemNamespace" . }}.svc.cluster.local
            port:
              number: 80
    # ── Identity: OAuth, device/session/exchange, JWKS ─────────────────────────
    - match:
        - uri:
            prefix: /api/v1/identity/
      {{- include "orbit.forceHttpsHeaders" . | nindent 6 }}
      route:
        - destination:
            host: orbit-identity.{{ include "orbit.systemNamespace" . }}.svc.cluster.local
            port:
              number: 80
    # ── Skills service: marketplace listing and skill browsing ─────────────────
    - match:
        - uri:
            prefix: /v1/marketplaces
      {{- include "orbit.forceHttpsHeaders" . | nindent 6 }}
      route:
        - destination:
            host: orbit-skills-service.{{ include "orbit.systemNamespace" . }}.svc.cluster.local
            port:
              number: 8098
    # ── Inference gateway (OpenAI-compatible API), the API-host default ────────
    - timeout: 3600s # Long timeout; inference streams can run for many minutes.
      {{- include "orbit.forceHttpsHeaders" . | nindent 6 }}
      route:
        - destination:
            host: orbit-inference-gateway.{{ include "orbit.systemNamespace" . }}.svc.cluster.local
            port:
              number: 80
