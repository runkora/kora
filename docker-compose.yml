# A fixed project name keeps container and volume names the same in any checkout.
name: kora

services:
  postgres:
    image: postgres:18-alpine
    container_name: kora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-kora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kora}
      POSTGRES_DB: ${DB_NAME:-kora}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres_18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kora} -d ${DB_NAME:-kora}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kora-network

  redis:
    image: redis:8-alpine
    container_name: kora-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-kora} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kora-network

  # ---------------------------------------------------------------------------
  # glauth — lightweight LDAP directory for local dev identity
  #
  # Backs the Dex LDAP connector so that group membership (platform-admin,
  # engineer, etc.) flows through the OIDC token — replicating the
  # production pattern where roles come from the corporate directory.
  #
  # Test user: dev@local.runkora.io / password
  # Groups:    platform-admin
  #
  # Enabled by: make dev-up  (or docker compose up -d glauth)
  # ---------------------------------------------------------------------------
  glauth:
    image: ghcr.io/glauth/glauth:v2.5.4
    container_name: kora-glauth
    restart: unless-stopped
    # entrypoint.sh substitutes ${GLAUTH_DEV_PASSWORD_HASH:-5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8} from .env into
    # the committed config at startup (the glauth image is too minimal for
    # sed/envsubst, so the script uses pure shell builtins).
    entrypoint: ["/bin/sh", "/etc/glauth/entrypoint.sh"]
    environment:
      - GLAUTH_DEV_PASSWORD_HASH=${GLAUTH_DEV_PASSWORD_HASH:-5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8}
    volumes:
      - ./config/glauth/config.cfg:/etc/glauth/config.cfg.in:ro
      - ./config/glauth/entrypoint.sh:/etc/glauth/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "while IFS= read -r l; do case $$l in *:0F35*) exit 0;; esac; done </proc/net/tcp6; exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - kora-network

  # ---------------------------------------------------------------------------
  # Dex — local OIDC provider
  #
  # Runs a real, standards-compliant OIDC server so the full OAuth 2.0 Device
  # Authorization Grant (RFC 8628) protocol executes without any cloud accounts.
  # Backed by glauth (LDAP) for user authentication and group membership.
  #
  # Issuer:   https://dex.local.runkora.io:5556/dex
  # Test user: dev@local.runkora.io / password
  # Client ID: kora-local  (public client — no secret)
  #
  # Enabled by: make dev-up  (or docker compose up -d dex)
  # ---------------------------------------------------------------------------
  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    container_name: kora-dex
    restart: unless-stopped
    depends_on:
      glauth:
        condition: service_healthy
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./config/dex/config.yaml:/etc/dex/config.yaml:ro
      - ./secrets/tls.crt:/etc/dex/tls.crt:ro
      - ./secrets/tls.key:/etc/dex/tls.key:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:5556/dex/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - kora-network

  # ---------------------------------------------------------------------------
  # Port proxy — maps standard ports (443/80) to k3d's high ports (8443/8880)
  #
  # Pure TCP passthrough (Layer 4) — no TLS termination, no certificate config.
  # Lets devs access https://local.runkora.io instead of https://local.runkora.io:8443.
  # HAProxy is ~10MB and uses negligible resources in TCP mode.
  # ---------------------------------------------------------------------------
  port-proxy:
    image: haproxy:3.2-alpine
    container_name: kora-port-proxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_18_data:
    driver: local
  redis_data:
    driver: local

networks:
  kora-network:
    name: kora-network   # explicit name prevents docker-compose project-prefix (kora_kora-network)
    driver: bridge
