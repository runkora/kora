# Orbit chart values, the same set `helm show values oci://ghcr.io/clear-route/charts/orbit`
# prints. Copy this file into your GitOps repository and edit it. A cluster
# already running SPIRE and Istio installs the chart with this file, no Helmfile.
#
# Cloud starting point. Replace the trust domain, hosts and database and Redis
# endpoints with your own.
global:
  trustDomain: orbit.example.com
  imageRegistry: ghcr.io/clear-route
  imagePullPolicy: IfNotPresent
  # Shared service config; a component's own config block overrides it.
  logFormat: json
  postgres:
    sslMode: require
    captureQueryText: false
  observability:
    otlpInsecure: false

frontendHost: orbit.example.com
# publicHosts defaults to api.<frontendHost> and <frontendHost>; set to override.

config:
  db:
    host: postgres.example.internal
    port: 5432
    name: orbit
    user: orbit
  redis:
    host: redis.example.internal
    port: 6379
  platformSecretName: orbit-secrets

istio:
  namespace: istio-system
  revision: ""
  outboundTrafficPolicy: ALLOW_ANY

spire:
  className: spire-system-spire

networkPolicy:
  enabled: true

gateway:
  create: true
  tls:
    enabled: true
    credentialName: orbit-gateway-tls
ingressGateway:
  service:
    type: LoadBalancer

operator:
  replicas: 2
  leaderElection: true
  podDisruptionBudget:
    enabled: true

identity:
  config:
    redisTLSEnabled: "true"
    accessTokenTtlMinutes: 15

inferenceGateway:
  # IAM role for the gateway pod, granting Bedrock discovery and invoke. On EKS
  # this is the IRSA or Pod Identity annotation. See docs/guides/deployment.md.
  serviceAccount:
    annotations: {}
  bedrock:
    accounts: []

frontend:
  config:
    nextPublicAppUrl: https://orbit.example.com

agents:
  # Kustomize-style patches applied to every resource orbit-agents provisions
  # in tenant namespaces (docs/adr/2026-09-15-manifest-patches-configmap.md).
  # The map key is a bare patch name (no extension); the chart writes it into
  # the ConfigMap as "<key>.yaml", so the key controls apply order. `content`
  # is the patch body verbatim. Remove the examples you don't need.
  manifestPatches:
    50-sandbox-imagepullsecret:
      content: |
        apiVersion: apps/v1
        kind: StatefulSet
        spec:
          template:
            spec:
              imagePullSecrets:
                - name: acme-registry
    51-sandbox-nodeselector:
      content: |
        apiVersion: apps/v1
        kind: StatefulSet
        spec:
          template:
            spec:
              nodeSelector:
                disktype: ssd
