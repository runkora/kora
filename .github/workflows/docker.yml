name: Docker build and publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: OCI tag to publish when running manually
        required: false
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: publish-backend-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-bake-build:
    name: Docker Bake Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
      REPOSITORY_URL: https://github.com/${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Derive image metadata
        shell: bash
        run: |
          echo "IMAGE_VERSION=pr-${{ github.event.pull_request.number }}" >> "${GITHUB_ENV}"
          echo "IMAGE_CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            docker-bake.hcl
            docker-bake.ci.hcl
          targets: |
            backend-images
            orbit-frontend
            orbit-operator
          load: true
          set: |
            *.platform=linux/amd64
            *.labels.org.opencontainers.image.source=${{ env.REPOSITORY_URL }}
            *.labels.org.opencontainers.image.url=${{ env.REPOSITORY_URL }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.labels.org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
            *.labels.org.opencontainers.image.created=${{ env.IMAGE_CREATED }}

  docker-bake-push:
    name: Docker Bake Build And Push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
      REPOSITORY_URL: https://github.com/${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Derive image metadata
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="latest"
          fi

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE_VERSION=${IMAGE_TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE_CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            docker-bake.hcl
            docker-bake.ci.hcl
          targets: |
            backend-images
            orbit-frontend
            orbit-operator
          push: true
          set: |
            *.platform=linux/amd64
            *.labels.org.opencontainers.image.source=${{ env.REPOSITORY_URL }}
            *.labels.org.opencontainers.image.url=${{ env.REPOSITORY_URL }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.labels.org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
            *.labels.org.opencontainers.image.created=${{ env.IMAGE_CREATED }}
