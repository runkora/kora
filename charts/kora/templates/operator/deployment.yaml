apiVersion: apps/v1
kind: Deployment
metadata:
  name: kora-operator
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      {{- include "kora.operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kora.operator.selectorLabels" . | nindent 8 }}
        runkora.io/kube-api-client: "true"
        {{- include "kora.operator.labels" . | nindent 8 }}
        spiffe.io/component: operator
        {{- include "kora.podLabels" (dict "root" $ "name" "operator") | nindent 8 }}
      annotations:
        # The operator joins the mesh to call the services it projects declared
        # resources into, with its SPIFFE identity /system/operator.
        {{- include "kora.spireProxyAnnotations" (dict "root" $) | nindent 8 }}
        # Nothing reaches the operator through the mesh. The kube-apiserver calls
        # the webhook (9443), the kubelet probes 8081 and the scraper reads 8080,
        # none with a mesh certificate.
        traffic.sidecar.istio.io/excludeInboundPorts: "9443,8081,8080"
        # Only the calls to kora services go through the mesh. The kube-apiserver
        # and the image registries the operator reads stay direct. The mesh's
        # outbound policy may not list them.
        traffic.sidecar.istio.io/excludeOutboundPorts: {{ $ports := list "443" "6443" }}{{ range .Values.agents.sandboxImages.registryPorts }}{{ $ports = append $ports (toString .) }}{{ end }}{{ $ports | uniq | join "," | quote }}
        # Keeps the scrape on 8080 instead of Istio's merged metrics port.
        prometheus.istio.io/merge-metrics: "false"
        checksum/config: {{ include (print $.Template.BasePath "/operator/config.yaml") . | sha256sum }}
        # controller-runtime's own built-in Prometheus metrics (reconcile queue
        # depth/errors/duration), not the internal/platform/metrics package —
        # the operator already exposes these on its default manager bind
        # address; this just makes them scrapable. See
        # docs/adr/2026-10-06-prometheus-metrics-endpoints.md.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        {{- include "kora.podAnnotations" (dict "root" $ "name" "operator") | nindent 8 }}
    spec:
      serviceAccountName: kora-operator
      {{- include "kora.imagePullSecrets" . | nindent 6 }}
      {{- include "kora.scheduling" (dict "root" $ "name" "operator") | nindent 6 }}
      securityContext:
        {{- include "kora.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      containers:
        - name: operator
          image: {{ include "kora.image" (dict "root" $ "name" "operator") | quote }}
          imagePullPolicy: {{ include "kora.imagePullPolicy" (dict "root" $ "name" "operator") }}
          securityContext:
            {{- include "kora.containerSecurityContext" (dict) | nindent 12 }}
          env:
            - name: HOME
              value: /tmp
            {{- include "kora.extraEnv" (dict "root" $ "name" "operator") | nindent 12 }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: https-webhook
              containerPort: 9443
              protocol: TCP
            - name: http-metrics
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "kora.configVolumeMount" . | nindent 12 }}
            # Preflight fetches its own SVID as proof SPIRE issues identities.
            # The Envoy sidecar reads its certificate from the same socket.
            {{- include "kora.spireVolumeMount" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "kora.configVolume" (dict "root" $ "name" "operator" "configMap" "kora-operator-config" "modules" (include "kora.operator.configModules" . | fromYaml)) | nindent 8 }}
        {{- include "kora.spireVolumes" . | nindent 8 }}
      terminationGracePeriodSeconds: 60
