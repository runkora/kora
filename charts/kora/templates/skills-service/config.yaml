{{- /*
Skills Service configuration files.
*/}}
{{- define "kora.skillsService.configModules" -}}
cmd/skills-service:
  metrics:
    enabled: {{ .Values.global.metrics.enabled }}
    port: {{ .Values.global.metrics.port | default 9464 }}
  identity:
    internalURL: {{ include "kora.serviceURL" (dict "root" . "name" "kora-identity") | toJson }}
  policy:
    policyServiceURL: {{ include "kora.serviceURL" (dict "root" . "name" "kora-policy-service") | toJson }}
  marketplace:
    {{- $limits := .Values.skillsService.limits | default dict }}
    limits:
      skillsPerMarketplace: {{ $limits.skillsPerMarketplace | default 0 | int64 }}
      filesPerSkill: {{ $limits.filesPerSkill | default 0 | int64 }}
      bytesPerFile: {{ $limits.bytesPerFile | default 0 | int64 }}
      skillMdBytesPerMarketplace: {{ $limits.skillMdBytesPerMarketplace | default 0 | int64 }}
      fileCacheBytesPerMarketplace: {{ $limits.fileCacheBytesPerMarketplace | default 0 | int64 }}
{{ include "kora.observabilityConfigModule" . }}
{{ include "kora.storageConfigModule" (dict "root" . "redisClient" true) }}
{{ include "kora.tokenConfigModule" . }}
{{- end }}
{{- include "kora.configMap" (dict "root" $ "name" "skillsService" "configMap" "kora-skills-service-config" "modules" (include "kora.skillsService.configModules" . | fromYaml)) }}
