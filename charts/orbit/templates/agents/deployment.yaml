apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-agents
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.agents.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.agents.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.agents.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.agents.selectorLabels" . | nindent 8 }}
        {{- include "orbit.agents.labels" . | nindent 8 }}
        spiffe.io/component: orbit-agents
        orbit.io/identity-proxy: "enabled"
        {{- include "orbit.podLabels" (dict "root" $ "name" "agents") | nindent 8 }}
      annotations:
        {{- include "orbit.spireProxyAnnotations" (dict "root" $ "identityProxy" true) | nindent 8 }}
        # Postgres is external to the mesh; bypass Envoy interception.
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
        {{- include "orbit.podAnnotations" (dict "root" $ "name" "agents") | nindent 8 }}
    spec:
      serviceAccountName: orbit-agents
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.scheduling" (dict "root" $ "name" "agents") | nindent 6 }}
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "orbit.spireVolumes" (dict "identityProxy" true) | nindent 8 }}
        # Connection registry aggregated by the operator; optional so the pod starts
        # before any Connection exists.
        - name: tenant-connections
          configMap:
            name: {{ .Values.agents.tenantConnectionsConfigMapName }}
            optional: true
        {{- include "orbit.extraVolumes" (dict "root" $ "name" "agents") | nindent 8 }}
      containers:
        - name: orbit-agents
          image: {{ include "orbit.image" (dict "root" $ "name" "agents") | quote }}
          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "agents") }}
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            - name: ORBIT_POSTGRES_SSL_MODE
              value: {{ .Values.agents.config.postgresSSLMode | quote }}
            - name: ORBIT_POSTGRES_CAPTURE_QUERY_TEXT
              value: {{ .Values.agents.config.postgresCaptureQueryText | quote }}
            - name: ORBIT_OTLP_INSECURE
              value: {{ .Values.agents.config.otlpInsecure | quote }}
            - name: ORBIT_LOG_FORMAT
              value: {{ .Values.agents.config.logFormat | quote }}
            - name: ORBIT_SESSION_MANAGER_POSTGRES_SSL_MODE
              value: {{ .Values.agents.config.sessionManagerPostgresSSLMode | quote }}
            - name: ORBIT_SESSION_MANAGER_AUTHORIZATION_POLICY_ENABLED
              value: {{ and .Values.platform.spiffe.enabled .Values.agents.authorizationPolicy.enabled | quote }}
            - name: ORBIT_SYSTEM_NAMESPACE
              value: {{ include "orbit.systemNamespace" . | quote }}
            - name: ORBIT_TRUST_DOMAIN
              value: {{ include "orbit.trustDomain" . | quote }}
            - name: ORBIT_SESSION_MANAGER_IMAGE
              value: {{ .Values.agents.config.sessionManagerImage | default (printf "%s/orbit-session-manager:%s" .Values.global.imageRegistry .Chart.AppVersion) | quote }}
            - name: ORBIT_SANDBOX_IMAGE
              value: {{ .Values.agents.config.sandboxImage | default (printf "%s/orbit-sandbox-exec:%s" .Values.global.imageRegistry .Chart.AppVersion) | quote }}
            - name: ORBIT_SANDBOX_GIT_AUTHOR_NAME
              value: {{ .Values.agents.config.sandboxGitAuthorName | quote }}
            - name: ORBIT_SANDBOX_GIT_AUTHOR_EMAIL
              value: {{ .Values.agents.config.sandboxGitAuthorEmail | quote }}
            - name: ORBIT_AGENTS_IMAGE_PULL_SECRETS
              value: {{ range $i, $s := .Values.global.imagePullSecrets }}{{ if $i }},{{ end }}{{ $s.name }}{{ end }}
            {{- /* Scheduling and storage for the StatefulSets and sandbox pods orbit-agents creates in tenant namespaces (ADR 2026-06-12). */}}
            {{- $rp := .Values.agents.runtimePods }}
            {{- $ns := $rp.nodeSelector | default .Values.global.nodeSelector }}
            {{- $tol := $rp.tolerations | default .Values.global.tolerations }}
            {{- $pc := $rp.priorityClassName | default .Values.global.priorityClassName }}
            {{- with $ns }}
            - name: ORBIT_MANIFEST__StatefulSet__*__spec__template__spec__nodeSelector
              value: {{ toJson . | quote }}
            - name: ORBIT_MANIFEST__Pod__*__spec__nodeSelector
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with $tol }}
            - name: ORBIT_MANIFEST__StatefulSet__*__spec__template__spec__tolerations
              value: {{ toJson . | quote }}
            - name: ORBIT_MANIFEST__Pod__*__spec__tolerations
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with $pc }}
            - name: ORBIT_MANIFEST__StatefulSet__*__spec__template__spec__priorityClassName
              value: {{ . | quote }}
            - name: ORBIT_MANIFEST__Pod__*__spec__priorityClassName
              value: {{ . | quote }}
            {{- end }}
            {{- with $rp.sandboxResources }}
            - name: ORBIT_MANIFEST__Pod__*__spec__containers__0__resources
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with $rp.workspace.storageClassName }}
            - name: ORBIT_MANIFEST__PersistentVolumeClaim__*__spec__storageClassName
              value: {{ . | quote }}
            {{- end }}
            {{- with $rp.workspace.accessModes }}
            - name: ORBIT_MANIFEST__PersistentVolumeClaim__*__spec__accessModes
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with $rp.serviceAccountAnnotations }}
            - name: ORBIT_MANIFEST__ServiceAccount__*__metadata__annotations
              value: {{ toJson . | quote }}
            {{- end }}
            {{- include "orbit.extraEnv" (dict "root" $ "name" "agents") | nindent 12 }}
          {{- include "orbit.platformEnvFrom" $ | nindent 10 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.agents.resources | nindent 12 }}
          volumeMounts:
            {{- include "orbit.spireVolumeMount" . | nindent 12 }}
            - name: tenant-connections
              mountPath: /var/run/orbit/connections
              readOnly: true
            {{- include "orbit.extraVolumeMounts" (dict "root" $ "name" "agents") | nindent 12 }}
        {{- include "orbit.identityProxyContainer" (dict "root" $) | nindent 8 }}
