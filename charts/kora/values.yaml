# Required: global.trustDomain, frontendHost.
# Requires externally managed Istio, SPIRE, PostgreSQL, and Redis.

global:
  # Shared by SPIRE, Istio and kora. Required.
  trustDomain: ""

  # Namespace kora runs in. Empty means the release namespace.
  systemNamespace: ""

  # Registry prefix for every kora image. Overridable per component.
  imageRegistry: ghcr.io/runkora

  # Image tag for every kora image. Empty uses the chart appVersion. Local
  # development sets this to pin a pushed tag; a release stamps digests instead.
  imageTag: ""

  # Service config shared by every component, rendered into each one's config
  # files. A component's configOverrides overrides it.
  logFormat: json
  postgres:
    sslMode: require
    captureQueryText: false
  observability:
    # The collector's gRPC URL, e.g. http://otel-collector.observability.svc:4317.
    # The scheme sets the transport: http:// is plaintext, https:// is TLS.
    # Empty exports no traces or metrics.
    otlpEndpoint: ""
    # Fraction of root traces sampled, 0.0 to 1.0.
    samplingRate: ""
    # The namespace running that collector, when it runs in this cluster.
    # Setting it opens the egress the export needs, on the endpoint's port, and
    # only takes effect while networkPolicy.enabled is true. Agent pods may
    # export to this namespace, or to the externalServices entry serving the
    # endpoint's port, whatever networkPolicy.enabled is. For a collector
    # outside the cluster, leave this empty and add its CIDR and port to
    # networkPolicy.externalServices instead.
    collectorNamespace: ""

  # Prometheus /metrics scrape endpoint, shared by every instrumented
  # component (see docs/adr/2026-10-06-prometheus-metrics-endpoints.md). No
  # component overrides enabled or port today; every one of the 10
  # internal/platform/metrics services inherits these two values as-is. Port
  # 9464 is the OTel Prometheus-exporter convention, kept distinct from 9090,
  # which allow-mesh-sidecar already uses for policy-gateway's ext_authz port.
  metrics:
    enabled: true
    port: 9464
    # The namespace running a scraper that reaches into kora-system (e.g.
    # Prometheus / Prometheus Operator / Grafana Alloy). Empty opens no
    # ingress. Only takes effect while networkPolicy.enabled is true. This
    # grants NetworkPolicy ingress only — it does not by itself satisfy this
    # mesh's Istio mTLS; the scraper must run inside the mesh (sidecar
    # injected) and be allowed by the target's AuthorizationPolicy (see
    # triggers.authorizationPolicy.metricsScraperPrincipals) to actually
    # complete a scrape. See the ADR's Decision.
    scraperNamespace: ""
    # Opt-in Prometheus Operator ServiceMonitor per instrumented service.
    # Renders nothing unless the monitoring.coreos.com/v1 CRD is present on
    # the target cluster, so enabling this without the CRD installed is safe.
    serviceMonitor:
      enabled: false
      interval: 30s
      # Extra labels merged onto every rendered ServiceMonitor, on top of
      # kora.labels. Most Prometheus Operator installs only select
      # ServiceMonitors carrying their own Helm release label (e.g.
      # `release: kube-prometheus-stack`, required because
      # serviceMonitorSelectorNilUsesHelmValues defaults to true) — set that
      # here. Empty by default: other installs may run a different operator
      # release name, or none at all.
      additionalLabels: {}

  # Pull secrets applied to kora and tenant workloads. Kubernetes convention:
  # a list of {name: <secret-name>} objects.
  imagePullSecrets: []

  # IfNotPresent for released, digest-pinned images. Always for local development.
  imagePullPolicy: IfNotPresent

  # Defaults for every kora workload. Overridable per component.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""

# The external frontend host, e.g. example.com. The API host is
# api.<frontendHost> (ADR 2026-07-04). Required.
frontendHost: ""

# Trusted-host allowlist for OAuth discovery metadata (ADR 2026-07-04).
# Canonical (api.) host first. Empty disables validation.
publicHosts: []

# The white-labelling theme. Empty means the kora default.
# Slots hold https URLs the browser loads. The init container validates them but never fetches.
theme:
  # -- The full theme.yaml as one string, passed with `--set-file theme.document=theme.yaml` or Argo CD `fileParameters`. Slot URLs must be https and a font host must send Access-Control-Allow-Origin. The chart also reads productName for the backend and fails the render if it is outside the Hades product-name bounds.
  document: ""

# Postgres and Redis endpoints rendered into each service's storage config
# file, and the name of the Secret every service reads.
config:
  db:
    host: ""
    port: 5432
    name: kora
    user: kora
  redis:
    host: ""
    port: 6379
    tls:
      # -- Connect to Redis over TLS 1.2 or later. Set false for a Redis that
      # serves plaintext.
      enabled: true
      # -- Secret in the system namespace holding the CA bundle under key
      # ca.crt. Empty trusts the system roots.
      caSecret: ""
      # -- Name checked against the Redis certificate. Empty uses config.redis.host.
      serverName: ""
  # Holds DB_PASSWORD, REDIS_PASSWORD, KORA_TOKEN_SIGNING_KEY,
  # KORA_TRIGGERS_ENCRYPTION_KEY. Not created by the chart.
  platformSecretName: kora-secrets

istio:
  namespace: istio-system
  # Empty means the default revision: namespaces get istio-injection=enabled.
  # A revision name labels istio.io/rev instead.
  revision: ""
  # ALLOW_ANY or REGISTRY_ONLY. REGISTRY_ONLY needs the ServiceEntries this
  # chart renders for the external hosts it knows about (Postgres, Redis).
  outboundTrafficPolicy: ALLOW_ANY

# The SPIRE deployment kora registers into.
spire:
  # Class the spire-controller-manager serves. A mismatch means kora's
  # ClusterSPIFFEIDs are ignored.
  className: spire-system-spire

# SPIFFE-dependent resources: DestinationRule SANs, AuthorizationPolicies.
# Always on in a supported install.
platform:
  spiffe:
    enabled: true

networkPolicy:
  # Enforce default-deny network policies.
  enabled: true
  # Outside networkPolicy.enabled default-deny; a managed DB or Redis subnet.
  externalServices: []
  # Permit kube-apiserver access to the admission webhook.
  apiServerCIDRs:
    - 0.0.0.0/0

gateway:
  # Set false to use an existing Istio Gateway (see deploy/reference/values/gateway-byo.yaml).
  create: true
  name: kora-gateway
  ports:
    http: 80
    https: 443
  tls:
    # HTTPS with HTTP-to-HTTPS redirect. Needs a kubernetes.io/tls Secret named
    # credentialName, in the namespace the gateway pods run in.
    enabled: false
    credentialName: kora-gateway-tls
  # Kubernetes Ingress in front of the Istio gateway Service (Traefik, ALB).
  # TLS terminates there; API routes force x-forwarded-proto=https.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  # With gateway.create=false: where the existing gateway pods run and their
  # selector, for gateway-level OPA and the admitting network policy.
  byo:
    namespace: ""
    selector:
      app: istio-ingressgateway

# Values for the ingressGateway subchart (upstream istio/gateway) when
# gateway.create is true. The SPIRE wiring is what lets DestinationRules and
# gateway-level OPA pin the proxy by SPIFFE identity instead of an istiod cert.
ingressGateway:
  name: kora-gateway
  service:
    type: LoadBalancer
  labels:
    app: kora-gateway
    istio: kora-gateway
    # Matches the system-component registration for spiffe://<td>/system/ingress-gateway.
    spiffe.io/component: ingress-gateway
  env:
    PILOT_CERT_PROVIDER: spire
    SPIFFE_ENDPOINT_SOCKET: unix:///run/secrets/workload-spiffe-uds/socket
  volumes:
    - name: workload-socket
      csi:
        driver: csi.spiffe.io
        readOnly: true
  volumeMounts:
    - name: workload-socket
      mountPath: /run/secrets/workload-spiffe-uds
      readOnly: true
  autoscaling:
    enabled: false
  podAnnotations:
    inject.istio.io/templates: gateway
    sidecar.istio.io/inject: "true"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true

operator:
  image:
    registry: ""
    repository: kora-operator
    tag: ""
    digest: ""
    pullPolicy: ""
  # Keep two replicas so admission remains available during a pod failure.
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  leaderElection: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  # Env vars for secrets only. Settings go in configOverrides.
  extraEnv: []
  # -- Raw config merged last over the operator's rendered config file, keyed
  # by config module (docs/adr/2026-10-06-rendered-service-config-files.md).
  # Keys follow the Go config structs; an unknown key fails startup.
  # e.g. {cmd/operator: {operator: {syncPeriodSecs: 120}}}
  configOverrides: {}
  # Containers the webhook injects into every tenant pod. Images come from
  # identityProxy.image and opaGateway.image.
  injection:
    opa:
      logLevel: info
      bundlePolling:
        minDelaySeconds: 30
        maxDelaySeconds: 60
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
    # -- Resources of each sidecar on a sandbox pod, set as both requests and
    # limits so the pod reserves what it can use. An environment's size is what
    # the sandbox's own container gets, and these sit on top of it.
    sandboxSidecars:
      istioProxy:
        cpu: 200m
        memory: 128Mi
      identityProxy:
        cpu: 200m
        memory: 64Mi
      opa:
        cpu: 500m
        memory: 128Mi
  # Pod Security Admission labels set on every tenant namespace.
  tenantPodSecurity:
    enforce: restricted
    warn: restricted
    audit: restricted
  preflight:
    # Preflight fails on an istiod outside this list. Edit it by hand with the
    # Istio pin. The release copies it into compatibility.yaml.
    supportedIstioMinors: ["1.31", "1.30"]
    intervalSeconds: 300

# Identity-proxy sidecar the operator injects into tenant agent and sandbox pods.
# Platform services carry none; they fetch their own token in-process.
identityProxy:
  image:
    registry: ""
    repository: kora-identity-proxy
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

# Schema migration Job, run as a pre-install and pre-upgrade hook before any
# workload rolls (docs/adr/2026-09-10-database-migrations.md).
migrate:
  image:
    registry: ""
    repository: kora-migrate
    tag: ""
    digest: ""
    pullPolicy: ""
  # Must stay below the Helm timeout (helm's default is 300s) or Helm fails the
  # release while the Job is still applying and the next upgrade deletes it
  # mid-flight.
  activeDeadlineSeconds: 240
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  # Env vars for secrets only. Settings go in configOverrides.
  extraEnv: []
  # -- Raw config merged last over the rendered config files, keyed by config
  # module (docs/adr/2026-10-06-rendered-service-config-files.md). Keys follow
  # the Go config structs; an unknown key fails startup.
  configOverrides: {}

identity:
  image:
    registry: ""
    repository: kora-identity
    tag: ""
    digest: ""
    pullPolicy: ""
  replicas: 1
  hostAliases: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  # Env vars for secrets only. Settings go in configOverrides.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  config:
    accessTokenTtlMinutes: 15
  # Operator-owned ConfigMaps and Secrets identity reads. Mounts are optional:
  # identity starts before any tenant exists.
  tenantsConfigMap: kora-tenants
  clientSecretsSecret: kora-tenant-oidc-secrets
  oauthClientsConfigMap: kora-tenant-oauth-clients
  # -- Raw config merged last over the rendered config files, keyed by config
  # module (docs/adr/2026-10-06-rendered-service-config-files.md). Keys follow
  # the Go config structs; an unknown key fails startup.
  configOverrides: {}

inferenceGateway:
  image:
    registry: ""
    repository: kora-inference-gateway
    tag: ""
    digest: ""
    pullPolicy: ""
  # Run two or more replicas in production. With one, a rollout leaves no pod
  # to serve new requests while the old pod drains.
  replicas: 1
  # -- Seconds the gateway keeps serving in-flight streams after SIGTERM. The
  # pod's terminationGracePeriodSeconds and the Istio sidecar's
  # terminationDrainDuration are derived from it.
  shutdownTimeoutSecs: 120
  # Created only when replicas > 1, as for the OPA gateway.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  # Env vars for secrets only. Settings go in configOverrides.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    # e.g. eks.amazonaws.com/role-arn for Bedrock access via IRSA.
    annotations: {}
  catalog:
    # -- Allow virtual model writes through the API, dashboard and MCP. With
    # false, virtual models come only from VirtualModel resources.
    apiAuthoring: true
  # -- Raw config merged last over the rendered config files, keyed by config
  # module (docs/adr/2026-10-06-rendered-service-config-files.md). Keys follow
  # the Go config structs; an unknown key fails startup.
  configOverrides: {}

koraMcp:
  image:
    registry: ""
    repository: kora-mcp
    tag: ""
    digest: ""
    pullPolicy: ""
  replicas: 1
  register: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  # Env vars for secrets only. Settings go in configOverrides.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  # -- Raw config merged last over the rendered config files, keyed by config
  # module (docs/adr/2026-10-06-rendered-service-config-files.md). Keys follow
  # the Go config structs; an unknown key fails startup.
  configOverrides: {}

toolGateway:
  image:
    registry: ""
    repository: kora-tool-gateway
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  # Request-path proxy replicas. The publisher runs one.
  proxyReplicas: 1
  httpPort: 8096
  mcpServersConfigMapName: kora-mcp-servers
  # Holds MCPServer spec.auth values. The operator renders it.
  mcpServerSecretsName: kora-mcp-server-secrets
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  # Env vars for secrets only. Settings go in configOverrides.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  # -- Raw config merged last over the rendered config files, keyed by config
  # module (docs/adr/2026-10-06-rendered-service-config-files.md). Keys follow
  # the Go config structs; an unknown key fails startup.
  configOverrides: {}

frontend:
  image:
    registry: ""
    repository: kora-frontend
    tag: ""
    digest: ""
    pullPolicy: ""
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  # In-cluster URLs the BFF calls. Empty derives from the release namespace.
  config:
    koraApiUrl: ""
    koraTriggersUrl: ""
    inferenceGatewayUrl: ""
    policyGatewayUrl: ""
    policyServiceUrl: ""
    koraAgentsUrl: ""
    toolGatewayUrl: ""
    nextPublicAppUrl: ""
  # Holds BFF_SESSION_SECRET.
  existingSecret: kora-frontend-secrets
  # Kubernetes Ingress straight to the frontend Service, for an edge that is
  # not the Istio gateway.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []

agents:
  image:
    registry: ""
    repository: kora-agents
    tag: ""
    digest: ""
    pullPolicy: ""
  # -- Operator-owned tenant registry ConfigMap; the service reads each tenant's authoring switch from it.
  tenantsConfigMap: kora-tenants
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  # Env vars for secrets only. Settings go in configOverrides.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  config:
    # Images kora-agents runs in tenant namespaces. Empty means <global.imageRegistry>/kora-session-manager
    # and kora-sandbox-base at global.imageTag or the appVersion. sandboxImage is registered per tenant as kora-base.
    sessionManagerImage: ""
    # Digest of kora-session-manager, set by the release. When set, the default image is
    # <global.imageRegistry>/kora-session-manager@<digest>, so a mirror keeps the pin.
    sessionManagerDigest: ""
    sandboxImage: ""
    # Git author name inside the sandbox. Empty means kora-agent.
    sandboxGitAuthorName: ""
    sandboxGitAuthorEmail: ""
    # -- Heap cap in MB for Node processes an agent run starts on its agent pod.
    # The pod's runs share one memory limit, so a runaway Node tool fails with a
    # heap OOM instead of taking every run with it. The agent harnesses and
    # sandbox commands are not capped. 0 disables the cap.
    nodeMaxOldSpaceMB: 512
  # -- Raw config merged last over kora-agents' rendered config files, keyed by
  # config module (docs/adr/2026-10-06-rendered-service-config-files.md). Keys
  # follow the Go config structs; an unknown key fails startup.
  # e.g. {cmd/kora-agents: {drafts: {retentionDays: 7}}}
  configOverrides: {}
  # -- Seconds a sandbox container (sandbox-exec, identity-proxy, opa) may take to
  # start before its startup probe restarts it. A ceiling for a stuck container,
  # well above a normal start. Probes check every second, so a healthy start is not delayed.
  sandboxStartupSeconds: 120
  # Sandbox provisioning guardrails, applied to every run
  # (docs/adr/2026-09-29-agent-run-guardrails.md). After the last attempt the
  # run records sandbox_lost until the user replies. Loop-guard thresholds are
  # set per agent type, not here.
  guardrails:
    # -- Re-provisioning attempts when a run's sandbox dies.
    sandboxProvisionAttempts: 3
    # -- Seconds before the second attempt; doubles for each attempt after.
    sandboxProvisionBackoffSecs: 5
    # -- Seconds across all attempts. At most 600, so the agent's tools still hear the outcome.
    sandboxProvisionBudgetSecs: 600
  # How long a run may sit idle after the agent's last turn before its session
  # closes and the run completes. The run's origin picks the value; a person
  # who messages a trigger run moves it to the manual one.
  idleTimeout:
    # -- Seconds a run a person started (dashboard or API) may stay idle.
    manualSecs: 1200
    # -- Seconds a run a trigger started may stay idle. Shorter, because nobody is watching it.
    triggerSecs: 300
  # The run scheduler in each kora-agents replica starts pending runs on agent pods.
  scheduling:
    # -- Runs one kora-agents replica starts at once.
    workerConcurrency: 16
    # -- Seconds between polls for pending runs, and before a run with no free pod is tried again.
    pollIntervalSecs: 1
    # -- Seconds a run may stay pending before it fails.
    startBudgetSecs: 180
    # -- Seconds a run may wait for its agent to finish provisioning before it fails.
    provisionBudgetSecs: 600
    # -- Session-manager pods each agent runs at least. A roll replaces one while the other takes new runs.
    minReplicas: 2
    # -- Seconds a terminating session-manager pod waits for its runs to end before it is stopped.
    drainGracePeriodSecs: 3600
  # Per-agent AuthorizationPolicy restricting the session-manager port to the
  # kora-agents principal. kora-agents creates one alongside each StatefulSet.
  authorizationPolicy:
    enabled: true
  tenantConnectionsConfigMapName: kora-tenant-connections
  # Kustomize patches applied to the resources kora-agents provisions in
  # tenant namespaces: StatefulSet, PersistentVolumeClaim (the StatefulSet's
  # workspace template), Service, ServiceAccount, HorizontalPodAutoscaler,
  # PodDisruptionBudget and the sandbox Pod. Each value is one kustomize
  # `patches:` entry and needs target.kind; keys sort into apply order.
  # Patches that change a resource's identity, security context or the
  # sandbox workspace mount are rejected at startup.
  #
  # Example, pinning agent pods to a node pool:
  #   manifestPatches:
  #     50-nodeselector:
  #       target:
  #         kind: StatefulSet
  #       patch: |
  #         apiVersion: apps/v1
  #         kind: StatefulSet
  #         metadata:
  #           name: any
  #         spec:
  #           template:
  #             spec:
  #               nodeSelector:
  #                 disktype: ssd
  manifestPatches: {}
  # Customisation for the workloads kora-agents provisions in tenant
  # namespaces. Applied before manifestPatches, so a patch still wins on a
  # field both set. See docs/adr/2026-09-16-first-class-workload-placement.md.
  #
  # Identity labels (spiffe.io/agent, runkora.io/tenant, runkora.io/agent-type,
  # runkora.io/role and the rest), the mesh annotations, security context and
  # service account name stay platform-owned: podLabels or podAnnotations that
  # collide with them fail kora-agents at startup.
  workloads:
    # Applied to the session-manager pods and sandbox pods alike.
    common:
      podLabels: {}
      podAnnotations: {}
    # Session-manager pods multiplex an agent's sessions and are long-lived.
    sessionManager:
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []
      priorityClassName: ""
      podLabels: {}
      podAnnotations: {}
      serviceAccount:
        # Cloud identity for the agent (eks.amazonaws.com/role-arn,
        # iam.gke.io/gcp-service-account). Sandbox pods run under the tenant's
        # default ServiceAccount and never receive these.
        annotations: {}
    # Sandbox pods are per-run, bursty, and execute the agent's own code. Giving
    # them their own pool keeps a heavy sandbox off the nodes serving live
    # sessions. A sandbox mounts its session-manager's workspace, so placing
    # them apart requires a ReadWriteMany workspace below.
    sandbox:
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []
      priorityClassName: ""
      podLabels: {}
      podAnnotations: {}
  # The agent workspace volume, mounted by the session-manager and by every
  # sandbox of that agent's runs. Empty keeps the cluster's default
  # StorageClass. A StatefulSet's volumeClaimTemplates are immutable and its
  # claims outlive it, so changing these affects agents created afterwards.
  workspace:
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  # Default and maximum environment sizes in Kubernetes quantities.
  # disk sizes the sandbox's local volume for its HOME, TMPDIR, caches, tool
  # installs and, with sandboxMount.enabled, its working folder.
  environments:
    # -- Size for an environment that sets none, and for the built-in default.
    defaultSize:
      cpu: "2"
      memory: 4Gi
      disk: 10Gi
    # -- Largest size an environment may request. An unset field takes the
    # value of `defaultSize`. Raise it to what a sandbox node holds: see
    # docs/guides/sandbox-nodes.md.
    maxSize: {}
  # Sandbox image settings (docs/adr/2026-10-03-sandbox-environments.md). Platform teams
  # register their own images as SandboxImage resources in tenant namespaces.
  sandboxImages:
    # -- Keep kora-base pulled on the nodes that run sandboxes. A SandboxImage
    # sets its own with spec.warm. Each warm image runs one DaemonSet per tenant.
    warmBase: false
    # Sandbox images kora ships and registers in every tenant namespace as
    # kora-go, kora-python and kora-node (docs/adr/2026-10-07-bundled-sandbox-images.md).
    # Disabling one removes its SandboxImage from every tenant. An empty image means
    # <global.imageRegistry>/kora-sandbox-<key> at global.imageTag or the appVersion.
    bundled:
      go:
        # -- Register kora-go: the base image plus golangci-lint, buf and protoc.
        enabled: true
        # -- Keep kora-go pulled on the nodes that run sandboxes.
        warm: false
        # -- Image reference for kora-go. Empty uses the release image.
        image: ""
      python:
        # -- Register kora-python: the base image plus ruff and pytest.
        enabled: true
        # -- Keep kora-python pulled on the nodes that run sandboxes.
        warm: false
        # -- Image reference for kora-python. Empty uses the release image.
        image: ""
      node:
        # -- Register kora-node: the base image plus Node LTS and pnpm.
        enabled: true
        # -- Keep kora-node pulled on the nodes that run sandboxes.
        warm: false
        # -- Image reference for kora-node. Empty uses the release image.
        image: ""
    # -- Registry ports other than 443 the operator may dial to validate images.
    registryPorts: []
    # -- Registry hosts the operator reads through another host. Keys are the
    # host in image references. A value given as http://host is read over plain
    # HTTP. Use http:// for a local registry only.
    registryMirrors: {}
  # Warm-start spares a run the node boot and the sandbox image pull. Placement follows
  # agents.workloads.sandbox, the keys below override it, and image warmers use it too.
  sandboxWarming:
    # -- Warm-start strategy. `none` accepts cold starts. `capacity` runs a
    # low-priority placeholder that holds a node open with the base image cached.
    # Use `capacity` for a pool that scales to zero.
    mode: none
    # -- `capacity` mode. Nodes held warm. Above one, placeholders repel each
    # other by hostname so they land on separate nodes; set `affinity` with your
    # own podAntiAffinity to replace that.
    replicas: 1
    # -- The placeholder's PriorityClass value. Stays below real pods at 0, or it
    # competes with the sandbox it exists for instead of yielding to it.
    priority: -10
    # -- Capacity each placeholder reserves, and the size a node is fitted to.
    # Empty reserves one default sandbox pod: `agents.environments.defaultSize`,
    # 1Gi of scratch disk and `operator.injection.sandboxSidecars`. A value here
    # replaces that and must cover a sandbox pod's total requests.
    resources: {}
    # -- Applied to the `capacity` placeholder. kora's own selector labels win on
    # a collision.
    podLabels: {}
    # -- Applied to the `capacity` placeholder. It already carries the Karpenter
    # and Cluster Autoscaler annotations that keep a held node from being scaled
    # away. Set them here to override.
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []

# Node agent that gives each sandbox a working folder on its own local disk,
# mounted into its session-manager pod at /workspaces/<run>/sandbox
# (docs/adr/2026-10-08-sandbox-workspace-mount.md). The agent runs privileged in
# the host network on every node. It exports the folder with the kernel NFS
# server on the sandbox's node and mounts it on the session-manager's node.
# Nodes need the kernel nfsd and NFSv4 client modules, and session-manager nodes
# must reach sandbox nodes on sandboxMount.port.
sandboxMount:
  # -- Run the node agent and give every new sandbox a local working folder.
  enabled: false
  # -- Namespace of the node agent. The system namespace's Pod Security level
  # rejects privileged pods.
  namespace: kora-sandbox-mount
  # -- Create the namespace at the privileged Pod Security level. Set false to
  # use a namespace you manage.
  createNamespace: true
  # -- The kubelet's root directory on the nodes.
  kubeletDir: /var/lib/kubelet
  # -- TCP port nfsd listens on, on every node. NFSv4 only, with no rpcbind or mountd port.
  port: 20490
  image:
    registry: ""
    repository: kora-sandbox-mount
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
  # -- Added to the tolerations of agents.workloads.sandbox and
  # agents.workloads.sessionManager, which the agent always carries.
  tolerations: []
  # -- The agent must run on every node that hosts sandboxes or session-manager
  # pods, so global.nodeSelector and global.affinity do not apply to it.
  nodeSelector: {}
  affinity: {}
  # -- Falls back to global.priorityClassName.
  priorityClassName: ""
  # -- Raw config merged last over the agent's rendered config file, keyed by
  # config module. Keys follow the Go config struct; an unknown key fails startup.
  # e.g. {cmd/sandbox-mount: {node: {resyncSecs: 60}}}
  configOverrides: {}

