apiVersion: v1
kind: Service
metadata:
  name: orbit-policy-service
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.policyService.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "orbit.policyService.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 8083
      protocol: TCP
    {{- if .Values.global.metrics.enabled }}
    - name: http-metrics
      port: {{ .Values.global.metrics.port | default 9464 }}
      targetPort: http-metrics
      protocol: TCP
    {{- end }}
