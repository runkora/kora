apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-inference-gateway
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.inferenceGateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.inferenceGateway.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.inferenceGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.inferenceGateway.selectorLabels" . | nindent 8 }}
        {{- include "orbit.inferenceGateway.labels" . | nindent 8 }}
        spiffe.io/component: inference-gateway
        orbit.io/identity-proxy: "enabled"
        {{- include "orbit.podLabels" (dict "root" $ "name" "inferenceGateway") | nindent 8 }}
      annotations:
        {{- include "orbit.spireProxyAnnotations" (dict "root" $ "identityProxy" true) | nindent 8 }}
        # Postgres is external to the mesh; bypass Envoy interception.
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
        {{- include "orbit.podAnnotations" (dict "root" $ "name" "inferenceGateway") | nindent 8 }}
    spec:
      serviceAccountName: orbit-inference-gateway
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.scheduling" (dict "root" $ "name" "inferenceGateway") | nindent 6 }}
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "orbit.spireVolumes" (dict "identityProxy" true) | nindent 8 }}
        {{- include "orbit.extraVolumes" (dict "root" $ "name" "inferenceGateway") | nindent 8 }}
      containers:
        - name: orbit-inference-gateway
          image: {{ include "orbit.image" (dict "root" $ "name" "inferenceGateway") | quote }}
          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "inferenceGateway") }}
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            - name: ORBIT_POSTGRES_SSL_MODE
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "inferenceGateway" "field" "postgresSSLMode" "default" .Values.global.postgres.sslMode) | quote }}
            - name: ORBIT_POSTGRES_CAPTURE_QUERY_TEXT
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "inferenceGateway" "field" "postgresCaptureQueryText" "default" .Values.global.postgres.captureQueryText) | quote }}
            - name: ORBIT_OTLP_INSECURE
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "inferenceGateway" "field" "otlpInsecure" "default" .Values.global.observability.otlpInsecure) | quote }}
            - name: ORBIT_LOG_FORMAT
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "inferenceGateway" "field" "logFormat" "default" .Values.global.logFormat) | quote }}
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix:///run/secrets/workload-spiffe-uds/socket"
            {{- /* Each Bedrock account registers provider "bedrock:<alias>"; credentials come from the pod's cloud identity. */}}
            {{- with .Values.inferenceGateway.bedrock.accounts }}
            {{- $aliases := list }}
            {{- range . }}{{ $aliases = append $aliases (required "inferenceGateway.bedrock.accounts[].alias must be set" .alias) }}{{ end }}
            - name: BEDROCK_ACCOUNTS
              value: {{ join "," $aliases | quote }}
            {{- range . }}
            - name: BEDROCK_{{ .alias | upper }}_REGION
              value: {{ required (printf "inferenceGateway.bedrock.accounts[%s].region must be set" .alias) .region | quote }}
            {{- end }}
            {{- end }}
            {{- include "orbit.extraEnv" (dict "root" $ "name" "inferenceGateway") | nindent 12 }}
          {{- include "orbit.platformEnvFrom" $ | nindent 10 }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.inferenceGateway.resources | nindent 12 }}
          volumeMounts:
            {{- include "orbit.spireVolumeMount" . | nindent 12 }}
            {{- include "orbit.extraVolumeMounts" (dict "root" $ "name" "inferenceGateway") | nindent 12 }}
        {{- include "orbit.identityProxyContainer" (dict "root" $) | nindent 8 }}
