apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-identity
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.identity.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.identity.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.identity.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.identity.selectorLabels" . | nindent 8 }}
        {{- include "orbit.identity.labels" . | nindent 8 }}
        spiffe.io/component: identity
        {{- include "orbit.podLabels" (dict "root" $ "name" "identity") | nindent 8 }}
      annotations:
        {{- include "orbit.spireProxyAnnotations" (dict "root" $) | nindent 8 }}
        # Postgres, Redis and the OIDC issuer are outside the mesh.
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379,5556"
        {{- include "orbit.podAnnotations" (dict "root" $ "name" "identity") | nindent 8 }}
    spec:
      {{- with .Values.identity.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: orbit-identity
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.scheduling" (dict "root" $ "name" "identity") | nindent 6 }}
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "orbit.spireVolumes" . | nindent 8 }}
        # Operator-owned tenant registries. All optional so identity starts before
        # any tenant exists; identity watches the files and reloads on change.
        - name: tenants-config
          configMap:
            name: {{ .Values.identity.tenantsConfigMap }}
            optional: true
        - name: tenant-client-secrets
          secret:
            secretName: {{ .Values.identity.clientSecretsSecret }}
            optional: true
        - name: oauth-clients
          configMap:
            name: {{ .Values.identity.oauthClientsConfigMap }}
            optional: true
        {{- include "orbit.extraVolumes" (dict "root" $ "name" "identity") | nindent 8 }}
      containers:
        - name: orbit-identity
          image: {{ include "orbit.image" (dict "root" $ "name" "identity") | quote }}
          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "identity") }}
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            - name: ORBIT_POSTGRES_SSL_MODE
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "identity" "field" "postgresSSLMode" "default" .Values.global.postgres.sslMode) | quote }}
            - name: ORBIT_POSTGRES_CAPTURE_QUERY_TEXT
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "identity" "field" "postgresCaptureQueryText" "default" .Values.global.postgres.captureQueryText) | quote }}
            - name: ORBIT_OTLP_ENDPOINT
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "identity" "field" "otlpEndpoint" "default" .Values.global.observability.otlpEndpoint) | quote }}
            - name: ORBIT_SAMPLING_RATE
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "identity" "field" "samplingRate" "default" .Values.global.observability.samplingRate) | quote }}
            - name: ORBIT_LOG_FORMAT
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "identity" "field" "logFormat" "default" .Values.global.logFormat) | quote }}
            - name: ORBIT_REDIS_TLS_ENABLED
              value: {{ .Values.identity.config.redisTLSEnabled | quote }}
            - name: ORBIT_ACCESS_TOKEN_TTL_MINUTES
              value: {{ .Values.identity.config.accessTokenTtlMinutes | quote }}
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix:///run/secrets/workload-spiffe-uds/socket"
            - name: ORBIT_TENANTS_CONFIG
              value: "/etc/orbit/tenants.yaml"
            - name: ORBIT_TENANT_SECRETS_CONFIG
              value: "/etc/orbit/tenant-secrets/client-secrets.yaml"
            - name: ORBIT_OAUTH_CLIENTS_CONFIG
              value: "/etc/orbit/oauth-clients/oauth-clients.json"
            {{- $publicHosts := include "orbit.publicHosts" . }}
            {{- if $publicHosts }}
            - name: ORBIT_PUBLIC_HOSTS
              value: {{ $publicHosts | quote }}
            {{- end }}
            {{- include "orbit.extraEnv" (dict "root" $ "name" "identity") | nindent 12 }}
          {{- include "orbit.platformEnvFrom" $ | nindent 10 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.identity.resources | nindent 12 }}
          volumeMounts:
            {{- include "orbit.spireVolumeMount" . | nindent 12 }}
            - name: tenants-config
              mountPath: /etc/orbit
              readOnly: true
            - name: tenant-client-secrets
              mountPath: /etc/orbit/tenant-secrets
              readOnly: true
            - name: oauth-clients
              mountPath: /etc/orbit/oauth-clients
              readOnly: true
            {{- include "orbit.extraVolumeMounts" (dict "root" $ "name" "identity") | nindent 12 }}
