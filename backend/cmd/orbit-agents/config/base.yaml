app:
  version: "0.1.0"

server:
  port: 8080
  basePath: ""
  shutdownTimeoutSecs: 30

observability:
  serviceName: orbit-agents

kubernetes:
  inCluster: true
  tenantNamespacePrefix: orbit-tenant-
  systemNamespace: orbit-system

platform:
  trustDomain: "orbit.test"
  identityServiceURL: "http://orbit-identity.orbit-system.svc"
  policyServiceURL: "http://orbit-policy-service.orbit-system.svc"

policy:
  bundleEndpoint: "http://orbit-policy-service.orbit-system.svc/api/v1/policy/bundles"
  # Shorter than the platform default (30s): triggers.createScheduledTrigger /
  # createManualTrigger mint a brand-new SERVICE principal and its grant, then
  # immediately resolve the agent type through this bundle in the same
  # request. A 30s poll window made that resolution fail every time; 3s bounds
  # the wait to something a synchronous admin request can retry through (see
  # resolveAgentType's bounded retry in internal/triggers/service.go).
  bundlePollIntervalSecs: 3

# Agent type draft reaper: sweep hourly, delete drafts untouched for 30 days.
drafts:
  reaperIntervalSecs: 3600
  retentionDays: 30

agents:
  sessionManagerImage: orbit-registry:5001/orbit-session-manager:latest
  sandboxImage: orbit-registry:5001/orbit-sandbox-exec:latest
  sandboxGRPCPort: 50051
  maxConcurrentRunsPerPod: 10
  connectionRegistryPath: "/var/run/orbit/connections/connections.json"
  sessionManager:
    postgresSSLMode: require
    # Restricts each agent pod's session-manager port to the orbit-agents
    # SPIFFE principal at the mesh layer. Overridden per-deployment by
    # ORBIT_SESSION_MANAGER_AUTHORIZATION_POLICY_ENABLED; requires SPIFFE.
    authorizationPolicyEnabled: true
