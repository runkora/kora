---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: koratenants.runkora.io
spec:
  group: runkora.io
  names:
    kind: KoraTenant
    listKind: KoraTenantList
    plural: koratenants
    shortNames:
    - kt
    singular: koratenant
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .spec.oidc.issuerURL
      name: OIDC
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KoraTenant declares a tenant's existence, OIDC configuration, and namespace.
          The CR name (metadata.name) is the tenant ID, so no separate tenantId field
          exists. The operator creates the tenant namespace, auto-derived as
          "kora-tenant-{name}" when spec.namespace is omitted, and registers the tenant
          in the kora-tenants ConfigMap consumed by the identity service. All tenant
          configuration lives in this single CR.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KoraTenantSpec defines the desired state of a tenant.
            properties:
              active:
                default: true
                description: |-
                  Active controls whether the tenant is active. When false, the operator
                  sets state:suspended in the registry without deleting cluster resources.
                type: boolean
              apiAuthoring:
                default: Enabled
                description: |-
                  APIAuthoring is Enabled or Disabled. Disabled makes the tenant's
                  agents, environments, triggers, trigger sources and roles read-only
                  through the API. See docs/adr/2026-10-24-declarative-resources.md.
                enum:
                - Enabled
                - Disabled
                type: string
              budget:
                description: Budget is the tenant's spending limit. It replaces a
                  budget set through the API.
                properties:
                  limitUSD:
                    exclusiveMinimum: true
                    minimum: 0
                    type: number
                  resetCadence:
                    default: monthly
                    enum:
                    - weekly
                    - monthly
                    type: string
                required:
                - limitUSD
                type: object
              displayName:
                description: |-
                  DisplayName is the human-readable tenant name surfaced in the identity
                  service tenant registry.
                minLength: 1
                type: string
              namespace:
                description: |-
                  Namespace selects the tenant workload namespace, defaulting to
                  kora-tenant-<name>. The operator labels it but never deletes it.
                maxLength: 63
                minLength: 1
                type: string
              oidc:
                description: OIDC configures the identity provider for this tenant.
                properties:
                  clientID:
                    description: ClientID is the OIDC client ID registered with the
                      identity provider.
                    type: string
                  clientSecretRef:
                    description: ClientSecretRef references the OIDC client-secret
                      Secret. Omit it for public clients.
                    properties:
                      name:
                        description: Name is the Secret name.
                        type: string
                      namespace:
                        description: Namespace defaults to the system namespace if
                          omitted.
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  emailDomains:
                    description: |-
                      EmailDomains lists the email address domains routed to this tenant by the
                      Home Realm Discovery endpoint (e.g. ["acme.com", "acme.io"]).
                      See docs/adr/2026-04-01-home-realm-discovery-and-email-based-tenant-routing.md
                    items:
                      type: string
                    type: array
                  issuerURL:
                    description: IssuerURL is the OIDC issuer URL.
                    type: string
                  scopes:
                    default:
                    - openid
                    - profile
                    - email
                    description: Scopes are the OAuth2 scopes to request. Defaults
                      to [openid, profile, email].
                    items:
                      type: string
                    type: array
                required:
                - clientID
                - issuerURL
                type: object
            required:
            - displayName
            - oidc
            type: object
          status:
            description: KoraTenantStatus records observed tenant state.
            properties:
              conditions:
                description: Conditions lists detailed status conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastReconciledAt:
                description: LastReconciledAt is the timestamp of the last successful
                  reconciliation.
                format: date-time
                type: string
              namespace:
                description: Namespace is the provisioned tenant namespace name.
                type: string
              phase:
                description: Phase summarizes tenant lifecycle state.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: spec.namespace is immutable. Recreate the KoraTenant to use another
            namespace.
          rule: 'has(oldSelf.spec.__namespace__) ? (has(self.spec.__namespace__) &&
            self.spec.__namespace__ == oldSelf.spec.__namespace__) : (!has(self.spec.__namespace__)
            || self.spec.__namespace__ == ''kora-tenant-'' + self.metadata.name)'
    served: true
    storage: true
    subresources:
      status: {}
