apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-triggers
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.triggers.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.triggers.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.triggers.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.triggers.selectorLabels" . | nindent 8 }}
        {{- include "orbit.triggers.labels" . | nindent 8 }}
        spiffe.io/component: orbit-triggers
        {{- include "orbit.podLabels" (dict "root" $ "name" "triggers") | nindent 8 }}
      annotations:
        {{- include "orbit.spireProxyAnnotations" (dict "root" $) | nindent 8 }}
        # Postgres is external to the mesh; bypass Envoy interception.
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
        checksum/config: {{ include (print $.Template.BasePath "/triggers/config.yaml") . | sha256sum }}
        prometheus.io/scrape: "{{ $.Values.global.metrics.enabled }}"
        prometheus.io/port: "{{ .Values.global.metrics.port | default 9464 }}"
        prometheus.io/path: "/metrics"
        {{- include "orbit.podAnnotations" (dict "root" $ "name" "triggers") | nindent 8 }}
    spec:
      serviceAccountName: orbit-triggers
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.scheduling" (dict "root" $ "name" "triggers") | nindent 6 }}
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "orbit.spireVolumes" . | nindent 8 }}
        {{- include "orbit.configVolume" (dict "root" $ "name" "triggers" "configMap" "orbit-triggers-config" "modules" (include "orbit.triggers.configModules" . | fromYaml)) | nindent 8 }}
        {{- include "orbit.redisCAVolume" . | nindent 8 }}
        {{- include "orbit.extraVolumes" (dict "root" $ "name" "triggers") | nindent 8 }}
      containers:
        - name: orbit-triggers
          image: {{ include "orbit.image" (dict "root" $ "name" "triggers") | quote }}
          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "triggers") }}
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            {{- include "orbit.platformEnv" (dict "root" $ "name" "triggers" "keys" (list "DB_PASSWORD" "REDIS_PASSWORD" "ORBIT_TRIGGERS_ENCRYPTION_KEY")) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8097
              protocol: TCP
            {{- if .Values.global.metrics.enabled }}
            - name: http-metrics
              containerPort: {{ .Values.global.metrics.port | default 9464 }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8097
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8097
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.triggers.resources | nindent 12 }}
          volumeMounts:
            {{- include "orbit.spireVolumeMount" . | nindent 12 }}
            {{- include "orbit.configVolumeMount" . | nindent 12 }}
            {{- include "orbit.redisCAVolumeMount" . | nindent 12 }}
            {{- include "orbit.extraVolumeMounts" (dict "root" $ "name" "triggers") | nindent 12 }}
