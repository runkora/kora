{{- /* Node agent for sandbox working folders (docs/adr/2026-10-08-sandbox-workspace-mount.md). */}}
{{- define "kora.sandboxMount.configModules" -}}
cmd/sandbox-mount:
  node:
    hostKubeletDir: {{ .Values.sandboxMount.kubeletDir | toJson }}
  server:
    port: {{ .Values.sandboxMount.port | int }}
{{- end }}
{{- if .Values.sandboxMount.enabled }}
{{- $m := .Values.sandboxMount }}
{{- if or (lt (int $m.port) 1) (gt (int $m.port) 65535) }}
  {{- fail "sandboxMount.port must be a TCP port" }}
{{- end }}
{{- $config := dict "root" $ "name" "sandboxMount" "configMap" "kora-sandbox-mount-config" "modules" (include "kora.sandboxMount.configModules" . | fromYaml) }}
{{- if $m.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $m.namespace }}
  labels:
    {{- include "kora.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kora-sandbox-mount
  namespace: {{ $m.namespace }}
  labels:
    {{- include "kora.sandboxMount.labels" . | nindent 4 }}
---
# The node agent only reads pods. It needs every namespace and node: a sandbox
# and its session-manager pod run on different nodes, and each node agent acts
# on whichever side it hosts.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kora-sandbox-mount
  labels:
    {{- include "kora.sandboxMount.labels" . | nindent 4 }}
rules:
  # The agent's two informers list and watch sandbox and session-manager pods.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kora-sandbox-mount
  labels:
    {{- include "kora.sandboxMount.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kora-sandbox-mount
subjects:
  - kind: ServiceAccount
    name: kora-sandbox-mount
    namespace: {{ $m.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kora-sandbox-mount-config
  namespace: {{ $m.namespace }}
  labels:
    {{- include "kora.sandboxMount.labels" . | nindent 4 }}
data:
  {{- range $module, $content := include "kora.configModules" $config | fromYaml }}
  {{ $module | replace "/" "." }}.yaml: |
    {{- toYaml $content | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kora-sandbox-mount
  namespace: {{ $m.namespace }}
  labels:
    {{- include "kora.sandboxMount.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kora.sandboxMount.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kora.sandboxMount.labels" . | nindent 8 }}
        {{- include "kora.sandboxMount.selectorLabels" . | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "false"
        # Restarts the agent when its config changes.
        checksum/config: {{ include "kora.configModules" $config | sha256sum }}
    spec:
      serviceAccountName: kora-sandbox-mount
      {{- include "kora.imagePullSecrets" . | nindent 6 }}
      # nfsd serves, and the NFS client connects, from the node's own address.
      hostNetwork: true
      # The agent joins the node's mount namespace through PID 1 to release mount copies under dying pods.
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with ($m.priorityClassName | default .Values.global.priorityClassName) }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $m.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $m.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with concat $m.tolerations .Values.agents.workloads.sandbox.tolerations .Values.agents.workloads.sessionManager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sandbox-mount
          image: {{ include "kora.imageRef" (dict "root" $ "image" $m.image) | quote }}
          imagePullPolicy: {{ include "kora.imagePullPolicy" (dict "root" $ "name" "sandboxMount") }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Mounting filesystems and starting the kernel NFS server need full privileges on the node.
          securityContext:
            privileged: true
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          volumeMounts:
            # Bidirectional: mounts the agent makes here reach the host, and from there the session-manager pods.
            - name: kubelet
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            {{- include "kora.configVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "kora.configVolume" $config | nindent 8 }}
        - name: kubelet
          hostPath:
            path: {{ $m.kubeletDir }}
            type: Directory
{{- end }}
