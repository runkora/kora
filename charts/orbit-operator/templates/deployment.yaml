apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-operator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orbit-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "orbit-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit-operator.labels" . | nindent 8 }}
      annotations:
        # The operator installs Istio — it cannot depend on Istio being present.
        # This annotation must never be removed.
        sidecar.istio.io/inject: "false"
        {{- range $k, $v := .Values.podAnnotations }}
        {{- if ne $k "sidecar.istio.io/inject" }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "orbit-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ include "orbit-operator.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            # Helm SDK needs a writable home for its repo/cache files.
            # The container runs as non-root (65532) and cannot write to /.
            - name: HOME
              value: /tmp
            # Leader election is the only in-cluster tunable that differs between
            # dev and production. Driven by the chart value so operators running
            # in Kind/minikube can set leaderElection: false without APP_ENV.
            - name: ORBIT_LEADER_ELECTION
              value: {{ .Values.leaderElection | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            # Dev environments resolve their symbolic spec.ref "main" to
            # whatever tag THIS operator itself is running at, rather than a
            # separately published or floating tag — so a dev environment
            # always matches the currently deployed Orbit version exactly.
            # Same helper as this container's own image line above, so it
            # can never drift out of sync with it.
            - name: ORBIT_DEVENV_SELF_IMAGE_TAG
              value: {{ include "orbit-operator.imageTag" . | quote }}
            {{- if .Values.opa }}
            {{- if .Values.opa.image }}
            - name: ORBIT_OPA_IMAGE
              value: {{ .Values.opa.image | quote }}
            {{- end }}
            {{- if .Values.opa.logLevel }}
            - name: ORBIT_OPA_LOG_LEVEL
              value: {{ .Values.opa.logLevel | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.devEnv }}
            {{- if .Values.devEnv.ingressDomain }}
            - name: ORBIT_DEVENV_INGRESS_DOMAIN
              value: {{ .Values.devEnv.ingressDomain | quote }}
            {{- end }}
            {{- if .Values.devEnv.appExternalURL }}
            - name: ORBIT_DEVENV_APP_EXTERNAL_URL
              value: {{ .Values.devEnv.appExternalURL | quote }}
            {{- end }}
            {{- if .Values.devEnv.imageRegistry }}
            - name: ORBIT_DEVENV_IMAGE_REGISTRY
              value: {{ .Values.devEnv.imageRegistry | quote }}
            {{- end }}
            {{- if .Values.devEnv.vclusterVersion }}
            - name: ORBIT_DEVENV_VCLUSTER_VERSION
              value: {{ .Values.devEnv.vclusterVersion | quote }}
            {{- end }}
            {{- if .Values.devEnv.quota }}
            {{- if .Values.devEnv.quota.cpuRequests }}
            - name: ORBIT_DEVENV_QUOTA_CPU_REQUESTS
              value: {{ .Values.devEnv.quota.cpuRequests | quote }}
            {{- end }}
            {{- if .Values.devEnv.quota.memoryRequests }}
            - name: ORBIT_DEVENV_QUOTA_MEMORY_REQUESTS
              value: {{ .Values.devEnv.quota.memoryRequests | quote }}
            {{- end }}
            {{- if .Values.devEnv.quota.cpuLimits }}
            - name: ORBIT_DEVENV_QUOTA_CPU_LIMITS
              value: {{ .Values.devEnv.quota.cpuLimits | quote }}
            {{- end }}
            {{- if .Values.devEnv.quota.memoryLimits }}
            - name: ORBIT_DEVENV_QUOTA_MEMORY_LIMITS
              value: {{ .Values.devEnv.quota.memoryLimits | quote }}
            {{- end }}
            {{- if .Values.devEnv.quota.maxPods }}
            - name: ORBIT_DEVENV_QUOTA_MAX_PODS
              value: {{ .Values.devEnv.quota.maxPods | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.devEnv.limitRange }}
            {{- if .Values.devEnv.limitRange.defaultCPURequest }}
            - name: ORBIT_DEVENV_LIMITRANGE_DEFAULT_CPU_REQUEST
              value: {{ .Values.devEnv.limitRange.defaultCPURequest | quote }}
            {{- end }}
            {{- if .Values.devEnv.limitRange.defaultMemoryRequest }}
            - name: ORBIT_DEVENV_LIMITRANGE_DEFAULT_MEMORY_REQUEST
              value: {{ .Values.devEnv.limitRange.defaultMemoryRequest | quote }}
            {{- end }}
            {{- if .Values.devEnv.limitRange.defaultCPULimit }}
            - name: ORBIT_DEVENV_LIMITRANGE_DEFAULT_CPU_LIMIT
              value: {{ .Values.devEnv.limitRange.defaultCPULimit | quote }}
            {{- end }}
            {{- if .Values.devEnv.limitRange.defaultMemoryLimit }}
            - name: ORBIT_DEVENV_LIMITRANGE_DEFAULT_MEMORY_LIMIT
              value: {{ .Values.devEnv.limitRange.defaultMemoryLimit | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.devEnv.nodeSelector }}
            - name: ORBIT_DEVENV_NODE_SELECTOR
              value: {{ .Values.devEnv.nodeSelector | toJson | quote }}
            {{- end }}
            {{- if .Values.devEnv.tolerations }}
            - name: ORBIT_DEVENV_TOLERATIONS
              value: {{ .Values.devEnv.tolerations | toJson | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: webhook
              containerPort: 9443
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: webhook-tls
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: webhook-tls
          secret:
            secretName: orbit-operator-webhook-tls
      terminationGracePeriodSeconds: 60
