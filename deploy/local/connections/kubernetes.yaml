# The local k3d cluster as a Kubernetes connection for the example tenant.
#
# scripts/cluster/register-k8s-connection.sh generates this resource with the
# live cluster CA and applies it, along with the ServiceAccount and token it
# needs. This file is the shape that script produces; the certificate is
# cluster specific, so the committed copy carries a placeholder.
#
# baseHost is the k3d server's own hostname, which CoreDNS resolves from its
# NodeHosts entries and which is on the API server certificate. It is
# deliberately not kubernetes.default.svc.cluster.local: that is a mesh
# service, so a sandbox's sidecar routes it inside the mesh and the traffic
# never reaches the egress chokepoint. A bare IP is rejected as well, since TLS
# to an IP literal carries no SNI for the interceptor to match.
#
# The API server listens on 6443, and the gateway may only dial 443 by default.
# egressGateway.upstreamPorts in deploy/reference/values/kora.local.yaml opens
# it.
apiVersion: runkora.io/v1alpha1
kind: Connection
metadata:
  name: orbit-local
  namespace: kora-tenant-example
spec:
  adapter: kubernetes
  baseHost: k3d-orbit-local-server-0:6443
  secretRef: kora-local-token
  secretKey: token
  caCert: |
    -----BEGIN CERTIFICATE-----
    <replace with the target cluster CA certificate PEM>
    -----END CERTIFICATE-----
