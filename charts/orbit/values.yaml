# =============================================================================
# orbit chart — default values
# =============================================================================
#
# These are the production-safe defaults. Override per-environment via a
# values file passed with -f, or with --set for individual fields.
#
# When deployed via the orbit-operator, the following values are computed
# automatically from the OrbitPlatform CR and active OrbitTenant CRs —
# you do NOT need to set them in a values file:
#
#   global.trustDomain
#   identity.existingSecret              (from spec.secrets.platformSecretRef)
#   identity.existingConfigMap           (always "orbit-config")
#   identity.existingTenantsConfigMap    (always "orbit-tenants")
#   identity.existingClientSecretsSecret (always "orbit-tenant-oidc-secrets")
#   platform.namespaces.tenants          (derived from active OrbitTenant CRs)
#   platform.spiffe.enabled              (from spec.spire.enabled)
#
# These defaults match the operator's naming conventions so the chart works
# correctly both when the operator manages it and when deployed standalone.
#
# Local dev example:
#   helm upgrade --install orbit ./charts/orbit \
#     -f deploy/local/orbit-values.yaml -n orbit-system
# =============================================================================

# -- Global values shared across all templates.
global:
  # Trust domain for SPIFFE SVIDs and Istio mTLS.
  # Must match global.trustDomain set in the orbit-platform chart.
  trustDomain: "cluster.local"

  # Image pull policy applied to all Orbit service containers.
  # Use IfNotPresent for production and staging; Always for local dev registries.
  imagePullPolicy: IfNotPresent

# -- Identity service configuration.
identity:
  # Container image for the orbit-identity service.
  image:
    repository: "ghcr.io/orbit-sh/orbit-identity"
    tag: ""  # Defaults to .Chart.AppVersion when empty.
    pullPolicy: ""  # Inherits global.imagePullPolicy when empty.

  # Number of identity service replicas.
  replicas: 1

  # hostAliases injects extra entries into the pod's /etc/hosts.
  # Useful in local dev to resolve Docker Compose hostnames (e.g. dex.orbit.local.clearroute.io)
  # from within the k3d cluster. Empty by default (no extra entries).
  hostAliases: []
  # - ip: "<dex-container-ip>"   # resolved dynamically at cluster setup time
  #   hostnames: ["dex.orbit.local.clearroute.io"]


  # Resource requests and limits.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Explicit security and observability tunables.
  # These replace APP_ENV-based YAML branching so consumers never need to set
  # an internal environment selector. Production values are the defaults;
  # override in deploy/local/orbit-values.yaml for local dev clusters.
  config:
    # PostgreSQL connection security. Use "require" in production (default).
    # Set to "disable" for local dev clusters that run Postgres without TLS.
    postgresSSLMode: "require"
    # Log query text in traces. Always false in production; set true locally
    # to see the full SQL of slow queries in your OTLP backend.
    postgresCaptureQueryText: "false"
    # Redis TLS. Always true in production; set false for local dev Redis.
    redisTLSEnabled: "true"
    # Send traces/metrics over plaintext gRPC. Always false in production.
    # Set true for local OTLP collectors (e.g. otel-collector in Kind) that
    # do not have TLS certificates.
    otlpInsecure: "false"
    # Structured log format. "json" for production log aggregators;
    # "console" for human-readable local dev output.
    logFormat: "json"

  # Name of the existing Secret containing environment variables for the
  # identity service (DB_PASSWORD, REDIS_PASSWORD, ORBIT_TOKEN_SIGNING_KEY, etc.).
  # Operator default: "orbit-secrets" (created by scripts/cluster/create-secrets.sh).
  existingSecret: "orbit-secrets"

  # Name of the existing ConfigMap containing non-secret environment variables
  # (DB_HOST, DB_NAME, DB_PORT, DB_USER, REDIS_HOST, REDIS_PORT, ORBIT_OIDC_CLIENT_ID,
  # ORBIT_OIDC_ISSUER_URL). Operator default: "orbit-config" (managed by operator).
  existingConfigMap: "orbit-config"

  # Name of the existing ConfigMap containing the tenant registry YAML.
  # The ConfigMap must have a key "tenants.yaml". Mounted at /etc/orbit/tenants.yaml
  # and referenced via ORBIT_TENANTS_CONFIG env var.
  # Operator default: "orbit-tenants" (managed by orbit-operator from OrbitTenant CRs).
  existingTenantsConfigMap: "orbit-tenants"

  # Name of the aggregated OIDC client secrets Secret managed by the orbit-operator
  # (orbit-tenant-oidc-secrets). Mounted at /etc/orbit/tenant-secrets/client-secrets.yaml
  # and referenced via ORBIT_TENANT_SECRETS_CONFIG. The identity service hot-reloads
  # this file without a pod restart when secrets are rotated.
  # Mounted with optional: true so the pod starts cleanly before any confidential
  # tenants are provisioned. Operator default: "orbit-tenant-oidc-secrets".
  existingClientSecretsSecret: "orbit-tenant-oidc-secrets"

# -- Inference gateway service configuration.
inferenceGateway:
  # Container image for the orbit-inference-gateway service.
  image:
    repository: "ghcr.io/orbit-sh/orbit-inference-gateway"
    tag: ""  # Defaults to .Chart.AppVersion when empty.
    pullPolicy: ""  # Inherits global.imagePullPolicy when empty.

  # Number of inference gateway replicas.
  replicas: 1

  # Resource requests and limits.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Security and observability tunables — same pattern as identity service.
  config:
    postgresSSLMode: "require"
    postgresCaptureQueryText: "false"
    otlpInsecure: "false"
    logFormat: "json"

  # Provider enablement — non-secret config injected as env vars into the deployment.
  # Credentials (AWS_ACCESS_KEY_ID etc.) go in the existingSecret via create-secrets.sh.
  bedrock:
    enabled: false
    region: ""

  # Name of the existing Secret containing DB_PASSWORD (and optionally provider credentials).
  # Shares orbit-secrets with the identity service — extra keys are ignored.
  existingSecret: "orbit-secrets"

  # Name of the existing ConfigMap containing DB_HOST, DB_NAME, DB_PORT, DB_USER.
  # Operator default: "orbit-config" (managed by operator, same as identity service).
  existingConfigMap: "orbit-config"

# -- Frontend service configuration.
frontend:
  # Container image for the orbit-frontend service.
  image:
    repository: "ghcr.io/orbit-sh/orbit-frontend"
    tag: ""  # Defaults to .Chart.AppVersion when empty.
    pullPolicy: ""  # Inherits global.imagePullPolicy when empty.

  # Number of frontend replicas.
  replicas: 1

  # Resource requests and limits.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Non-secret environment variables injected via the orbit-frontend-config ConfigMap.
  # These are created directly by this chart (not operator-managed).
  config:
    # URL of the Go identity service, reachable from inside the cluster.
    # Server-side only — never sent to the browser.
    orbitApiUrl: ""
    # URL of the inference gateway service, reachable from inside the cluster.
    # Server-side only — never sent to the browser.
    inferenceGatewayUrl: ""
    # URL of the policy gateway service, reachable from inside the cluster.
    # Used by the BFF to fetch the principal's effective scope set (ADR-0037).
    # Server-side only — never sent to the browser.
    policyGatewayUrl: ""
    # URL of the policy service (PAP), reachable from inside the cluster.
    # Used by the BFF to proxy grant/role/vocabulary admin endpoints.
    # Server-side only — never sent to the browser.
    policyServiceUrl: ""
    # URL of the orbit-agents service, reachable from inside the cluster.
    # Used by the BFF to proxy agent type and run CRUD + SSE endpoints.
    # Server-side only — never sent to the browser.
    orbitAgentsUrl: ""
    # Public base URL of the frontend, reachable from the browser.
    # Must match the NEXT_PUBLIC_APP_URL Docker build arg used to build the image,
    # as Next.js inlines NEXT_PUBLIC_* values into client bundles at build time.
    nextPublicAppUrl: ""

  # Name of the existing Secret containing BFF_SESSION_SECRET.
  # Created by scripts/cluster/create-secrets.sh before the operator deploys this chart.
  existingSecret: "orbit-frontend-secrets"

# -- Platform namespace configuration.
# The operator injects these from the OrbitPlatform CR and active OrbitTenant CRs.
platform:
  namespaces:
    # The system namespace where Orbit core services are deployed.
    system: "orbit-system"
    # Tenant namespaces — populated by the orbit-operator from active OrbitTenant CRs.
    # Do not set this manually when using the operator.
    tenants: []

  # SPIFFE configuration for DestinationRule SAN validation.
  # Operator injects this from spec.spire.enabled in the OrbitPlatform CR.
  spiffe:
    enabled: true

# -- NetworkPolicy toggle.
# Should match the value used in the orbit-platform chart.
networkPolicy:
  enabled: true

# -- Policy Service configuration (PAP — Policy Administration Point).
agents:
  image:
    repository: "ghcr.io/orbit-sh/orbit-agents"
    tag: ""
    pullPolicy: ""

  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  config:
    postgresSSLMode: "require"
    postgresCaptureQueryText: "false"
    otlpInsecure: "false"
    logFormat: "json"
    sessionManagerPostgresSSLMode: "require"

  existingSecret: "orbit-secrets"
  existingConfigMap: "orbit-config"

policyService:
  image:
    repository: "ghcr.io/orbit-sh/orbit-policy-service"
    tag: ""
    pullPolicy: ""

  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

  config:
    postgresSSLMode: "require"
    postgresCaptureQueryText: "false"
    otlpInsecure: "false"
    logFormat: "json"

  existingSecret: "orbit-secrets"
  existingConfigMap: "orbit-config"

# -- Policy Gateway configuration (PEP — Policy Enforcement Point).
policyGateway:
  image:
    repository: "ghcr.io/orbit-sh/orbit-policy-gateway"
    tag: ""
    pullPolicy: ""

  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

  config:
    otlpInsecure: "false"
    logFormat: "json"

# -- Egress Gateway configuration (per-tenant credential broker).
# Hijacks CONNECT requests from sandbox pods, terminates upstream TLS with
# a per-tenant CA leaf, mints JIT upstream credentials, forwards to the real
# upstream. See
# docs/adr/2026-06-06-jit-credential-brokering-egress-gateway.md.
egressGateway:
  image:
    repository: "ghcr.io/orbit-sh/orbit-egress-gateway"
    tag: ""
    pullPolicy: ""

  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # The CONNECT port the gateway listens on. Sandbox pods set
  # HTTPS_PROXY=http://orbit-egress-gateway.orbit-system.svc:<connectPort>.
  # Must match cmd/egress-gateway/config/base.yaml's server.httpPort and
  # internal/operator/tenant_netpol.go's egressGatewayCONNECTPort constant.
  connectPort: 8085

  # Aggregated Secret names projected into the gateway pod. The operator
  # aggregates per-tenant material into these orbit-system Secrets so a
  # single pod can serve every tenant. See deployment.yaml for the
  # on-disk layout the gateway expects.
  tenantCASecretName: "orbit-tenant-cas"
  connectionSecretName: "orbit-tenant-connection-secrets"

  # ConfigMap and Secret whose entries are imported into the gateway
  # container's environment via envFrom. The operator-managed orbit-config
  # and orbit-secrets carry shared platform settings (DB host/credentials,
  # platform token signing key path, etc.) so the gateway picks them up
  # without duplicating per-service env wiring.
  existingConfigMap: "orbit-config"
  existingSecret: "orbit-secrets"

  config:
    otlpInsecure: "false"
    logFormat: "json"
    # PostgreSQL connection security. Use "require" in production; "disable"
    # for local dev clusters that run Postgres without TLS.
    postgresSSLMode: "require"

# -- OPA Gateway configuration (ADR-0044: gateway-level enforcement).
# Standalone OPA pod that enforces authz_gateway.rego on all traffic entering
# through the Istio IngressGateway via gRPC ext_authz.
opaGateway:
  # frontendHost is the hostname (without port) of the frontend service as seen
  # by the Istio IngressGateway :authority header. When set, an Envoy-level
  # VirtualHost bypass is added so that browser cookie traffic never reaches OPA.
  # Matches data.config.frontend_host in the gateway OPA bundle.
  # Leave empty to rely only on the Rego-level bypass.
  frontendHost: ""

  image:
    # openpolicyagent/opa with the Envoy plugin built in.
    repository: "openpolicyagent/opa"
    tag: "1.15.2-envoy-static"

  # Two replicas ensures the IngressGateway always has an ext_authz backend
  # available. The PodDisruptionBudget keeps at least one pod up during drains.
  replicas: 2

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
