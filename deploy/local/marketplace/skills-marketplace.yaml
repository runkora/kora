# Example skill marketplace for the local example tenant. The repository is on
# the tenant's spec.allowedMarketplaceRepos (deploy/local/tenants/example.yaml),
# so the operator serves it. skills-service names the marketplace after the
# repository and reads its default branch. Browsing its skills needs the local
# GitHub App Secret (secrets/kora-github-app.pem) with access to the repository.
apiVersion: runkora.io/v1alpha1
kind: SkillMarketplaceSource
metadata:
  name: skills-marketplace
  namespace: kora-tenant-example
spec:
  github:
    owner: anthropics
    repo: skills
