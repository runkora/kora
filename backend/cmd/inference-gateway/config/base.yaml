# Inference Gateway build-time defaults. The chart renders the per-install
# service URLs and providers.namespace.

app:
  version: "0.1.0"

server:
  port: 8081
  basePath: /v1
  shutdownTimeoutSecs: 10

observability:
  serviceName: orbit-inference-gateway

metrics:
  enabled: true
  port: 9464
  shutdownTimeoutSecs: 5

pricing:
  # How often the pricing cache refreshes (seconds). 3600 = 1 hour.
  refreshIntervalSecs: 3600
  # How often the pricing sync worker fetches upstream prices (seconds). 86400 = 24 hours.
  syncIntervalSecs: 86400
  # Upstream URL for LiteLLM's community-maintained pricing JSON.
  sourceURL: "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"

policy:
  bundlePollIntervalSecs: 30
