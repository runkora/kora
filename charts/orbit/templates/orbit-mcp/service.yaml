apiVersion: v1
kind: Service
metadata:
  name: orbit-mcp
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.orbitMcp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "orbit.orbitMcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 8095
      protocol: TCP
