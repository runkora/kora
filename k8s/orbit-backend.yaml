apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbit-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-backend
  labels:
    app: orbit-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbit-backend
  template:
    metadata:
      labels:
        app: orbit-backend
        spiffe.io/spire-managed-identity: "true"
        spiffe.io/component: orbit-backend
      annotations:
        inject.istio.io/templates: "sidecar,spire"
    spec:
      serviceAccountName: orbit-backend
      volumes:
        - name: spire-workload-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
      containers:
        - name: orbit-backend
          image: orbit-registry:5000/orbit-backend:latest
          imagePullPolicy: Always
          env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///run/secrets/workload-spiffe-uds/socket
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: orbit-secrets
            - secretRef:
                name: orbit-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 256m
              memory: 256Mi
            limits:
              cpu: 512m
              memory: 512Mi
          volumeMounts:
            - name: spire-workload-socket
              mountPath: /run/secrets/workload-spiffe-uds
              readOnly: true
