# What Orbit requires of SPIRE. An existing SPIRE must match these; the rest is
# chart default. The trust domain and cluster name are injected by the Helmfile
# from the shared environment facts (global.spire.trustDomain, clusterName).
spire-server:
  controllerManager:
    identities:
      clusterSPIFFEIDs:
        # The chart's catch-all registration would race Orbit's own.
        default:
          enabled: false
  nodeAttestor:
    k8sPSAT:
      enabled: true
      serviceAccountAllowList:
        - spire-system:spire-agent

spire-agent:
  sds:
    enabled: true
    defaultSVIDName: default
    defaultBundleName: ROOTCA
    defaultAllBundlesName: ALL
  nodeAttestor:
    k8sPSAT:
      enabled: true
  workloadAttestors:
    k8s:
      enabled: true
      disableContainerSelectors: true
      useNewContainerLocator: false

spiffe-csi-driver:
  enabled: true

spire-controller-manager:
  enabled: true
