name: Docker build and publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: OCI tag to publish when running manually
        required: false
        default: latest
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  REPOSITORY_URL: https://github.com/${{ github.repository }}

concurrency:
  group: publish-backend-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Expands the bake file's default group into a list of individual target names.
  # Adding a new image to docker-bake.hcl's default group is all that's needed —
  # CI picks it up automatically on the next run.
  list-targets:
    name: List bake targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Expand default group to target list
        id: list
        run: |
          TARGETS=$(docker buildx bake --print -f docker-bake.hcl 2>/dev/null \
            | jq -c '[.target | keys[] | select(startswith("_") | not)]')
          echo "targets=${TARGETS}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.target }}
    needs: list-targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.list-targets.outputs.targets) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive image tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_TAG="pr-${{ github.event.pull_request.number }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            IMAGE_TAG="${GITHUB_SHA}"
          else
            IMAGE_TAG="latest"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE_VERSION=${IMAGE_TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE_CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Login is unconditional: PR builds don't push images, but they pull the
      # layer cache from GHCR, which needs auth on a private registry.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on non-PR)
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          set: |
            *.platform=linux/amd64
            *.cache-from=type=registry,ref=ghcr.io/${{ env.IMAGE_NAMESPACE }}/orbit-buildcache:${{ matrix.target }}
            *.cache-to=type=registry,ref=ghcr.io/${{ env.IMAGE_NAMESPACE }}/orbit-buildcache:${{ matrix.target }},mode=max,ignore-error=true
            *.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}
            *.labels.org.opencontainers.image.url=https://github.com/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.labels.org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
            *.labels.org.opencontainers.image.created=${{ env.IMAGE_CREATED }}
