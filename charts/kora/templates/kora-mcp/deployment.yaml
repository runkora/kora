apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-mcp
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.koraMcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.koraMcp.replicas }}
  selector:
    matchLabels:
      {{- include "kora.koraMcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kora.koraMcp.selectorLabels" . | nindent 8 }}
        {{- include "kora.koraMcp.labels" . | nindent 8 }}
        spiffe.io/component: orbit-mcp
        {{- include "kora.podLabels" (dict "root" $ "name" "koraMcp") | nindent 8 }}
      annotations:
        {{- include "kora.spireProxyAnnotations" (dict "root" $) | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/kora-mcp/config.yaml") . | sha256sum }}
        {{- include "kora.podAnnotations" (dict "root" $ "name" "koraMcp") | nindent 8 }}
    spec:
      serviceAccountName: orbit-mcp
      {{- include "kora.imagePullSecrets" . | nindent 6 }}
      {{- include "kora.scheduling" (dict "root" $ "name" "koraMcp") | nindent 6 }}
      securityContext:
        {{- include "kora.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "kora.spireVolumes" . | nindent 8 }}
        {{- include "kora.configVolume" (dict "root" $ "name" "koraMcp" "configMap" "orbit-mcp-config" "modules" (include "kora.koraMcp.configModules" . | fromYaml)) | nindent 8 }}
        {{- include "kora.extraVolumes" (dict "root" $ "name" "koraMcp") | nindent 8 }}
      containers:
        - name: orbit-mcp
          image: {{ include "kora.image" (dict "root" $ "name" "koraMcp") | quote }}
          imagePullPolicy: {{ include "kora.imagePullPolicy" (dict "root" $ "name" "koraMcp") }}
          securityContext:
            {{- include "kora.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix:///run/secrets/workload-spiffe-uds/socket"
            {{- include "kora.extraEnv" (dict "root" $ "name" "koraMcp") | nindent 12 }}
          ports:
            - name: http
              containerPort: 8095
              protocol: TCP
            {{- if .Values.global.metrics.enabled }}
            - name: http-metrics
              containerPort: {{ .Values.global.metrics.port | default 9464 }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.koraMcp.resources | nindent 12 }}
          volumeMounts:
            {{- include "kora.spireVolumeMount" . | nindent 12 }}
            {{- include "kora.configVolumeMount" . | nindent 12 }}
            {{- include "kora.extraVolumeMounts" (dict "root" $ "name" "koraMcp") | nindent 12 }}
