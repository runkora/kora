app:
  version: "0.1.0"
  # json emits structured logs for ingestion by log aggregators (Datadog, Loki, etc.)
  logFormat: json

server:
  port: 8080
  basePath: /api/v1
  shutdownTimeoutSecs: 30

observability:
  serviceName: orbit
  otlpEndpoint: ""      # set to your collector address, e.g. "otel-collector:4317"
  samplingRate: 0.1     # sample 10% of traces in production
  otlpInsecure: false   # always use TLS in production
