# Example GitHub App connection for the local example tenant.
# make cluster-deploy applies this resource when secrets/orbit-github-app.pem exists.
apiVersion: orbit.io/v1alpha1
kind: Connection
metadata:
  name: github
  namespace: orbit-tenant-example
spec:
  adapter: github_app
  baseHost: github.com
  secretRef: github-app-key
  secretKey: key.pem
  config:
    app_id: "4015347"          # string — your GitHub App's App ID
    installation_id: 139299720 # number — the installation on your org/repos
    owner: clear-route         # Restrict repository access to this owner.
