name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Weekly, to pick up new queries against an unchanged main.
    - cron: "17 3 * * 2"

permissions:
  contents: read

jobs:
  # Runs each language only when its inputs changed. The weekly schedule has
  # no diff, so it analyses every language.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # A JSON array of the languages to analyse.
      languages: ${{ steps.languages.outputs.languages }}
    steps:
      - if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - 'backend/**'
              - '.github/workflows/codeql.yml'
            javascript-typescript:
              - 'frontend/**'
              - 'tools/**'
              - '.github/workflows/codeql.yml'
            actions:
              - '.github/workflows/**'

      # The merge queue analyses nothing: no ruleset rule gates on code scanning
      # results, and the push to main analyses the merged tree. A run where no
      # language changed analyses actions, so every pull request gets a code
      # scanning result.
      - id: languages
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          case "$EVENT" in
            merge_group) languages='[]' ;;
            schedule) languages='["go","javascript-typescript","actions"]' ;;
            *)
              languages="${CHANGES:-[]}"
              [ "$languages" = '[]' ] && languages='["actions"]'
              ;;
          esac
          echo "languages=${languages}" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.changes.outputs.languages) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # Go only supports a traced build (CodeQL rejects build-mode none
          # for it); the other languages are extracted from source.
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
          queries: security-and-quality

      # Compile every package once without linking binaries. The generated
      # protobuf code is committed, so no tool install or proto-gen is needed.
      - if: matrix.language == 'go'
        name: Build
        run: cd backend && go build ./...

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # The analyze matrix varies per run, so branch protection requires this
  # always-on job instead. Analysis is skipped only in the merge queue.
  gate:
    name: CodeQL gate
    needs: [changes, analyze]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless change detection and every analysis passed
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "analyze: ${{ needs.analyze.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          case "${{ needs.analyze.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
