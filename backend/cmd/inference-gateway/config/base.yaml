# Inference Gateway -- build-time defaults.
#
# This file is embedded in the Docker image. Operators never edit it directly.
# All deployment-time configuration is supplied via environment variables,
# which loadEnvOverrides() applies on top of these defaults at startup.
# Helm chart values map to env vars -- see the inference-gateway chart values.yaml.

app:
  version: "0.1.0"

server:
  port: 8081
  basePath: /v1
  shutdownTimeoutSecs: 10

observability:
  serviceName: orbit-inference-gateway

pricing:
  # How often the pricing cache refreshes (seconds). 3600 = 1 hour.
  refreshIntervalSecs: 3600
  # How often the pricing sync worker fetches upstream prices (seconds). 86400 = 24 hours.
  syncIntervalSecs: 86400
  # Upstream URL for LiteLLM's community-maintained pricing JSON.
  sourceURL: "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"

identity:
  # SVID exchange for this service's own platform token. The mesh's mTLS peer
  # identity authenticates the call, so no credential is configured here.
  internalURL: "http://orbit-identity.orbit-system.svc"

policy:
  bundleEndpoint: "http://orbit-policy-service.orbit-system.svc/api/v1/policy/bundles"
  bundlePollIntervalSecs: 30
  policyServiceURL: "http://orbit-policy-service.orbit-system.svc"

providers:
  # The operator's InferenceProvider aggregate, mounted by the chart.
  configDir: /etc/orbit/inference-providers
  secretDir: /etc/orbit/inference-provider-secrets
