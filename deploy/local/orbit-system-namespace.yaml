# Pre-bootstrap manifest for orbit-system namespace.
#
# Applied by `make cluster-platform` BEFORE helmfile runs so that Helm can
# store its release secret in the namespace. The orbit-platform chart's own
# namespaces.yaml template then applies the full label set idempotently.
#
# Labels here intentionally match the chart template so kubectl apply is a
# no-op on upgrades:
#   istio-injection: enabled          — Istio sidecar injection
#   spiffe.io/spire-managed: "true"   — SPIRE workload attestation
apiVersion: v1
kind: Namespace
metadata:
  name: orbit-system
  labels:
    istio-injection: enabled
    spiffe.io/spire-managed: "true"
