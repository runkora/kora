apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.runkora.io
  labels:
    {{- include "kora-crds.labels" . | nindent 4 }}
  annotations:
    # helm uninstall keeps this CRD. Tenant definitions outlive the product install.
    helm.sh/resource-policy: keep
spec:
  group: runkora.io
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
    shortNames:
      - kag
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.identityMode
        - name: Accepted
          type: string
          jsonPath: .status.conditions[?(@.type=="Accepted")].status
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >
            Agent defines an agent for the tenant whose namespace holds it.
            kora-agents watches it and provisions it as it does an agent built
            in the dashboard. metadata.name is the agent slug.
          type: object
          required:
            - spec
          x-kubernetes-validations:
            # The slug names the agent's Service, a DNS-1035 label. Pod labels add a revision hash of up to 10 characters to it.
            - rule: "self.metadata.name.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$') && size(self.metadata.name) <= 52"
              message: metadata.name must be a DNS-1035 label of at most 52 characters.
            - rule: "!(self.metadata.name in ['delegated', 'autonomous'])"
              message: metadata.name must not be delegated or autonomous. They are identity mode names.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - displayName
                - model
              properties:
                displayName:
                  type: string
                  minLength: 1
                description:
                  type: string
                systemPrompt:
                  type: string
                framework:
                  type: string
                  enum:
                    - claude-code
                    - codex
                    - opencode
                  default: claude-code
                identityMode:
                  type: string
                  enum:
                    - autonomous
                    - delegated
                  default: autonomous
                  description: Who the agent acts as. Recreate the Agent to change it.
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: identityMode is immutable.
                model:
                  type: object
                  description: The VirtualModel the agent runs on.
                  required:
                    - family
                    - name
                  properties:
                    family:
                      type: string
                      pattern: "^[a-z0-9_-]{1,255}$"
                    name:
                      type: string
                      pattern: "^[a-z0-9_-]{1,255}$"
                environments:
                  type: array
                  description: Environments the agent may run in, by name. One is the default. Empty runs kora-base.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        minLength: 1
                      default:
                        type: boolean
                connectivity:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                        - none
                        - whitelist
                        - open
                      default: none
                    hosts:
                      type: array
                      description: Hosts the agent may reach in whitelist mode, exact or "*.suffix".
                      items:
                        type: string
                        minLength: 1
                connectors:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - connection
                  items:
                    type: object
                    required:
                      - connection
                      - actions
                    properties:
                      connection:
                        type: string
                        minLength: 1
                        description: A Connection name in this namespace.
                      actions:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          minLength: 1
                      resources:
                        type: array
                        description: Upstream resources the connector is narrowed to. Empty means all.
                        items:
                          type: string
                          minLength: 1
                mcpTools:
                  type: array
                  description: Tools the agent may call, per MCPServer. Each becomes the scope mcp:<server>:<tool>:use.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - server
                  items:
                    type: object
                    required:
                      - server
                      - tools
                    properties:
                      server:
                        type: string
                        minLength: 1
                        description: An MCPServer name in this namespace.
                      tools:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          minLength: 1
                scopes:
                  type: array
                  description: Further scopes on the agent's grant.
                  items:
                    type: string
                    minLength: 1
                guardrails:
                  type: object
                  description: Loop-guard thresholds. Each pause must be above its warn. Unset fields take the platform defaults.
                  properties:
                    repeatedCallWarn:
                      type: integer
                      format: int32
                      minimum: 1
                    repeatedCallPause:
                      type: integer
                      format: int32
                      minimum: 1
                    waitRearmWarn:
                      type: integer
                      format: int32
                      minimum: 1
                    waitRearmPause:
                      type: integer
                      format: int32
                      minimum: 1
                budget:
                  type: object
                  description: The spending limits on the agent's grant.
                  properties:
                    limitUSD:
                      type: number
                      minimum: 0
                    resetCadence:
                      type: string
                      enum:
                        - weekly
                        - monthly
                      default: monthly
                    perRunLimitUSD:
                      type: number
                      minimum: 0
                maxConcurrentRunsPerPod:
                  type: integer
                  format: int32
                  minimum: 1
                  description: Runs one agent pod holds at once. Unset takes the install default.
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
