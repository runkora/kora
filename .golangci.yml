version: "2"

run:
  timeout: 5m
  tests: false
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gosec
    - goconst
    - gocritic     # includes ruleguard — see settings.gocritic below
    - gocyclo
    - nolintlint
    - unconvert
    - unparam
    - whitespace
    - bodyclose    # enforce resp.Body.Close(); //nolint:bodyclose where intentional
    - noctx        # enforce http.NewRequestWithContext over http.NewRequest
    - errorlint    # enforce errors.Is / errors.As over == comparisons
    - depguard     # enforce import restrictions per ADR-0007 and ADR-0020
  disable:
    - errcheck

  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true

    govet:
      enable-all: true
      disable:
        - fieldalignment

    gocyclo:
      min-complexity: 15

    goconst:
      min-len: 3
      min-occurrences: 5

    misspell:
      locale: US

    revive:
      confidence: 0.8

    gosec:
      excludes:
        - G104  # Errors unhandled
        - G204  # Subprocess launched with variable
        - G302  # File permissions
        - G304  # File inclusion via variable

    # gocritic is already enabled above. The ruleguard extension loads our
    # custom ADR-0007 rules file, which flags:
    #   - span.SetStatus(_, err.Error())         — dynamic local error string
    #   - span.SetStatus(_, ctx.Err().Error())   — dynamic context error string
    #   - attribute.String(_, err.Error())        — raw error in span attribute
    #   - attribute.String(_, ctx.Err().Error())  — raw context err in attribute
    #
    # These rules enforce the two-signal observability pattern:
    #   span.RecordError(err)                         // full dynamic detail
    #   span.SetStatus(codes.Error, errX.Error())     // static sentinel string
    gocritic:
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          rules: "../rules/orbit_rules.go"

    # depguard enforces ADR-0007 and ADR-0020 import discipline.
    #
    # Rule: no-otel-span-mgmt-in-service-clients
    #   Scope: individual typed service clients (platform/clients/*/client.go)
    #   Rationale: httpclient.Base owns all span lifecycle — opening, status
    #   setting, and error recording. Service clients call Base.Do,
    #   Base.HandleErrorResponse, and Base.RecordError instead. Importing
    #   otel/codes or otel/trace in a service client means it is managing
    #   spans it does not own, duplicating work and risking inconsistency.
    #   The base client (httpclient/base.go) is excluded from this rule
    #   because it is the legitimate owner of span management.
    #
    # Rule: no-feature-cross-imports
    #   Scope: all internal feature packages
    #   Rationale: ADR-0020 prohibits feature packages from importing each
    #   other. Cross-cutting concerns must go through platform/.
    depguard:
      rules:
        no-otel-span-mgmt-in-service-clients:
          files:
            # Matches all typed service clients, e.g.:
            #   internal/platform/clients/identity/client.go
            #   internal/platform/clients/billing/client.go
            # Excludes the base client (httpclient/base.go) because it is
            # the legitimate owner of span lifecycle management.
            - "**/platform/clients/*/client.go"
          deny:
            - pkg: "go.opentelemetry.io/otel/codes"
              desc: >
                ADR-0007: service clients must not manage span status directly.
                Use httpclient.Base.HandleErrorResponse and Base.RecordError
                instead — they set span status and call span.RecordError
                centrally. Import otel/codes only in httpclient/base.go.
            - pkg: "go.opentelemetry.io/otel/trace"
              desc: >
                ADR-0007: service clients must not own span lifecycle.
                Spans are opened and closed by httpclient.Base.Do.
                If you need to attach domain attributes on success, accept a
                trace.Span argument or use the ctx returned by Base.Do.
                Import otel/trace only in httpclient/base.go.

  exclusions:
    paths:
      - ".*_test\\.go$"
    rules:
      - path: examples/
        linters:
          - errcheck
          - unparam
      # ruleguard reports "empty rule set" on packages where none of our custom
      # ADR-0007 rules fire (i.e. no OTel span calls exist). This is a known
      # gocritic/ruleguard quirk — it is not a real violation.
      - linters:
          - gocritic
        text: "ruleguard: execution error: used Run\\(\\) with an empty rule set"
