# PROXY deployment: the request-path PEP + MCP proxy, behind the Service.
# It runs WITHOUT identity-proxy (sidecar,spire only): when it forwards a
# caller's bearer to a callerIdentity:forward server (acting AS the caller),
# identity-proxy would overwrite that header with the gateway's own token and
# defeat the passthrough — the same reason orbit-mcp omits it. It still reaches
# policy-service (the in-process evaluator's bundle poll, GET /policy/bundles/*,
# is auth-bypassed) and orbit-mcp over spire-mTLS. Horizontally scalable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-tool-gateway
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.toolGateway.labels" . | nindent 4 }}
    orbit.io/mode: proxy
spec:
  replicas: {{ .Values.toolGateway.proxyReplicas }}
  selector:
    matchLabels:
      {{- include "orbit.toolGateway.selectorLabels" . | nindent 6 }}
      orbit.io/mode: proxy
  template:
    metadata:
      labels:
        {{- include "orbit.toolGateway.selectorLabels" . | nindent 8 }}
        {{- include "orbit.toolGateway.labels" . | nindent 8 }}
        orbit.io/mode: proxy
        # SPIRE workload attestation — issues spiffe://<trust-domain>/system/tool-gateway.
        spiffe.io/spire-managed-identity: "true"
        spiffe.io/component: tool-gateway
      annotations:
        # NO identity-proxy: the proxy forwards the CALLER's token to forward
        # servers, which identity-proxy would overwrite (same model as orbit-mcp).
        inject.istio.io/templates: "sidecar,spire"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      serviceAccountName: orbit-tool-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      volumes:
        - name: spire-workload-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        # Registry mount — the proxy reads it to resolve a tool's upstream server.
        - name: mcp-servers
          configMap:
            name: {{ .Values.toolGateway.mcpServersConfigMapName }}
            optional: true
      containers:
        - name: orbit-tool-gateway
          image: "{{ .Values.toolGateway.image.repository }}:{{ include "orbit.toolGateway.imageTag" . }}"
          imagePullPolicy: {{ include "orbit.toolGateway.imagePullPolicy" . }}
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: ORBIT_TOOL_GATEWAY_MODE
              value: proxy
            - name: ORBIT_OTLP_INSECURE
              value: {{ .Values.toolGateway.config.otlpInsecure | quote }}
            - name: ORBIT_LOG_FORMAT
              value: {{ .Values.toolGateway.config.logFormat | quote }}
            - name: ORBIT_POSTGRES_SSL_MODE
              value: {{ .Values.toolGateway.config.postgresSSLMode | quote }}
          {{- if or .Values.toolGateway.existingConfigMap .Values.toolGateway.existingSecret }}
          envFrom:
            {{- if .Values.toolGateway.existingConfigMap }}
            - configMapRef:
                name: {{ .Values.toolGateway.existingConfigMap }}
            {{- end }}
            {{- if .Values.toolGateway.existingSecret }}
            - secretRef:
                name: {{ .Values.toolGateway.existingSecret }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.toolGateway.httpPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.toolGateway.httpPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.toolGateway.httpPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.toolGateway.resources | nindent 12 }}
          volumeMounts:
            - name: spire-workload-socket
              mountPath: /run/secrets/workload-spiffe-uds
              readOnly: true
            - name: mcp-servers
              mountPath: /var/run/orbit/mcp-servers
              readOnly: true
