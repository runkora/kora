{{- if .Values.operator.podDisruptionBudget.enabled }}
# Keeps one operator replica answering admission during a node drain; the webhooks fail closed.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orbit-operator
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.operator.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.operator.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "orbit.operator.selectorLabels" . | nindent 6 }}
{{- end }}
