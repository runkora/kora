# =============================================================================
# HAProxy — TCP passthrough from standard ports to k3d high ports
#
# Forwards:
#   443 → host.docker.internal:8443  (HTTPS — Istio gateway in k3d)
#    80 → host.docker.internal:8880  (HTTP  — redirects to HTTPS)
#
# Pure Layer 4 — no TLS termination, no certificates needed.
# =============================================================================

global
    log stdout format raw local0

defaults
    mode    tcp
    timeout connect  5s
    timeout client   3600s
    timeout server   3600s
    timeout tunnel   3600s

frontend https_in
    bind :443
    default_backend k3d_https

frontend http_in
    bind :80
    default_backend k3d_http

backend k3d_https
    server k3d host.docker.internal:8443

backend k3d_http
    server k3d host.docker.internal:8880
