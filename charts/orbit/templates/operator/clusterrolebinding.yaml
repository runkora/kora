apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orbit-operator
  labels:
    {{- include "orbit.operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orbit-operator
subjects:
  - kind: ServiceAccount
    name: orbit-operator
    namespace: {{ include "orbit.systemNamespace" . }}
