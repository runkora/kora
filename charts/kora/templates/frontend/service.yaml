apiVersion: v1
kind: Service
metadata:
  name: orbit-frontend
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.frontend.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kora.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
