apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbit-example
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-example
  labels:
    app: orbit-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbit-example
  template:
    metadata:
      labels:
        app: orbit-example
        spiffe.io/spire-managed-identity: "true"
        spiffe.io/agent: example
      annotations:
        inject.istio.io/templates: "sidecar,spire"
    spec:
      serviceAccountName: orbit-example
      volumes:
        - name: spire-workload-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
      containers:
        - name: orbit-example
          image: orbit-registry:5000/orbit-example:latest
          imagePullPolicy: Always
          env:
            - name: APP_ENV
              value: development
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///run/secrets/workload-spiffe-uds/socket
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: orbit-config
            - secretRef:
                name: orbit-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: spire-workload-socket
              mountPath: /run/secrets/workload-spiffe-uds
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: orbit-example
spec:
  selector:
    app: orbit-example
  ports:
    - name: http
      port: 80
      targetPort: 8081
      protocol: TCP
