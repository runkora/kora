apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: orbit-system

configMapGenerator:
  - name: orbit-config
    literals:
      - DB_HOST=orbit-postgres
      - DB_NAME=orbit
      - DB_PORT=5432
      - DB_USER=orbit
      - REDIS_HOST=host.k3d.internal
      - REDIS_PORT=6379
      - ORBIT_OIDC_CLIENT_ID=orbit-local
      - ORBIT_OIDC_ISSUER_URL=http://dex.orbit.local:5556/dex

resources:
  - identity.yaml
