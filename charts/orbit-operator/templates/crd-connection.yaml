apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: connections.orbit.io
  labels:
    {{- include "orbit-operator.labels" . | nindent 4 }}
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: orbit.io
  names:
    kind: Connection
    listKind: ConnectionList
    plural: connections
    singular: connection
    shortNames:
      - oconn
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Adapter
          type: string
          jsonPath: .spec.adapter
        - name: Host
          type: string
          jsonPath: .spec.baseHost
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >
            Connection declares the credential-source identity of one external
            service the Orbit egress gateway brokers for a tenant (GitOps —
            Amendment 3 of the JIT credential-brokering ADR). It carries the
            adapter, the upstream base host, a reference to a Kubernetes Secret
            (a name, never a value), and adapter-specific config. The operator
            aggregates these CRs (and their referenced Secrets) into the
            orbit-system config the egress gateway mounts. The CR name
            (metadata.name) is the agent-facing connection name.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - adapter
                - secretRef
              x-kubernetes-validations:
                - rule: >-
                    self.adapter != 'kubernetes' || self.baseHost == '' ||
                    !self.baseHost.split(':')[0].matches('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')
                  message: >-
                    kubernetes connections must use a DNS hostname as baseHost, not a
                    bare IPv4 address — TLS to an IP literal carries no SNI, so the
                    sandbox's transparent-egress interception can never authorize it.
              properties:
                adapter:
                  description: >
                    Credential mechanism selector (e.g. "github_app",
                    "passthrough"). Validated by the gateway's adapter registry
                    at resolve time, not by this schema — adding an adapter must
                    not require a CRD bump.
                  type: string
                  minLength: 1
                baseHost:
                  description: >
                    Upstream the gateway terminates and re-originates, e.g.
                    "github.com". Optional for adapters that do not key on a
                    single host.
                  type: string
                secretRef:
                  description: >
                    Name of a Kubernetes Secret in this namespace holding the
                    connection's secret material (e.g. the GitHub App private
                    key). A name, never a value — the material is materialised by
                    the deployer's secret pipeline.
                  type: string
                  minLength: 1
                secretKey:
                  description: >
                    Which data key inside the referenced Secret holds the
                    material. Optional — when omitted and the Secret has exactly
                    one key, that key is used.
                  type: string
                config:
                  description: >
                    Adapter-specific configuration, passed through to the gateway
                    verbatim. For github_app the adapter parses app_id (string)
                    and installation_id (number); snake_case is required.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
