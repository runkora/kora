name: Secret scan

on:
  # Every push, any branch: a secret is leaked the moment it reaches the remote.
  # pull_request also covers forks, which never fire push on the base repo.
  # Merge queue branches run through merge_group instead of push.
  push:
    branches-ignore: ["gh-readonly-queue/**"]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: v8.27.2

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans every commit, not just the tip.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GL_VER=${GITLEAKS_VERSION#v}
          GL_OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          GL_ARCH=$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')
          mkdir -p "${HOME}/.local/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GL_VER}_${GL_OS}_${GL_ARCH}.tar.gz" \
            | tar -xz -C "${HOME}/.local/bin" gitleaks
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - run: make secrets
