# Production environment storage configuration

postgres:
  port: 5432
  sslMode: require  # SECURITY: Always require TLS in production

  # Connection pool — tune based on (CPU cores * 2) + disk count
  maxConnections: 25
  minConnections: 5
  maxConnLifetimeMinutes: 60
  maxConnIdleTimeMinutes: 30
  healthCheckPeriodSeconds: 60
  connectTimeoutSeconds: 5
  captureQueryText: false  # SECURITY: Disable SQL capture (prevents PII/schema exposure)

redis:
  port: 6379
  db: 0

  # Retry and timeout configuration
  maxRetries: 3
  dialTimeoutSeconds: 5
  readTimeoutSeconds: 3
  writeTimeoutSeconds: 3

  # Connection pool — tuned for production workloads
  poolSize: 20
  minIdleConns: 5
  connMaxIdleTimeMinutes: 30

  tlsEnabled: true  # SECURITY: Always require TLS in production
