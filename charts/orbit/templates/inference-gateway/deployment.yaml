apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-inference-gateway
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.inferenceGateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.inferenceGateway.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.inferenceGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.inferenceGateway.selectorLabels" . | nindent 8 }}
        {{- include "orbit.inferenceGateway.labels" . | nindent 8 }}
        spiffe.io/component: inference-gateway
        # Watches InferenceProvider resources through the API server.
        orbit.io/kube-api-client: "true"
        {{- include "orbit.podLabels" (dict "root" $ "name" "inferenceGateway") | nindent 8 }}
      annotations:
        {{- include "orbit.spireProxyAnnotations" (dict "root" $) | nindent 8 }}
        # Postgres is external to the mesh; bypass Envoy interception.
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
        checksum/config: {{ include (print $.Template.BasePath "/inference-gateway/config.yaml") . | sha256sum }}
        {{- include "orbit.podAnnotations" (dict "root" $ "name" "inferenceGateway") | nindent 8 }}
    spec:
      serviceAccountName: orbit-inference-gateway
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.scheduling" (dict "root" $ "name" "inferenceGateway") | nindent 6 }}
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "orbit.spireVolumes" . | nindent 8 }}
        {{- include "orbit.configVolume" (dict "root" $ "name" "inferenceGateway" "configMap" "orbit-inference-gateway-config" "modules" (include "orbit.inferenceGateway.configModules" . | fromYaml)) | nindent 8 }}
        {{- include "orbit.redisCAVolume" . | nindent 8 }}
        {{- include "orbit.extraVolumes" (dict "root" $ "name" "inferenceGateway") | nindent 8 }}
      containers:
        - name: orbit-inference-gateway
          image: {{ include "orbit.image" (dict "root" $ "name" "inferenceGateway") | quote }}
          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "inferenceGateway") }}
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix:///run/secrets/workload-spiffe-uds/socket"
            {{- include "orbit.platformEnv" (dict "root" $ "name" "inferenceGateway" "keys" (list "DB_PASSWORD" "REDIS_PASSWORD")) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            {{- if .Values.global.metrics.enabled }}
            - name: http-metrics
              containerPort: {{ .Values.global.metrics.port | default 9464 }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.inferenceGateway.resources | nindent 12 }}
          volumeMounts:
            {{- include "orbit.spireVolumeMount" . | nindent 12 }}
            {{- include "orbit.configVolumeMount" . | nindent 12 }}
            {{- include "orbit.redisCAVolumeMount" . | nindent 12 }}
            {{- include "orbit.extraVolumeMounts" (dict "root" $ "name" "inferenceGateway") | nindent 12 }}
