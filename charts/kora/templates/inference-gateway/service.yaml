apiVersion: v1
kind: Service
metadata:
  name: kora-inference-gateway
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.inferenceGateway.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kora.inferenceGateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 8081
      protocol: TCP
    {{- if .Values.global.metrics.enabled }}
    - name: http-metrics
      port: {{ .Values.global.metrics.port | default 9464 }}
      targetPort: http-metrics
      protocol: TCP
    {{- end }}
