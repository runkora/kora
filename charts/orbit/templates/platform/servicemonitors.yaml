# Opt-in Prometheus Operator ServiceMonitor per instrumented service. Renders
# nothing unless both global.metrics.serviceMonitor.enabled is set AND the
# monitoring.coreos.com/v1 CRD is present on the target cluster, so leaving the
# flag on without the CRD installed cannot break `helm template`/`install`.
# See docs/adr/2026-10-06-prometheus-metrics-endpoints.md.
#
# This only configures what Prometheus Operator scrapes. It does not by itself
# satisfy this mesh's Istio mTLS or the default-deny NetworkPolicy — see
# global.metrics.scraperNamespace (netpols.yaml) and the ADR's Consequences.
#
# selector.matchLabels targets the app.kubernetes.io/name each Service's own
# metadata.labels carries (orbit.<svc>.labels), not the pod-level
# selectorLabels a Service's own spec.selector uses — ServiceMonitor discovers
# targets by matching Service objects, not Pods.
{{- if and .Values.global.metrics.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
{{- range $svc := list "identity" "agents" "inference-gateway" "policy-service" "policy-gateway" "triggers" "egress-gateway" "tool-gateway" "mcp" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orbit-{{ $svc }}
  namespace: {{ include "orbit.systemNamespace" $ }}
  labels:
    {{- include "orbit.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orbit-{{ $svc }}
  namespaceSelector:
    matchNames:
      - {{ include "orbit.systemNamespace" $ }}
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: {{ $.Values.global.metrics.serviceMonitor.interval | default "30s" }}
{{- end }}
{{- end }}
