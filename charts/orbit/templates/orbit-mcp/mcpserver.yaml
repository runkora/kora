{{- if .Values.orbitMcp.register }}
# Registers the platform Orbit MCP as a GLOBAL MCPServer (orbit-system). The
# operator's MCPServerAggregator renders it into the orbit-mcp-servers registry
# and the tool-gateway introspects its tools into mcp:orbit:<tool>:use scopes.
# callerIdentity: forward — the Orbit MCP acts AS the caller against first-party
# Orbit APIs (valid only for orbit-system/global servers).
apiVersion: orbit.io/v1alpha1
kind: MCPServer
metadata:
  name: orbit
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.orbitMcp.labels" . | nindent 4 }}
spec:
  displayName: "Orbit Platform MCP"
  endpoint: "http://orbit-mcp.{{ include "orbit.systemNamespace" . }}.svc:8095/mcp"
  transport: streamable-http
  reintrospectIntervalSeconds: 900
  callerIdentity: forward
{{- end }}
