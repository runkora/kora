name: Docker build and publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: OCI tag to publish when running manually
        required: false
        default: latest
        type: string
  workflow_call:
    inputs:
      image_tag:
        description: OCI tag to publish
        required: true
        type: string
      platforms:
        description: Comma-separated build platforms
        required: false
        default: linux/amd64
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  REPOSITORY_URL: https://github.com/${{ github.repository }}

concurrency:
  group: publish-backend-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the image builds when nothing that enters a build context changed.
  # The patterns mirror .dockerignore.
  changes:
    name: Detect image-affecting changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A file counts only if it satisfies every rule, which is what makes
          # the negations exclude. Under the default quantifier a negation is
          # just another pattern and matches everything it does not name.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.github/**'
            workflow:
              - '.github/workflows/docker.yml'

  # Expands the bake file's default group into a list of target names. A new
  # image added to that group is built on the next run.
  list-targets:
    name: List bake targets
    needs: changes
    # Release tags and manual runs always build. Everything else builds only
    # when an image input changed.
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Expand default group to target list
        id: list
        run: |
          TARGETS=$(docker buildx bake --print -f docker-bake.hcl 2>/dev/null \
            | jq -c '[.target | keys[] | select(startswith("_") | not)]')
          echo "targets=${TARGETS}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.target }}
    needs: list-targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.list-targets.outputs.targets) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive image tag
        shell: bash
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_TAG="pr-${{ github.event.pull_request.number }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            IMAGE_TAG="${GITHUB_SHA}"
          else
            IMAGE_TAG="latest"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE_VERSION=${IMAGE_TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE_CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_ENV}"

      - name: Enable multi-arch emulation
        if: contains(inputs.platforms, 'arm64')
        run: docker run --rm --privileged tonistiigi/binfmt:qemu-v8.1.5 --install arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Login runs for pull requests as well. They do not push, but pulling the
      # layer cache from a private GHCR needs auth.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on non-PR)
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          set: |
            *.platform=${{ inputs.platforms || 'linux/amd64' }}
            *.cache-from=type=registry,ref=ghcr.io/${{ env.IMAGE_NAMESPACE }}/orbit-buildcache:${{ matrix.target }}
            *.cache-to=type=registry,ref=ghcr.io/${{ env.IMAGE_NAMESPACE }}/orbit-buildcache:${{ matrix.target }},mode=max,ignore-error=true
            *.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}
            *.labels.org.opencontainers.image.url=https://github.com/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.labels.org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
            *.labels.org.opencontainers.image.created=${{ env.IMAGE_CREATED }}

  # The build matrix varies per run, so branch protection requires this
  # always-on job instead. A skipped build means no image input changed.
  gate:
    name: Docker gate
    needs: [changes, list-targets, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless change detection and every build passed
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "list-targets: ${{ needs.list-targets.result }}"
          echo "build: ${{ needs.build.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          case "${{ needs.list-targets.result }}" in success|skipped) ;; *) exit 1 ;; esac
          case "${{ needs.build.result }}" in success|skipped) ;; *) exit 1 ;; esac
