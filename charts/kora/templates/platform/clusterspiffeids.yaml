{{- if .Values.platform.spiffe.enabled }}
# kora's SPIFFE registrations, scoped to the system namespace and namespaces
# labelled runkora.io/role=tenant.
#
#   System component:  spiffe://<trust-domain>/system/<spiffe.io/component>
#   Tenant service:    spiffe://<trust-domain>/tenant/<namespace>/service/<spiffe.io/service>
#   Tenant agent:      spiffe://<trust-domain>/tenant/<namespace>/agent/<spiffe.io/agent>
#   Sandbox run:       spiffe://<trust-domain>/tenant/<namespace>/agent/<slug>/sandbox/<run-id>
{{- $trustDomain := include "kora.trustDomain" . }}
{{- $ns := include "kora.systemNamespace" . }}
---
# Every kora pod in the system namespace, operator and ingress gateway included.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: kora-system-component
  labels:
    {{- include "kora.labels" . | nindent 4 }}
spec:
  className: {{ .Values.spire.className }}
  spiffeIDTemplate: "spiffe://{{ $trustDomain }}/system/{{ `{{ index .PodMeta.Labels \"spiffe.io/component\" }}` }}"
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ $ns }}
  podSelector:
    matchExpressions:
      - key: spiffe.io/component
        operator: Exists
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: kora-tenant-service
  labels:
    {{- include "kora.labels" . | nindent 4 }}
spec:
  className: {{ .Values.spire.className }}
  spiffeIDTemplate: "spiffe://{{ $trustDomain }}/tenant/{{ `{{ .PodMeta.Namespace }}` }}/service/{{ `{{ index .PodMeta.Labels \"spiffe.io/service\" }}` }}"
  namespaceSelector:
    matchLabels:
      runkora.io/role: tenant
  podSelector:
    matchExpressions:
      - key: spiffe.io/service
        operator: Exists
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: kora-tenant-agent
  labels:
    {{- include "kora.labels" . | nindent 4 }}
spec:
  className: {{ .Values.spire.className }}
  spiffeIDTemplate: "spiffe://{{ $trustDomain }}/tenant/{{ `{{ .PodMeta.Namespace }}` }}/agent/{{ `{{ index .PodMeta.Labels \"spiffe.io/agent\" }}` }}"
  namespaceSelector:
    matchLabels:
      runkora.io/role: tenant
  podSelector:
    matchExpressions:
      - key: spiffe.io/agent
        operator: Exists
---
# One identity per run: every credential the egress gateway mints is tied to
# the run that asked for it. The principal extractor normalises this back to
# the agent identity for authorisation and lifts run_id into claims.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: kora-tenant-sandbox
  labels:
    {{- include "kora.labels" . | nindent 4 }}
spec:
  className: {{ .Values.spire.className }}
  spiffeIDTemplate: "spiffe://{{ $trustDomain }}/tenant/{{ `{{ .PodMeta.Namespace }}` }}/agent/{{ `{{ index .PodMeta.Labels \"runkora.io/agent-slug\" }}` }}/sandbox/{{ `{{ index .PodMeta.Labels \"runkora.io/run-id\" }}` }}"
  namespaceSelector:
    matchLabels:
      runkora.io/role: tenant
  podSelector:
    matchLabels:
      runkora.io/role: sandbox
    matchExpressions:
      - key: runkora.io/agent-slug
        operator: Exists
      - key: runkora.io/run-id
        operator: Exists
{{- end }}
