name: Frontend CI

on:
  workflow_call:

# Tool versions — keep in sync with pinned versions in Makefile.
env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'

jobs:
  # ── Static analysis + unit/integration tests ──────────────────────────────
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Lint
        run: make frontend-lint

      - name: Type check
        run: make frontend-type-check

      - name: Format check
        run: make frontend-fmt

      - name: Unit tests
        run: cd frontend && pnpm run test:coverage:unit

      - name: Integration tests
        run: cd frontend && pnpm run test:coverage:integration

      - name: Upload unit coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: frontend/coverage/unit/
          retention-days: 30
          if-no-files-found: ignore
          fail_ci_if_error: false

      - name: Upload integration coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-integration
          path: frontend/coverage/integration/
          retention-days: 30
          if-no-files-found: ignore
          fail_ci_if_error: false

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: make frontend-test-e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
          if-no-files-found: ignore
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 30
          if-no-files-found: ignore
          fail_ci_if_error: false
