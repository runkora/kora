---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-controller-manager
  namespace: spire
data:
  controller-manager-config.yaml: |
    apiVersion: spire.spiffe.io/v1alpha1
    kind: ControllerManagerConfig
    metadata:
      name: spire-controller-manager
    # Override clusterName and trustDomain via an environment overlay patch.
    clusterName: orbit-cluster
    trustDomain: orbit.local
    # Connect to the SPIRE Server via the shared Unix socket
    spireServerSocketPath: /tmp/spire-server/private/api.sock
    # Watch all namespaces for ClusterSPIFFEID resources
    watchClassless: true
    metrics:
      bindAddress: "0"
    health:
      # Port 8083 avoids colliding with SPIRE Server health (8080) and gRPC (8081)
      healthProbeBindAddress: ":8083"
    leaderElection:
      leaderElect: false
