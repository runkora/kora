apiVersion: v1
kind: Service
metadata:
  name: kora-tool-gateway
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.toolGateway.labels" . | nindent 4 }}
spec:
  # Route request traffic to the PROXY pods only (the publisher serves none).
  selector:
    {{- include "kora.toolGateway.selectorLabels" . | nindent 4 }}
    runkora.io/mode: proxy
  ports:
    # Plain HTTP — health + GET /v1/catalog (the BFF reads the catalog here),
    # and the Phase-4 MCP request path. Must match
    # cmd/tool-gateway/config/base.yaml's server.httpPort.
    - name: http
      port: 80
      targetPort: 8096
      protocol: TCP
    {{- if .Values.global.metrics.enabled }}
    - name: http-metrics
      port: {{ .Values.global.metrics.port | default 9464 }}
      targetPort: http-metrics
      protocol: TCP
    {{- end }}
