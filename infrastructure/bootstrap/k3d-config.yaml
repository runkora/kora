apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: orbit-local

# 1 server + 2 agents gives us realistic pod scheduling without burning RAM
servers: 1
agents: 2

image: rancher/k3s:v1.29.4-k3s1

ports:
  # Istio ingress gateway — high ports avoid conflicts with other local services.
  - port: 8443:443
    nodeFilters:
      - loadbalancer
  - port: 8880:80
    nodeFilters:
      - loadbalancer
  # Shared TLS-passthrough listener for dev-environment vcluster API server
  # access (SNI-routed per environment — see the operator's
  # devenvironment_ingress.go and the ephemeral-dev-environments-via-vcluster
  # ADR). NOT 6443: k3d's own loadbalancer already reverse-proxies the k3s
  # API server itself on container port 6443 (confirmed live via `docker ps`
  # — a random host port maps to it automatically, independent of this
  # file), so this listener needs its own distinct port to avoid colliding
  # with that. 16443 matches devEnvAPIGatewayPort.
  - port: 16443:16443
    nodeFilters:
      - loadbalancer

registries:
  create: 
    name: orbit-registry
    host: "0.0.0.0"
    hostPort: "5001"

# Attach k3d nodes to the same Docker network as docker-compose so that pods
# running inside k3d can reach orbit-postgres by container hostname without
# relying on host.k3d.internal (unreliable on macOS/Colima).
# The orbit-network is created by 'docker compose up' (make dev-up), which must
# run before 'make dev-cluster' — enforced by the Makefile dependency.
network: orbit-network

options:
  k3s:
    extraArgs:
      # Disable Traefik — we use Istio as the ingress gateway
      - arg: --disable=traefik
        nodeFilters:
          - server:*
