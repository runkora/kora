---
# SPIRE Server ServiceAccount + RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: spire

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-server
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  # Required by the k8sbundle notifier to publish the trust bundle ConfigMap
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  # Required by the SPIRE Controller Manager to manage ClusterSPIFFEID entries
  - apiGroups: ["spire.spiffe.io"]
    resources: ["clusterspiffeids", "clusterspiffeids/status", "clusterfederatedtrustdomains", "clusterfederatedtrustdomains/status", "clusterstaticentries", "clusterstaticentries/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  # Required by the SPIRE Controller Manager to manage the validating webhook
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Required by controller-runtime cache for leader election and service endpoint tracking
  - apiGroups: [""]
    resources: ["endpoints", "services"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-server
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: spire

---
# Empty ConfigMap that the k8sbundle notifier populates with the trust bundle.
# Must exist before the SPIRE Server starts — notifier updates it, not creates it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-bundle
  namespace: spire
data: {}

---
# SPIRE Server StatefulSet
# Two containers share the server socket via an emptyDir volume:
#   - spire-server:         the SPIRE gRPC server
#   - spire-controller-mgr: watches ClusterSPIFFEID CRDs and auto-registers entries
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: spire
  labels:
    app: spire-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spire-server
  serviceName: spire-server
  template:
    metadata:
      labels:
        app: spire-server
    spec:
      serviceAccountName: spire-server
      securityContext:
        # SPIRE server and controller-manager run as root — required for socket
        # management and key material access. runAsNonRoot is intentionally
        # omitted. seccompProfile + drop ALL caps + no privilege escalation
        # are applied as compensating controls.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spire-server
          image: ghcr.io/spiffe/spire-server:1.9.4
          args: ["-config", "/run/spire/config/server.conf"]
          ports:
            - containerPort: 8081
              name: grpc
            - containerPort: 8080
              name: health
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
            - name: spire-data
              mountPath: /run/spire/data
            - name: spire-server-socket
              mountPath: /tmp/spire-server/private
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

        - name: spire-controller-manager
          image: ghcr.io/spiffe/spire-controller-manager:0.6.3
          args:
            - "--config=controller-manager-config.yaml"
          ports:
            - containerPort: 9443
              name: webhook
            - containerPort: 8083
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: spire-controller-manager-config
              mountPath: /controller-manager-config.yaml
              subPath: controller-manager-config.yaml
            - name: spire-server-socket
              mountPath: /tmp/spire-server/private
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

      volumes:
        - name: spire-config
          configMap:
            name: spire-server
        - name: spire-controller-manager-config
          configMap:
            name: spire-controller-manager
        - name: spire-server-socket
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: spire-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: spire
spec:
  selector:
    app: spire-server
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
  type: ClusterIP
