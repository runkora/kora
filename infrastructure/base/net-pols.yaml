---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: orbit-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: orbit-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Allow intra-namespace traffic on the Envoy sidecar ports only (15006 = iptables redirect).
# Direct pod-to-pod on app ports is intentionally blocked — all traffic
# must transit the sidecar, mirroring what Cilium enforces in CI/staging.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mesh-sidecar
  namespace: orbit-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: orbit-system
      ports:
        - port: 15006   # Envoy inbound iptables redirect
        - port: 15008   # Envoy HBONE (HTTP/2 tunnel for mTLS)
        - port: 15090   # Envoy Prometheus metrics
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: orbit-system
      ports:
        - port: 15006
        - port: 15008

---
# Allow orbit-system pods to reach istiod in the istio-system namespace on the xDS port.
# Envoy sidecars injected into orbit-system must reach istiod:15012 (gRPC xDS) to receive
# Listener, Cluster, Route, and Endpoint configurations. Without this rule, all
# sidecar-managed traffic fails silently because Envoy never receives its config.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istiod-xds
  namespace: orbit-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 15012   # istiod gRPC xDS (Envoy control plane)

---
# Allow orbit-system pods to reach the SPIRE Server gRPC port (8081) in the spire namespace.
# Note: the SPIRE Workload API is a Unix domain socket (hostPath mount) — it is not
# governed by NetworkPolicy. This rule covers direct server API calls only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-spire-server-grpc
  namespace: orbit-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: spire
      ports:
        - port: 8081   # SPIRE Server gRPC
