---
# Local-dev overlay patch for the spire-agent ConfigMap.
# Overrides production-safe base defaults with values appropriate for k3d:
#   - insecure_bootstrap = true  (no pre-distributed bundle needed)
#   - cluster = "orbit-local"    (matches the k3d cluster name)
#   - KeyManager "memory"        (ephemeral keys; clean state on pod restart)
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent
  namespace: spire
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire/data"
      log_level = "INFO"
      server_address = "spire-server"
      server_port = "8081"
      trust_domain = "orbit.local"

      # Local dev only: skip pre-distributed bundle verification.
      # MUST NOT be used in staging or production.
      insecure_bootstrap = true

      # Expose the Workload API socket — Envoy and SPIFFE Helper connect here
      socket_path = "/run/spire/sockets/agent.sock"
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }

    plugins {
      NodeAttestor "k8s_psat" {
        plugin_data {
          cluster = "orbit-local"
          token_path = "/var/run/secrets/tokens/spire-agent"
        }
      }

      # Local dev only: ephemeral in-memory keys.
      # Production should use KeyManager "disk" or a KMS plugin.
      KeyManager "memory" {
        plugin_data {}
      }

      WorkloadAttestor "k8s" {
        plugin_data {
          # LOCAL DEV ONLY — skip kubelet TLS verification because k3d nodes
          # do not have a CA-signed kubelet certificate.
          # MUST NOT be set in staging or production; remove for any real cluster.
          skip_kubelet_verification = true
        }
      }
    }
