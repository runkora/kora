apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orbit-identity
  labels:
    {{- include "orbit.identity.labels" . | nindent 4 }}
rules:
  # The devenvironments feature's only Kubernetes access, deliberately
  # narrowed to CRUD (+ watch, for the kubeconfig-signing wait) on
  # OrbitDevEnvironment CRs — no namespaces, no pods, no Helm releases, and
  # no access to the status subresource (only the operator's reconciler
  # signs kubeconfig CSRs and advances lifecycle phase).
  - apiGroups: ["orbit.io"]
    resources: ["orbitdevenvironments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
