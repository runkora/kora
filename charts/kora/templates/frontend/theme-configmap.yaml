{{- if include "kora.themeEnabled" . }}
# The theme document the frontend pod mounts and its init container validates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kora-frontend-theme
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.frontend.labels" . | nindent 4 }}
data:
  theme.yaml: |
    {{- .Values.theme.document | nindent 4 }}
{{- end }}
