name: Images

on:
  workflow_call:
    inputs:
      image_tag:
        description: OCI tag to publish. Empty derives it from the event.
        required: false
        default: ""
        type: string
      platforms:
        description: Comma-separated build platforms.
        required: false
        default: linux/amd64
        type: string
      push:
        description: Push the images, or build and discard.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  list-targets:
    name: List bake targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          TARGETS=$(docker buildx bake --print -f docker-bake.hcl 2>/dev/null \
            | jq -c '[.target | keys[] | select(startswith("_") | not)]')
          echo "targets=${TARGETS}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.target }}
    needs: list-targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.list-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: version
        uses: ./.github/actions/derive-version
        with:
          image_tag: ${{ inputs.image_tag }}

      - name: Enable multi-arch emulation
        if: contains(inputs.platforms, 'arm64')
        run: docker run --rm --privileged tonistiigi/binfmt:qemu-v8.1.5 --install arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login also runs on build-only calls: pulling the layer cache from a
      # private GHCR needs auth.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        # docker-bake.hcl tags every image with IMAGE_TAG, which defaults to latest.
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.target }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          set: |
            *.platform=${{ inputs.platforms }}
            *.cache-from=type=registry,ref=ghcr.io/${{ env.IMAGE_NAMESPACE }}/orbit-buildcache:${{ matrix.target }}
            *.cache-to=type=registry,ref=ghcr.io/${{ env.IMAGE_NAMESPACE }}/orbit-buildcache:${{ matrix.target }},mode=max,ignore-error=true
            *.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}
            *.labels.org.opencontainers.image.url=https://github.com/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.labels.org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            *.labels.org.opencontainers.image.created=${{ steps.version.outputs.created }}
