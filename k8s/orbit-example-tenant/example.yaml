apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbit-example
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-example
  labels:
    app: orbit-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbit-example
  template:
    metadata:
      labels:
        app: orbit-example
        spiffe.io/spire-managed-identity: "true"
        spiffe.io/agent: example
        orbit.io/identity-proxy: "enabled"
      annotations:
        # Inject Istio sidecar + SPIRE socket mount + identity-proxy sidecar.
        # The identity-proxy template also patches istio-proxy to mount the
        # shared /run/orbit emptyDir so Envoy can reach the ext_proc socket.
        inject.istio.io/templates: "sidecar,identity-proxy"
        # Hold the app until istio-proxy is ready to avoid Postgres connect
        # failures on pod startup (iptables intercepts before Envoy is ready).
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      serviceAccountName: orbit-example
      containers:
        - name: orbit-example
          image: orbit-registry:5000/orbit-example:latest
          imagePullPolicy: Always
          env:
            - name: APP_ENV
              value: development
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: orbit-config
            - secretRef:
                name: orbit-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orbit-example
spec:
  selector:
    app: orbit-example
  ports:
    - name: http
      port: 80
      targetPort: 8081
      protocol: TCP
