apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policyroles.runkora.io
  labels:
    {{- include "kora-crds.labels" . | nindent 4 }}
  annotations:
    # helm uninstall keeps this CRD. Tenant definitions outlive the product install.
    helm.sh/resource-policy: keep
spec:
  group: runkora.io
  names:
    kind: PolicyRole
    listKind: PolicyRoleList
    plural: policyroles
    singular: policyrole
    shortNames:
      - kpr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Role
          type: string
          jsonPath: .spec.role
        - name: Accepted
          type: string
          jsonPath: .status.conditions[?(@.type=="Accepted")].status
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >
            PolicyRole grants scopes to every user whose identity provider role
            claim matches, in the tenant whose namespace holds it.
            policy-service watches it.
          type: object
          required:
            - spec
          x-kubernetes-validations:
            - rule: "self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') && size(self.metadata.name) <= 63"
              message: metadata.name must be a DNS label.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - scopes
              properties:
                role:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: The identity provider's role claim. Unset means metadata.name.
                scopes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                budget:
                  type: object
                  description: The spending limit for each holder of the role, or for all of them together when pooled.
                  required:
                    - limitUSD
                  properties:
                    limitUSD:
                      type: number
                      exclusiveMinimum: true
                      minimum: 0
                    resetCadence:
                      type: string
                      enum:
                        - weekly
                        - monthly
                      default: monthly
                    pooled:
                      type: boolean
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
