# =============================================================================
# orbit chart — local development values
# =============================================================================
#
# Applied automatically by the orbit-operator when reconciling the OrbitPlatform CR.
# To install manually (escape hatch):
#   helm upgrade --install orbit ./charts/orbit \
#     -f deploy/local/orbit-values.yaml -n orbit-system
#
# Trust domain must match spec.trustDomain in deploy/local/orbit-platform.yaml.
# =============================================================================

global:
  trustDomain: "orbit.local"
  # Force pull from local k3d registry on every pod start.
  # Local registry images are not content-addressed — Always ensures the
  # cluster always runs the freshest locally-built image.
  imagePullPolicy: Always

identity:
  image:
    # Local k3d registry — built by: make docker-push
    repository: orbit-registry:5001/orbit-identity
    tag: latest

  replicas: 1

  # APP_ENV controls which config YAML is loaded at startup.
  # "local" maps to backend/internal/identity/config/local.yaml.
  appEnv: local

  config:
    tenantsConfigPath: "/etc/orbit/tenants.yaml"

  # ConfigMap containing the tenant registry YAML (config/tenants.yaml).
  # Created by: kubectl create configmap orbit-tenants \
  #   --from-file=tenants.yaml=config/tenants.yaml -n orbit-system
  # Or via the GitOps-compatible pattern:
  #   --set identity.existingTenantsConfigMap=orbit-tenants
  existingTenantsConfigMap: orbit-tenants

  # Secret containing DB_PASSWORD, REDIS_PASSWORD, JWT_SIGNING_KEY, and
  # per-tenant OIDC client secrets (e.g. ORBIT_TENANT_EXAMPLE_OIDC_CLIENT_SECRET).
  # Created by: make cluster-secrets (runs scripts/cluster/create-secrets.sh)
  existingSecret: orbit-secrets

  # ConfigMap containing non-secret env vars (DB_HOST, DB_NAME, REDIS_HOST, etc.).
  # Created by the chart itself or manually — see deploy/local/README.md.
  existingConfigMap: orbit-config

platform:
  namespaces:
    system: orbit-system
    tenants:
      - orbit-tenant-example

  spiffe:
    enabled: true

networkPolicy:
  enabled: true
