# A small valid theme: a product name, two colour tokens, a logo for both modes
# and a favicon for dark only, so `favicon.light` falls through. One token and
# one slot are unknown to the manifest, so both are ignored and logged. No fonts.
koraVersion: "1.0.0"
productName: Acme Agents
tokens:
  --hades-raw-100:
    dark: '#0a0a0a'
    light: '#fafafa'
  --hades-raw-accent-500:
    dark: oklch(70% 0.15 250)
  --hades-raw-not-a-token:
    dark: '#123456'
slots:
  logo:
    dark: https://assets.acme.example/brand/logo-dark.svg
    light: https://assets.acme.example/brand/logo-light.svg
  favicon:
    dark: https://assets.acme.example/brand/favicon.svg
  not-a-slot: https://assets.acme.example/brand/nothing.svg
