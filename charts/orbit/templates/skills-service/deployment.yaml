apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-skills-service
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.skillsService.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.skillsService.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.skillsService.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.skillsService.selectorLabels" . | nindent 8 }}
        {{- include "orbit.skillsService.labels" . | nindent 8 }}
        spiffe.io/component: skills-service
        {{- include "orbit.podLabels" (dict "root" $ "name" "skillsService") | nindent 8 }}
      annotations:
        {{- include "orbit.spireProxyAnnotations" (dict "root" $) | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/skills-service/config.yaml") . | sha256sum }}
        {{- include "kora.podAnnotations" (dict "root" $ "name" "skillsService") | nindent 8 }}
    spec:
      serviceAccountName: orbit-skills-service
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.scheduling" (dict "root" $ "name" "skillsService") | nindent 6 }}
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "kora.spireVolumes" . | nindent 8 }}
        {{- include "kora.configVolume" (dict "root" $ "name" "skillsService" "configMap" "kora-skills-service-config" "modules" (include "kora.skillsService.configModules" . | fromYaml)) | nindent 8 }}
        {{- include "kora.redisCAVolume" . | nindent 8 }}
        - name: skill-marketplaces
          configMap:
            name: kora-skill-marketplaces
            optional: true
        - name: skill-marketplace-secrets
          secret:
            secretName: kora-skill-marketplace-secrets
            optional: true
        {{- include "kora.extraVolumes" (dict "root" $ "name" "skillsService") | nindent 8 }}
      containers:
        - name: orbit-skills-service
          image: {{ include "orbit.image" (dict "root" $ "name" "skillsService") | quote }}
          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "skillsService") }}
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix:///run/secrets/workload-spiffe-uds/socket"
            {{- include "kora.platformEnv" (dict "root" $ "name" "skillsService" "keys" (list "REDIS_PASSWORD")) | nindent 12 }}
          ports:
            - name: skills-http
              containerPort: 8098
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8098
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8098
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.skillsService.resources | nindent 12 }}
          volumeMounts:
            {{- include "kora.spireVolumeMount" . | nindent 12 }}
            {{- include "kora.configVolumeMount" . | nindent 12 }}
            {{- include "kora.redisCAVolumeMount" . | nindent 12 }}
            - name: skill-marketplaces
              mountPath: /etc/kora/skill-marketplaces
              readOnly: true
            - name: skill-marketplace-secrets
              mountPath: /etc/kora/skill-marketplace-secrets
              readOnly: true
            {{- include "kora.extraVolumeMounts" (dict "root" $ "name" "skillsService") | nindent 12 }}
