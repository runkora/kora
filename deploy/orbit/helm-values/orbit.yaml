global:
  trustDomain: cluster.local
  namespaces:
    system: orbit-system
    istio: istio-system

identity:
  enabled: true
  image:
    repository: orbit-registry:5001/orbit-identity
    tag: latest
  config:
    postgresSSLMode: "disable"
    postgresCaptureQueryText: "true"
    redisTLSEnabled: "false"
    otlpInsecure: "true"
    logFormat: "console"
  infrastructureConfig:
    create: true
    data:
      DB_HOST: orbit-postgres
      DB_NAME: orbit
      DB_PORT: "5432"
      DB_USER: orbit
      REDIS_HOST: orbit-redis
      REDIS_PORT: "6379"
  tolerations: []
  nodeSelector: {}

identityProxy:
  enabled: true
  workloadSelectorLabels:
    orbit.io/identity-proxy: "enabled"

externalServices:
  # orbit-network subnet — covers orbit-postgres (172.24.0.4), Dex (172.24.0.1:5556), and the Docker gateway
  - cidr: 172.24.0.0/16
    ports:
      - 5432
      - 6379
      - 5556
  # host.k3d.internal resolves to 192.168.5.2 (Docker Desktop internal gateway)
  # Required for Redis access from k3d pods
  - cidr: 192.168.5.0/24
    ports:
      - 6379
