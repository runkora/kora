name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly, so the published score tracks the default branch over time.
    - cron: "31 4 * * 1"
  push:
    branches: [main]
  # Temporary, so the workflow runs once on the fixing PR. Removed in the next commit.
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions replace the top-level set, so the reads the
      # checkout and the analysis need are restated here.
      contents: read
      actions: read
      # Upload the SARIF result to code scanning.
      security-events: write
      # Required by scorecard-action for publishing, harmless while that is off.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing requires a public repository. Set to true once it is.
          publish_results: false

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: results.sarif
