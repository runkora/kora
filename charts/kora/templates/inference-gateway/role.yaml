# The gateway watches InferenceProvider resources and the Secrets they name in
# its own namespace, and writes each resource's status. RBAC cannot narrow
# Secrets by label; the gateway caches only those labelled
# runkora.io/inference-provider=true.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kora-inference-gateway
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.inferenceGateway.labels" . | nindent 4 }}
rules:
  - apiGroups: ["runkora.io"]
    resources: ["inferenceproviders"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["runkora.io"]
    resources: ["inferenceproviders/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kora-inference-gateway
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.inferenceGateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kora-inference-gateway
subjects:
  - kind: ServiceAccount
    name: kora-inference-gateway
    namespace: {{ include "kora.systemNamespace" . }}
