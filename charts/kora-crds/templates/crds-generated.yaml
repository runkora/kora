{{- /*
The declarative CRDs, generated by controller-gen into generated/ (make generate).
This adds the chart labels and keeps each CRD on helm uninstall: tenant
definitions outlive the product install.
*/}}
{{- range $path, $_ := .Files.Glob "generated/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $_ := set $crd.metadata "labels" (include "kora-crds.labels" $ | fromYaml) }}
{{- $_ := set $crd.metadata.annotations "helm.sh/resource-policy" "keep" }}
---
{{ toYaml $crd }}
{{- end }}
