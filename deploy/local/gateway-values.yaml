# Local k3d gateway values
#
# k3d does not run a cloud LoadBalancer controller, so the default
# service.type=LoadBalancer leaves the gateway service in <pending> for its
# EXTERNAL-IP indefinitely. Helm's --wait then blocks until the 10-minute
# timeout because it polls for the LB ingress IP.
#
# Using NodePort lets Helm finish immediately. Traffic reaches the gateway via
# the k3d port-forward mappings defined in infrastructure/bootstrap/k3d-config.yaml:
#   localhost:8880 → node:80
#   localhost:8443 → node:443
service:
  type: NodePort
