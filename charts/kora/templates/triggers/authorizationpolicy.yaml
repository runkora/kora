{{- if and .Values.platform.spiffe.enabled .Values.triggers.authorizationPolicy.enabled }}
# AuthorizationPolicy: restrict who may reach kora-triggers at all.
#
# kora-triggers holds every webhook source's signing secret and can start a run
# under any trigger's own principal. Its own scope enforcement treats a SYSTEM
# principal as unrestricted — the platform-wide convention — so a token minted by
# any other in-mesh component reaches every triggers route. Mesh-wide
# reachability is therefore a much larger surface than the two callers this
# service actually has, and the mesh is the right place to say so: the check runs
# in the sidecar, before the request is ever seen by the application.
#
# ALLOW, not DENY. A DENY listing the callers to exclude is a list that has to be
# kept complete forever; an ALLOW listing the callers that exist fails closed
# when something new appears, which is the direction this service should fail in.
#
# NOTE: Istio prepends "spiffe://" when translating an AuthorizationPolicy to
# Envoy RBAC. Principals are written WITHOUT the prefix — writing it produces
# "spiffe://spiffe://..." in the generated rule and never matches.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: kora-triggers-callers
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.triggers.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kora.triggers.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              {{- range .Values.triggers.authorizationPolicy.systemPrincipals }}
              - "{{ include "kora.trustDomain" $ }}/system/{{ . }}"
              {{- end }}
              {{- range .Values.triggers.authorizationPolicy.meshPrincipals }}
              - "{{ include "kora.trustDomain" $ }}/{{ . }}"
              {{- end }}
    {{- if .Values.triggers.authorizationPolicy.metricsScraperPrincipals }}
    # Prometheus /metrics scrape traffic, scoped to the metrics port only: the
    # metrics endpoint carries no trigger-management authority, so a
    # scraper's principal needs no admission to the rule above. See
    # docs/adr/2026-10-06-prometheus-metrics-endpoints.md, Decision.
    - from:
        - source:
            principals:
              {{- range .Values.triggers.authorizationPolicy.metricsScraperPrincipals }}
              - "{{ include "kora.trustDomain" $ }}/{{ . }}"
              {{- end }}
      to:
        - operation:
            ports:
              - "{{ .Values.global.metrics.port | default 9464 }}"
    {{- end }}
    {{- if .Values.triggers.authorizationPolicy.metricsScraperIPBlocks }}
    # Same exception, for a scraper with no SPIFFE identity (not
    # sidecar-injected into the mesh) — principals can't match a caller with
    # no mTLS identity to present. Matched against the connection's actual
    # source IP instead, regardless of mTLS. See the ADR's Decision.
    - from:
        - source:
            ipBlocks:
              {{- range .Values.triggers.authorizationPolicy.metricsScraperIPBlocks }}
              - "{{ . }}"
              {{- end }}
      to:
        - operation:
            ports:
              - "{{ .Values.global.metrics.port | default 9464 }}"
    {{- end }}
{{- end }}
