# In-cluster URLs the Next.js BFF calls server-side; frontend.config.*
# overrides the release-namespace defaults. Only NEXT_PUBLIC_APP_URL reaches
# the browser, and it must match the build-time value.
{{- $ns := include "orbit.systemNamespace" . }}
{{- $c := .Values.frontend.config }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: orbit-frontend-config
  namespace: {{ $ns }}
  labels:
    {{- include "orbit.frontend.labels" . | nindent 4 }}
data:
  ORBIT_API_URL: {{ $c.orbitApiUrl | default (printf "http://orbit-identity.%s.svc.cluster.local/api/v1" $ns) | quote }}
  ORBIT_TRIGGERS_URL: {{ $c.orbitTriggersUrl | default (printf "http://orbit-triggers.%s.svc.cluster.local/api/v1" $ns) | quote }}
  INFERENCE_GATEWAY_URL: {{ $c.inferenceGatewayUrl | default (printf "http://orbit-inference-gateway.%s.svc.cluster.local/v1" $ns) | quote }}
  POLICY_GATEWAY_URL: {{ $c.policyGatewayUrl | default (printf "http://orbit-policy-gateway.%s.svc.cluster.local/v1" $ns) | quote }}
  POLICY_SERVICE_URL: {{ $c.policyServiceUrl | default (printf "http://orbit-policy-service.%s.svc.cluster.local/api/v1" $ns) | quote }}
  ORBIT_AGENTS_URL: {{ $c.orbitAgentsUrl | default (printf "http://orbit-agents.%s.svc.cluster.local" $ns) | quote }}
  TOOL_GATEWAY_URL: {{ $c.toolGatewayUrl | default (printf "http://orbit-tool-gateway.%s.svc.cluster.local" $ns) | quote }}
  SKILLS_SERVICE_URL: {{ $c.skillsServiceUrl | default (printf "http://orbit-skills-service.%s.svc.cluster.local" $ns) | quote }}
  NEXT_PUBLIC_APP_URL: {{ $c.nextPublicAppUrl | default (printf "https://%s" (include "orbit.frontendHost" .)) | quote }}
