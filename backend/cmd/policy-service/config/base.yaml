app:
  version: "0.1.0"

server:
  port: 8083
  basePath: "/api/v1"
  shutdownTimeoutSecs: 30

bundle:
  # The chart renders jwksURL and frontendHost.
  issuer: "kora"
  audience: "kora-platform"
  # Where the chart mounts the kora-tenants ConfigMap.
  tenantsPath: /etc/kora/tenants.yaml

observability:
  serviceName: "policy-service"

metrics:
  enabled: true
  port: 9464
  shutdownTimeoutSecs: 5
