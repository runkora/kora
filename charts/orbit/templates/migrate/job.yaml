# Applies the database schema before any workload rolls
# (docs/adr/2026-09-10-database-migrations.md). Helm blocks the release until
# the Job succeeds; Argo CD runs it as a PreSync hook. A failed Job is kept
# for inspection under Helm; before-hook-creation replaces it on the next run.
apiVersion: batch/v1
kind: Job
metadata:
  name: orbit-migrate
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.migrate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "orbit.migrate.labels" . | nindent 8 }}
        {{- include "orbit.podLabels" (dict "root" $ "name" "migrate") | nindent 8 }}
      annotations:
        # A plain Postgres connection needs no SVID and no Envoy.
        sidecar.istio.io/inject: "false"
        {{- include "orbit.podAnnotations" (dict "root" $ "name" "migrate") | nindent 8 }}
    spec:
      # No API access and no mesh identity: the default ServiceAccount with no
      # token is enough.
      automountServiceAccountToken: false
      restartPolicy: Never
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.scheduling" (dict "root" $ "name" "migrate") | nindent 6 }}
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "orbit.image" (dict "root" $ "name" "migrate") | quote }}
          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "migrate") }}
          command: ["./orbit"]
          args: ["up"]
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict) | nindent 12 }}
          # Rendered inline rather than through orbit-config: that ConfigMap is
          # an ordinary release resource and does not exist when the hook runs.
          env:
            - name: DB_HOST
              value: {{ required "config.db.host must be set" .Values.config.db.host | quote }}
            - name: DB_PORT
              value: {{ .Values.config.db.port | quote }}
            - name: DB_NAME
              value: {{ .Values.config.db.name | quote }}
            - name: DB_USER
              value: {{ .Values.config.db.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.platformSecretName }}
                  key: DB_PASSWORD
            - name: ORBIT_POSTGRES_SSL_MODE
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "migrate" "field" "postgresSSLMode" "default" .Values.global.postgres.sslMode) | quote }}
            - name: ORBIT_LOG_FORMAT
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "migrate" "field" "logFormat" "default" .Values.global.logFormat) | quote }}
            {{- include "orbit.extraEnv" (dict "root" $ "name" "migrate") | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
