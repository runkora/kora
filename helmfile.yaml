# =============================================================================
# helmfile.yaml — Reference / Escape-Hatch Install Manifest
# =============================================================================
#
# NOTE: This file is NOT the primary install path for local development.
# The orbit-operator (make cluster-operator + kubectl apply deploy/local/orbit-platform.yaml)
# is the canonical way to install and manage the full platform stack.
#
# Helmfile is retained as a reference implementation and escape hatch for:
#   - Manual inspection of individual releases (helmfile diff)
#   - Emergency recovery when the operator is unavailable
#   - CI environments that do not run the operator
#
# WHY NOT A SINGLE HELM CHART?
# ─────────────────────────────
# Istio and SPIRE chart templates hardcode their own namespaces (istio-system,
# spire-system) for ServiceAccounts, ClusterRoleBindings, and webhooks. If
# installed as sub-charts of a parent chart in a different namespace (e.g.
# orbit-system), the ServiceAccount and Deployment land in different namespaces
# and pods fail to start. The operator solves this by driving each release
# independently into its canonical namespace with correct ordering.
#
# USAGE (escape hatch only)
# ─────────────────────────
#   helmfile apply --environment local       # install / upgrade everything
#   helmfile diff  --environment local       # dry-run diff
#   helmfile destroy --environment local     # tear down all releases
#   helmfile apply --environment local -l name=orbit-platform   # single release
#
# ENVIRONMENTS
# ─────────────
#   local    — k3d local dev cluster (values from deploy/local/)
#   default  — chart defaults only; suitable base for your own environment
#
# ADDING A NEW ENVIRONMENT
# ─────────────────────────
# NOTE: SPIRE and Istio are managed by the orbit-operator, not helmfile.
# The helmfile escape-hatch only covers the orbit-platform chart.
#
# 1. Create deploy/<env>/helmfile-env.yaml:
#
#      orbitPlatform:
#        valuesFile: deploy/<env>/platform-values.yaml
#
# 2. Add the environment below (same pattern as `local`).
# 3. Run: helmfile apply --environment <env>
#
# NOTE: charts/orbit-platform is currently a local chart. Publishing to an OCI
# registry (oci://ghcr.io/orbitapp/charts/orbit-platform) is tracked in ADR-0024.
# =============================================================================

environments:
  # Default environment — chart defaults only, no local overrides.
  default:
    values:
      - deploy/versions.yaml

  # Local k3d development cluster.
  local:
    values:
      - deploy/versions.yaml
      - deploy/local/helmfile-env.yaml

---
# =============================================================================
# Helm repositories
# =============================================================================

repositories:
  - name: spiffe
    url: https://spiffe.github.io/helm-charts-hardened/
  - name: istio
    url: https://istio-release.storage.googleapis.com/charts

# =============================================================================
# Releases — installed in dependency order via `needs:`
# =============================================================================

releases:

  # ── SPIRE CRDs ─────────────────────────────────────────────────────────────
  # Must be a separate release installed BEFORE spire. The spiffe/spire-crds
  # chart ships CRDs in templates/ (not crds/), so Helm 3's CRD-install-first
  # guarantee does NOT apply when bundled as a sub-chart. Installing it first
  # as a standalone release ensures CRDs exist before spire reconciles them.
  - name: spire-crds
    namespace: spire-system
    createNamespace: true
    chart: spiffe/spire-crds
    version: {{ .Values.versions.spire_crds_chart | quote }}
    wait: true
    waitForJobs: true

  # ── SPIRE ──────────────────────────────────────────────────────────────────
  # Release name "spire" in namespace "spire-system" is load-bearing:
  # the SPIRE controller manager derives ClusterSPIFFEID className as
  # "<namespace>-<release>" = "spire-system-spire". All ClusterSPIFFEID
  # resources in charts/orbit-platform/templates/ reference this className.
  # Do NOT change the release name or namespace without updating those resources.
  - name: spire
    namespace: spire-system
    chart: spiffe/spire
    version: {{ .Values.versions.spire_chart | quote }}
    needs:
      - spire-system/spire-crds
    wait: true
    timeout: 180
    values:
{{- if .Values.spire.valuesFile }}
      - {{ .Values.spire.valuesFile | quote }}
{{- end }}

  # ── Istio Base (CRDs + cluster-scoped resources) ───────────────────────────
  - name: istio-base
    namespace: istio-system
    createNamespace: true
    chart: istio/base
    version: {{ .Values.versions.istio_chart | quote }}
    wait: true

  # ── istiod (control plane) ─────────────────────────────────────────────────
  - name: istiod
    namespace: istio-system
    chart: istio/istiod
    version: {{ .Values.versions.istio_chart | quote }}
    needs:
      - istio-system/istio-base
    wait: true
    timeout: 120
    values:
{{- if .Values.istiod.valuesFile }}
      - {{ .Values.istiod.valuesFile | quote }}
{{- end }}

  # ── Istio Gateway ──────────────────────────────────────────────────────────
  # No --wait: the gateway pod starts quickly but Helm's readiness probe can
  # race in slow environments. orbit-platform does not depend on gateway readiness.
  - name: gateway
    namespace: istio-system
    chart: istio/gateway
    version: {{ .Values.versions.istio_chart | quote }}
    needs:
      - istio-system/istiod

  # ── orbit-platform (ClusterSPIFFEIDs + NetworkPolicies) ────────────────────
  # Thin chart containing only cluster-scoped Orbit resources. Does NOT manage
  # SPIRE or Istio — those are the releases above. Depends on both SPIRE and
  # istiod being ready so ClusterSPIFFEIDs can be reconciled on first install.
  # NOTE: createNamespace is intentionally absent here. The chart's own
  # namespaces.yaml template creates orbit-system with the correct Istio and
  # SPIRE labels. Using helmfile's createNamespace:true causes Helm to
  # pre-create a bare namespace which then conflicts with the chart's Namespace
  # template during pre-flight validation. No wait: because this chart has no
  # Pods -- there is nothing to poll readiness on after resources are applied.
  - name: orbit-platform
    namespace: orbit-system
    chart: charts/orbit-platform
    needs:
      - spire-system/spire
      - istio-system/istiod
    values:
{{- if .Values.orbitPlatform.valuesFile }}
      - {{ .Values.orbitPlatform.valuesFile | quote }}
{{- end }}
