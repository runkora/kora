app:
  version: "0.1.0"

server:
  httpPort: 8095
  basePath: ""
  shutdownTimeoutSecs: 30

# The chart renders the backends' service URLs.

observability:
  serviceName: "orbit-mcp"

metrics:
  enabled: true
  port: 9464
  path: /metrics
  shutdownTimeoutSecs: 5
  namespace: ""
  collectGoRuntimeMetrics: true
  collectProcessMetrics: true
