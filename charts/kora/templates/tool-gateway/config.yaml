{{- /*
tool-gateway config files (docs/adr/2026-10-06-rendered-service-config-files.md),
one ConfigMap per Deployment. Takes (dict "root" $ "mode" "publisher"|"proxy").
*/}}
{{- define "kora.toolGateway.configModules" -}}
{{- with .root }}
cmd/tool-gateway:
  mode: {{ $.mode | toJson }}
  publicHosts: {{ splitList "," (include "kora.publicHosts" .) | compact | toJson }}
  metrics:
    enabled: {{ .Values.global.metrics.enabled }}
    port: {{ .Values.global.metrics.port | default 9464 }}
  identity:
    internalURL: {{ include "kora.serviceURL" (dict "root" . "name" "orbit-identity") | toJson }}
  policy:
    policyServiceInternalURL: {{ include "kora.serviceURL" (dict "root" . "name" "orbit-policy-service") | toJson }}
    bundleEndpoint: {{ include "kora.bundleEndpoint" . | toJson }}
{{ include "kora.observabilityConfigModule" . }}
{{ include "kora.storageConfigModule" (dict "root" . "redisClient" (eq $.mode "proxy")) }}
{{ include "kora.tokenConfigModule" . }}
{{- end }}
{{- end }}
{{- include "kora.configMap" (dict "root" $ "name" "toolGateway" "configMap" "orbit-tool-gateway-publisher-config" "modules" (include "kora.toolGateway.configModules" (dict "root" $ "mode" "publisher") | fromYaml)) }}
---
{{ include "kora.configMap" (dict "root" $ "name" "toolGateway" "configMap" "orbit-tool-gateway-config" "modules" (include "kora.toolGateway.configModules" (dict "root" $ "mode" "proxy") | fromYaml)) }}
