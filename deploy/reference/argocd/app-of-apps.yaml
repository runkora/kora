# Use sync waves to install releases in dependency order.
# The orbit Application's second source is a placeholder: replace repoURL with
# your own GitOps values repository holding an orbit chart values file.
# Configure OCI registry credentials when required.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spire-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://spiffe.github.io/helm-charts-hardened
    chart: spire-crds
    targetRevision: 0.6.1
  destination:
    server: https://kubernetes.default.svc
    namespace: spire-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spire
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://spiffe.github.io/helm-charts-hardened
    chart: spire
    targetRevision: 0.30.2
    helm:
      values: |
        global:
          spire:
            trustDomain: orbit.example.com
            clusterName: orbit
        spire-server:
          controllerManager:
            identities:
              clusterSPIFFEIDs:
                # The chart's catch-all registration would race Orbit's own.
                default:
                  enabled: false
          nodeAttestor:
            k8sPSAT:
              enabled: true
              clusters:
                orbit:
                  service_account_allow_list:
                    - spire-system:spire-agent
        spire-agent:
          sds:
            enabled: true
            defaultSVIDName: default
            defaultBundleName: ROOTCA
            defaultAllBundlesName: ALL
          nodeAttestor:
            k8sPSAT:
              enabled: true
          workloadAttestors:
            k8s:
              enabled: true
              disableContainerSelectors: true
              useNewContainerLocator: false
        spiffe-csi-driver:
          enabled: true
        spire-controller-manager:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: spire-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
