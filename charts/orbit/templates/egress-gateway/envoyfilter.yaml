# EnvoyFilter: HTTP CONNECT proxy-chaining for the egress gateway.
#
# Architecture:
#
#   sandbox tool (curl/git/SDK with HTTPS_PROXY=http://orbit-egress-gateway:8085)
#     │
#     │  CONNECT example.com:443 HTTP/1.1
#     │  Host: example.com:443
#     ▼
#   sandbox-side istio-proxy (SIDECAR_OUTBOUND HCM for service "8085")
#     │  identity-proxy ext_proc filter injects:
#     │    Authorization: Bearer <platform-token>
#     │
#     │  CONNECT routed by connect_matcher route to the egress-gateway cluster
#     │  in PROXY mode (route has upgrade_configs:[CONNECT] but NO
#     │  connect_config) — Envoy forwards the CONNECT request, with the
#     │  injected header, upstream as a normal HTTP request rather than
#     │  terminating it and tunnelling raw TCP.
#     ▼
#   gateway-side istio-proxy (SIDECAR_INBOUND HCM for port 8085)
#     │  Same shape: HCM upgrade_configs:[CONNECT], connect_matcher route in
#     │  PROXY mode forwarding the CONNECT to the local app cluster
#     │  (inbound|8085||).
#     ▼
#   orbit-egress-gateway application :8085  ← terminates the CONNECT
#     │  net/http server. r.Method == "CONNECT" → ConnectHandler hijacks,
#     │  writes 200 Connection Established, runs TLS termination using the
#     │  per-tenant CA, dispatches the inner request to ProxyHandler.
#
# This is the classic forward-proxy CHAIN (cf. Squid cache_peer): each Envoy
# hop forwards the CONNECT as an ordinary HTTP request through its filter
# chain — so ext_proc injects the Bearer on the way out — and only the FINAL
# hop (our Go app) terminates it. Envoy controls this per-route:
#   - route.upgrade_configs[CONNECT] WITHOUT connect_config → proxy/forward
#     the CONNECT upstream (headers preserved, filter chain runs).
#   - route.upgrade_configs[CONNECT] WITH    connect_config → terminate the
#     CONNECT locally: the router STRIPS the request headers and tunnels raw
#     TCP. That destroys the injected Bearer and means our app never sees a
#     CONNECT — the bug this file originally shipped with.
# See envoy configs/proxy_connect.yaml for the canonical proxy-mode shape.
#
# Without the upgrade_configs + connect_matcher patches, Istio's HCM rejects
# the unknown CONNECT method with 404 (sandbox-side) or never routes the
# CONNECT to our application (gateway-side). With them (in proxy mode),
# CONNECT flows through the mesh carrying the Bearer token, and our
# application sees a normal *http.Request the standard library understands.
#
# We deliberately keep the mesh in the path on both sides:
#  - Sandbox-side: identity-proxy ext_proc must see the CONNECT to inject
#    the platform token. The token is the gateway's only signal of caller
#    identity — without it there's no policy decision and no mint.
#  - Gateway-side: istio-proxy delivers the request to the application as
#    HTTP. Our handler stays in net/http land; all the platform middleware
#    (logging, tracing, AuthMiddleware) applies normally.
#
# The Service port (charts/orbit/templates/egress-gateway/service.yaml) MUST
# be named "http-connect" — Istio only renders an HCM for "http-*" port
# names; a "tcp-*" name would short-circuit to a TCP proxy and there'd be no
# HCM for this filter to patch.
{{- if .Values.networkPolicy.enabled }}
---
# ── Sandbox outbound: enable HCM CONNECT pass-through ────────────────────────
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: egress-gateway-connect-outbound
  namespace: {{ .Values.istio.namespace }}
  labels:
    {{- include "orbit.egressGateway.labels" . | nindent 4 }}
spec:
  # Sandbox pods are labelled orbit.io/role=sandbox by the orbit-agents
  # provisioner. Selector lives in istio-system so it applies across every
  # tenant namespace's sandbox pods.
  workloadSelector:
    labels:
      orbit.io/role: sandbox
  configPatches:
    # 1. Add upgrade_configs: [CONNECT] to the SIDECAR_OUTBOUND HCM for the
    #    egress-gateway service (port 8085). This makes Envoy accept CONNECT
    #    requests on this listener and pass them through end-to-end.
    - applyTo: NETWORK_FILTER
      match:
        context: SIDECAR_OUTBOUND
        listener:
          filterChain:
            destinationPort: {{ .Values.egressGateway.connectPort }}
            filter:
              name: "envoy.filters.network.http_connection_manager"
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            upgrade_configs:
              - upgrade_type: CONNECT
    # 2. Add a CONNECT-matching route to the outbound route_config Istio
    #    renders for port 8085. Outbound HTTP route configs are named by port
    #    number ("8085" here).
    #
    #    CRITICAL — virtual-host selection: a forward-proxy CONNECT is
    #    addressed to the DESTINATION, so its :authority is "example.com:443",
    #    NOT the gateway service. Envoy picks the virtual host by :authority,
    #    so the CONNECT never lands on the gateway-service vhost (domains =
    #    the gateway FQDN/IP) — it lands on the catch-all "allow_any" vhost
    #    (domains ["*"]), whose only route is prefix:"/" and therefore cannot
    #    match a CONNECT (which has no :path) → Istio returns 404. We must
    #    attach our connect_matcher route to the "*"-matching vhost itself.
    #
    #    "allow_any" is Istio's passthrough vhost, present when the mesh
    #    outboundTrafficPolicy is ALLOW_ANY (the default). The route still
    #    forwards to the gateway cluster, and the sandbox's NetworkPolicy is
    #    what actually constrains egress — agents can only reach the gateway.
    #
    #    INSERT_FIRST so the connect route is evaluated before allow_any's
    #    prefix:"/" passthrough route. (Harmless either way — connect_matcher
    #    only matches CONNECT and prefix:"/" only matches requests with a
    #    path — but explicit ordering avoids surprises across Istio versions.)
    - applyTo: HTTP_ROUTE
      match:
        context: SIDECAR_OUTBOUND
        routeConfiguration:
          name: "{{ .Values.egressGateway.connectPort }}"
          vhost:
            name: "allow_any"
      patch:
        operation: INSERT_FIRST
        value:
          name: connect-passthrough
          match:
            connect_matcher: {}
          route:
            cluster: "outbound|{{ .Values.egressGateway.connectPort }}||orbit-egress-gateway.{{ include "orbit.systemNamespace" . }}.svc.cluster.local"
            # PROXY mode: NO connect_config. Forward the CONNECT (with the
            # ext_proc-injected Bearer) to the gateway as an HTTP request.
            upgrade_configs:
              - upgrade_type: CONNECT
---
# ── Gateway inbound: enable HCM CONNECT pass-through ─────────────────────────
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: egress-gateway-connect-inbound
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.egressGateway.labels" . | nindent 4 }}
spec:
  workloadSelector:
    labels:
      {{- include "orbit.egressGateway.selectorLabels" . | nindent 6 }}
  configPatches:
    # 1. Add upgrade_configs: [CONNECT] to the SIDECAR_INBOUND HCM on
    #    port 8085 of the gateway pod, so istio-proxy delivers CONNECT
    #    requests to our application as HTTP rather than reject/tunnel.
    - applyTo: NETWORK_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            destinationPort: {{ .Values.egressGateway.connectPort }}
            filter:
              name: "envoy.filters.network.http_connection_manager"
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            upgrade_configs:
              - upgrade_type: CONNECT
    # 2. Add a CONNECT-matching route on the inbound route_config. Inbound
    #    Istio route configs are named "inbound|<port>||" with a vhost
    #    "inbound|http|<port>". The cluster the route forwards to is the
    #    local-app cluster "inbound|<port>||", which lands on our
    #    application listener inside the pod.
    - applyTo: HTTP_ROUTE
      match:
        context: SIDECAR_INBOUND
        routeConfiguration:
          name: "inbound|{{ .Values.egressGateway.connectPort }}||"
          vhost:
            name: "inbound|http|{{ .Values.egressGateway.connectPort }}"
      patch:
        operation: ADD
        value:
          name: connect-passthrough
          match:
            connect_matcher: {}
          route:
            cluster: "inbound|{{ .Values.egressGateway.connectPort }}||"
            # PROXY mode: NO connect_config. Forward the CONNECT to our app
            # so net/http sees r.Method == "CONNECT" and ConnectHandler runs.
            upgrade_configs:
              - upgrade_type: CONNECT
{{- end }}
