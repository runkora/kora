apiVersion: v1
kind: Service
metadata:
  name: kora-opa-gateway
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.opaGateway.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kora.opaGateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: 9191
      targetPort: 9191
      protocol: TCP
