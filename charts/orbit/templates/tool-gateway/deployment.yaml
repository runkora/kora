# Publisher: introspects MCP servers and publishes scopes. Single writer, not
# behind the Service. It fetches its own platform token in-process.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-tool-gateway-publisher
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.toolGateway.labels" . | nindent 4 }}
    orbit.io/mode: publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "orbit.toolGateway.selectorLabels" . | nindent 6 }}
      orbit.io/mode: publisher
  template:
    metadata:
      labels:
        {{- include "orbit.toolGateway.selectorLabels" . | nindent 8 }}
        {{- include "orbit.toolGateway.labels" . | nindent 8 }}
        orbit.io/mode: publisher
        spiffe.io/component: tool-gateway
        {{- include "orbit.podLabels" (dict "root" $ "name" "toolGateway") | nindent 8 }}
      annotations:
        {{- include "orbit.spireProxyAnnotations" (dict "root" $) | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/tool-gateway/config.yaml") . | sha256sum }}
        {{- include "orbit.podAnnotations" (dict "root" $ "name" "toolGateway") | nindent 8 }}
    spec:
      serviceAccountName: orbit-tool-gateway
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.scheduling" (dict "root" $ "name" "toolGateway") | nindent 6 }}
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "orbit.spireVolumes" . | nindent 8 }}
        {{- include "orbit.configVolume" (dict "root" $ "name" "toolGateway" "configMap" "orbit-tool-gateway-publisher-config" "modules" (include "orbit.toolGateway.configModules" (dict "root" $ "mode" "publisher") | fromYaml)) | nindent 8 }}
        - name: mcp-servers
          configMap:
            name: {{ .Values.toolGateway.mcpServersConfigMapName }}
            optional: true
        {{- include "orbit.extraVolumes" (dict "root" $ "name" "toolGateway") | nindent 8 }}
      containers:
        - name: orbit-tool-gateway
          image: {{ include "orbit.image" (dict "root" $ "name" "toolGateway") | quote }}
          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "toolGateway") }}
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            {{- include "orbit.platformEnv" (dict "root" $ "keys" (list "DB_PASSWORD")) | nindent 12 }}
            {{- include "orbit.extraEnv" (dict "root" $ "name" "toolGateway") | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.toolGateway.httpPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.toolGateway.httpPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.toolGateway.httpPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.toolGateway.resources | nindent 12 }}
          volumeMounts:
            {{- include "orbit.spireVolumeMount" . | nindent 12 }}
            {{- include "orbit.configVolumeMount" . | nindent 12 }}
            - name: mcp-servers
              mountPath: /var/run/orbit/mcp-servers
              readOnly: true
            {{- include "orbit.extraVolumeMounts" (dict "root" $ "name" "toolGateway") | nindent 12 }}
