apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-policy-gateway
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.policyGateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.policyGateway.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.policyGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.policyGateway.selectorLabels" . | nindent 8 }}
        {{- include "orbit.policyGateway.labels" . | nindent 8 }}
        spiffe.io/spire-managed-identity: "true"
        spiffe.io/component: policy-gateway
      annotations:
        inject.istio.io/templates: "sidecar,spire"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      serviceAccountName: orbit-policy-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      volumes:
        - name: spire-workload-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
      containers:
        - name: orbit-policy-gateway
          image: "{{ .Values.policyGateway.image.repository }}:{{ include "orbit.policyGateway.imageTag" . }}"
          imagePullPolicy: {{ include "orbit.policyGateway.imagePullPolicy" . }}
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: ORBIT_OTLP_INSECURE
              value: {{ .Values.policyGateway.config.otlpInsecure | quote }}
            - name: ORBIT_LOG_FORMAT
              value: {{ .Values.policyGateway.config.logFormat | quote }}
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.policyGateway.resources | nindent 12 }}
          volumeMounts:
            - name: spire-workload-socket
              mountPath: /run/secrets/workload-spiffe-uds
              readOnly: true
