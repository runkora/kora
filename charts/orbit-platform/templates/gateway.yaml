# Istio Gateway resource for all externally-reachable Orbit services.
#
# This is a platform concern — it owns the external ingress configuration for
# the cluster and is shared by every service that needs external access.
# Individual services declare their own VirtualService resources (in the orbit
# chart) that reference this Gateway by name.
#
# Current hosts:
#   orbit.local.clearroute.io     → orbit-frontend     (browser UI)
#   api.orbit.local.clearroute.io → orbit-inference-gateway  (developer / agent CLI API)
#
# The selector `app: gateway` matches the Istio ingress gateway pods
# deployed in istio-system by the operator's `gateway` Helm release.
#
# TLS (gateway.tls.enabled=true):
#   HTTPS on port 443 using credentialName secret in istio-system.
#   HTTP on port 80 redirects to HTTPS.
#   Local dev: k3d maps host:8443 → lb:443 and host:8880 → lb:80.
#
# No TLS (default):
#   HTTP only on port 80. Useful for environments where TLS is terminated
#   upstream (e.g. a cloud load balancer).
#
# Ref: ADR-0034 (frontend cluster deployment and ingress routing)
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: orbit-gateway
  namespace: {{ include "orbit-platform.systemNamespace" . }}
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
spec:
  selector:
    # Selects the Istio ingress gateway pods in istio-system.
    # The gateway Helm chart labels pods with app=gateway and istio=gateway.
    app: gateway
  servers:
    {{- if .Values.gateway.tls.enabled }}
    # HTTPS — terminate TLS at the gateway using the named secret from istio-system.
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.gateway.tls.credentialName }}
      hosts:
        - "orbit.local.clearroute.io"
        - "api.orbit.local.clearroute.io"
    # HTTP — redirect all traffic to HTTPS.
    - port:
        number: 80
        name: http
        protocol: HTTP
      tls:
        httpsRedirect: true
      hosts:
        - "orbit.local.clearroute.io"
        - "api.orbit.local.clearroute.io"
    {{- else }}
    # HTTP only — no TLS termination at the gateway.
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "orbit.local.clearroute.io"
        - "api.orbit.local.clearroute.io"
    {{- end }}
