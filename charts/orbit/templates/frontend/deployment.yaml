apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-frontend
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.frontend.selectorLabels" . | nindent 8 }}
        {{- include "orbit.frontend.labels" . | nindent 8 }}
        # Required for SPIRE workload attestation — triggers ClusterSPIFFEID
        # orbit-system-component to issue:
        #   spiffe://<trust-domain>/system/frontend
        spiffe.io/spire-managed-identity: "true"
        spiffe.io/component: frontend
      annotations:
        # Inject the base Istio sidecar plus the custom SPIRE socket template.
        inject.istio.io/templates: "sidecar,spire"
        # Hold the application container until the Envoy proxy is ready.
        # Prevents the frontend from accepting traffic before mTLS is established.
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
          proxyMetadata:
            PILOT_CERT_PROVIDER: spire
            SPIFFE_ENDPOINT_SOCKET: unix:///run/secrets/workload-spiffe-uds/socket
        # Mount the SPIRE CSI socket into the injected Envoy sidecar.
        sidecar.istio.io/userVolumeMount: '{"spire-workload-socket":{"mountPath":"/run/secrets/workload-spiffe-uds","readOnly":true}}'
    spec:
      serviceAccountName: orbit-frontend
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.nodeSelector" . | nindent 6 }}
      {{- include "orbit.tolerations" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      volumes:
        # SPIFFE CSI volume — delivers the SVID workload socket to the sidecar.
        - name: spire-workload-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
      containers:
        - name: orbit-frontend
          image: "{{ .Values.frontend.image.repository }}:{{ include "orbit.frontend.imageTag" . }}"
          imagePullPolicy: {{ include "orbit.frontend.imagePullPolicy" . }}
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: orbit-frontend-config
            {{- if .Values.frontend.existingSecret }}
            - secretRef:
                name: {{ .Values.frontend.existingSecret }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: spire-workload-socket
              mountPath: /run/secrets/workload-spiffe-uds
              readOnly: true
