# Applies the database schema before any workload rolls
# (docs/adr/2026-09-10-database-migrations.md). Helm blocks the release until
# the Job succeeds; Argo CD runs it as a PreSync hook. A failed Job is kept
# for inspection under Helm; before-hook-creation replaces it on the next run.
apiVersion: batch/v1
kind: Job
metadata:
  name: orbit-migrate
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.migrate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "orbit.migrate.labels" . | nindent 8 }}
        {{- include "orbit.podLabels" (dict "root" $ "name" "migrate") | nindent 8 }}
      annotations:
        # A plain Postgres connection needs no SVID and no Envoy.
        sidecar.istio.io/inject: "false"
        checksum/config: {{ include (print $.Template.BasePath "/migrate/config.yaml") . | sha256sum }}
        {{- include "orbit.podAnnotations" (dict "root" $ "name" "migrate") | nindent 8 }}
    spec:
      # No API access and no mesh identity: the default ServiceAccount with no
      # token is enough.
      automountServiceAccountToken: false
      restartPolicy: Never
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.scheduling" (dict "root" $ "name" "migrate") | nindent 6 }}
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "orbit.configVolume" (dict "root" $ "name" "migrate" "configMap" "orbit-migrate-config" "modules" (include "orbit.migrate.configModules" . | fromYaml)) | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "orbit.image" (dict "root" $ "name" "migrate") | quote }}
          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "migrate") }}
          command: ["./orbit"]
          args: ["up"]
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict) | nindent 12 }}
          env:
            {{- include "orbit.platformEnv" (dict "root" $ "name" "migrate" "keys" (list "DB_PASSWORD")) | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          volumeMounts:
            {{- include "orbit.configVolumeMount" . | nindent 12 }}
