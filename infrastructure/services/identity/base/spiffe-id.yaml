apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: identity
spec:
  spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/system/identity"
  podSelector:
    matchLabels:
      app: identity
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - orbit
