{{- if .Values.platform.spiffe.enabled }}
# East-west callers need client mTLS pinned to the workload's SPIFFE identity,
# otherwise in-mesh requests fail with cx_connect_fail.
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: kora-triggers-client-policy
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.triggers.labels" . | nindent 4 }}
spec:
  host: kora-triggers.{{ include "kora.systemNamespace" . }}.svc.cluster.local
  exportTo: ["*"]
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
      subjectAltNames:
        - "spiffe://{{ include "kora.trustDomain" . }}/system/kora-triggers"
{{- end }}
