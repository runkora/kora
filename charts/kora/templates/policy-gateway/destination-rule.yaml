{{- if .Values.platform.spiffe.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: kora-policy-gateway-client-policy
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.policyGateway.labels" . | nindent 4 }}
spec:
  host: kora-policy-gateway.{{ include "kora.systemNamespace" . }}.svc.cluster.local
  exportTo: ["*"]
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
      subjectAltNames:
        - "spiffe://{{ include "kora.trustDomain" . }}/system/policy-gateway"
{{- end }}
