apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-policy-gateway
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.policyGateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.policyGateway.replicas }}
  selector:
    matchLabels:
      {{- include "kora.policyGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kora.policyGateway.selectorLabels" . | nindent 8 }}
        {{- include "kora.policyGateway.labels" . | nindent 8 }}
        spiffe.io/component: policy-gateway
        {{- include "kora.podLabels" (dict "root" $ "name" "policyGateway") | nindent 8 }}
      annotations:
        {{- include "kora.spireProxyAnnotations" (dict "root" $) | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/policy-gateway/config.yaml") . | sha256sum }}
        {{- include "kora.podAnnotations" (dict "root" $ "name" "policyGateway") | nindent 8 }}
    spec:
      serviceAccountName: orbit-policy-gateway
      {{- include "kora.imagePullSecrets" . | nindent 6 }}
      {{- include "kora.scheduling" (dict "root" $ "name" "policyGateway") | nindent 6 }}
      securityContext:
        {{- include "kora.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "kora.spireVolumes" . | nindent 8 }}
        {{- include "kora.configVolume" (dict "root" $ "name" "policyGateway" "configMap" "orbit-policy-gateway-config" "modules" (include "kora.policyGateway.configModules" . | fromYaml)) | nindent 8 }}
        {{- include "kora.redisCAVolume" . | nindent 8 }}
        {{- include "kora.extraVolumes" (dict "root" $ "name" "policyGateway") | nindent 8 }}
      containers:
        - name: orbit-policy-gateway
          image: {{ include "kora.image" (dict "root" $ "name" "policyGateway") | quote }}
          imagePullPolicy: {{ include "kora.imagePullPolicy" (dict "root" $ "name" "policyGateway") }}
          securityContext:
            {{- include "kora.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            {{- include "kora.platformEnv" (dict "root" $ "name" "policyGateway" "keys" (list "REDIS_PASSWORD")) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
            {{- if .Values.global.metrics.enabled }}
            - name: http-metrics
              containerPort: {{ .Values.global.metrics.port | default 9464 }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.policyGateway.resources | nindent 12 }}
          volumeMounts:
            {{- include "kora.spireVolumeMount" . | nindent 12 }}
            {{- include "kora.configVolumeMount" . | nindent 12 }}
            {{- include "kora.redisCAVolumeMount" . | nindent 12 }}
            {{- include "kora.extraVolumeMounts" (dict "root" $ "name" "policyGateway") | nindent 12 }}
