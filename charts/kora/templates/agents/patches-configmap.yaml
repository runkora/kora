{{- /*
Manifest patches ConfigMap (docs/adr/2026-09-15-manifest-patches-configmap.md).

Mounted at /etc/kora/manifest-patches inside the orbit-agents pod. Each
.Values.agents.manifestPatches entry is one kustomize `patches:` entry,
written as "<key>.yaml". Keys sort into apply order.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: orbit-agents-manifest-patches
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.agents.labels" . | nindent 4 }}
data:
{{- range $name, $patch := .Values.agents.manifestPatches }}
  {{ $name }}.yaml: |
{{ toYaml $patch | indent 4 }}
{{- end }}
