app:
  version: "0.1.0"

server:
  # Webhook ingestion, the trigger management API, and health.
  port: 8097
  # Must stay /api/v1: the inbound webhook path is basePath + /webhooks/, and
  # every registered source posts to that address. The api VirtualService
  # routes /api/v1/webhooks/ here; changing this breaks existing senders.
  basePath: /api/v1
  shutdownTimeoutSecs: 30

# The chart renders the identity, agents and policy service URLs.
policy:
  # Short: a trigger's run grant is created moments before its first delivery,
  # so a long poll interval shows up as a spurious first-fire denial.
  bundlePollIntervalSecs: 3

observability:
  serviceName: orbit-triggers

metrics:
  enabled: true
  port: 9464
  shutdownTimeoutSecs: 5
