apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orbit-agents
  labels:
    {{- include "kora.agents.labels" . | nindent 4 }}
# Verbs match the calls in internal/agents/k8s.go. There are no informers and
# no watch. get+update on every namespaced resource because each
# ensureX follows a create-then-backfill pattern — on AlreadyExists it Gets
# the existing object, merges the KoraTenant owner reference, and Updates
# (docs/adr/2026-09-06-owner-references-for-agents-and-sandboxes.md).
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "create", "update", "patch", "delete"]
  # Run start lists an agent's pods to find the Ready ones (ReadyOrdinals).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["get", "create", "update", "delete"]
  # Deleting an agent type removes its workspace claims by label.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["networking.istio.io"]
    resources: ["destinationrules"]
    verbs: ["get", "create", "update", "delete"]
  # AuthorizationPolicies restricting each agent pod's session-manager port to
  # the orbit-agents principal, created in the tenant namespace alongside the
  # StatefulSet (internal/agents/k8s.go ensureAuthorizationPolicy).
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies"]
    verbs: ["get", "create", "update", "delete"]
  # Read-only access to the cluster-scoped KoraTenant CR so orbit-agents can
  # set it as ownerReferences on the resources it provisions. Enables the
  # ArgoCD resource-tree view and native k8s cascade delete
  # (docs/adr/2026-09-06-owner-references-for-agents-and-sandboxes.md).
  - apiGroups: ["runkora.io"]
    resources: ["koratenants"]
    verbs: ["get"]
  # A SandboxImage's validation and pinned digest decide the image a sandbox runs.
  - apiGroups: ["runkora.io"]
    resources: ["sandboximages"]
    verbs: ["get", "list"]
