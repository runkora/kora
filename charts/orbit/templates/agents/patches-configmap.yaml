{{- /*
Manifest patches ConfigMap (docs/adr/2026-09-15-manifest-patches-configmap.md).

Mounted at /etc/orbit/manifest-patches inside the orbit-agents pod. Data
comes entirely from .Values.agents.manifestPatches: a map keyed by a bare
patch name (no extension, e.g. "01-sandbox-imagepullsecret"), each entry an
object with `content` (the patch body, verbatim). The key controls apply
order (lexicographic) and is written into the ConfigMap as "<key>.yaml".
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: orbit-agents-manifest-patches
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.agents.labels" . | nindent 4 }}
data:
{{- range $name, $patch := .Values.agents.manifestPatches }}
  {{ $name }}.yaml: |
{{ required (printf "agents.manifestPatches.%s.content is required" $name) $patch.content | indent 4 }}
{{- end }}
