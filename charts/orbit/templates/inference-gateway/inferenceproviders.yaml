{{- /* Each Bedrock account in values is an InferenceProvider. Without credentialsSecret it uses the gateway's workload identity. */}}
{{- range .Values.inferenceGateway.bedrock.accounts }}
{{- $alias := required "inferenceGateway.bedrock.accounts[].alias must be set" .alias }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $alias) }}
{{- fail (printf "inferenceGateway.bedrock.accounts alias %q must be a DNS label: lowercase letters, digits and hyphens" $alias) }}
{{- end }}
---
apiVersion: orbit.io/v1alpha1
kind: InferenceProvider
metadata:
  name: {{ $alias }}
  namespace: {{ include "orbit.systemNamespace" $ }}
  labels:
    {{- include "orbit.labels" $ | nindent 4 }}
spec:
  type: bedrock
  bedrock:
    region: {{ required (printf "inferenceGateway.bedrock.accounts[%s].region must be set" $alias) .region | quote }}
    {{- with .assumeRoleARN }}
    assumeRoleARN: {{ . | quote }}
    {{- end }}
    {{- with .externalID }}
    externalID: {{ . | quote }}
    {{- end }}
    {{- with .credentialsSecret }}
    credentials:
      secretRef:
        name: {{ . | quote }}
    {{- end }}
{{- end }}
