{{- if .Values.gateway.create }}
# Istio Gateway for the two external hosts (ADR 2026-07-04):
#   <frontendHost>      the dashboard and BFF
#   api.<frontendHost>  the unified backend API
# With gateway.create=false this is not rendered; VirtualServices bind to
# gateway.name instead.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Values.ingressGateway.name }}
  servers:
    {{- if .Values.gateway.tls.enabled }}
    - port:
        number: {{ .Values.gateway.ports.https }}
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.gateway.tls.credentialName }}
      hosts:
        - {{ include "orbit.frontendHost" . | quote }}
        - {{ include "orbit.apiHost" . | quote }}
    - port:
        number: {{ .Values.gateway.ports.http }}
        name: http
        protocol: HTTP
      tls:
        httpsRedirect: true
      hosts:
        - {{ include "orbit.frontendHost" . | quote }}
        - {{ include "orbit.apiHost" . | quote }}
    {{- else }}
    - port:
        number: {{ .Values.gateway.ports.http }}
        name: http
        protocol: HTTP
      hosts:
        - {{ include "orbit.frontendHost" . | quote }}
        - {{ include "orbit.apiHost" . | quote }}
    {{- end }}
{{- end }}
