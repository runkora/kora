apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: kora-local

# 1 server + 2 agents gives us realistic pod scheduling without burning RAM
servers: 1
agents: 2

# Inside the Kubernetes window Istio 1.30 and 1.31 support.
image: rancher/k3s:v1.36.4-k3s1

ports:
  # Istio ingress gateway — high ports avoid conflicts with other local services.
  - port: 8443:443
    nodeFilters:
      - loadbalancer
  - port: 8880:80
    nodeFilters:
      - loadbalancer

registries:
  create: 
    name: kora-registry
    host: "0.0.0.0"
    hostPort: "5001"

# Attach k3d nodes to the same Docker network as docker-compose so that pods
# running inside k3d can reach kora-postgres by container hostname without
# relying on host.k3d.internal (unreliable on macOS/Colima).
# The kora-network is created by 'docker compose up' (make dev-up), which must
# run before 'make dev-cluster' — enforced by the Makefile dependency.
network: kora-network

options:
  k3s:
    extraArgs:
      # Disable Traefik — we use Istio as the ingress gateway
      - arg: --disable=traefik
        nodeFilters:
          - server:*
