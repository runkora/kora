name: Charts CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - uses: ./.github/actions/k8s-toolchain
        with:
          helm: true
      - run: helm dependency build charts/orbit
      - run: make chart-lint
      - run: make chart-docs-check

  render:
    name: Render (k8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.35.0", "1.36.0", "1.37.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/k8s-toolchain
        with:
          helm: true
          kubeconform: true
      - run: helm dependency build charts/orbit
      - name: Render and validate manifests
        env:
          K8S_VERSION: ${{ matrix.k8s }}
        run: |
          set -euo pipefail
          {
            helm template orbit-crds charts/orbit-crds -n orbit-system
            echo '---'
            helm template orbit charts/orbit -n orbit-system -f charts/orbit/ci/default-values.yaml
          } > rendered.yaml
          kubeconform -summary -strict -ignore-missing-schemas \
            -kubernetes-version "${K8S_VERSION}" rendered.yaml
