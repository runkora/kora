# Example tenant workload and marketplace for the local cluster. The namespace comes from
# deploy/local/tenants/example.yaml; the operator's webhook adds the sidecars.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-config
  namespace: orbit-tenant-example
data:
  # Mounted as the storage config file the loader merges last.
  storage.yaml: |
    postgres:
      host: orbit-postgres
      port: 5432
      database: orbit
      user: orbit
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbit-example
  namespace: orbit-tenant-example
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-example
  namespace: orbit-tenant-example
  labels:
    app: orbit-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbit-example
  template:
    metadata:
      labels:
        app: orbit-example
        # Selects the orbit-tenant-agent ClusterSPIFFEID: .../agent/example.
        spiffe.io/agent: example
    spec:
      serviceAccountName: orbit-example
      # Tenant namespaces enforce restricted Pod Security.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orbit-example
          image: orbit-registry:5001/orbit-example:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: APP_ENV
              value: local
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - secretRef:
                name: orbit-secrets
          volumeMounts:
            - name: config-files
              mountPath: /etc/orbit/config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config-files
          configMap:
            name: example-config
            items:
              - key: storage.yaml
                path: internal/platform/storage.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: orbit-example
  namespace: orbit-tenant-example
spec:
  selector:
    app: orbit-example
  ports:
    - name: http
      port: 80
      targetPort: 8081
      protocol: TCP
---
# Approved by the example tenant's allowedMarketplaceRepos. Crawling skills
# requires the platform GitHub App to have access to this repository.
apiVersion: orbit.io/v1alpha1
kind: SkillMarketplaceSource
metadata:
  name: skills-marketplace
  namespace: orbit-tenant-example
spec:
  displayName: Clear Route Skills
  github:
    owner: clear-route
    repo: skills-marketplace
    branch: main
