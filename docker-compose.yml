services:
  postgres:
    image: postgres:17-alpine
    container_name: orbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orbit-network

  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orbit-network

  # ---------------------------------------------------------------------------
  # glauth — lightweight LDAP directory for local dev identity
  #
  # Backs the Dex LDAP connector so that group membership (platform-admin,
  # tenant-admin, etc.) flows through the OIDC token — replicating the
  # production pattern where roles come from the corporate directory.
  #
  # Test user: dev@orbit.local.clearroute.io / password
  # Groups:    platform-admin
  #
  # Enabled by: make dev-up  (or docker compose up -d glauth)
  # ---------------------------------------------------------------------------
  glauth:
    image: ghcr.io/glauth/glauth:v2.3.2
    container_name: orbit-glauth
    restart: unless-stopped
    # entrypoint.sh substitutes ${GLAUTH_DEV_PASSWORD_HASH} from .env into
    # the committed config at startup (the glauth image is too minimal for
    # sed/envsubst, so the script uses pure shell builtins).
    entrypoint: ["/bin/sh", "/etc/glauth/entrypoint.sh"]
    environment:
      - GLAUTH_DEV_PASSWORD_HASH=${GLAUTH_DEV_PASSWORD_HASH}
    volumes:
      - ./config/glauth/config.cfg:/etc/glauth/config.cfg.in:ro
      - ./config/glauth/entrypoint.sh:/etc/glauth/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':0F35' /proc/net/tcp || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - orbit-network

  # ---------------------------------------------------------------------------
  # Dex — local OIDC provider
  #
  # Runs a real, standards-compliant OIDC server so the full OAuth 2.0 Device
  # Authorization Grant (RFC 8628) protocol executes without any cloud accounts.
  # Backed by glauth (LDAP) for user authentication and group membership.
  #
  # Issuer:   https://dex.orbit.local.clearroute.io:5556/dex
  # Test user: dev@orbit.local.clearroute.io / password
  # Client ID: orbit-local  (public client — no secret)
  #
  # Enabled by: make dev-up  (or docker compose up -d dex)
  # ---------------------------------------------------------------------------
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    container_name: orbit-dex
    restart: unless-stopped
    depends_on:
      glauth:
        condition: service_healthy
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./config/dex/config.yaml:/etc/dex/config.yaml:ro
      - ./secrets/tls.crt:/etc/dex/tls.crt:ro
      - ./secrets/tls.key:/etc/dex/tls.key:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:5556/dex/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - orbit-network

  # ---------------------------------------------------------------------------
  # Port proxy — maps standard ports (443/80) to k3d's high ports (8443/8880)
  #
  # Pure TCP passthrough (Layer 4) — no TLS termination, no certificate config.
  # Lets devs access https://orbit.local.clearroute.io instead of https://orbit.local.clearroute.io:8443.
  # HAProxy is ~10MB and uses negligible resources in TCP mode.
  # ---------------------------------------------------------------------------
  port-proxy:
    image: haproxy:3.1-alpine
    container_name: orbit-port-proxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  orbit-network:
    name: orbit-network   # explicit name prevents docker-compose project-prefix (orbit_orbit-network)
    driver: bridge
