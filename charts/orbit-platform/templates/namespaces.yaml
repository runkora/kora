# Orbit platform namespaces.
#
# This chart only manages Orbit's own namespaces:
#   orbit-system          — Orbit control-plane services (identity, etc.)
#   <tenant namespaces>   — one per entry in .Values.namespaces.tenants
#
# istio-system and spire-system are created by the orbit-operator via
# client-go CreateOrUpdate before each Helm release install, and are NOT
# managed here to avoid cross-release ownership conflicts.
#
# Uses lookup to make creation idempotent.

{{- $labels := include "orbit-platform.labels" . | fromYaml }}

{{- /* ── orbit-system ─────────────────────────────────────────────────── */}}
{{- if not (lookup "v1" "Namespace" "" (include "orbit-platform.systemNamespace" .)) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "orbit-platform.systemNamespace" . }}
  labels:
    {{- include "orbit-platform.labels" . | nindent 4 }}
    # Enable Istio sidecar injection for all pods in orbit-system.
    istio-injection: enabled
    # Enable SPIRE workload attestation for pods in this namespace.
    spiffe.io/spire-managed: "true"
{{- end }}

{{- /* ── tenant namespaces ───────────────────────────────────────────── */}}
{{- /* Use lookup guard: tenant namespaces may already exist (created by the   */}}
{{- /* orbit-operator TenantReconciler). Helm cannot import externally-managed  */}}
{{- /* namespaces, so we skip creation when the namespace already exists.       */}}
{{- range .Values.namespaces.tenants }}
{{- if not (lookup "v1" "Namespace" "" .) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  labels:
    {{- include "orbit-platform.labels" $ | nindent 4 }}
    # Tenant namespaces get Istio injection and SPIRE attestation.
    istio-injection: enabled
    spiffe.io/spire-managed: "true"
    # The orbit.io/role=tenant label is used by ClusterSPIFFEID selectors to
    # distinguish tenant workload identity paths from system component paths.
    orbit.io/role: tenant
{{- end }}
{{- end }}
