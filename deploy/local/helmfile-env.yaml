# =============================================================================
# deploy/local/helmfile-env.yaml — Local dev environment bindings for helmfile
# =============================================================================
#
# Referenced by helmfile.yaml under environments.local.values.
# Used only as an escape-hatch / debugging path — primary installs are driven
# by the orbit-operator (see deploy/local/orbit-platform.yaml).
#
# SPIRE and Istio are now configured entirely by the operator from the
# OrbitPlatform CR fields — no separate values files are needed or used.
#
# To use (escape-hatch only):
#   helmfile apply --environment local
# =============================================================================

orbitPlatform:
  valuesFile: deploy/local/platform-values.yaml
