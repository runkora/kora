apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbit-inference-gateway
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.inferenceGateway.labels" . | nindent 4 }}
  {{- with .Values.inferenceGateway.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
