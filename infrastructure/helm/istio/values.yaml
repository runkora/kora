# =============================================================================
# Istio Helm values — base / production defaults
#
# Two charts are deployed in sequence:
#   1. istio/base    — CRDs and cluster-wide resources
#   2. istio/istiod  — control plane (uses these values)
#
# Usage (handled automatically by dev-cluster-up.sh):
#   helm upgrade --install istio-base istio/base \
#     --namespace istio-system --create-namespace \
#     -f infrastructure/helm/istio/values.yaml
#   helm upgrade --install istiod istio/istiod \
#     --namespace istio-system \
#     -f infrastructure/helm/istio/values.yaml
# =============================================================================

# Pilot (istiod) configuration
pilot:
  # Autoscaling: off by default — override per environment for HA
  autoscaleEnabled: false
  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Tracing: conservative default for production — override per environment.
  # Local dev overrides this to 100.0 in values.local.yaml.
  traceSampling: 0.1

# Global mesh configuration
meshConfig:
  # Access logging to stdout — off by default for production performance
  # Enable per environment or per-workload via telemetry API
  accessLogFile: ""
  enableTracing: false

  # Default proxy resource requests
  defaultConfig:
    proxyMetadata: {}

# Ingress gateway: disabled at chart level — deploy separately if needed
gateways:
  istio-ingressgateway:
    enabled: false
