name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Tool versions — keep in sync with pinned versions in Makefile.
env:
  GOLANGCI_LINT_VERSION: v2.6.2
  GITLEAKS_VERSION: v8.27.2

jobs:
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history required — gitleaks scans all commits, not just the tip.
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          if ! command -v gitleaks > /dev/null; then
            echo "Installing gitleaks ${GITLEAKS_VERSION}..."
            GL_TAG=${GITLEAKS_VERSION}
            GL_VER=${GL_TAG#v}
            GL_OS=$(uname -s | tr '[:upper:]' '[:lower:]')
            GL_ARCH=$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')
            GL_URL="https://github.com/gitleaks/gitleaks/releases/download/${GL_TAG}/gitleaks_${GL_VER}_${GL_OS}_${GL_ARCH}.tar.gz"
            INSTALL_DIR="${HOME}/.local/bin"
            mkdir -p "${INSTALL_DIR}"
            echo "Downloading ${GL_URL}"
            curl -sSfL "${GL_URL}" | tar -xz -C "${INSTALL_DIR}" gitleaks
            echo "${INSTALL_DIR}" >> $GITHUB_PATH
          else
            echo "gitleaks already installed"
          fi
          make secrets

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v${GOLANGCI_LINT_VERSION}
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Verify dependencies
        run: |
          cd backend
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        run: make fmt

      - name: Verify no formatting changes
        run: git diff --exit-code

      - name: Run go vet
        run: make vet

      - name: Run golangci-lint
        run: make lint

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build backend
        run: make build-backend

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run tests
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./backend/coverage.out
          flags: unittests
          name: codecov-orbit
          fail_ci_if_error: false
