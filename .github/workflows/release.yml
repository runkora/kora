name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

concurrency:
  group: release-${{ github.ref }}
  # A release uploads several artifacts; cancelling midway leaves them partial.
  cancel-in-progress: false

jobs:
  images:
    name: Build images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      image_tag: ${{ github.ref_name }}
      platforms: linux/amd64,linux/arm64
      push: true
    secrets: inherit

  publish:
    name: Publish charts
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      HAS_COSIGN: ${{ secrets.COSIGN_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/k8s-toolchain
        with:
          helm: true
          yq: true
      - id: version
        uses: ./.github/actions/derive-version

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Docker credentials let the stamp step read image digests with
      # `docker buildx imagetools` and cosign sign the images; the images are
      # private, so an anonymous pull fails with 401.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR for Helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Resolve digests and stamp charts
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/stamp-release-charts.sh

      - name: Package and push charts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          helm package charts/orbit-crds -d dist
          helm package charts/orbit -d dist
          for c in orbit-crds orbit; do
            helm push "dist/${c}-${VERSION}.tgz" "${CHART_REPO}" 2>&1 | tee "push-${c}.txt"
          done

      - name: Sign charts and images
        if: ${{ env.HAS_COSIGN == 'true' }}
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: .github/scripts/sign-release.sh

      - name: Write the compatibility statement
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: .github/scripts/write-compatibility.sh

      # The built Storybook is a release asset: the Pages/ stories a theme
      # producer previews a white-label theme on. Hosted by no one.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build and archive Storybook
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          make frontend-storybook-build KORA_VERSION="${VERSION}"
          test -f frontend/storybook-static/preview.json
          mkdir -p dist
          (cd frontend/storybook-static && zip -qr "${GITHUB_WORKSPACE}/dist/kora-storybook-${TAG}.zip" .)

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # A semver pre-release tag (v0.2.0-rc.1) carries a hyphen; publish it
          # as a prerelease and never as latest.
          flags=(--title "${TAG}" --generate-notes)
          if [[ "${TAG}" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
            # A final release lists everything since the previous final release,
            # not only what changed since its last release candidate.
            # Only kora's own v* tags count: a hades/v* release is never the predecessor.
            previous=$(gh release list --exclude-pre-releases --exclude-drafts --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("v"))][0].tagName // ""')
            if [[ -n "${previous}" ]]; then
              flags+=(--notes-start-tag "${previous}")
            fi
          fi
          gh release create "${TAG}" "${flags[@]}" dist/*.tgz dist/kora-storybook-*.zip images.txt compatibility.yaml
