  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: 1.29.1
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
