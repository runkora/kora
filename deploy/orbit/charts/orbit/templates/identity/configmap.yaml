{{- if and .Values.identity.enabled .Values.identity.infrastructureConfig.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orbit-platform.identity.configMapName" . }}
  namespace: {{ include "orbit-platform.systemNamespace" . }}
  labels:
    {{- include "orbit-platform.identity.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.identity.infrastructureConfig.data | nindent 2 }}
{{- end }}
