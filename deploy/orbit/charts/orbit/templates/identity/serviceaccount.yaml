{{- if and .Values.identity.enabled .Values.identity.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orbit-platform.identity.serviceAccountName" . }}
  namespace: {{ include "orbit-platform.systemNamespace" . }}
  labels:
    {{- include "orbit-platform.identity.labels" . | nindent 4 }}
  {{- with .Values.identity.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
