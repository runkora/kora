apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: ext-authz
spec:
  spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/system/ext-authz"
  podSelector:
    matchLabels:
      app: ext-authz
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - orbit
