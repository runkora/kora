apiVersion: apps/v1
kind: Deployment

metadata:
  name: orbit-skills-service
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    app: orbit-skills-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: orbit-skills-service

  template:
    metadata:
      labels:
        app: orbit-skills-service
        # Names this pod's SPIFFE ID, spiffe://<trust domain>/system/skills-service.
        # Route registration authenticates with it, and policy-service lets a
        # caller register routes only under its own component name.
        spiffe.io/component: skills-service
      annotations:
        {{- include "orbit.spireProxyAnnotations" (dict "root" $) | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/skills-service/config.yaml") . | sha256sum }}

    spec:
      serviceAccountName: orbit-skills-service

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: orbit-skills-service

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          image: {{ include "orbit.image" (dict "root" $ "name" "skillsService") | quote }}

          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "skillsService") }}

          ports:
            - name: http
              containerPort: 8098
              protocol: TCP

          env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix:///run/secrets/workload-spiffe-uds/socket"
            {{- include "orbit.platformEnv" (dict "root" $ "name" "skillsService" "keys" (list "REDIS_PASSWORD")) | nindent 12 }}

            - name: GITHUB_APP_ID
              value: {{ .Values.skillsService.github.appID | quote }}

            - name: GITHUB_APP_INSTALLATION_ID
              value: {{ .Values.skillsService.github.installationID | quote }}

            - name: GITHUB_APP_PRIVATE_KEY_PATH
              value: {{ index .Values.skillsService.githubApps 0 "mountPath" }}/privateKey

            - name: ORBIT_MARKETPLACE_SOURCES_CONFIG
              value: "/etc/orbit/marketplace"

          volumeMounts:
            {{- include "orbit.spireVolumeMount" . | nindent 12 }}
            {{- include "orbit.configVolumeMount" . | nindent 12 }}
            {{- include "orbit.redisCAVolumeMount" . | nindent 12 }}
            - name: marketplace-sources
              mountPath: /etc/orbit/marketplace
            {{- range .Values.skillsService.githubApps }}
            - name: github-app-{{ .secretName }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}

          resources:
            {{- toYaml .Values.skillsService.resources | nindent 12 }}

      volumes:
        {{- include "orbit.spireVolumes" . | nindent 8 }}
        {{- include "orbit.configVolume" (dict "root" $ "name" "skillsService" "configMap" "orbit-skills-service-config" "modules" (include "orbit.skillsService.configModules" . | fromYaml)) | nindent 8 }}
        {{- include "orbit.redisCAVolume" . | nindent 8 }}
        # Rendered by the operator from SkillMarketplaceSource CRs. Optional:
        # the pod starts before the first render, and skills-service picks the
        # file up when it appears.
        - name: marketplace-sources
          configMap:
            name: {{ .Values.skillsService.marketplaceSourcesConfigMapName }}
            optional: true
        {{- range .Values.skillsService.githubApps }}
        - name: github-app-{{ .secretName }}
          secret:
            secretName: {{ .secretName }}
            # The service starts without it; a skill crawl that needs GitHub
            # fails (HTTP 500) until it exists.
            optional: true
        {{- end }}