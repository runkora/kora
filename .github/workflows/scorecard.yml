name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly rescore of the default branch.
    - cron: "31 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions replace the top-level set. Explicit reads for the
      # checkout and the analysis.
      contents: read
      actions: read
      # Upload the SARIF result to code scanning.
      security-events: write
      # OIDC token that signs the published result for the scorecard.dev API.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to the scorecard.dev API, which serves the README badge.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        # Needs Code Security enabled on the repository.
        with:
          sarif_file: results.sarif
