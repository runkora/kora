# =============================================================================
# orbit chart — local development values
# =============================================================================
#
# Applied automatically by the orbit-operator when reconciling the OrbitPlatform CR.
# To install manually with chart dependencies enabled:
#   helm dependency build ./charts/orbit
#   helm upgrade --install orbit ./charts/orbit \
#     -f deploy/local/orbit-values.yaml -n istio-system --create-namespace
#
#
# NOTE: The following fields are intentionally absent from this file because
# the orbit-operator injects them as computed values during reconciliation —
# any values set here would be overwritten:
#
#   identity.existingSecret              → from spec.secrets.platformSecretRef
#   identity.existingConfigMap           → orbit-config (operator-managed)
#   identity.existingTenantsConfigMap    → orbit-tenants (operator-managed)
#   identity.existingClientSecretsSecret → orbit-tenant-oidc-secrets (operator-managed)
#   platform.namespaces.tenants          → derived from active OrbitTenant CRs
#   platform.spiffe.enabled              → derived from spec.spire.enabled
#
# To configure these, edit deploy/local/orbit-platform.yaml (OrbitPlatform CR)
# or deploy/local/tenants/*.yaml (OrbitTenant CRs).
# =============================================================================

spire:
  crds:
    enabled: true
  enabled: true
  global:
    spire:
      trustDomain: "orbit.test"
      clusterName: "orbit-local"
  spire-server:
    nodeAttestor:
      k8sPSAT:
        clusters:
          orbit-local:
            service_account_allow_list:
              - "spire-system:spire-agent"

istio:
  enabled: true
  gateway:
    enabled: true

istiod:
  meshConfig:
    trustDomain: "orbit.test"

istio-gateway:
  name: gateway
  service:
    type: LoadBalancer

global:
  # Force pull from local k3d registry on every pod start.
  # Local registry images are not content-addressed — Always ensures the
  # cluster always runs the freshest locally-built image.
  imagePullPolicy: Always
  # Must match the SPIRE/Istio trust domain used by the Orbit chart dependencies.
  # The operator injects this automatically; set it here so manual helm upgrades
  # (e.g. make deploy-orbit) also produce correct SPIFFE SANs in DestinationRules.
  trustDomain: "orbit.test"

identity:
  image:
    # Local k3d registry — built by: make docker-push
    repository: orbit-registry:5001/orbit-identity
    tag: latest

  replicas: 1

  # hostAliases are injected dynamically by scripts/cluster/resolve-docker-ips.sh
  # at cluster setup time — no hardcoded IPs here.

  # Local dev overrides for security and observability tunables.
  # These correspond to the identity.config.* fields in charts/orbit/values.yaml
  # and are injected as ORBIT_* env vars — no APP_ENV needed.
  config:
    postgresSSLMode: "disable"           # Local Postgres has no TLS cert.
    postgresCaptureQueryText: "true"     # Log full SQL in traces locally.
    redisTLSEnabled: "false"             # Local Redis has no TLS cert.
    otlpInsecure: "true"                 # Local OTLP collector has no TLS.
    logFormat: "console"                 # Human-readable logs locally.

inferenceGateway:
  image:
    # Local k3d registry — built by: make docker-push-platform
    repository: orbit-registry:5001/orbit-inference-gateway
    tag: latest

  replicas: 1

  config:
    postgresSSLMode: "disable"           # Local Postgres has no TLS cert.
    postgresCaptureQueryText: "true"     # Log full SQL in traces locally.
    otlpInsecure: "true"                 # Local OTLP collector has no TLS.
    logFormat: "console"                 # Human-readable logs locally.

  # Enable Bedrock for local dev. Credentials (AWS_ACCESS_KEY_ID,
  # AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN) are read from .env and
  # injected into orbit-secrets by: make cluster-secrets
  bedrock:
    enabled: true
    region: "us-east-1"

frontend:
  image:
    # Local k3d registry — built by: make docker-push-frontend
    repository: orbit-registry:5001/orbit-frontend
    tag: latest

  replicas: 1

  config:
    # In-cluster identity service — server-side BFF only, never sent to the browser.
    orbitApiUrl: "http://orbit-identity.orbit-system/api/v1"
    # In-cluster inference gateway — server-side BFF only, never sent to the browser.
    inferenceGatewayUrl: "http://orbit-inference-gateway.orbit-system/v1"
    # In-cluster policy gateway — server-side BFF only, never sent to the browser.
    policyGatewayUrl: "http://orbit-policy-gateway.orbit-system/v1"
    # In-cluster policy service (PAP) — server-side BFF only, never sent to the browser.
    policyServiceUrl: "http://orbit-policy-service.orbit-system/api/v1"
    # Public URL of the frontend as seen from the browser.
    # Must match the NEXT_PUBLIC_APP_URL Docker build arg (baked into client bundle).
    nextPublicAppUrl: "https://orbit.local.clearroute.io:8443"

networkPolicy:
  enabled: true

platform:
  gateway:
    tls:
      enabled: true
      credentialName: orbit-gateway-tls

policyService:
  image:
    repository: orbit-registry:5001/orbit-policy-service
    tag: latest
  replicas: 1
  config:
    postgresSSLMode: "disable"
    postgresCaptureQueryText: "true"
    otlpInsecure: "true"
    logFormat: "console"

policyGateway:
  image:
    repository: orbit-registry:5001/orbit-policy-gateway
    tag: latest
  replicas: 1
  config:
    otlpInsecure: "true"
    logFormat: "console"

opaGateway:
  image:
    # Pulled by: make docker-pull-third-party
    repository: orbit-registry:5001/openpolicyagent/opa
    tag: 1.15.2-envoy-static
  replicas: 1
  frontendHost: orbit.local.clearroute.io
