{{- if .Values.koraMcp.register }}
# Registers the platform kora MCP as a GLOBAL MCPServer (kora-system). The
# operator's MCPServerAggregator renders it into the kora-mcp-servers registry
# and the tool-gateway introspects its tools into mcp:kora:<tool>:use scopes.
# callerIdentity: forward — the kora MCP acts AS the caller against first-party
# kora APIs (valid only for kora-system/global servers).
apiVersion: runkora.io/v1alpha1
kind: MCPServer
metadata:
  name: kora
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.koraMcp.labels" . | nindent 4 }}
spec:
  displayName: {{ printf "%s Platform MCP" (include "kora.themeProductName" .) | quote }}
  description: "The control plane itself: manage agents, models, policy and runs through governed tools."
  endpoint: "http://kora-mcp.{{ include "kora.systemNamespace" . }}.svc:8095/mcp"
  transport: streamable-http
  reintrospectIntervalSeconds: 900
  callerIdentity: forward
{{- end }}
