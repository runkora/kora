app:
  version: "0.1.0"
  # console gives colorized, human-readable output for local development
  logFormat: console

server:
  port: 6069
  basePath: /api/v1
  shutdownTimeoutSecs: 5

observability:
  serviceName: orbit
  otlpEndpoint: ""      # empty → stdout exporter for local dev
  samplingRate: 1.0     # capture every trace locally
  otlpInsecure: true    # no TLS needed when collector is local
