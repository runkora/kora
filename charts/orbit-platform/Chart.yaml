apiVersion: v2
name: orbit-platform
description: >
  Orbit cluster-level resources — namespaces, ClusterSPIFFEIDs, and NetworkPolicies.
  This is a thin chart that manages Orbit's cluster-scoped configuration only.
  SPIRE and Istio are installed as SEPARATE Helm releases, driven by the
  orbit-operator, configured entirely from the OrbitPlatform CR.
type: application
version: 0.3.3
appVersion: "0.1.0"

keywords:
  - orbit
  - spiffe
  - service-mesh
  - workload-identity

maintainers:
  - name: Orbit Platform Team
#
# The orbit-operator installs each release separately in the correct order:
#   spire-crds     → spire-system namespace, release spire-crds
#   spire          → spire-system namespace, release spire  (className: spire-system-spire)
#   istio-base     → istio-system namespace, release istio-base
#   istiod         → istio-system namespace, release istiod
#   gateway        → istio-system namespace, release gateway
#   orbit-platform → orbit-system namespace (this chart, cluster resources only)
#   orbit          → orbit-system namespace (identity service + sidecar)
#
# See: deploy/local/orbit-platform.yaml (OrbitPlatform CR),
#      OrbitPlatform CR fields (spec.trustDomain, spec.clusterName, spec.gateway)
