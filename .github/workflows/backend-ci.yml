name: Backend CI

on:
  workflow_call:

# Tool versions — keep in sync with pinned versions in Makefile.
env:
  GOLANGCI_LINT_VERSION: v2.11.3
  GITLEAKS_VERSION: v8.27.2

jobs:
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history required — gitleaks scans all commits, not just the tip.
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          if ! command -v gitleaks > /dev/null; then
            echo "Installing gitleaks ${GITLEAKS_VERSION}..."
            GL_TAG=${GITLEAKS_VERSION}
            GL_VER=${GL_TAG#v}
            GL_OS=$(uname -s | tr '[:upper:]' '[:lower:]')
            GL_ARCH=$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')
            GL_URL="https://github.com/gitleaks/gitleaks/releases/download/${GL_TAG}/gitleaks_${GL_VER}_${GL_OS}_${GL_ARCH}.tar.gz"
            INSTALL_DIR="${HOME}/.local/bin"
            mkdir -p "${INSTALL_DIR}"
            echo "Downloading ${GL_URL}"
            curl -sSfL "${GL_URL}" | tar -xz -C "${INSTALL_DIR}" gitleaks
            echo "${INSTALL_DIR}" >> $GITHUB_PATH
          else
            echo "gitleaks already installed"
          fi
          make secrets

  infra-lint:
    name: Infra Config Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check sentinel password not in non-base values files
        # values.yaml (base) intentionally contains REPLACE-VIA-OVERLAY as a
        # fail-fast guard. Any other values file containing this sentinel means
        # it was accidentally copy-pasted and would deploy with a broken password.
        run: |
          MATCHES=$(grep -rl "REPLACE-VIA-OVERLAY" infrastructure/helm/ | grep -v '/values\.yaml$' || true)
          if [ -n "$MATCHES" ]; then
            echo "ERROR: sentinel password 'REPLACE-VIA-OVERLAY' found in non-base values file(s):"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK: sentinel password only present in base values.yaml files"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Restore Go module cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      # Same per-commit strategy as Build and Test, plus golangci-lint's
      # analysis cache. Own key family: lint compiles with its own flag set,
      # so sharing go-build-/go-test- keys would thrash their saves.
      - name: Restore Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-go-lint-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-lint-${{ hashFiles('backend/go.sum') }}-
            ${{ runner.os }}-go-lint-

      - name: Verify dependencies
        run: |
          cd backend
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        run: make fmt

      - name: Verify no formatting changes
        run: git diff --exit-code

      # No standalone `go vet` step: .golangci.yml enables govet with
      # enable-all, so golangci-lint runs everything vet runs. A separate step
      # paid a full compile (~2m20s) to duplicate the check.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend
          # The explicit cache above owns ~/.cache/golangci-lint; the action's
          # built-in cache uses a 7-day rotating key and would double-save.
          skip-cache: true

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          # setup-go keys its cache on go.sum alone and saves only on a key
          # miss, so the build cache decays as source changes under an
          # unchanged go.sum. The explicit cache below saves per commit and
          # restores the nearest prefix match instead.
          cache: false

      # Module cache is shared across Build/Test/Lint with a stable key: it
      # only changes when go.sum does, so bundling it into the per-commit
      # build caches stored the same few hundred MB three times per commit.
      - name: Restore Go module cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Restore Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ hashFiles('backend/go.sum') }}-
            ${{ runner.os }}-go-build-

      - name: Install proto tools
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          BUF_OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          BUF_ARCH=$(uname -m | sed 's/x86_64/x86_64/;s/aarch64/aarch64/')
          curl -sSfL --retry 3 \
            "https://github.com/bufbuild/buf/releases/download/v1.55.1/buf-${BUF_OS}-${BUF_ARCH}" \
            -o "$(go env GOPATH)/bin/buf" && chmod +x "$(go env GOPATH)/bin/buf"

      - name: Build backend
        run: make build-backend

  test:
    # No `needs: build` — `go test` compiles its own artifacts and shares
    # nothing with the Build job, so gating on it only serialised the two
    # longest jobs. They now run concurrently.
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Restore Go module cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      # Separate key prefix from Build: race + coverage instrumentation
      # produce distinct artifacts, and sharing one cache would thrash it.
      - name: Restore Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-test-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-test-${{ hashFiles('backend/go.sum') }}-
            ${{ runner.os }}-go-test-

      - name: Run tests
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        if: always()
        with:
          files: ./backend/coverage.out
          flags: unittests
          name: codecov-orbit
          fail_ci_if_error: false
