apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-mcp
  namespace: {{ include "orbit.systemNamespace" . }}
  labels:
    {{- include "orbit.orbitMcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.orbitMcp.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.orbitMcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbit.orbitMcp.selectorLabels" . | nindent 8 }}
        {{- include "orbit.orbitMcp.labels" . | nindent 8 }}
        spiffe.io/component: orbit-mcp
        {{- include "orbit.podLabels" (dict "root" $ "name" "orbitMcp") | nindent 8 }}
      annotations:
        {{- include "orbit.spireProxyAnnotations" (dict "root" $ "identityProxy" false) | nindent 8 }}
        {{- include "orbit.podAnnotations" (dict "root" $ "name" "orbitMcp") | nindent 8 }}
    spec:
      serviceAccountName: orbit-mcp
      {{- include "orbit.imagePullSecrets" . | nindent 6 }}
      {{- include "orbit.scheduling" (dict "root" $ "name" "orbitMcp") | nindent 6 }}
      securityContext:
        {{- include "orbit.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "orbit.spireVolumes" (dict "identityProxy" false) | nindent 8 }}
        {{- include "orbit.extraVolumes" (dict "root" $ "name" "orbitMcp") | nindent 8 }}
      containers:
        - name: orbit-mcp
          image: {{ include "orbit.image" (dict "root" $ "name" "orbitMcp") | quote }}
          imagePullPolicy: {{ include "orbit.imagePullPolicy" (dict "root" $ "name" "orbitMcp") }}
          securityContext:
            {{- include "orbit.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            - name: ORBIT_OTLP_INSECURE
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "orbitMcp" "field" "otlpInsecure" "default" .Values.global.observability.otlpInsecure) | quote }}
            - name: ORBIT_LOG_FORMAT
              value: {{ include "orbit.serviceConfig" (dict "root" $ "name" "orbitMcp" "field" "logFormat" "default" .Values.global.logFormat) | quote }}
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix:///run/secrets/workload-spiffe-uds/socket"
            {{- include "orbit.extraEnv" (dict "root" $ "name" "orbitMcp") | nindent 12 }}
          ports:
            - name: http
              containerPort: 8095
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.orbitMcp.resources | nindent 12 }}
          volumeMounts:
            {{- include "orbit.spireVolumeMount" . | nindent 12 }}
            {{- include "orbit.extraVolumeMounts" (dict "root" $ "name" "orbitMcp") | nindent 12 }}
