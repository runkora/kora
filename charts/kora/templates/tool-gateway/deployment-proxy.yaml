# Proxy: the request-path PEP behind the Service. No identity-proxy, because it
# forwards the caller's token to callerIdentity:forward servers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-tool-gateway
  namespace: {{ include "kora.systemNamespace" . }}
  labels:
    {{- include "kora.toolGateway.labels" . | nindent 4 }}
    runkora.io/mode: proxy
spec:
  replicas: {{ .Values.toolGateway.proxyReplicas }}
  selector:
    matchLabels:
      {{- include "kora.toolGateway.selectorLabels" . | nindent 6 }}
      runkora.io/mode: proxy
  template:
    metadata:
      labels:
        {{- include "kora.toolGateway.selectorLabels" . | nindent 8 }}
        {{- include "kora.toolGateway.labels" . | nindent 8 }}
        runkora.io/mode: proxy
        spiffe.io/component: tool-gateway
        {{- include "kora.podLabels" (dict "root" $ "name" "toolGateway") | nindent 8 }}
      annotations:
        {{- include "kora.spireProxyAnnotations" (dict "root" $) | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/tool-gateway/config.yaml") . | sha256sum }}
        {{- include "kora.podAnnotations" (dict "root" $ "name" "toolGateway") | nindent 8 }}
    spec:
      serviceAccountName: orbit-tool-gateway
      {{- include "kora.imagePullSecrets" . | nindent 6 }}
      {{- include "kora.scheduling" (dict "root" $ "name" "toolGateway") | nindent 6 }}
      securityContext:
        {{- include "kora.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      volumes:
        {{- include "kora.spireVolumes" . | nindent 8 }}
        {{- include "kora.configVolume" (dict "root" $ "name" "toolGateway" "configMap" "orbit-tool-gateway-config" "modules" (include "kora.toolGateway.configModules" (dict "root" $ "mode" "proxy") | fromYaml)) | nindent 8 }}
        - name: mcp-servers
          configMap:
            name: {{ .Values.toolGateway.mcpServersConfigMapName }}
            optional: true
        - name: mcp-server-secrets
          secret:
            secretName: {{ .Values.toolGateway.mcpServerSecretsName }}
            optional: true
        {{- include "kora.redisCAVolume" . | nindent 8 }}
        {{- include "kora.extraVolumes" (dict "root" $ "name" "toolGateway") | nindent 8 }}
      containers:
        - name: orbit-tool-gateway
          image: {{ include "kora.image" (dict "root" $ "name" "toolGateway") | quote }}
          imagePullPolicy: {{ include "kora.imagePullPolicy" (dict "root" $ "name" "toolGateway") }}
          securityContext:
            {{- include "kora.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            {{- include "kora.platformEnv" (dict "root" $ "name" "toolGateway" "keys" (list "DB_PASSWORD" "REDIS_PASSWORD")) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.toolGateway.httpPort }}
              protocol: TCP
            {{- if .Values.global.metrics.enabled }}
            - name: http-metrics
              containerPort: {{ .Values.global.metrics.port | default 9464 }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.toolGateway.httpPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.toolGateway.httpPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.toolGateway.resources | nindent 12 }}
          volumeMounts:
            {{- include "kora.spireVolumeMount" . | nindent 12 }}
            {{- include "kora.configVolumeMount" . | nindent 12 }}
            {{- include "kora.redisCAVolumeMount" . | nindent 12 }}
            - name: mcp-servers
              mountPath: /var/run/kora/mcp-servers
              readOnly: true
            - name: mcp-server-secrets
              mountPath: /var/run/kora/mcp-server-secrets
              readOnly: true
            {{- include "kora.extraVolumeMounts" (dict "root" $ "name" "toolGateway") | nindent 12 }}
